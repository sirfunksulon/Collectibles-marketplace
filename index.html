<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RapidUp — Collectibles Marketplace</title>
<style>
:root{--bg:#fff;--surface:#fff;--ink:#10110f;--muted:#6d706a;--line:#dedfd8;--soft:#eceee8;--gold:#c8951e;--green:#16734b;--red:#a93631;--shadow:0 18px 55px rgba(0,0,0,.08);--r:22px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.header{max-width:1280px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:9px 22px;min-height:76px}.brand{min-width:0;display:flex;align-items:center}.logo{display:block;width:min(300px,100%);height:auto;max-height:64px;object-fit:contain;object-position:left center}.header-actions{display:flex;align-items:center;gap:9px}.icon{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:14px;font-weight:900;position:relative}.badge{position:absolute;right:-5px;top:-7px;background:#111;color:#fff;border-radius:99px;font-size:10px;padding:4px 7px}
main{max-width:1280px;margin:auto;padding:28px 22px 90px}.market-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:10px 0 26px}.market-head h1{font-size:clamp(38px,6vw,68px);line-height:.9;letter-spacing:-.065em;margin:8px 0 0}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:950;color:var(--muted);text-transform:uppercase}.tiny{font-size:12px;line-height:1.45}.muted{color:var(--muted)}
.section{margin:34px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:0 0 14px}.sectionhead h2{margin:0;font-size:24px;letter-spacing:-.035em}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.item-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}.item-image{aspect-ratio:1/1;background:#f0f0eb;display:grid;place-items:center;overflow:hidden}.item-image img{width:100%;height:100%;object-fit:contain;display:block}.item-body{padding:14px}.item-title{font-weight:900;line-height:1.2;min-height:34px}.item-meta{display:flex;justify-content:space-between;gap:10px;margin-top:9px}.price{font-size:18px;font-weight:950}.current{font-size:14px;font-weight:850}.resolve{color:var(--green);font-weight:900}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;letter-spacing:.05em;background:#fff}
.channel-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.channel{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px;text-align:left;box-shadow:0 8px 28px rgba(0,0,0,.04)}.channel b{display:block;font-size:16px}.channel small{display:block;color:var(--muted);margin-top:5px}
.empty{border:1px dashed #cfd1c8;border-radius:18px;background:rgba(255,255,255,.55);padding:34px;text-align:center;color:var(--muted)}.empty b{color:var(--ink)}
.primary,.secondary,.danger,.ghost{border-radius:14px;padding:12px 17px;font-weight:900;border:1px solid var(--line)}.primary{background:#111;color:#fff;border-color:#111}.secondary{background:#fff}.danger{background:#a93631;color:#fff;border-color:#a93631}.ghost{background:transparent;border-color:transparent}
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:grid;place-items:center;padding:18px}.modal{width:min(900px,100%);max-height:min(88vh,900px);overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.25);padding:22px}.modalHead{display:flex;justify-content:space-between;gap:18px;align-items:start;margin-bottom:18px}.modalHead h2{margin:5px 0 0;font-size:28px;letter-spacing:-.045em}.close{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:22px}.actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:18px}.step,.notice,.success{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:11px;background:#fafaf7}.success{background:#eef7f1;border-color:#cce3d3}.notice b,.step b{display:block;margin-bottom:4px}.input{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px 15px;outline:none}.input:focus{border-color:#777}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:flex;flex-direction:column;gap:7px}.offer-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.offer-choice button{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px;text-align:left}.offer-choice button.selected{border:2px solid #111}.offer-choice b{display:block;margin-bottom:5px}.offer-line{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:9px}.offer-line .right{text-align:right}.drawer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.3)}.drawer-panel{margin-left:auto;width:min(390px,100%);height:100%;background:#fff;padding:20px;overflow:auto}.list{display:grid;gap:9px}.listrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.detail{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,.9fr);gap:24px}.detail-visual{border:1px solid var(--line);border-radius:22px;background:#fff;overflow:hidden;min-height:430px;display:grid;place-items:center}.detail-visual img{width:100%;height:100%;max-height:600px;object-fit:contain}.detail h1{font-size:clamp(34px,5vw,58px);line-height:.92;letter-spacing:-.06em;margin:8px 0 20px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}.stat b{display:block;font-size:20px;margin-top:4px}.searchbox{display:flex;gap:8px;margin:0 0 18px}.searchbox input{flex:1}.suggestions{position:relative}.suggestions-box{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.14);max-height:280px;overflow:auto;padding:5px}.suggestion{display:block;width:100%;border:0;background:#fff;text-align:left;border-radius:10px;padding:10px 11px}.suggestion:hover{background:var(--soft)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.channel-grid{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}}@media(max-width:620px){.header{padding:7px 10px;min-height:62px}.logo{width:min(210px,calc(100vw - 125px));max-height:54px}.header-actions{gap:4px}.icon{width:38px;height:38px}main{padding:22px 12px 70px}.grid,.channel-grid,.formgrid,.offer-choice{grid-template-columns:1fr}.market-head{align-items:start;flex-direction:column}.detail-visual{min-height:330px}}
</style>

const DAY=86400000;
const CYCLE_DAYS=7;
const RESOLUTION_SECONDS=90;
const EXTENSION_WINDOW=15;
const EXTENSION_BASE=30;
const EXTENSION_COEF=.4;
const API_BASE='https://api.pokemontcg.io/v2';
const API_PAGE_SIZE=100;
let items=[];
let state=loadState();
let consignmentCache={results:[],pokemon:'',set:'',card:'',variant:'',token:0,loading:false};

function initialState(){return {page:'market',activeItem:null,modal:null,menu:false,search:'',notifications:[],offers:[],proxyBids:{},activity:[],unread:0,toast:''}}
function loadState(){
  try{
    const fresh=initialState();
    for(const k of LEGACY_KEYS){try{localStorage.removeItem(k)}catch(e){}}
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw){items=[];return fresh}
    const saved=JSON.parse(raw);items=Array.isArray(saved.itemState)?saved.itemState:[];
    return {...fresh,...saved,notifications:Array.isArray(saved.notifications)?saved.notifications:[],offers:Array.isArray(saved.offers)?saved.offers:[],proxyBids:saved.proxyBids||{},activity:Array.isArray(saved.activity)?saved.activity:[]};
  }catch(e){console.warn('RapidUp state reset',e);items=[];return initialState()}
}
function save(){state.unread=state.notifications.filter(n=>!n.read).length;try{localStorage.setItem(STORAGE_KEY,JSON.stringify({...state,itemState:items}))}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}
function ageDays(x){return Math.max(0,Math.floor((Date.now()-(x.injectedAt||Date.now()))/DAY))}
function cycleStart(x){return Number(x.cycleStartedAt||x.injectedAt||Date.now())}
function cycleEnd(x){return cycleStart(x)+CYCLE_DAYS*DAY}
function resolutionEnd(x){return Number(x.resolutionEndsAt||0)}
function isResolving(x){return !x.sold&&Number(x.currentOffer||0)>=Number(x.price||0)&&resolutionEnd(x)>Date.now()}
function isExpiredCycle(x){return !x.sold&&!isResolving(x)&&cycleEnd(x)<=Date.now()}
function activeOffersFor(id){return state.offers.filter(o=>o.item===id&&o.status==='active'&&o.expires>Date.now())}
function competitiveOffer(x){
  const offers=activeOffersFor(x.id).map(o=>Number(o.current||o.amount||0)).filter(n=>n>0).sort((a,b)=>b-a);
  if(!offers.length)return 0;
  return offers[0];
}
function offerCurrentForBuyer(x,buyer='You'){
  const mine=state.offers.filter(o=>o.item===x.id&&o.buyer===buyer&&o.status==='active'&&o.expires>Date.now());
  if(!mine.length)return 0;
  return Math.max(...mine.map(o=>Number(o.current||o.amount||0)));
}
function minCompetitive(x){return Math.max(1,Number(x.price||1),Number(x.currentOffer||0)+1)}
function formatRemaining(ms){
  if(ms<=0)return '00:00';
  const s=Math.ceil(ms/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(d)return `${d}d ${String(h).padStart(2,'0')}h`;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function notify(text,type='CONCIERGE',item=null){state.notifications.unshift({id:'n'+Date.now()+Math.random(),text,type,item,created:Date.now(),read:false});save()}
function activity(text){state.activity.unshift({text,created:Date.now()});state.activity=state.activity.slice(0,50);save()}
function toast(text){state.toast=text;render();setTimeout(()=>{state.toast='';render()},2200)}
function route(page){state.page=page||'market';state.modal=null;state.menu=false;render()}
function openItem(id){state.activeItem=id;state.page='item';render()}
function openModal(type,data=null){state.modal={type,data};state.menu=false;render();if(type==='consign')setTimeout(initConsignmentGenerator,0)}
function closeModal(){state.modal=null;render()}
function openMenu(){state.menu=true;render()}
function header(){
  return `<header class="topbar"><div class="header"><div class="brand"><img class="logo" src="${LOGO}" alt="RapidUp Collectibles Marketplace"></div><div class="header-actions"><button class="icon" aria-label="Search" onclick="openModal('search')">⌕</button><button class="icon" aria-label="Concierge" onclick="openModal('concierge')">✦${state.unread?`<span class="badge">${state.unread}</span>`:''}</button><button class="icon" aria-label="Menu" onclick="openMenu()">☰</button></div></div></header>`;
}
function channels(){
  const map=new Map();items.filter(x=>!x.sold).forEach(x=>{const key=[x.category||'Collectibles',x.internal?.condition||x.condition||'Raw',x.era||'Unknown'].join(' · ');if(!map.has(key))map.set(key,[]);map.get(key).push(x)});
  return [...map.entries()].map(([name,xs])=>({name,items:xs})).sort((a,b)=>b.items.length-a.items.length);
}
function itemCard(x){
  const resolving=isResolving(x), current=Number(x.currentOffer||0), remaining=resolving?resolutionEnd(x)-Date.now():0;
  return `<article class="item-card" onclick="openItem('${esc(x.id)}')"><div class="item-image"><img src="${esc(x.img||'')}" alt="${esc(x.fullName||x.name)}"></div><div class="item-body"><div class="item-title">${esc(x.fullName||x.name)}</div><div class="item-meta"><span><span class="eyebrow">PRICE</span><div class="price">${money(x.price)}</div></span><span style="text-align:right"><span class="eyebrow">CURRENT OFFER</span><div class="current">${current?money(current):'—'}</div></span></div><div class="tiny muted" style="margin-top:9px">${ageDays(x)} day${ageDays(x)===1?'':'s'} old ${resolving?`· <span class="resolve">${formatRemaining(remaining)} remaining</span>`:''}</div></div></article>`;
}
function market(){
  const live=items.filter(x=>!x.sold), resolving=live.filter(isResolving), newly=live.filter(x=>ageDays(x)<=1&&!isResolving(x)).sort((a,b)=>(b.injectedAt||0)-(a.injectedAt||0));
  const ch=channels();
  return `<main><div class="market-head"><div><div class="eyebrow">RAPIDUP</div><h1>Collectibles Marketplace</h1><div class="tiny muted" style="margin-top:10px">Make an offer. We'll let you know.</div></div></div>
  <section class="section"><div class="sectionhead"><h2>Channels</h2><span class="pill">${live.length} items</span></div>${ch.length?`<div class="channel-grid">${ch.map(c=>`<button class="channel" onclick="openChannel(${JSON.stringify(c.name)})"><b>${esc(c.name)}</b><small>${c.items.length} item${c.items.length===1?'':'s'}</small></button>`).join('')}</div>`:'<div class="empty">Channels will appear as inventory arrives.</div>'}</section>
  <section class="section"><div class="sectionhead"><h2>Resolving</h2><span class="pill">${resolving.length}</span></div>${resolving.length?`<div class="grid">${resolving.map(itemCard).join('')}</div>`:`<div class="empty"><b>No items are resolving.</b><br>When competitive demand reaches a seller's Price, resolution begins.</div>`}</section>
  <section class="section"><div class="sectionhead"><h2>Newly Added</h2><span class="pill">${newly.length}</span></div>${newly.length?`<div class="grid">${newly.map(itemCard).join('')}</div>`:'<div class="empty"><b>No newly added items.</b><br>Consign an item to begin building the marketplace.</div>'}</section>
  </main>`;
}
function openChannel(name){state.modal={type:'channel',data:name};render()}
function channelModal(name){const xs=channels().find(c=>c.name===name)?.items||[];return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">CHANNEL</div><h2>${esc(name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="tiny muted" style="margin-bottom:12px">Descriptive discovery only. Every available item remains visible through the marketplace.</div><div class="grid">${xs.map(itemCard).join('')||'<div class="empty">No items currently match this channel.</div>'}</div></div>`}
function itemPage(){

function recalculateItem(x){const active=activeOffersFor(x.id).filter(o=>o.expires>Date.now());if(!active.length){x.currentOffer=0;return}const sorted=active.slice().sort((a,b)=>Number(b.max)-Number(a.max));const top=sorted[0],second=sorted[1];let current=Number(top.current||top.amount||1);if(second)current=Math.min(Number(top.max),Math.max(1,Number(second.max)+1));else current=Math.max(1,Number(top.current||top.amount||1));if(top.mode==='actual')current=Math.max(current,Number(top.amount));top.current=current;x.currentOffer=current; if(current>=Number(x.price||0))beginAutomaticResolution(x)}

function sellerBeginResolution(id){const x=items.find(v=>v.id===id);if(!x||x.sold)return;if(!Number(x.currentOffer||0))return toast('There is no current offer to resolve.');x.resolutionStartedAt=Date.now();x.resolutionEndsAt=Date.now()+RESOLUTION_SECONDS*1000;x.resolution={coef:EXTENSION_COEF,window:EXTENSION_WINDOW,base:EXTENSION_BASE,lastExtension:0,used:[],cycleStartInteger:null,sellerInitiated:true};notify(`Resolution started for ${x.fullName||x.name}.`,'RESOLUTION',id);save();render()}
function extendResolution(x){if(!isResolving(x))return;const left=Math.ceil((resolutionEnd(x)-Date.now())/1000);if(left>EXTENSION_WINDOW)return;const r=x.resolution||{coef:EXTENSION_COEF,window:EXTENSION_WINDOW,base:EXTENSION_BASE,used:[]};const integer=Math.max(0,Math.floor(left));r.used=r.used||[];if(r.used.includes(integer))return;const ext=EXTENSION_BASE*Math.max(.05,Number(r.coef||EXTENSION_COEF));x.resolutionEndsAt=Math.max(resolutionEnd(x),Date.now()+ext*1000);r.lastExtension=ext;r.used.push(integer);r.coef=Number(r.coef||EXTENSION_COEF)/2;x.resolution=r}
function resolveItem(x){const offers=activeOffersFor(x.id).filter(o=>o.expires>Date.now()).sort((a,b)=>Number(b.max)-Number(a.max));if(!offers.length||(!x.resolution?.sellerInitiated && Number(x.currentOffer||0)<Number(x.price||0))){x.resolutionEndsAt=0;x.resolutionStartedAt=0;x.status='Open Market';x.cycleStartedAt=Date.now();x.injectedAt=Date.now();state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.status='expired');notify(`Cycle complete for ${x.fullName||x.name}; Price was not reached.`,'CYCLE',x.id);return}const top=offers[0],second=offers[1];const finalPrice=second?Math.min(Number(top.max),Math.max(Number(x.price||0),Number(second.max)+1)):Math.min(Number(top.max),Math.max(Number(x.currentOffer||0),Number(x.price||0)));x.sold=true;x.status='Sold';x.resolutionEndsAt=0;state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.status=o.id===top.id?'accepted':'unavailable');state.activity.unshift({text:`Sold ${x.fullName||x.name} for ${money(finalPrice)}.`,created:Date.now()});notify(`You won ${x.fullName||x.name} for ${money(finalPrice)}.`,'WON',x.id);save()}
function tick(){const now=Date.now();let changed=false;for(const x of items.filter(v=>!v.sold)){for(const o of state.offers.filter(v=>v.item===x.id&&v.status==='active')){if(o.expires<=now){o.status='expired';changed=true}}recalculateItem(x);if(isResolving(x)){extendResolution(x);if(resolutionEnd(x)<=now){resolveItem(x);changed=true}}else if(isExpiredCycle(x)){if(activeOffersFor(x.id).some(o=>Number(o.max)>=Number(x.price||0)))beginAutomaticResolution(x);else{state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.status='expired');x.cycleStartedAt=now;x.injectedAt=now;x.currentOffer=0;changed=true}}}if(changed)save();render();}

function deriveVariants(c){const p=c?.tcgplayer?.prices||{};const out=Object.keys(p);return out.length?[...new Set(out)]:['Standard']}
function luceneTerm(value){
  const clean=String(value||'').trim();
  if(!clean)return '';
  const escaped=clean.replace(/([\\:\"()])/g,'\\$1');
  return /\s/.test(clean)?`"${escaped}"`:escaped;
}
function apiQueryFor(field,q){
  const clean=String(q||'').trim();if(!clean)return '';
  const term=luceneTerm(clean);
  if(field==='pokemon')return `name:${term}`;
  if(field==='set')return `set.name:${term} OR set.id:${term}`;
  if(field==='card'){
    const m=clean.match(/^(.*?)\s*#\s*([A-Za-z0-9-]+)$/);
    if(m&&m[1].trim())return `name:${luceneTerm(m[1])} number:${luceneTerm(m[2])}`;
    return `name:${term} OR number:${term} OR id:${term}`;
  }
  return `${term} OR name:${term} OR set.name:${term} OR id:${term} OR number:${term}`;
}

function submitConsignment(){const card=consignmentCache.results.find(x=>x.id===consignmentCache.card);const price=Math.max(1,Number(document.getElementById('consignPrice')?.value||1));if(!card||!consignmentCache.variant)return toast('Select a valid card and variant first.');const now=Date.now(),year=card.releaseYear||'',item={id:'item-'+now+Math.random(),name:card.name,set:`${card.setName} #${card.number}`,fullName:`${card.name} · ${card.setName} #${card.number} · ${consignmentCache.variant}`,year,era:year>=2014?'Modern':year>=2003?'Mid Era':year>=1996?'Classic':'Unknown',category:'Pokemon',method:'rapidup-cycle',type:'RapidUp Cycle',price,currentOffer:0,status:'Open Market',sold:false,staged:true,injectedAt:now,cycleStartedAt:now,img:card.images?.large||card.images?.small||'',variant:consignmentCache.variant,grade:document.getElementById('consignCondition')?.value==='Graded'?'PSA 10':'Raw',lang:document.getElementById('consignLanguage')?.value||'English',presentation:'RapidUp Standard',internal:{condition:document.getElementById('consignCondition')?.value||'Raw',language:document.getElementById('consignLanguage')?.value||'English',presentation:'RapidUp Standard'},consignment:{cardId:card.id,setId:card.setId,setName:card.setName,cardNumber:card.number,cardName:card.name,releaseYear:card.releaseYear,variant:consignmentCache.variant}};items.push(item);save();state.modal=null;notify(`Your ${card.name} listing is live.`,'LISTING',item.id);activity(`Listed ${item.fullName} at ${money(price)}.`);render()}
function sellerOverview(){const mine=items.filter(x=>!x.sold);return `<main><div class="market-head"><div><div class="eyebrow">SELLER</div><h1>Your Inventory</h1><div class="tiny muted" style="margin-top:10px">List your item. We'll let you know.</div></div><button class="primary" onclick="openModal('consign')">List an Item</button></div><div class="grid">${mine.map(itemCard).join('')||'<div class="empty"><b>No inventory.</b><br>Consign a collectible to begin.</div>'}</div></main>`}
function modal(){if(!state.modal)return '';const m=state.modal;if(m.type==='search')return overlay(searchModal());if(m.type==='concierge')return overlay(conciergeModal());if(m.type==='consign')return overlay(consignmentModal());if(m.type==='channel')return overlay(channelModal(m.data));if(m.type==='offer'){offerMode='actual';return overlay(offerModal(m.data))}return ''}
function overlay(body){return `<div class="modalOverlay" onclick="if(event.target===this)closeModal()">${body}</div>`}
function render(){let body=state.page==='item'?itemPage():state.page==='seller'?sellerOverview():market();document.getElementById('app').innerHTML=header()+body+modal()+(state.menu?menuDrawer():'')+(state.toast?`<div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:#111;color:#fff;padding:12px 16px;border-radius:14px;font-weight:800">${esc(state.toast)}</div>`:'');if(state.modal?.type==='search')setTimeout(renderSearchResults,0)}
window.addEventListener('click',e=>{if(!e.target.closest('.suggestions'))document.querySelectorAll('.suggestions-box').forEach(x=>x.hidden=true)});
setInterval(tick,1000);render();tick();
</script>
</body>
</html>
