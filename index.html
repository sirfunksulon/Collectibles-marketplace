function getCardEra(year){
 const y=Number(year);
 if(y>=1996&&y<=2002)return 'Classic';
 if(y>=2003&&y<=2013)return 'Mid Era';
 if(y>=2014)return 'Modern';
 return 'Unknown';
}

const CHANNEL_ERA_DEFS=[
 {key:'Classic',yearMin:1996,yearMax:2002},

 {key:'Modern',yearMin:2014,yearMax:new Date().getFullYear()}
];
const CHANNEL_CONDITIONS=['Raw','Graded'];
const CHANNEL_START_PRICES=[1,5,10,25,50,100];
const CHANNEL_AUCTION_TYPES=['ELASTIC','SUDDEN DEATH'];
function buildChannelDefinitions(){

function itemCard(x){
  if(!x||x.sold)return '';
  const auction=x.method==='auction';
  if(auction&&x.status!=='Live')return '';
  const title=fullItemTitle(x);
  const method=auction?'AUCTION':'BUY NOW';
  return `<article class="card itemcard"><div class="itemimg clickable" onclick="openItem('${x.id}');return false">${img(x)}</div><div class="itembody"><span class="ruSelling">${method}</span><div class="ruTitle clickable" onclick="openItem('${x.id}');return false">${esc(title)}</div><div class="ruPrice">${money(auction?x.current:x.price)}</div><div class="ruMeta">${auction?`<span data-item-timer="${x.id}">${fmt(secondsLeft(x))}</span> remaining`:'Available now'}</div><div class="ruActions">${auction?`<button class="primary" onclick="openAuction('${x.id}')">View Auction</button>`:`<button class="primary" onclick="addToCart('${x.id}')">Buy Now</button><button class="secondary" onclick="makeOffer('${x.id}')">Offer</button>`}</div></div></article>`;
}
function buildConsignmentTitle(data={}){
  const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
  const number=clean(data.cardNumber).replace(/^#/,'');
  let grade=clean(data.grade),grader=clean(data.grader);
  if(data.condition==='Graded'||grader||grade){
    grader=grader||graderFromGrade(grade);
    if(grader)grade=clean(grade.replace(new RegExp('^'+grader+'\\s*','i'),'')).trim();
  }else{
    grade='';grader='';
  }
  return [
    clean(data.year),
    clean(data.category),
    clean(data.setName),
    clean(data.variant),
    clean(data.cardName),
    number?`#${number}`:'',
    grader,
    grade
  ].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
}

function fullItemTitle(x){return x.fullName||`${x.year||inferYear(x)} Pokemon ${x.set||''} ${x.variant||''} ${x.name||''}${isGraded(x)?` ${x.grader||graderFromGrade(x.grade)||''} ${x.grade||''}`:''}`.replace(/\s+/g,' ').trim();}
function inferYear(x){const m=String(x.name||'').match(/\b(19|20)\d{2}\b/);return m?m[0]:'2025';}
function isGraded(x){return /\b(PSA|CGC|BGS|SGC|TAG|GEM|NM|MT)\b/i.test(String(x.grade||''))||!!x.grader;}
function graderFromGrade(g){const m=String(g||'').match(/\b(PSA|CGC|BGS|SGC|TAG)\b/i);return m?m[1].toUpperCase():'';}
function exploreFilterModal(){const f=state.exploreFilters||{};const cats=[...new Set(items.map(x=>x.category||x.channel).filter(Boolean))];const langs=[...new Set(items.map(x=>x.lang).filter(Boolean))];const vars=[...new Set(items.map(x=>x.variant).filter(Boolean))];return `<div class="modal ruFilterModal"><div class="modalHead"><div><div class="eyebrow">SEARCH</div><h2>Find collectibles</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="ruFilterGrid"><div class="ruFilterField full"><label>Specific item</label><input id="rfText" class="input" value="${esc(f.text||'')}" placeholder="Item name, set, number..."></div><div class="ruFilterField"><label>Category</label><select id="rfCategory" class="input"><option value="">All categories</option>${cats.map(c=>`<option value="${esc(c)}" ${f.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="ruFilterField"><label>Year</label><input id="rfYear" class="input" type="number" value="${esc(f.year||'')}" placeholder="Any year"></div><div class="ruFilterField"><label>Condition</label><select id="rfCondition" class="input"><option value="">All</option><option value="raw" ${f.condition==='raw'?'selected':''}>Raw</option><option value="graded" ${f.condition==='graded'?'selected':''}>Graded</option></select></div><div class="ruFilterField"><label>Grading company</label><input id="rfGrader" class="input" value="${esc(f.grader||'')}" placeholder="PSA, CGC, BGS..."></div><div class="ruFilterField"><label>Grade range</label><div style="display:flex;gap:7px"><input id="rfMin" class="input" type="number" min="1" max="10" step="0.5" value="${esc(f.gradeMin??'')}" placeholder="Min"><input id="rfMax" class="input" type="number" min="1" max="10" step="0.5" value="${esc(f.gradeMax??'')}" placeholder="Max"></div></div><div class="ruFilterField"><label>Presentation</label><select id="rfPresentation" class="input"><option value="">All presentations</option><option value="standard" ${f.presentation==='standard'?'selected':''}>Standard</option><option value="premium" ${f.presentation==='premium'?'selected':''}>Premium</option></select></div><div class="ruFilterField"><label>Language</label><select id="rfLanguage" class="input"><option value="">All languages</option>${langs.map(v=>`<option value="${esc(v)}" ${f.language===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="ruFilterField"><label>Variant</label><select id="rfVariant" class="input"><option value="">All variants</option>${vars.map(v=>`<option value="${esc(v)}" ${f.variant===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="ruFilterField"><label>Selling method</label><select id="rfMethod" class="input"><option value="">All selling methods</option><option value="auction" ${f.method==='auction'?'selected':''}>Auction</option><option value="buy" ${f.method==='buy'?'selected':''}>Buy Now</option></select></div><div class="ruFilterField"><label>Auction type</label><select id="rfAuctionType" class="input"><option value="">All auction types</option><option value="ELASTIC" ${f.auctionType==='ELASTIC'?'selected':''}>Timer / Elastic</option><option value="SUDDEN DEATH" ${f.auctionType==='SUDDEN DEATH'?'selected':''}>Value Start / Sudden Death</option></select></div></div><div class="ruExploreBar" style="margin-top:16px"><span class="ruResultCount" id="ruFilterCount">${items.filter(x=>!x.sold).length} results</span><span class="tiny muted">Presentation defaults to all when unselected.</span></div><div class="actions"><button class="secondary" onclick="closeModal()">Close</button><button class="primary" onclick="applyExploreFilters()">Apply Filters</button></div></div>`}
function applyExploreFilters(){state.exploreFilters={text:document.getElementById('rfText')?.value.trim()||'',category:document.getElementById('rfCategory')?.value||'',year:document.getElementById('rfYear')?.value||'',condition:document.getElementById('rfCondition')?.value||'',grader:document.getElementById('rfGrader')?.value.trim()||'',gradeMin:document.getElementById('rfMin')?.value||'',gradeMax:document.getElementById('rfMax')?.value||'',presentation:document.getElementById('rfPresentation')?.value||'',language:document.getElementById('rfLanguage')?.value||'',variant:document.getElementById('rfVariant')?.value||'',method:document.getElementById('rfMethod')?.value||'',auctionType:document.getElementById('rfAuctionType')?.value||''};closeModal();}
function explore(){
  const f=state.exploreFilters||{};
  let list=items.filter(x=>!x.sold && (x.method==='buy' || (x.method==='auction' && x.status==='Live')));
  if(f.text)list=list.filter(x=>fullItemTitle(x).toLowerCase().includes(f.text.toLowerCase()));
  if(f.category)list=list.filter(x=>x.category===f.category||x.channel===f.category||x.channelId===f.category);
  if(f.year)list=list.filter(x=>String(x.year||inferYear(x))===String(f.year));
  if(f.condition==='raw')list=list.filter(x=>!isGraded(x));
  if(f.condition==='graded')list=list.filter(x=>isGraded(x));
  if(f.grader)list=list.filter(x=>String(x.grader||graderFromGrade(x.grade)).toLowerCase()===String(f.grader).toLowerCase());
  if(f.gradeMin!==''&&f.gradeMin!=null)list=list.filter(x=>isNaN(Number(x.gradeValue))||Number(x.gradeValue)>=Number(f.gradeMin));
  if(f.gradeMax!==''&&f.gradeMax!=null)list=list.filter(x=>isNaN(Number(x.gradeValue))||Number(x.gradeValue)<=Number(f.gradeMax));
  if(f.presentation)list=list.filter(x=>(x.presentation||'standard').toLowerCase()===f.presentation);
  if(f.language)list=list.filter(x=>x.lang===f.language);
  if(f.variant)list=list.filter(x=>x.variant===f.variant);
  if(f.method)list=list.filter(x=>x.method===f.method);
  if(f.auctionType)list=list.filter(x=>x.method==='auction'&&x.auctionType===f.auctionType);
  if(f.sort==='price')list.sort((a,b)=>(a.method==='auction'?a.current:a.price)-(b.method==='auction'?b.current:b.price));
  else if(f.sort==='ending')list.sort((a,b)=>secondsLeft(a)-secondsLeft(b));
  else list.sort((a,b)=>(b.bidCount||0)-(a.bidCount||0));
  const cats=[...new Set(items.map(x=>x.category||x.channel).filter(Boolean))];
  const methods=[['','All selling methods'],['auction','Auction'],['buy','Buy Now']];
  return `<main><div class="ruExploreTop"><h1>Explore</h1><button class="icon ruSearchIcon" aria-label="Search and filters" onclick="openModal('exploreFilters')">⌕</button></div><div class="ruExploreBar"><div class="ruFilterSelect"><select onchange="state.exploreFilters=state.exploreFilters||{};state.exploreFilters.category=this.value;render()"><option value="">All categories</option>${cats.map(c=>`<option value="${esc(c)}" ${f.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select onchange="state.exploreFilters=state.exploreFilters||{};state.exploreFilters.method=this.value;render()">${methods.map(([v,l])=>`<option value="${v}" ${f.method===v?'selected':''}>${l}</option>`).join('')}</select></div><span class="tiny muted">${list.length} results</span></div><div class="grid">${list.slice(0,24).map(itemCard).join('')}</div></main>`;
}
function auctions(){
 const activeChannels=getActiveChannels();
 return `<main><section class="hero"><div class="eyebrow">AUCTION DIRECTORY</div><h1>Choose a channel.</h1><p>Only channel permutations with your own staged inventory appear here. Each channel holds one live auction; there is no public queue.</p></section><div class="ruChannelGrid">${activeChannels.map(c=>{const x=activeForChannel(c.id);return `<article class="card ruChannel"><div class="itemimg">${img(x)}</div><div><div class="eyebrow">${esc(c.auctionType)}</div><h2>${esc(c.name)}</h2><div class="ruChannelName">${esc(fullItemTitle(x))}</div><div class="tiny muted"><span data-channel-timer="${c.id}">${fmt(secondsLeft(x))}</span> · ${money(x.current)} current</div></div><div><button class="primary" onclick="openAuction('${x.id}')">Join</button></div></article>`}).join('')}</div>${activeChannels.length?'':`<div class="empty">No auction channels currently contain eligible inventory.</div>`}</main>`
}

function calculateNewEndTime(currentEndTimeMs, bidTimestampMs, extensionWindowSeconds = 15, extensionDurationSeconds = 15) {
  const timeRemainingMs = currentEndTimeMs - bidTimestampMs;
  const windowMs = extensionWindowSeconds * 1000;
  const extensionMs = extensionDurationSeconds * 1000;

  // If bid arrives within the extension window, extend from the current end time
  // (or current time + extension duration).
  if (timeRemainingMs > 0 && timeRemainingMs <= windowMs) {
    return Math.max(currentEndTimeMs + extensionMs, bidTimestampMs + extensionMs);
  }
  return currentEndTimeMs;
}

function initElasticState(auction){
  if(!auction.elastic){
    auction.elastic={
      usedIntegers:[],
      coefficient:0.2,
      cycleStartInt:null,
      lastInt:null
    };
  }
}
function updateElasticClock(auction,currentSecondsLeft){
  if(auction.auctionType!=='ELASTIC'||currentSecondsLeft<=0)return;
  initElasticState(auction);
  const currentInt=Math.floor(currentSecondsLeft);
  const state=auction.elastic;
  if(state.lastInt!==null&&currentInt<state.lastInt){
    if(state.cycleStartInt!==null&&currentInt<state.cycleStartInt){
      state.usedIntegers=[];
      state.coefficient=0.2;
      state.cycleStartInt=null;
    }
  }
  state.lastInt=currentInt;
}
function calculateElasticExtension(auction,currentSecondsLeft){
  if(auction.auctionType!=='ELASTIC'||currentSecondsLeft>30||currentSecondsLeft<=0)return {canExtend:false,extensionSeconds:0};
  initElasticState(auction);
  const currentInt=Math.floor(currentSecondsLeft);
  const state=auction.elastic;
  const mirrorInt=30-currentInt;
  const extensionSeconds=mirrorInt*state.coefficient;
  return {canExtend:extensionSeconds>0,extensionSeconds:extensionSeconds,currentInt:currentInt,appliedCoefficient:state.coefficient};
}
function applyElasticBid(auction,currentSecondsLeft){
  const preview=calculateElasticExtension(auction,currentSecondsLeft);
  if(!preview.canExtend)return 0;
  const state=auction.elastic;
  const addedMs=preview.extensionSeconds*1000;
  auction.endsAt+=addedMs;
  if(!state.usedIntegers.includes(preview.currentInt))state.usedIntegers.push(preview.currentInt);
  if(state.cycleStartInt===null)state.cycleStartInt=preview.currentInt;
  state.coefficient=state.coefficient/2;
  return preview.extensionSeconds;
}
function elasticPreview(x){
  if(!x||x.auctionType!=='ELASTIC')return {active:false};
  const remaining=secondsLeft(x),result=calculateElasticExtension(x,remaining);
  const state=x.auction?.elastic;
  if(!result.canExtend)return {active:false,remaining,whole:Math.floor(remaining),subsequent:Math.max(0,Math.floor(remaining)-1),mirrored:30-Math.floor(remaining),coef:state?.coefficient??.2,nextCoef:state?.coefficient??.2,extension:0,used:false,cycleStart:state?.cycleStartInt??null};
  const used=state.usedIntegers.includes(result.currentInt);
  return {active:true,remaining,whole:result.currentInt,subsequent:Math.max(0,result.currentInt-1),mirrored:30-result.currentInt,coef:result.appliedCoefficient,nextCoef:result.appliedCoefficient/2,extension:used?0:result.extensionSeconds,used,cycleStart:state.cycleStartInt,newCycle:state.cycleStartInt===null};
}

let swipeState=null;
function startSwipe(e,id){
  const el=document.getElementById('swipeBidControl');if(!el)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();el.setPointerCapture?.(e.pointerId);el.classList.add('dragging');
  swipeState={id,pointerId:e.pointerId,startX:e.clientX,currentX:e.clientX,completed:false};
}
function moveSwipe(e){
  if(!swipeState||e.pointerId!==swipeState.pointerId)return;
  e.preventDefault();swipeState.currentX=e.clientX;
  const el=document.getElementById('swipeBidControl'),thumb=document.getElementById('swipeThumb'),bar=document.getElementById('swipeProgress');if(!el||!thumb)return;
  const max=Math.max(1,el.clientWidth-thumb.offsetWidth-10),dx=Math.max(0,Math.min(max,e.clientX-swipeState.startX)),pct=dx/max;
  thumb.style.transform=`translateX(${dx}px)`;if(bar)bar.style.width=`${Math.round(pct*100)}%`;
  swipeState.completed=pct>=.82;
}
function resetSwipe(){const el=document.getElementById('swipeBidControl'),thumb=document.getElementById('swipeThumb'),bar=document.getElementById('swipeProgress');if(el)el.classList.remove('dragging');if(thumb)thumb.style.transform='translateX(0)';if(bar)bar.style.width='0';swipeState=null;}
function endSwipe(e,id){
  if(!swipeState||swipeState.id!==id||e.pointerId!==swipeState.pointerId)return;
  const complete=swipeState.completed;try{document.getElementById('swipeBidControl')?.releasePointerCapture?.(e.pointerId)}catch(_){ }
  if(!complete){resetSwipe();return setToast('Swipe farther to submit the bid.');}
  resetSwipe();
  const x=item(id);if(!x||x.sold||x.status!=='Live')return setToast('Only the active auction can receive bids.');
  submitBid(id,minBid(x),{buyer:'You'});
}
function cancelSwipe(e){if(swipeState&&e.pointerId===swipeState.pointerId)resetSwipe();}

function submitBid(id,amount,opts={}){
  const x=item(id);
  if(!x||x.sold||x.status!=='Live')return false;
  const minimum=minBid(x);
  if(!Number.isFinite(amount)||amount<minimum)return setToast(`Minimum bid is ${money(minimum)}.`),false;
  const before=secondsLeft(x);
  if(before<=0){tick();return setToast('This auction has ended.'),false;}
  const bidTimestampMs=Date.now();
  const buyer=opts.buyer||'You';
  const bid={id:'bid'+bidTimestampMs+Math.random(),item:id,amount,created:bidTimestampMs,buyer};
  x.current=amount;
  x.bidCount=(Number(x.bidCount)||0)+1;
  state.bids.push(bid);
  if(x.auctionType==='ELASTIC'&&before>0&&before<=30){
    applyElasticBid(x,before);
  }else{
    x.endsAt=calculateNewEndTime(Number(x.endsAt)||0,bidTimestampMs,15,15);
  }
  if(buyer!=='You')resolveProxyForIncomingBid(x);
  save();
  render();
  if(buyer==='You')setToast(`Bid accepted at ${money(amount)}.`);
  return true;
}

function minBid(x){return (Number(x?.current)||0)+1}

function placeBid(id){const input=document.getElementById('bidInput');submitBid(id,Number(input?.value),{buyer:'You'});}

  <button class="primary" style="width:100%;margin-top:12px" onclick="submitCustomBid('${id}')">SET PROXY BID</button></div>`;
}

function submitCustomBid(id){
  const max=Number(document.getElementById('customBidInput')?.value);
  const increment=Number(document.getElementById('proxyIncrement')?.value)||1;
  const x=item(id);if(!x)return;
  const minimum=minBid(x);
  if(!Number.isFinite(max)||max<minimum)return setToast(`Maximum must be at least ${money(minimum)}.`);
  const opening=Math.min(max,minimum);
  if(!submitBid(id,opening,{buyer:'You',proxyOpening:true}))return;
  state.proxyBids=state.proxyBids||{};
  state.proxyBids[id]={item:id,buyer:'You',max,increment,created:Date.now(),active:true};
  closeModal();
  activity(`Proxy bid active through ${money(max)} with a ${money(increment)} increment.`);
}

function resolveProxyForIncomingBid(x){
  const p=(state.proxyBids||{})[x.id];
  if(!p||!p.active||p.buyer!=='You')return;
  if(x.current>=p.max){p.active=false;return;}
  const response=Math.min(p.max,x.current+p.increment);
  if(response<=x.current){p.active=false;return;}
  // Record the proxy response without recursively invoking proxy resolution.
  const before=secondsLeft(x);
  x.current=response;x.bidCount=(Number(x.bidCount)||0)+1;
  state.bids.push({id:'proxy'+Date.now()+Math.random(),item:x.id,amount:response,created:Date.now(),buyer:'You',proxy:true});
  if(x.auctionType==='ELASTIC'&&before>0&&before<=30)applyElasticBid(x,before);
  if(response>=p.max)p.active=false;
}

function checkoutCart(){

 let purchasedCount=0;
 let missedCount=0;
 state.cart.forEach(id=>{
  const itm=item(id);
  if(itm&&!itm.sold&&itm.method==='buy'){
   itm.sold=true;
   itm.status='Sold';
   state.purchases.unshift({
    id:'p-'+Date.now()+Math.random().toString(36).substr(2,4),
    item:id,
    price:itm.price||itm.current,
    date:Date.now()
   });
   state.won.unshift({item:id,price:itm.price||itm.current,source:'Buy Now',date:Date.now()});
   state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');
   notify(`Purchase complete: ${itm.name}.`,'won',id,'PURCHASE COMPLETE');
   purchasedCount++;
  }else{
   missedCount++;
  }
 });
 state.cart=[];
 state.cartOpen=false;
 if(missedCount>0&&purchasedCount>0){
  setToast(`Bought ${purchasedCount} item(s)! ${missedCount} item(s) sold out before checkout.`);

  setToast(`Order failed: Item(s) were purchased by another buyer.`);
 }else{
  setToast(`Successfully purchased ${purchasedCount} item(s)!`);
 }
 save();
 render();
}

function updateItem(itemId,newAttrs={}){
 const x=item(itemId);if(!x)return null;
 x.internal=x.internal||{};
 const sellerFields=['auctionType','startingPrice','presentation'];
 Object.keys(newAttrs).forEach(k=>{
  const v=newAttrs[k];
  x[k]=v;
  if(['category','year','era','condition','language','variant','presentation','auctionType','startingPrice'].includes(k))x.internal[k]=v;
  if(k==='method'){x.method=v;x.type=v==='auction'?'Auction':'Buy Now';}
 });
 if(x.method==='auction'){
  const result=evaluateAndEnqueue(x);
  if(result){x.status='Auction queue';x.endsAt=0;}
 }else{
  ensureQueueState(state);channels.forEach(c=>state.channelQueues[c.id]=(state.channelQueues[c.id]||[]).filter(id=>id!==x.id));x.channel=null;x.channelId=null;x.endsAt=0;x.status='Available now';
 }
 normalizeAuctions(state);save();render();return x;
}
function convertMethod(id,method){const x=item(id);if(!x||x.sold)return;if(method==='buy'){x.method='buy';x.type='Buy Now';x.privateAuction=null;x.price=Math.max(1,Number(x.price||x.current||x.market||1));x.endsAt=0;x.status='Available now';ensureQueueState(state);channels.forEach(c=>state.channelQueues[c.id]=(state.channelQueues[c.id]||[]).filter(qid=>qid!==x.id));x.channel=null;x.channelId=null;}else if(method==='auction'){x.method='auction';x.type='Auction';x.privateAuction=null;x.current=Math.max(1,Number(x.current||1));x.bidCount=0;const result=evaluateAndEnqueue(x);if(result){x.status='Auction queue';x.endsAt=0;}}normalizeAuctions(state);save();closeModal();activity(`${x.name} moved to ${method==='buy'?'BUY NOW':'PUBLIC AUCTION'}.`)}

function privateAccept(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active||x?.sold)return setToast('This private auction is closed.');p.active=false;x.sold=true;x.status='Sold';x.privateAuction={active:false};state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');state.won.push({item:id,price:p.current,source:'Private Auction',date:Date.now()});notify(`You accepted the seller counter on ${x.name} at ${money(p.current)}.`,'won',id,'PRIVATE AUCTION WON');save();closeModal();activity(`Private auction accepted at ${money(p.current)}.`)}

function privateSeller(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active)return `<div class="modal"><div class="modalHead"><h2>Private auction closed</h2><button class="close" onclick="closeModal()">×</button></div></div>`;const responses=p.responses.filter(r=>r.engaged);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLER HUB · PRIVATE AUCTION</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>Demand-based only.</b> This market exists because active committed offers were already present. Buyers never see this aggregate seller surface.</div><div class="privateStage"><div class="eyebrow">CURRENT PARTICIPATION PRICE</div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">${responses.length} active participants · Wave ${p.wave} · response deadline ${new Date(p.deadline).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}</div></div><div class="sectionhead"><h2>Aggregate responses</h2><span class="muted">Seller only</span></div><div class="responseGrid">${responses.map((r,i)=>`<div class="response"><div class="tiny muted">Participant ${i+1}</div><b>${money(r.amount)}</b><div class="tiny muted">${r.engaged?'engaged':'inactive'}</div></div>`).join('')||'<div class="empty">No active responses.</div>'}</div><div class="actions" style="margin-top:16px"><button class="primary" onclick="sellerAcceptHighest('${id}')">Accept highest</button><button class="secondary" onclick="sellerWave('${id}')">Counter all</button><button class="danger" onclick="endPrivate('${id}')">End private auction</button><button class="secondary" onclick="openModal('method','${id}')">Change selling method</button></div><div class="tiny muted" style="margin-top:13px">Every wave has a finite response period. Buyers who do not engage cease participating in that wave. There is no fixed maximum number of waves.</div></div>`}
function sellerAcceptHighest(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active||!p.responses.length)return;const eligible=p.responses.filter(r=>r.engaged);if(!eligible.length)return setToast('No participating responses to accept.');const high=Math.max(...eligible.map(r=>r.amount));p.active=false;x.sold=true;x.status='Sold';x.privateAuction={active:false};state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');state.won.push({item:id,price:high,source:'Private Auction',date:Date.now()});notify(`Private auction completed on ${x.name}.`,'won',id,'PRIVATE AUCTION COMPLETE');save();closeModal();activity(`Private auction completed at ${money(high)}.`)}

let consignmentCache={
  cards:[],
  searchResults:[],
  selectedPokemon:'',
  selectedSet:'',
  selectedCard:'',
  selectedVariant:'',
  activeField:'',
  requestToken:0,
  loading:false
};

function setConsignmentStatus(text,error=false){
  const el=document.getElementById('consignStatus');
  if(el){
    el.textContent=text;
    el.className=error?'warning tiny':'tiny muted';
  }
}

function normalizePokemonCard(card){
  const releaseDate=card?.set?.releaseDate||'';
  const releaseYear=releaseDate?parseInt(releaseDate.slice(0,4),10):null;

  return {
    id:card?.id||'',
    cardName:card?.name||'',
    cardNumber:card?.number||'',
    setId:card?.set?.id||'',
    setName:card?.set?.name||'',
    releaseYear:Number.isFinite(releaseYear)?releaseYear:null,
    pokemon:card?.name||'',
    images:card?.images||{},
    variants:typeof getPokemonCardVariants==='function'
      ? getPokemonCardVariants(card)
      : [],
    raw:card
  };
}

function uniqueConsignmentCards(cards){
  return [...new Map(
    cards
      .map(normalizePokemonCard)
      .filter(x=>x.id&&x.cardName&&x.setName)
      .map(x=>[x.id,x])
  ).values()];
}

function selectedConsignmentCard(){
  return consignmentCache.searchResults.find(
    x=>x.id===consignmentCache.selectedCard
  )||consignmentCache.cards.find(
    x=>x.id===consignmentCache.selectedCard
  )||null;
}

function closeConsignmentSuggestions(){
  document.querySelectorAll('.consignSuggestions').forEach(x=>x.hidden=true);
}

function suggestionElementId(field){
  return `consign${field.charAt(0).toUpperCase()+field.slice(1)}Suggestions`;
}

function fieldInputId(field){
  return `consign${field.charAt(0).toUpperCase()+field.slice(1)}`;
}

function consignmentFieldValue(field){
  return document.getElementById(fieldInputId(field))?.value.trim()||'';
}

function openConsignmentSuggestions(field){
  consignmentCache.activeField=field;
  renderConsignmentSuggestions(field);

  const el=document.getElementById(suggestionElementId(field));
  if(el)el.hidden=false;
}

function activeConsignmentCards(){
  let cards=consignmentCache.searchResults.slice();

  const p=consignmentCache.selectedPokemon.trim().toLowerCase();
  const s=consignmentCache.selectedSet.trim().toLowerCase();
  const v=consignmentCache.selectedVariant.trim().toLowerCase();

  if(p){
    cards=cards.filter(x=>
      x.cardName.toLowerCase().includes(p)
    );
  }

  if(s){
    cards=cards.filter(x=>
      x.setName.toLowerCase().includes(s)||
      x.setId.toLowerCase()===s
    );
  }

  if(v){
    cards=cards.filter(x=>
      (x.variants||[]).some(
        value=>String(value).toLowerCase().includes(v)
      )
    );
  }

  return cards;
}

function localConsignmentOptions(field){
  const cards=activeConsignmentCards();

  if(field==='pokemon'){
    return [...new Set(
      cards.map(x=>x.cardName).filter(Boolean)
    )]
    .sort((a,b)=>a.localeCompare(b))
    .map(value=>({value,label:value}));
  }

  if(field==='set'){
    const map=new Map();

    cards.forEach(x=>{
      if(x.setName&&!map.has(x.setId||x.setName)){
        map.set(
          x.setId||x.setName,
          {
            value:x.setName,
            label:x.setName,
            sub:x.releaseYear?String(x.releaseYear):''
          }
        );
      }
    });

    return [...map.values()]
      .sort((a,b)=>a.label.localeCompare(b.label));
  }

  if(field==='card'){
    return cards.map(x=>({
      value:x.id,
      label:`${x.cardName} #${x.cardNumber}`,
      sub:x.setName
    }));
  }

  if(field==='variant'){
    const values=new Set();

    cards.forEach(x=>{
      (x.variants||[]).forEach(v=>{
        if(v)values.add(v);
      });
    });

    return [...values]
      .sort()
      .map(value=>({value,label:value}));
  }

  return [];
}

function renderConsignmentSuggestions(field){
  const el=document.getElementById(
    suggestionElementId(field)
  );

  if(!el)return;

  const q=consignmentFieldValue(field).toLowerCase();

  let options=localConsignmentOptions(field);

  if(q){
    options=options.filter(o=>
      `${o.label} ${o.sub||''} ${o.value}`
        .toLowerCase()
        .includes(q)
    );
  }

  options=options.slice(0,60);

  if(!options.length){
    el.innerHTML='<div class="consignLoading">No matching selections yet.</div>';
    el._options=[];
    return;
  }

  el._options=options;

  el.innerHTML=options.map(
    (o,i)=>
      `<button type="button" class="consignOption" onclick="selectConsignmentOption('${field}',${i})">
        <b>${esc(o.label)}</b>
        ${o.sub?`<small>${esc(o.sub)}</small>`:''}
      </button>`
  ).join('');
}

function selectConsignmentOption(field,index){
  const input=document.getElementById(fieldInputId(field));
  const box=document.getElementById(suggestionElementId(field));

  const options=box?box._options||[]:[];
  const option=options[index];

  if(!input||!option)return;

  if(field==='card'){
    input.value=option.label;
    consignmentCache.selectedCard=option.value;

    const card=consignmentCache.searchResults.find(
      x=>x.id===option.value
    );

    if(card){
      consignmentCache.selectedPokemon=card.cardName;
      consignmentCache.selectedSet=card.setName;

      document.getElementById('consignPokemon').value=
        card.cardName;

      document.getElementById('consignSet').value=
        card.setName;

      populateConsignmentVariants(card);
    }
  }

  if(field==='pokemon'){
    input.value=option.value;
    consignmentCache.selectedPokemon=option.value;
  }

  if(field==='set'){
    input.value=option.value;
    consignmentCache.selectedSet=option.value;
  }

  if(field==='variant'){
    input.value=option.value;
    consignmentCache.selectedVariant=option.value;
  }

  closeConsignmentSuggestions();
  applyConsignmentFilters(field);

  if(field==='card'){
    const card=selectedConsignmentCard();
    if(card)populateConsignmentVariants(card);
  }

  updateConsignmentPreview();
}

function populateConsignmentVariants(card){
  const input=document.getElementById('consignVariant');
  const box=document.getElementById('consignVariantSuggestions');

  if(!input)return;

  const variants=[
    ...new Set(
      (card?.variants||[]).filter(Boolean)
    )
  ];

  if(box){
    box._options=variants.map(
      value=>({value,label:value})
    );

    box.innerHTML=box._options.map(
      (o,i)=>
        `<button type="button" class="consignOption" onclick="selectConsignmentOption('variant',${i})">
          <b>${esc(o.label)}</b>
        </button>`
    ).join('');
  }

  input.disabled=false;
}

function populateConsignmentCards(cards){
  consignmentCache.cards=cards;

  const input=document.getElementById('consignCard');

  if(input)input.disabled=false;

  renderConsignmentSuggestions('card');
}

function applyConsignmentFilters(changedField){
  const cards=activeConsignmentCards();

  consignmentCache.cards=cards;

  renderConsignmentSuggestions('pokemon');
  renderConsignmentSuggestions('set');
  renderConsignmentSuggestions('card');
  renderConsignmentSuggestions('variant');

  const current=selectedConsignmentCard();

  if(!current&&changedField!=='card'){
    consignmentCache.selectedCard='';
    const card=document.getElementById('consignCard');
    if(card)card.value='';
  }

  if(current){
    populateConsignmentVariants(current);
  }

  renderConsignmentSuggestions(
    consignmentCache.activeField
  );

  setConsignmentStatus(
    `${cards.length} matching card${cards.length===1?'':'s'} available.`
  );

  updateConsignmentPreview();
}

async function fetchConsignmentCardsByField(field,value){
  const q=String(value||'').trim();
  if(!q)return[];

  if(typeof window.searchPokemonCards!=='function'){
    throw new Error('Pokémon TCG search client is not available.');
  }

  const minLength=Number(window.POKEMON_TCG_MIN_SEARCH_LENGTH)||3;

  if(field==='variant')return[];

  // Under the threshold we deliberately avoid network traffic.
  // The API client may still return anything already cached in memory.
  if(q.length<minLength){
    if(field==='pokemon')return await window.searchPokemonCards(q);
    if(field==='set')return await window.searchPokemonCards({set:q});
    if(field==='card')return await window.searchPokemonCards({card:q});
    return[];
  }

  if(field==='pokemon')return await window.searchPokemonCards(q);
  if(field==='set')return await window.searchPokemonCards({set:q});
  if(field==='card')return await window.searchPokemonCards({card:q});
  return[];
}
let consignmentDebounce=null;

function scheduleConsignmentLookup(field,value){
  clearTimeout(consignmentDebounce);

  const q=String(value||'').trim();

  if(!q){
    if(field==='pokemon')
      consignmentCache.selectedPokemon='';

    if(field==='set')
      consignmentCache.selectedSet='';

    if(field==='card'){
      consignmentCache.selectedCard='';
      consignmentCache.selectedVariant='';
    }

    if(field==='variant')
      consignmentCache.selectedVariant='';

    applyConsignmentFilters(field);
    return;
  }

  const minLength=
    Number(window.POKEMON_TCG_MIN_SEARCH_LENGTH)||3;

  /*
   * Below the threshold, update only from local memory. No
   * outbound API lookup is scheduled.
   */
  if(q.length<minLength){
    applyConsignmentFilters(field);
    renderConsignmentSuggestions(field);
    setConsignmentStatus(
      `Type ${minLength} characters to search the Pokémon TCG database.`
    );
    return;
  }

  consignmentDebounce=setTimeout(
    ()=>lookupConsignmentField(field,q),
    250
  );
}

async function lookupConsignmentField(field,value){
  const token=++consignmentCache.requestToken;

  consignmentCache.loading=true;

  setConsignmentStatus(
    `Searching Pokémon TCG database for “${value}”…`
  );

  try{
    const results=uniqueConsignmentCards(
      await fetchConsignmentCardsByField(field,value)
    );

    if(token!==consignmentCache.requestToken)return;

    consignmentCache.searchResults=results;
    consignmentCache.cards=results;

    if(field==='pokemon')
      consignmentCache.selectedPokemon=value;

    if(field==='set')
      consignmentCache.selectedSet=value;

    if(field==='card'){
      const clean=value.replace(/^#/,'').toLowerCase();

      const match=
        results.find(
          x=>x.id.toLowerCase()===value.toLowerCase()
        )||
        results.find(
          x=>
            `${x.cardName} #${x.cardNumber}`
              .toLowerCase()===value.toLowerCase()
        )||
        results.find(
          x=>
            x.cardName.toLowerCase().includes(
              value.toLowerCase()
            )||
            x.cardNumber.toLowerCase()===clean
        );

      if(match){
        consignmentCache.selectedCard=match.id;
        consignmentCache.selectedPokemon=match.cardName;
        consignmentCache.selectedSet=match.setName;

        document.getElementById('consignCard').value=
          `${match.cardName} #${match.cardNumber}`;

        document.getElementById('consignPokemon').value=
          match.cardName;

        document.getElementById('consignSet').value=
          match.setName;

        populateConsignmentVariants(match);
      }
    }

    applyConsignmentFilters(field);

    renderConsignmentSuggestions(field);

    const box=document.getElementById(
      suggestionElementId(field)
    );

    if(box)box.hidden=false;

    setConsignmentStatus(
      results.length
        ? `${results.length} matching card${results.length===1?'':'s'} found. Select a result or refine another field.`
        : 'No matching Pokémon cards found.',
      !results.length
    );

  }catch(error){
    if(token!==consignmentCache.requestToken)return;

    console.error(
      'RapidUp Pokémon lookup failed:',
      error
    );

    setConsignmentStatus(
      'Unable to reach the Pokémon TCG database. Please try again.',
      true
    );

  }finally{
    if(token===consignmentCache.requestToken)
      consignmentCache.loading=false;
  }
}

function consignmentPokemonChanged(value){
  consignmentCache.selectedPokemon=value||'';
  consignmentCache.selectedCard='';
  consignmentCache.selectedVariant='';

  document.getElementById('consignCard').value='';
  document.getElementById('consignVariant').value='';

  scheduleConsignmentLookup('pokemon',value);
  openConsignmentSuggestions('pokemon');
  updateConsignmentPreview();
}

function consignmentSetChanged(value){
  consignmentCache.selectedSet=value||'';
  consignmentCache.selectedCard='';
  consignmentCache.selectedVariant='';

  document.getElementById('consignCard').value='';
  document.getElementById('consignVariant').value='';

  scheduleConsignmentLookup('set',value);
  openConsignmentSuggestions('set');
  updateConsignmentPreview();
}

function consignmentCardChanged(value){
  const v=(value||'').trim();

  const exact=consignmentCache.searchResults.find(
    x=>x.id===v
  );

  if(exact){
    consignmentCache.selectedCard=exact.id;
    populateConsignmentVariants(exact);
    updateConsignmentPreview();
    closeConsignmentSuggestions();
    return;
  }

  const labelMatch=consignmentCache.searchResults.find(
    x=>
      `${x.cardName} #${x.cardNumber}`
        .toLowerCase()===v.toLowerCase()
  );

  if(labelMatch){
    consignmentCache.selectedCard=labelMatch.id;
    consignmentCache.selectedPokemon=labelMatch.cardName;
    consignmentCache.selectedSet=labelMatch.setName;

    document.getElementById('consignPokemon').value=
      labelMatch.cardName;

    document.getElementById('consignSet').value=
      labelMatch.setName;

    populateConsignmentVariants(labelMatch);
    updateConsignmentPreview();
    closeConsignmentSuggestions();
    return;
  }

  consignmentCache.selectedCard='';
  consignmentCache.selectedVariant='';

  document.getElementById('consignVariant').value='';

  scheduleConsignmentLookup('card',v);
  openConsignmentSuggestions('card');
  updateConsignmentPreview();
}

function consignmentVariantChanged(value){
  consignmentCache.selectedVariant=value||'';

  renderConsignmentSuggestions('variant');
  openConsignmentSuggestions('variant');
  updateConsignmentPreview();
}

function updateConsignmentPreview(){
  const preview=document.getElementById(
    'consignTitlePreview'
  );

  const submit=document.getElementById(
    'consignSubmit'
  );

  if(!preview)return;

  const card=selectedConsignmentCard();
  const variant=consignmentCache.selectedVariant;
  const condition=document.getElementById('consignCondition')?.value||'Raw';
  const grade=condition==='Graded'?(document.getElementById('consignGrade')?.value||''):'';

  const title=
    card&&variant
      ? buildConsignmentTitle({year:card.releaseYear,category:'Pokemon',setName:card.setName,variant,cardName:card.cardName,cardNumber:card.cardNumber,condition,grade})
      : 'Select a card and variant.';

  preview.textContent=title;

  if(submit)
    submit.disabled=!(card&&variant);
  updateSellerConfigUI();
}

function tick(){
 const now=Date.now();
 let changed=expireOffers(now);
 items.filter(x=>x.method==='auction'&&!x.sold&&x.status==='Live').forEach(x=>{
  // Elastic cycle state advances with the authoritative countdown. When the
  // countdown organically moves below the integer where the current decay
  // cycle began, the immediately lower integer starts a fresh cycle. This is
  // intentionally NOT triggered by every integer change: upward movement from
  // an Elastic extension and revisits within the current cycle preserve their
  // existing state.
  if(x.auctionType==='ELASTIC'&&remainingMs(x)>0){
   updateElasticClock(x,secondsLeft(x));
  }
  if(remainingMs(x)<=0){finishAuction(x);changed=true}
 });
 if(state.modal?.type==='privateBuyer'||state.modal?.type==='privateSeller'){
  const p=state.privateAuctions[state.modal.data];
  if(p?.active&&p.deadline<=now){p.responses=p.responses.map(r=>({...r,engaged:false}));p.active=false;p.activeParticipants=0;changed=true;}
 }
 if(changed){save();render();updatePreciseTimerDisplays();return;}
 // All visible countdowns derive from the same authoritative endsAt value.
 const x=state.page==='auction'?item(state.activeItem):null;

  if(x.auctionType==='ELASTIC'){const ep=elasticPreview(x);const reads=document.querySelectorAll('.elasticReadout');if(reads.length>=3){const last=x.auction?.lastExtension;reads[0].querySelector('b').textContent=last==null?'—':'+'+Number(last).toFixed(2)+'s';reads[1].querySelector('b').textContent=ep.active?(ep.used?'+0.00s':'+'+ep.extension.toFixed(2)+'s'):'—';reads[1].querySelector('.sub').textContent=ep.active?(ep.used?'integer already consumed':'predicted from current integer'):'outside extension zone';reads[2].querySelector('b').textContent=ep.active?`${ep.whole}s → ${ep.subsequent}s · ${ep.coef.toFixed(2)}`:'inactive';reads[2].querySelector('.sub').textContent=ep.active?(ep.used?`integer consumed · coefficient remains ${ep.coef.toFixed(2)}`:`mirrored ${ep.mirrored} · next coefficient ${(ep.coef/2).toFixed(2)}`):'public timer';}}}
 save();
 updatePreciseTimerDisplays();
}
