<style>
:root{--bg:#fff;--surface:#fff;--ink:#10110f;--muted:#6d706a;--line:#dedfd8;--soft:#eceee8;--gold:#c8951e;--green:#16734b;--red:#a93631;--shadow:0 18px 55px rgba(0,0,0,.08);--r:22px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Helvetica Neue",Arial,ui-sans-serif,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.header{max-width:1280px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:9px 22px;min-height:76px;position:relative}.brand{min-width:0;display:flex;align-items:center}.logo{display:block;width:min(300px,100%);height:auto;max-height:64px;object-fit:contain;object-position:left center}.header-actions{display:flex;align-items:center;gap:13px}.icon{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:14px;font-weight:900;position:relative}.badge{position:absolute;right:-5px;top:-7px;background:#111;color:#fff;border-radius:99px;font-size:10px;padding:4px 7px}
main{max-width:1280px;margin:auto;padding:28px 22px 90px}.market-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:10px 0 26px}.market-head h1{font-size:clamp(38px,6vw,68px);line-height:.95;letter-spacing:-.045em;margin:8px 0 0;font-weight:800}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:950;color:var(--muted);text-transform:uppercase}.tiny{font-size:12px;line-height:1.45}.muted{color:var(--muted)}
.section{margin:34px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:0 0 14px}.sectionhead h2{margin:0;font-size:25px;letter-spacing:-.025em;font-weight:750}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.item-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}.item-image{aspect-ratio:1/1;background:#f0f0eb;display:grid;place-items:center;overflow:hidden}.item-image img{width:100%;height:100%;object-fit:contain;display:block}.item-body{padding:14px}.item-title{font-weight:900;line-height:1.2;min-height:34px}.item-meta{display:flex;justify-content:space-between;gap:10px;margin-top:9px}.price{font-size:18px;font-weight:950}.current{font-size:14px;font-weight:850}.resolve{color:var(--green);font-weight:900}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;letter-spacing:.05em;background:#fff}
.channel-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.channel{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px;text-align:left;box-shadow:0 8px 28px rgba(0,0,0,.04)}.channel b{display:block;font-size:16px}.channel small{display:block;color:var(--muted);margin-top:5px}
.empty{border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:#fff;padding:24px 8px;text-align:left;color:var(--muted)}.empty b{color:var(--ink)}
.primary,.secondary,.danger,.ghost{border-radius:14px;padding:12px 17px;font-weight:900;border:1px solid var(--line)}.primary{background:#111;color:#fff;border-color:#111}.secondary{background:#fff}.danger{background:#a93631;color:#fff;border-color:#a93631}.ghost{background:transparent;border-color:transparent}
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:grid;place-items:center;padding:18px}.modal{width:min(900px,100%);max-height:min(88vh,900px);overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.25);padding:22px}.modalHead{display:flex;justify-content:space-between;gap:18px;align-items:start;margin-bottom:18px}.modalHead h2{margin:5px 0 0;font-size:28px;letter-spacing:-.045em}.close{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:22px}.actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:18px}.step,.notice,.success{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:11px;background:#fafaf7}.success{background:#eef7f1;border-color:#cce3d3}.notice b,.step b{display:block;margin-bottom:4px}.input{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px 15px;outline:none}.input:focus{border-color:#777}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:flex;flex-direction:column;gap:7px}.offer-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.offer-choice button{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px;text-align:left}.offer-choice button.selected{border:2px solid #111}.offer-choice b{display:block;margin-bottom:5px}.offer-line{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:9px}.offer-line .right{text-align:right}.drawer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.3)}.drawer-panel{margin-left:auto;width:min(390px,100%);height:100%;background:#fff;padding:20px;overflow:auto}.list{display:grid;gap:9px}.listrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.detail{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,.9fr);gap:24px}.detail-visual{border:1px solid var(--line);border-radius:22px;background:#fff;overflow:hidden;min-height:430px;display:grid;place-items:center}.detail-visual img{width:100%;height:100%;max-height:600px;object-fit:contain}.detail h1{font-size:clamp(34px,5vw,58px);line-height:.92;letter-spacing:-.06em;margin:8px 0 20px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}.stat b{display:block;font-size:20px;margin-top:4px}.searchbox{display:flex;gap:8px;margin:0 0 18px}.searchbox input{flex:1}.suggestions{position:relative}.suggestions-box{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.14);max-height:280px;overflow:auto;padding:5px}.suggestion{display:block;width:100%;border:0;background:#fff;text-align:left;border-radius:10px;padding:10px 11px}.suggestion:hover{background:var(--soft)}.landing{padding-top:18px}.landing-buttons{display:flex;flex-direction:column;gap:24px;min-height:auto;padding:18px 0 24px}.landing-button{display:block;width:100%;padding:0;border:0;background:transparent;border-radius:18px;overflow:hidden;line-height:0;box-shadow:0 10px 34px rgba(0,0,0,.07);transition:transform .14s ease,box-shadow .14s ease}.landing-button:hover,.landing-button:focus-visible{transform:translateY(-2px);box-shadow:0 16px 42px rgba(0,0,0,.11);outline:none}.landing-button:focus-visible{box-shadow:0 0 0 3px rgba(200,149,30,.35),0 16px 42px rgba(0,0,0,.11)}.landing-divider{width:100%;height:1px;background:var(--line);flex:0 0 1px}.landing-button img{display:block;width:100%;height:auto}
 .listing-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.listing-choice button{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px;text-align:left}.listing-choice button.selected{border:2px solid #111;padding:14px;background:#fafaf7}.listing-choice b{display:block;margin-bottom:5px}.listing-help{margin-top:10px}.listing-decay{margin-top:12px}.listing-mode{font-size:11px;color:var(--muted);margin-top:8px}.seller-item-mode{margin-top:8px;font-size:11px}.seller-item-mode b{color:var(--ink)}
.footer{max-width:1280px;margin:0 auto;padding:0 22px 34px}.footer-rule{height:1px;background:var(--line);margin-bottom:22px}.footer-inner{display:flex;justify-content:space-between;gap:22px;align-items:flex-start}.footer-brand{font-weight:950;font-size:17px}.footer-copy{margin-top:5px;font-size:11px;color:var(--muted);max-width:420px;line-height:1.5}.footer-links{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}.footer-links button{border:0;background:transparent;padding:2px 0;font-size:11px;font-weight:850;color:var(--muted)}.footer-links button:hover{color:var(--ink)}

@media(max-width:620px){.seller-attention{grid-template-columns:1fr}.seller-item{grid-template-columns:64px minmax(0,1fr);gap:11px}.seller-thumb{width:64px;height:64px}.seller-item-side{grid-column:2;text-align:left;display:flex;align-items:center;gap:10px}.seller-item-side .status{margin-top:0}.seller-controls{grid-template-columns:1fr 1fr}.seller-controls input{grid-column:1/-1}.seller-table{overflow:auto}.seller-table-row{min-width:650px}}

const DAY=86400000;
const RESOLUTION_SECONDS=86400;
const EXTENSION_WINDOW=15;
const EXTENSION_BASE=30;
const EXTENSION_COEF=.4;
const API_BASE='https://api.pokemontcg.io/v2';
const API_PAGE_SIZE=100;
let items=[];
let state=loadState();
let consignmentCache={results:[],pokemon:'',set:'',card:'',variant:'',token:0,loading:false};

function initialState(){return {page:'market',activeItem:null,modal:null,menu:false,search:'',notifications:[],offers:[],proxyBids:{},activity:[],unread:0,toast:''}}
function loadState(){
  try{
    const fresh=initialState();
    for(const k of LEGACY_KEYS){try{localStorage.removeItem(k)}catch(e){}}
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw){items=[];return fresh}
    const saved=JSON.parse(raw);items=Array.isArray(saved.itemState)?saved.itemState:[];
    return {...fresh,...saved,notifications:Array.isArray(saved.notifications)?saved.notifications:[],offers:Array.isArray(saved.offers)?saved.offers:[],proxyBids:saved.proxyBids||{},activity:Array.isArray(saved.activity)?saved.activity:[]};
  }catch(e){console.warn('RapidUp state reset',e);items=[];return initialState()}
}
function save(){state.unread=state.notifications.filter(n=>!n.read).length;try{localStorage.setItem(STORAGE_KEY,JSON.stringify({...state,itemState:items}))}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}
function ageDays(x){return Math.max(0,Math.floor((Date.now()-(x.injectedAt||Date.now()))/DAY))}
function isBuyNow(x){return x?.method==='buy-now'}
function isDormantAuction(x){return !isBuyNow(x)&&(x?.method==='dormant-static'||x?.method==='dormant-decay'||x?.method==='rapidup-cycle'||!x?.method)}
function listingModeLabel(x){if(isBuyNow(x))return 'BUY NOW';if(x?.method==='dormant-decay')return 'DORMANT · DECAY';return 'DORMANT · STATIC'}
function listingModeDescription(x){if(isBuyNow(x))return 'Immediate purchase at the seller’s listed price.';if(x?.method==='dormant-decay')return `Threshold decreases ${money(x.decayAmount||0)} every 24 hours until demand activates the competitive event.`;return 'Seller threshold remains fixed until demand activates the competitive event.'}
function maybeDecayPrice(x,now){if(!isDormantAuction(x)||x.method!=='dormant-decay'||isResolving(x)||x.sold)return false;let next=Number(x.nextDecayAt||0);if(!next){x.nextDecayAt=Number(x.injectedAt||now)+DAY;return true}if(now<next)return false;const amount=Math.max(0,Number(x.decayAmount||0));if(!amount){x.nextDecayAt=now+DAY;return true}const steps=Math.max(1,Math.floor((now-next)/DAY)+1);x.price=Math.max(1,Number(x.price||1)-amount*steps);x.nextDecayAt=next+steps*DAY;return true}
function resolutionEnd(x){return Number(x.resolutionEndsAt||0)}
function isResolving(x){return !x.sold&&Number(x.currentOffer||0)>=Number(x.price||0)&&resolutionEnd(x)>Date.now()}
function activeOffersFor(id){return state.offers.filter(o=>o.item===id&&o.status==='active'&&(Number(o.expires)===0||o.expires>Date.now()))}
function competitiveOffer(x){
  const offers=activeOffersFor(x.id).map(o=>Number(o.current||o.amount||0)).filter(n=>n>0).sort((a,b)=>b-a);
  if(!offers.length)return 0;
  return offers[0];
}
function offerCurrentForBuyer(x,buyer='You'){
  const mine=state.offers.filter(o=>o.item===x.id&&o.buyer===buyer&&o.status==='active'&&o.expires>Date.now());
  if(!mine.length)return 0;
  return Math.max(...mine.map(o=>Number(o.current||o.amount||0)));
}
function minCompetitive(x){return Math.max(1,Number(x.price||1),Number(x.currentOffer||0)+1)}
function formatRemaining(ms){
  if(ms<=0)return '00:00';
  const s=Math.ceil(ms/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(d)return `${d}d ${String(h).padStart(2,'0')}h`;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function notify(text,type='CONCIERGE',item=null){state.notifications.unshift({id:'n'+Date.now()+Math.random(),text,type,item,created:Date.now(),read:false});save()}
function activity(text){state.activity.unshift({text,created:Date.now()});state.activity=state.activity.slice(0,50);save()}
function toast(text){state.toast=text;render();setTimeout(()=>{state.toast='';render()},2200)}
function route(page){state.page=page||'market';state.modal=null;state.menu=false;render()}
function openItem(id){state.activeItem=id;state.page='item';render()}
function openModal(type,data=null){state.modal={type,data};state.menu=false;render();if(type==='consign')setTimeout(initConsignmentGenerator,0)}
function closeModal(){state.modal=null;render()}
function openMenu(){state.menu=true;render()}
function header(){
  return `<header class="topbar"><div class="header"><div class="brand"><button class="ghost" style="padding:0;border:0" aria-label="RapidUp home" onclick="route('market')"><img class="logo" src="${LOGO}" alt="RapidUp Collectibles Marketplace"></button></div><button class="icon concierge-icon header-concierge" aria-label="Concierge" onclick="openModal('concierge')"><img class="concierge-star" src="${PAREIDOLIC_STAR}" alt="">${state.unread?`<span class="badge">${state.unread}</span>`:''}</button><div class="header-actions"><button class="icon" aria-label="Search" onclick="openModal('search')">⌕</button><button class="icon" aria-label="Menu" onclick="openMenu()">☰</button></div></div></header>`;
}
function channels(){
  const map=new Map();items.filter(x=>!x.sold).forEach(x=>{const key=[x.category||'Collectibles',x.internal?.condition||x.condition||'Raw',x.era||'Unknown'].join(' · ');if(!map.has(key))map.set(key,[]);map.get(key).push(x)});
  return [...map.entries()].map(([name,xs])=>({name,items:xs})).sort((a,b)=>b.items.length-a.items.length);
}
function itemCard(x){
  const resolving=isResolving(x), current=Number(x.currentOffer||0), remaining=resolving?resolutionEnd(x)-Date.now():0;
  const primaryLabel=isBuyNow(x)?'BUY NOW':'THRESHOLD', mode=listingModeLabel(x);
  const sub=isBuyNow(x)?'Immediate purchase':resolving?`ACTIVE · ${formatRemaining(remaining)} remaining`:x.method==='dormant-decay'?`DORMANT · ${money(x.decayAmount||0)}/day`: 'DORMANT · STATIC';
  return `<article class="item-card" onclick="openItem('${esc(x.id)}')"><div class="item-image"><img src="${esc(x.img||'')}" alt="${esc(x.fullName||x.name)}"></div><div class="item-body"><div class="item-title">${esc(x.fullName||x.name)}</div><div class="item-meta"><span><span class="eyebrow">${primaryLabel}</span><div class="price">${money(x.price)}</div></span><span style="text-align:right"><span class="eyebrow">CURRENT OFFER</span><div class="current">${current?money(current):'—'}</div></span></div><div class="tiny muted" style="margin-top:9px">${esc(sub)}</div></div></article>`;
}

function openLandingBrowse(kind){state.modal={type:'landingBrowse',data:kind};render()}
function landingBrowseModal(kind){
  const live=items.filter(x=>!x.sold), resolving=live.filter(isResolving), newly=live.filter(x=>ageDays(x)<=1&&!isResolving(x)).sort((a,b)=>(b.injectedAt||0)-(a.injectedAt||0));
  if(kind==='channels'){
    const ch=channels();
    return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">EXPLORE</div><h2>Channels</h2></div><button class="close" onclick="closeModal()">×</button></div>${ch.length?`<div class="channel-grid">${ch.map(c=>`<button class="channel" onclick="closeModal();openChannel(${JSON.stringify(c.name)})"><b>${esc(c.name)}</b><small>${c.items.length} item${c.items.length===1?'':'s'}</small></button>`).join('')}</div>`:'<div class="empty">No channels yet.</div>'}</div>`;
  }
  const buyNow=live.filter(isBuyNow), xs=kind==='closing'?resolving:kind==='buy'?buyNow:newly, title=kind==='closing'?'Closing Soon':kind==='buy'?'Buy Now':'New Arrivals', eyebrow=kind==='closing'?'CLOSING':kind==='buy'?'BUY NOW':'NEW';
  return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div><button class="close" onclick="closeModal()">×</button></div>${xs.length?`<div class="grid">${xs.map(itemCard).join('')}</div>`:`<div class="empty">${kind==='closing'?'Nothing is closing soon.':kind==='buy'?'Nothing is available for Buy Now yet.':'Nothing new yet.'}</div>`}</div>`;
}
function openChannel(name){state.modal={type:'channel',data:name};render()}
function channelModal(name){const xs=channels().find(c=>c.name===name)?.items||[];return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">CHANNEL</div><h2>${esc(name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="grid">${xs.map(itemCard).join('')||'<div class="empty">No items currently match this channel.</div>'}</div></div>`}
function itemPage(){
 const x=items.find(v=>v.id===state.activeItem);if(!x)return market();const resolving=isResolving(x),current=Number(x.currentOffer||0),mine=offerCurrentForBuyer(x),remaining=resolving?resolutionEnd(x)-Date.now():0,buyNow=isBuyNow(x),mode=listingModeLabel(x);

function offerModal(id){const x=items.find(v=>v.id===id);if(!x||isBuyNow(x))return '';return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">${isResolving(x)?'COMPETE':'MAKE AN OFFER'}</div><h2>${esc(x.fullName||x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>${isResolving(x)?'Current Offer':'Threshold'}: ${money(x.currentOffer||x.price)}</b><br>Your offer remains active until the item activates or is sold. Your proxy maximum remains private.</div><div class="offer-choice"><button id="actualChoice" class="selected" onclick="selectOfferMode('actual')"><b>ACTUAL OFFER</b><span class="tiny muted">Commit exactly the amount you enter.</span></button><button id="proxyChoice" onclick="selectOfferMode('proxy')"><b>PROXY</b><span class="tiny muted">Set a private maximum. RapidUp competes only as needed.</span></button></div><label style="display:block;margin-top:13px"><span class="eyebrow" id="offerAmountLabel">OFFER</span><input id="offerAmount" class="input" type="number" min="1" step="1" placeholder="${Math.max(1,Number(x.currentOffer||0)+1)}"></label><div id="offerHelp" class="tiny muted" style="margin-top:8px">The amount you enter is your actual committed offer.</div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="submitOffer('${id}')">Submit Offer</button></div></div>`}
let offerMode='actual';
function selectOfferMode(mode){offerMode=mode;const a=document.getElementById('actualChoice'),p=document.getElementById('proxyChoice'),l=document.getElementById('offerAmountLabel'),h=document.getElementById('offerHelp');if(a)a.classList.toggle('selected',mode==='actual');if(p)p.classList.toggle('selected',mode==='proxy');if(l)l.textContent=mode==='proxy'?'PROXY MAXIMUM':'OFFER';if(h)h.textContent=mode==='proxy'?'Your maximum remains private. The public Current Offer will be only what competition requires.':'The amount you enter is your actual committed offer.'}
function submitOffer(id){const x=items.find(v=>v.id===id),amount=Number(document.getElementById('offerAmount')?.value||0);if(!x||x.sold||isBuyNow(x)||!amount||amount<1)return toast('Enter a valid offer.');const existing=state.offers.filter(o=>o.item===id&&o.buyer==='You'&&o.status==='active');existing.forEach(o=>o.status='replaced');const now=Date.now(),resolving=isResolving(x);const o={id:'o'+now+Math.random(),item:id,buyer:'You',mode:offerMode,amount:offerMode==='actual'?amount:1,max:offerMode==='proxy'?amount:amount,current:offerMode==='proxy'?Math.max(1,Math.min(amount,Math.max(1,Number(x.currentOffer||0)+1))):amount,status:'active',created:now,expires:resolving?resolutionEnd(x):0};state.offers.push(o);recalculateItem(x);save();notify(`Your ${offerMode==='proxy'?'proxy':'offer'} on ${x.fullName||x.name} is active.`,'OFFER',id);state.modal=null;state.activeItem=id;state.page='item';render()}
function recalculateItem(x){if(isBuyNow(x)||x.sold)return;const active=activeOffersFor(x.id).filter(o=>Number(o.expires)===0||o.expires>Date.now());if(!active.length){x.currentOffer=0;return}const sorted=active.slice().sort((a,b)=>Number(b.max)-Number(a.max));const top=sorted[0],second=sorted[1];let current=Number(top.current||top.amount||1);if(second)current=Math.min(Number(top.max),Math.max(1,Number(second.max)+1));else current=Math.max(1,Number(top.current||top.amount||1));if(top.mode==='actual')current=Math.max(current,Number(top.amount));top.current=current;x.currentOffer=current;if(isDormantAuction(x)&&current>=Number(x.price||0))beginAutomaticResolution(x)}
function beginAutomaticResolution(x){if(x.sold||isResolving(x)||isBuyNow(x))return;const now=Date.now();x.resolutionStartedAt=now;x.resolutionEndsAt=now+RESOLUTION_SECONDS*1000;x.status='Active';x.resolution={coef:EXTENSION_COEF,window:EXTENSION_WINDOW,base:EXTENSION_BASE,lastExtension:0,used:[],cycleStartInteger:null};state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.expires=x.resolutionEndsAt);notify(`Demand reached the threshold on ${x.fullName||x.name}. The 24-hour competitive event has begun.`,'CLOSING',x.id);save()}
function sellerBeginResolution(id){const x=items.find(v=>v.id===id);if(!x||x.sold||isBuyNow(x))return;if(!Number(x.currentOffer||0))return toast('There is no current offer to start closing.');const now=Date.now();x.resolutionStartedAt=now;x.resolutionEndsAt=now+RESOLUTION_SECONDS*1000;x.status='Active';x.resolution={coef:EXTENSION_COEF,window:EXTENSION_WINDOW,base:EXTENSION_BASE,lastExtension:0,used:[],cycleStartInteger:null,sellerInitiated:true};state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.expires=x.resolutionEndsAt);notify(`The 24-hour competitive event has begun for ${x.fullName||x.name}.`,'CLOSING',id);save();render()}
function extendResolution(x){if(!isResolving(x))return;const left=Math.ceil((resolutionEnd(x)-Date.now())/1000);if(left>EXTENSION_WINDOW)return;const r=x.resolution||{coef:EXTENSION_COEF,window:EXTENSION_WINDOW,base:EXTENSION_BASE,used:[]};const integer=Math.max(0,Math.floor(left));r.used=r.used||[];if(r.used.includes(integer))return;const ext=EXTENSION_BASE*Math.max(.05,Number(r.coef||EXTENSION_COEF));x.resolutionEndsAt=Math.max(resolutionEnd(x),Date.now()+ext*1000);r.lastExtension=ext;r.used.push(integer);r.coef=Number(r.coef||EXTENSION_COEF)/2;x.resolution=r}
function resolveItem(x){const offers=activeOffersFor(x.id).filter(o=>Number(o.expires)===0||o.expires>Date.now()).sort((a,b)=>Number(b.max)-Number(a.max));if(!offers.length||(!x.resolution?.sellerInitiated&&Number(x.currentOffer||0)<Number(x.price||0))){x.resolutionEndsAt=0;x.resolutionStartedAt=0;x.status=isDormantAuction(x)?'Dormant':'Open Market';state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.status='expired');x.currentOffer=0;if(x.method==='dormant-decay')x.nextDecayAt=Date.now()+DAY;notify(`Competitive event completed for ${x.fullName||x.name}; the item remains available.`,'CYCLE',x.id);return}const top=offers[0],second=offers[1];const finalPrice=second?Math.min(Number(top.max),Math.max(Number(x.price||0),Number(second.max)+1)):Math.min(Number(top.max),Math.max(Number(x.currentOffer||0),Number(x.price||0)));x.sold=true;x.status='Sold';x.resolutionEndsAt=0;state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.status=o.id===top.id?'accepted':'unavailable');state.activity.unshift({text:`Sold ${x.fullName||x.name} for ${money(finalPrice)}.`,created:Date.now()});notify(`You won ${x.fullName||x.name} for ${money(finalPrice)}.`,'WON',x.id);save()}
function buyNow(id){const x=items.find(v=>v.id===id);if(!x||x.sold||!isBuyNow(x))return;const now=Date.now();x.sold=true;x.status='Sold';x.finalPrice=Number(x.price||0);x.salePrice=Number(x.price||0);x.soldAt=now;state.activity.unshift({text:`Purchased ${x.fullName||x.name} for ${money(x.price)}.`,created:now});notify(`Purchase completed for ${x.fullName||x.name} at ${money(x.price)}.`,'PURCHASE',id);save();render()}
function tick(){const now=Date.now();let changed=false;for(const x of items.filter(v=>!v.sold)){if(maybeDecayPrice(x,now))changed=true;recalculateItem(x);if(isResolving(x)){extendResolution(x);if(resolutionEnd(x)<=now){resolveItem(x);changed=true}}else{for(const o of state.offers.filter(v=>v.item===x.id&&v.status==='active')){if(Number(o.expires)>0&&o.expires<=now){o.status='expired';changed=true}}}}if(changed)save();if(changed){render()}else{const timer=document.getElementById('detailTimer');if(timer){const x=items.find(v=>v.id===state.activeItem);if(x&&isResolving(x))timer.textContent=formatRemaining(resolutionEnd(x)-now)}}}

function normalizeCard(c){const rd=c?.set?.releaseDate||'';const y=rd?parseInt(rd.slice(0,4),10):null;return {id:c?.id||'',name:c?.name||'',number:c?.number||'',setId:c?.set?.id||'',setName:c?.set?.name||'',releaseYear:Number.isFinite(y)?y:null,images:c?.images||{},variants:deriveVariants(c),raw:c}}
function deriveVariants(c){const p=c?.tcgplayer?.prices||{};const out=Object.keys(p);return out.length?[...new Set(out)]:['Standard']}
function luceneTerm(value){
  const clean=String(value||'').trim();
  if(!clean)return '';
  const escaped=clean.replace(/([\\:\"()])/g,'\\$1');
  return /\s/.test(clean)?`"${escaped}"`:escaped;
}
function apiQueryFor(field,q){
  const clean=String(q||'').trim();if(!clean)return '';
  const term=luceneTerm(clean);
  if(field==='pokemon')return `name:${term}`;
  if(field==='set')return `set.name:${term} OR set.id:${term}`;
  if(field==='card'){
    const m=clean.match(/^(.*?)\s*#\s*([A-Za-z0-9-]+)$/);
    if(m&&m[1].trim())return `name:${luceneTerm(m[1])} number:${luceneTerm(m[2])}`;
    return `name:${term} OR number:${term} OR id:${term}`;
  }
  return `${term} OR name:${term} OR set.name:${term} OR id:${term} OR number:${term}`;
}
window.searchPokemonCards=async function(arg){if(typeof arg==='string')return searchPokemonCards('pokemon',arg);if(arg?.set!=null)return searchPokemonCards('set',arg.set);if(arg?.card!=null)return searchPokemonCards('card',arg.card);return []};

function filterLocal(field,q){const clean=String(q||'').toLowerCase();let xs=consignmentCache.results;if(field==='pokemon'&&consignmentCache.pokemon)xs=xs.filter(x=>x.name.toLowerCase().includes(consignmentCache.pokemon.toLowerCase()));if(field==='set'&&consignmentCache.set)xs=xs.filter(x=>x.setName.toLowerCase().includes(consignmentCache.set.toLowerCase())||x.setId.toLowerCase()===consignmentCache.set.toLowerCase());if(field==='variant'&&consignmentCache.variant)xs=xs.filter(x=>(x.variants||[]).some(v=>v.toLowerCase().includes(consignmentCache.variant.toLowerCase())));if(clean){if(field==='pokemon')xs=xs.filter(x=>x.name.toLowerCase().includes(clean));if(field==='set')xs=xs.filter(x=>x.setName.toLowerCase().includes(clean)||x.setId.toLowerCase()===clean);if(field==='card')xs=xs.filter(x=>`${x.name} #${x.number}`.toLowerCase().includes(clean)||x.id.toLowerCase()===clean||x.number.toLowerCase()===clean)}return xs}
function renderConsignmentSuggestions(field){const box=document.getElementById(`consign${field.charAt(0).toUpperCase()+field.slice(1)}Box`);if(!box)return;let opts=[];const q=(document.getElementById(`consign${field.charAt(0).toUpperCase()+field.slice(1)}`)?.value||'').trim().toLowerCase();const xs=filterLocal(field,q);if(field==='pokemon')opts=[...new Set(xs.map(x=>x.name))].map(v=>({value:v,label:v}));else if(field==='set'){const m=new Map();xs.forEach(x=>{if(!m.has(x.setId))m.set(x.setId,{value:x.setName,label:x.setName,sub:x.releaseYear||''})});opts=[...m.values()]}else if(field==='card')opts=xs.map(x=>({value:x.id,label:`${x.name} #${x.number}`,sub:x.setName}));else if(field==='variant'){const s=new Set();xs.forEach(x=>(x.variants||[]).forEach(v=>s.add(v)));opts=[...s].map(v=>({value:v,label:v}))}opts=opts.slice(0,60);box.innerHTML=opts.length?opts.map((o,i)=>`<button class="suggestion" type="button" onclick="selectConsignmentOption('${field}',${i})"><b>${esc(o.label)}</b>${o.sub?`<small class="muted">${esc(o.sub)}</small>`:''}</button>`).join(''):'<div class="tiny muted" style="padding:10px">No matching selections.</div>';box._options=opts;box.hidden=false}
async function lookupConsignment(field,value){const token=++consignmentCache.token;consignmentCache.loading=true;setConsignmentStatus(`Searching Pokémon TCG database for “${value}”…`);try{const rs=await searchPokemonCards(field,value);if(token!==consignmentCache.token)return;consignmentCache.results=rs;applyConsignmentSelection(field,value);setConsignmentStatus(rs.length?`${rs.length} matching card${rs.length===1?'':'s'} found.`:'No matching Pokémon cards found.',!rs.length);renderConsignmentSuggestions(field);updateConsignmentPreview()}catch(e){if(token!==consignmentCache.token)return;console.error(e);setConsignmentStatus('The Pokémon TCG database could not be reached. Check your connection and try again.',true)}finally{if(token===consignmentCache.token)consignmentCache.loading=false}}

function consignmentCardChanged(v){const q=String(v||'').trim();const exact=consignmentCache.results.find(x=>x.id.toLowerCase()===q.toLowerCase()||`${x.name} #${x.number}`.toLowerCase()===q.toLowerCase());if(exact){selectCard(exact);return};consignmentCache.card='';consignmentCache.variant='';document.getElementById('consignVariant').value='';scheduleLookup('card',q);renderConsignmentSuggestions('card')}
function consignmentVariantChanged(v){consignmentCache.variant=v||'';renderConsignmentSuggestions('variant');updateConsignmentPreview()}
function selectCard(card){consignmentCache.card=card.id;consignmentCache.pokemon=card.name;consignmentCache.set=card.setName;document.getElementById('consignPokemon').value=card.name;document.getElementById('consignSet').value=card.setName;document.getElementById('consignCard').value=`${card.name} #${card.number}`;document.getElementById('consignVariant').value='';consignmentCache.variant='';renderConsignmentSuggestions('variant');document.querySelectorAll('.suggestions-box').forEach(x=>x.hidden=true);updateConsignmentPreview()}
function selectConsignmentOption(field,i){const box=document.getElementById(`consign${field.charAt(0).toUpperCase()+field.slice(1)}Box`);const o=box?box._options?.[i]:null;if(!o)return;const input=document.getElementById(`consign${field.charAt(0).toUpperCase()+field.slice(1)}`);if(field==='card'){const card=consignmentCache.results.find(x=>x.id===o.value);if(card)selectCard(card);return}input.value=o.value;if(field==='pokemon')consignmentCache.pokemon=o.value;if(field==='set')consignmentCache.set=o.value;if(field==='variant')consignmentCache.variant=o.value;box.hidden=true;updateConsignmentPreview()}
function setConsignmentStatus(t,error=false){const e=document.getElementById('consignStatus');if(e){e.textContent=t;e.style.color=error?'var(--red)':'var(--muted)'}}
function updateConsignmentPreview(){const card=consignmentCache.results.find(x=>x.id===consignmentCache.card);const title=document.getElementById('consignTitle'),submit=document.getElementById('consignSubmit');if(!title||!submit)return;if(!card||!consignmentCache.variant){title.textContent=card?`${card.name} #${card.number} · Select a variant.`:'Select a card and variant.';submit.disabled=true;return}title.textContent=`${card.name} · ${card.setName} #${card.number} · ${consignmentCache.variant}`;submit.disabled=false}
function submitConsignment(){const card=consignmentCache.results.find(x=>x.id===consignmentCache.card);const price=Math.max(1,Number(document.getElementById('consignPrice')?.value||1));const decay=Math.max(1,Number(document.getElementById('consignDecay')?.value||1));if(!card||!consignmentCache.variant)return toast('Select a valid card and variant first.');const now=Date.now(),year=card.releaseYear||'',method=listingMode,item={id:'item-'+now+Math.random(),name:card.name,set:`${card.setName} #${card.number}`,fullName:`${card.name} · ${card.setName} #${card.number} · ${consignmentCache.variant}`,year,era:year>=2014?'Modern':year>=2003?'Mid Era':year>=1996?'Classic':'Unknown',category:'Pokemon',method,type:method==='buy-now'?'Buy Now':'RapidUp Dormant Auction',price,currentOffer:0,status:method==='buy-now'?'Buy Now':'Dormant',sold:false,staged:true,injectedAt:now,cycleStartedAt:now,nextDecayAt:method==='dormant-decay'?now+DAY:0,decayAmount:method==='dormant-decay'?decay:0,img:card.images?.large||card.images?.small||'',variant:consignmentCache.variant,grade:document.getElementById('consignCondition')?.value==='Graded'?'PSA 10':'Raw',lang:document.getElementById('consignLanguage')?.value||'English',presentation:'RapidUp Standard',internal:{condition:document.getElementById('consignCondition')?.value||'Raw',language:document.getElementById('consignLanguage')?.value||'English',presentation:'RapidUp Standard'},consignment:{cardId:card.id,setId:card.setId,setName:card.setName,cardNumber:card.number,cardName:card.name,releaseYear:card.releaseYear,variant:consignmentCache.variant}};items.push(item);save();state.modal=null;notify(`Your ${card.name} listing is live.`,'LISTING',item.id);activity(`Listed ${item.fullName} at ${money(price)} · ${method==='buy-now'?'Buy Now':method==='dormant-decay'?`Dormant with ${money(decay)}/day decay`:'Dormant static threshold'}.`);render()}
function sellerDemoItems(){return [
{id:'demo-charizard',name:'Charizard ex',fullName:'Charizard ex · Obsidian Flames',price:120,currentOffer:104,status:'Dormant',method:'dormant-static',condition:'Near Mint',offers:3,listed:'2 days ago'},
{id:'demo-mewtwo',name:'Mewtwo GX',fullName:'Mewtwo GX · Shining Legends',price:85,currentOffer:0,status:'Dormant',method:'dormant-decay',decayAmount:5,condition:'Lightly Played',offers:0,listed:'4 days ago'},
{id:'demo-jolteon',name:'Jolteon V',fullName:'Jolteon V · Evolving Skies',price:72,currentOffer:69,status:'Active',method:'dormant-static',condition:'Near Mint',offers:4,listed:'6 days ago'},
{id:'demo-gardevoir',name:'Gardevoir',fullName:'Gardevoir · Secret Wonders',price:110,currentOffer:91,status:'Buy Now',method:'buy-now',condition:'Moderately Played',offers:2,listed:'1 day ago'},
{id:'demo-blastoise',name:'Blastoise',fullName:'Blastoise · Boundaries Crossed',price:64,currentOffer:64,status:'Active',method:'dormant-decay',decayAmount:4,condition:'Lightly Played',offers:5,listed:'7 days ago'}]}
function sellerInventoryRows(){const real=items.filter(x=>!x.sold);return real.length?real:sellerDemoItems()}
function sellerItemRow(x){const resolving=isResolving(x),current=Number(x.currentOffer||0),image=x.img||'',mode=listingModeLabel(x),click=x.id.startsWith('demo-')?'':`onclick="openItem('${esc(x.id)}')"`;return `<article class="seller-item" ${click} style="cursor:${x.id.startsWith('demo-')?'default':'pointer'}"><div class="seller-thumb">${image?`<img src="${esc(image)}" alt="${esc(x.fullName||x.name)}">`:'<span class="tiny muted">ITEM</span>'}</div><div class="seller-item-main"><div class="seller-item-name">${esc(x.fullName||x.name)}</div><div class="seller-item-meta"><span>Listed <b>${esc(x.listed||'Recently')}</b></span><span>Price <b>${money(x.price)}</b></span><span>Offer <b>${current?money(current):'No offer'}</b></span></div><div class="seller-item-mode">Mode: <b>${esc(mode)}</b>${x.method==='dormant-decay'?` · ${money(x.decayAmount||0)}/day`:''}</div></div><div class="seller-item-side"><div class="price">${money(x.price)}</div><div class="status"><span class="pill">${resolving?'Active':esc(x.status||mode)}</span></div></div></article>`}
function sellerSalesRows(){const sold=items.filter(x=>x.sold);if(sold.length)return sold.map(x=>({name:x.fullName||x.name||'Item',price:money(x.finalPrice||x.salePrice||x.currentOffer||x.price),date:x.soldAt?new Date(x.soldAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Completed',status:'Completed',net:money(x.finalPrice||x.salePrice||x.currentOffer||x.price)}));return [{name:'Jolteon V · Evolving Skies',price:'$72',date:'Sep 7, 2026',status:'Completed',net:'$72'},{name:'Mewtwo GX · Shining Legends',price:'$62',date:'Sep 5, 2026',status:'Completed',net:'$62'},{name:'Blastoise · Boundaries Crossed',price:'$48',date:'Sep 2, 2026',status:'Completed',net:'$48'},{name:'Alakazam V · Vivid Voltage',price:'$29',date:'Aug 29, 2026',status:'Completed',net:'$29'}]}
function sellerActivityRows(){return [{text:'Offer received on Charizard ex — $104.',time:'11:42 AM'},{text:'Resolution started for Jolteon V.',time:'10:18 AM'},{text:'Sale completed — Mewtwo GX for $62.',time:'Yesterday'},{text:'Item listed — Blastoise.',time:'Sep 1'}]}
function sellerOverview(){const inv=sellerInventoryRows(),offers=inv.filter(x=>Number(x.currentOffer||0)>0),closing=inv.filter(x=>x.status==='Closing'||isResolving(x)),sales=sellerSalesRows();return `<main><div class="market-head"><div><div class="eyebrow">SELLER HUB</div><h1>Your Marketplace</h1><div class="tiny muted" style="margin-top:10px">Everything happening with your inventory, sales, and offers.</div></div><button class="primary" onclick="openModal('consign')">List an Item</button></div><nav class="seller-tabs" aria-label="Seller Hub sections"><a href="#seller-overview">Overview</a><a href="#seller-inventory">Inventory</a><a href="#seller-sales">Sales</a><a href="#seller-activity">Activity</a></nav>
<section id="seller-overview" class="seller-section"><div class="seller-section-title"><div><div class="eyebrow">OVERVIEW</div><h2>At a glance</h2></div></div><div class="seller-quadrant"><div class="seller-metric"><div class="label">Active Items</div><div class="value">${inv.length}</div></div><div class="seller-metric"><div class="label">Items Sold</div><div class="value">${sales.length}</div></div><div class="seller-metric"><div class="label">Gross Sales</div><div class="value">${money(sales.reduce((n,x)=>n+Number(x.price.replace('$','')),0))}</div></div><div class="seller-metric"><div class="label">Net</div><div class="value">$3.00</div></div></div><div class="seller-attention"><div class="seller-mini"><div class="seller-mini-head"><h3>Offers Received</h3><div class="seller-mini-count">${offers.length}</div></div><div class="seller-mini-list">${offers.slice(0,3).map(x=>`<div class="seller-mini-row"><span>${esc(x.name||x.fullName)}</span><b>${money(x.currentOffer)}</b></div>`).join('')||'<div class="tiny muted">No offers on active items.</div>'}</div></div><div class="seller-mini"><div class="seller-mini-head"><h3>Closing Soon</h3><div class="seller-mini-count">${closing.length}</div></div><div class="seller-mini-list">${closing.slice(0,3).map(x=>`<div class="seller-mini-row"><span>${esc(x.name||x.fullName)}</span><b>Resolving</b></div>`).join('')||'<div class="tiny muted">Nothing is closing.</div>'}</div></div></div></section>
<section id="seller-inventory" class="seller-section"><div class="seller-section-title"><div><div class="eyebrow">INVENTORY</div><h2>Your Items</h2></div><button class="seller-link" onclick="document.getElementById('seller-inventory-all').classList.toggle('open')">View All Inventory →</button></div><div class="seller-list">${inv.slice(0,4).map(sellerItemRow).join('')}</div><div id="seller-inventory-all" class="seller-all" style="margin-top:14px"><div class="seller-controls"><input id="sellerInventorySearch" class="input" placeholder="Search inventory…" oninput="filterSellerInventory()"><select id="sellerInventoryStatus" class="input" onchange="filterSellerInventory()"><option value="all">All Statuses</option><option value="active">Active</option><option value="dormant">Dormant</option><option value="buy now">Buy Now</option><option value="closing">Closing</option><option value="sold">Sold</option></select><select id="sellerInventorySort" class="input" onchange="filterSellerInventory()"><option value="recent">Recently Listed</option><option value="offerHigh">Highest Offer</option><option value="priceHigh">Highest Listed Price</option><option value="priceLow">Lowest Listed Price</option></select></div><div class="seller-filterbar"><button class="active" type="button">Advanced Filters</button><button type="button">Has Offer</button><button type="button">No Offer</button></div><div id="sellerInventoryAllRows" class="seller-list">${inv.map(sellerItemRow).join('')}</div></div></section>
<section id="seller-sales" class="seller-section"><div class="seller-section-title"><div><div class="eyebrow">SALES</div><h2>Completed Transactions</h2></div></div><div class="seller-table"><div class="seller-table-row head"><div>Item</div><div>Sale Price</div><div>Date</div><div>Status</div><div>Net</div></div>${sales.map(x=>`<div class="seller-table-row"><div class="seller-sale-name">${esc(x.name)}</div><div>${x.price}</div><div>${x.date}</div><div>${x.status}</div><div><b>${x.net}</b></div></div>`).join('')}</div></section>
<section id="seller-activity" class="seller-section"><div class="seller-section-title"><div><div class="eyebrow">ACTIVITY</div><h2>Recent Activity</h2></div></div><div class="seller-activity">${sellerActivityRows().map(x=>`<div class="seller-event"><div class="seller-event-mark"></div><div class="seller-event-text">${esc(x.text)}</div><div class="seller-event-time">${esc(x.time)}</div></div>`).join('')}</div></section></main>`}
function filterSellerInventory(){const source=sellerInventoryRows(),q=(document.getElementById('sellerInventorySearch')?.value||'').toLowerCase().trim(),status=document.getElementById('sellerInventoryStatus')?.value||'all',sort=document.getElementById('sellerInventorySort')?.value||'recent';let rows=source.filter(x=>(!q||`${x.fullName||x.name}`.toLowerCase().includes(q))&&(status==='all'||String(x.status||'Active').toLowerCase()===status));if(sort==='offerHigh')rows.sort((a,b)=>Number(b.currentOffer||0)-Number(a.currentOffer||0));if(sort==='priceHigh')rows.sort((a,b)=>Number(b.price||0)-Number(a.price||0));if(sort==='priceLow')rows.sort((a,b)=>Number(a.price||0)-Number(b.price||0));const el=document.getElementById('sellerInventoryAllRows');if(el)el.innerHTML=rows.map(sellerItemRow).join('')||'<div class="seller-empty">No inventory matches these filters.</div>'}
function contactModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">RAPIDUP</div><h2>Contact Us</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>We’d love to hear from you.</b><br>Questions, feedback, or ideas for making collecting better? This is where we’ll make room for the community.</div><label style="display:block;margin-top:14px"><span class="eyebrow">Message</span><textarea id="contactMessage" class="input" rows="5" placeholder="Tell us what’s on your mind…"></textarea></label><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="closeModal();toast('Thanks for reaching out.')">Send Message</button></div></div>`}
function footer(){return `<footer class="footer"><div class="footer-rule"></div><div class="footer-inner"><div><div class="footer-brand">RapidUp</div><div class="footer-copy">Built for integrity. Guided by simplicity. RapidUp is designed to preserve agency at the core of the collector experience.</div><div class="footer-copy">© 2026 RapidUp. All rights reserved.</div></div><nav class="footer-links" aria-label="Footer"><button onclick="openModal('contact')">Contact Us</button><button onclick="toast('About RapidUp is coming soon.')">About</button><button onclick="toast('Terms are coming soon.')">Terms</button><button onclick="toast('Privacy policy is coming soon.')">Privacy</button></nav></div></footer>`}
function modal(){if(!state.modal)return '';const m=state.modal;if(m.type==='search')return overlay(searchModal());if(m.type==='concierge')return overlay(conciergeModal());if(m.type==='consign')return overlay(consignmentModal());if(m.type==='channel')return overlay(channelModal(m.data));if(m.type==='landingBrowse')return overlay(landingBrowseModal(m.data));if(m.type==='contact')return overlay(contactModal());if(m.type==='offer'){offerMode='actual';return overlay(offerModal(m.data))}return ''}
function overlay(body){return `<div class="modalOverlay" onclick="if(event.target===this)closeModal()">${body}</div>`}
function render(){let body=state.page==='item'?itemPage():state.page==='seller'?sellerOverview():market();document.getElementById('app').innerHTML=header()+body+footer()+modal()+(state.menu?menuDrawer():'')+(state.toast?`<div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:#111;color:#fff;padding:12px 16px;border-radius:14px;font-weight:800">${esc(state.toast)}</div>`:'');if(state.modal?.type==='search')setTimeout(renderSearchResults,0)}
window.addEventListener('click',e=>{if(!e.target.closest('.suggestions'))document.querySelectorAll('.suggestions-box').forEach(x=>x.hidden=true)});
setInterval(tick,1000);render();tick();
</script>
</body>
