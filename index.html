const DAY=86400000;
const CYCLE_DAYS=7;
const RESOLUTION_SECONDS=90;
const EXTENSION_WINDOW=15;
const EXTENSION_BASE=30;
const EXTENSION_COEF=.4;
const API_BASE='https://api.pokemontcg.io/v2';
const API_PAGE_SIZE=100;
let items=[];
let state=loadState();
let consignmentCache={results:[],pokemon:'',set:'',card:'',variant:'',token:0,loading:false};

function initialState(){return {page:'market',activeItem:null,modal:null,menu:false,search:'',notifications:[],offers:[],proxyBids:{},activity:[],communityPulse:{},unread:0,toast:''}}
function loadState(){
  try{
    const fresh=initialState();
    for(const k of LEGACY_KEYS){try{localStorage.removeItem(k)}catch(e){}}
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw){items=[];return fresh}
    const saved=JSON.parse(raw);items=Array.isArray(saved.itemState)?saved.itemState:[];
    return {...fresh,...saved,notifications:Array.isArray(saved.notifications)?saved.notifications:[],offers:Array.isArray(saved.offers)?saved.offers:[],proxyBids:saved.proxyBids||{},activity:Array.isArray(saved.activity)?saved.activity:[],communityPulse:saved.communityPulse&&typeof saved.communityPulse==='object'?saved.communityPulse:{}};
  }catch(e){console.warn('RapidUp state reset',e);items=[];return initialState()}
}
function save(){state.unread=state.notifications.filter(n=>!n.read).length;try{localStorage.setItem(STORAGE_KEY,JSON.stringify({...state,itemState:items}))}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}
function ageDays(x){return Math.max(0,Math.floor((Date.now()-(x.injectedAt||Date.now()))/DAY))}
function cycleStart(x){return Number(x.cycleStartedAt||x.injectedAt||Date.now())}
function cycleEnd(x){return cycleStart(x)+CYCLE_DAYS*DAY}
function resolutionEnd(x){return Number(x.resolutionEndsAt||0)}
function isResolving(x){return !x.sold&&Number(x.currentOffer||0)>=Number(x.price||0)&&resolutionEnd(x)>Date.now()}
function isExpiredCycle(x){return !x.sold&&!isResolving(x)&&cycleEnd(x)<=Date.now()}
function activeOffersFor(id){return state.offers.filter(o=>o.item===id&&o.status==='active'&&o.expires>Date.now())}
function competitiveOffer(x){
  const offers=activeOffersFor(x.id).map(o=>Number(o.current||o.amount||0)).filter(n=>n>0).sort((a,b)=>b-a);
  if(!offers.length)return 0;
  return offers[0];
}
function offerCurrentForBuyer(x,buyer='You'){
  const mine=state.offers.filter(o=>o.item===x.id&&o.buyer===buyer&&o.status==='active'&&o.expires>Date.now());
  if(!mine.length)return 0;
  return Math.max(...mine.map(o=>Number(o.current||o.amount||0)));
}
function minCompetitive(x){return Math.max(1,Number(x.price||1),Number(x.currentOffer||0)+1)}
function formatRemaining(ms){
  if(ms<=0)return '00:00';
  const s=Math.ceil(ms/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(d)return `${d}d ${String(h).padStart(2,'0')}h`;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function notify(text,type='CONCIERGE',item=null){state.notifications.unshift({id:'n'+Date.now()+Math.random(),text,type,item,created:Date.now(),read:false});save()}
function activity(text){state.activity.unshift({text,created:Date.now()});state.activity=state.activity.slice(0,50);save()}
function toast(text){state.toast=text;render();setTimeout(()=>{state.toast='';render()},2200)}
function route(page){state.page=page||'market';state.modal=null;state.menu=false;render()}
function openItem(id){state.activeItem=id;state.page='item';render()}
function openModal(type,data=null){state.modal={type,data};state.menu=false;render();if(type==='consign')setTimeout(initConsignmentGenerator,0)}
function closeModal(){state.modal=null;render()}
function openMenu(){state.menu=true;render()}
function header(){
  return `<header class="topbar"><div class="header"><div class="brand"><button class="ghost" style="padding:0;border:0" aria-label="RapidUp home" onclick="route('market')"><img class="logo" src="${LOGO}" alt="RapidUp Collectibles Marketplace"></button></div><div class="header-actions"><button class="icon" aria-label="Search" onclick="openModal('search')">⌕</button><button class="icon concierge-icon" aria-label="Concierge" onclick="openModal('concierge')"><img class="concierge-star" src="${PAREIDOLIC_STAR}" alt="">${state.unread?`<span class="badge">${state.unread}</span>`:''}</button><button class="icon" aria-label="Menu" onclick="openMenu()">☰</button></div></div></header>`;
}
function channels(){
  const map=new Map();items.filter(x=>!x.sold).forEach(x=>{const key=[x.category||'Collectibles',x.internal?.condition||x.condition||'Raw',x.era||'Unknown'].join(' · ');if(!map.has(key))map.set(key,[]);map.get(key).push(x)});
  return [...map.entries()].map(([name,xs])=>({name,items:xs})).sort((a,b)=>b.items.length-a.items.length);
}
function itemCard(x){
  const resolving=isResolving(x), current=Number(x.currentOffer||0), remaining=resolving?resolutionEnd(x)-Date.now():0;
  return `<article class="item-card" onclick="openItem('${esc(x.id)}')"><div class="item-image"><img src="${esc(x.img||'')}" alt="${esc(x.fullName||x.name)}"></div><div class="item-body"><div class="item-title">${esc(x.fullName||x.name)}</div><div class="item-meta"><span><span class="eyebrow">PRICE</span><div class="price">${money(x.price)}</div></span><span style="text-align:right"><span class="eyebrow">CURRENT OFFER</span><div class="current">${current?money(current):'—'}</div></span></div><div class="tiny muted" style="margin-top:9px">${ageDays(x)} day${ageDays(x)===1?'':'s'} old ${resolving?`· <span class="resolve">${formatRemaining(remaining)} remaining</span>`:''}</div></div></article>`;
}

function openLandingBrowse(kind){state.modal={type:'landingBrowse',data:kind};render()}
function landingBrowseModal(kind){
  const live=items.filter(x=>!x.sold), resolving=live.filter(isResolving), newly=live.filter(x=>ageDays(x)<=1&&!isResolving(x)).sort((a,b)=>(b.injectedAt||0)-(a.injectedAt||0));
  if(kind==='channels'){
    const ch=channels();
    return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">EXPLORE</div><h2>Channels</h2></div><button class="close" onclick="closeModal()">×</button></div>${ch.length?`<div class="channel-grid">${ch.map(c=>`<button class="channel" onclick="closeModal();openChannel(${JSON.stringify(c.name)})"><b>${esc(c.name)}</b><small>${c.items.length} item${c.items.length===1?'':'s'}</small></button>`).join('')}</div>`:'<div class="empty">No channels yet.</div>'}</div>`;
  }
  const xs=kind==='closing'?resolving:newly, title=kind==='closing'?'Closing Soon':'New Arrivals', eyebrow=kind==='closing'?'CLOSING':'NEW';
  return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div><button class="close" onclick="closeModal()">×</button></div>${xs.length?`<div class="grid">${xs.map(itemCard).join('')}</div>`:`<div class="empty">${kind==='closing'?'Nothing is closing soon.':'Nothing new yet.'}</div>`}</div>`;
}
function openChannel(name){state.modal={type:'channel',data:name};render()}
function channelModal(name){const xs=channels().find(c=>c.name===name)?.items||[];return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">CHANNEL</div><h2>${esc(name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="grid">${xs.map(itemCard).join('')||'<div class="empty">No items currently match this channel.</div>'}</div></div>`}
function pulseData(id){const p=state.communityPulse?.[id]||{condition:{},price:{}};return {condition:p.condition||{},price:p.price||{},yourCondition:p.yourCondition||'',yourPrice:p.yourPrice||''}}
function pulseTotal(obj){return Object.values(obj||{}).reduce((a,n)=>a+Number(n||0),0)}
function pulsePct(n,total){return total?Math.round(Number(n||0)/total*100):0}
function pulseResults(obj){const total=pulseTotal(obj);return Object.entries(obj||{}).filter(([,n])=>Number(n)>0).sort((a,b)=>Number(b[1])-Number(a[1])).map(([k,n])=>`<div class="pulse-row"><span>${esc(k)}</span><span class="pulse-track"><span class="pulse-fill" style="width:${pulsePct(n,total)}%"></span></span><b>${pulsePct(n,total)}%</b></div>`).join('')}
function communityPulse(x){const p=pulseData(x.id),ct=pulseTotal(p.condition),pt=pulseTotal(p.price);if(!ct&&!pt)return `<section class="pulse"><div class="pulse-empty"><div class="mark">✦</div><b>Be the first voice in the Pulse.</b><p>You’ve seen the item. Now give the community your read on its condition and asking price.</p><button class="primary" onclick="openPulse('${esc(x.id)}')">Assess This Item</button></div></section>`;return `<section class="pulse"><div class="pulse-head"><div><div class="eyebrow">COMMUNITY PULSE</div><div class="pulse-title">What does the community think?</div><div class="pulse-sub">A snapshot of collector opinion—not a grading authority.</div></div><button class="secondary" onclick="openPulse('${esc(x.id)}')">${p.yourCondition||p.yourPrice?'Update Your View':'Assess This Item'}</button></div>${ct?`<div class="pulse-section"><h3>Condition</h3><div class="pulse-results">${pulseResults(p.condition)}</div></div>`:''}${pt?`<div class="pulse-section"><h3>Price Sentiment</h3><div class="pulse-results">${pulseResults(p.price)}</div></div>`:''}${p.yourCondition||p.yourPrice?`<div class="tiny muted" style="margin-top:13px">Your assessment: ${p.yourCondition?esc(p.yourCondition):'—'} · ${p.yourPrice?esc(p.yourPrice):'—'}</div>`:''}</section>`}
function openPulse(id){state.modal={type:'pulse',data:id};render()}
function submitPulse(id){const condition=document.getElementById('pulseCondition')?.value||'',price=document.querySelector('.sentiment-choice button.selected')?.dataset.value||'';if(!condition||!price)return toast('Choose a condition and price sentiment first.');if(!state.communityPulse[id])state.communityPulse[id]={condition:{},price:{},yourCondition:'',yourPrice:''};const p=state.communityPulse[id];if(p.yourCondition)p.condition[p.yourCondition]=Math.max(0,Number(p.condition[p.yourCondition]||0)-1);if(p.yourPrice)p.price[p.yourPrice]=Math.max(0,Number(p.price[p.yourPrice]||0)-1);p.condition[condition]=Number(p.condition[condition]||0)+1;p.price[price]=Number(p.price[price]||0)+1;p.yourCondition=condition;p.yourPrice=price;Object.keys(p.condition).forEach(k=>{if(!p.condition[k])delete p.condition[k]});Object.keys(p.price).forEach(k=>{if(!p.price[k])delete p.price[k]});save();state.modal=null;render();toast('Your assessment is now part of the Community Pulse.')}
function pulseModal(id){const x=items.find(v=>v.id===id);if(!x)return '';const p=pulseData(id);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">COMMUNITY PULSE</div><h2>What do you think?</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="poll-preview"><img src="${esc(x.img||'')}" alt="${esc(x.fullName||x.name)}"><div class="poll-preview-caption">${esc(x.fullName||x.name)}</div></div><div class="poll-question"><label for="pulseCondition">What condition do you think this item is in?</label><select id="pulseCondition" class="input"><option value="">Select a condition…</option>${['Near Mint','Lightly Played','Moderately Played','Heavily Played','Damaged'].map(v=>`<option value="${v}" ${p.yourCondition===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="poll-question"><label>How does the asking price feel to you?</label><div class="sentiment-choice">${['Underpriced','Fair Price','Overpriced'].map(v=>`<button type="button" data-value="${v}" class="${p.yourPrice===v?'selected':''}" onclick="document.querySelectorAll('.sentiment-choice button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">${v}</button>`).join('')}</div></div><div class="tiny muted" style="margin-top:12px">Your assessment is editable later. Community Pulse is informational and does not replace professional grading.</div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="submitPulse('${esc(id)}')">${p.yourCondition||p.yourPrice?'Update Assessment':'Submit Assessment'}</button></div></div>`}
function itemPage(){

function submitOffer(id){const x=items.find(v=>v.id===id),amount=Number(document.getElementById('offerAmount')?.value||0);if(!x||x.sold||!amount||amount<1)return toast('Enter a valid offer.');const existing=state.offers.filter(o=>o.item===id&&o.buyer==='You'&&o.status==='active');existing.forEach(o=>o.status='replaced');const now=Date.now();const o={id:'o'+now+Math.random(),item:id,buyer:'You',mode:offerMode,amount:offerMode==='actual'?amount:1,max:offerMode==='proxy'?amount:amount,current:offerMode==='proxy'?Math.max(1,Math.min(amount,Math.max(1,Number(x.currentOffer||0)+1))):amount,status:'active',created:now,expires:cycleEnd(x)};state.offers.push(o);recalculateItem(x);save();notify(`Your ${offerMode==='proxy'?'proxy':'offer'} on ${x.fullName||x.name} is active.`,'OFFER',id);state.modal=null;state.activeItem=id;state.page='item';render()}
function recalculateItem(x){const active=activeOffersFor(x.id).filter(o=>o.expires>Date.now());if(!active.length){x.currentOffer=0;return}const sorted=active.slice().sort((a,b)=>Number(b.max)-Number(a.max));const top=sorted[0],second=sorted[1];let current=Number(top.current||top.amount||1);if(second)current=Math.min(Number(top.max),Math.max(1,Number(second.max)+1));else current=Math.max(1,Number(top.current||top.amount||1));if(top.mode==='actual')current=Math.max(current,Number(top.amount));top.current=current;x.currentOffer=current; if(current>=Number(x.price||0))beginAutomaticResolution(x)}
function beginAutomaticResolution(x){if(x.sold||isResolving(x))return;x.resolutionStartedAt=Date.now();x.resolutionEndsAt=Date.now()+RESOLUTION_SECONDS*1000;x.resolution={coef:EXTENSION_COEF,window:EXTENSION_WINDOW,base:EXTENSION_BASE,lastExtension:0,used:[],cycleStartInteger:null};notify(`Demand reached Price on ${x.fullName||x.name}. Closing has begun.`,'CLOSING',x.id);save()}
function sellerBeginResolution(id){const x=items.find(v=>v.id===id);if(!x||x.sold)return;if(!Number(x.currentOffer||0))return toast('There is no current offer to start closing.');x.resolutionStartedAt=Date.now();x.resolutionEndsAt=Date.now()+RESOLUTION_SECONDS*1000;x.resolution={coef:EXTENSION_COEF,window:EXTENSION_WINDOW,base:EXTENSION_BASE,lastExtension:0,used:[],cycleStartInteger:null,sellerInitiated:true};notify(`Closing started for ${x.fullName||x.name}.`,'CLOSING',id);save();render()}
function extendResolution(x){if(!isResolving(x))return;const left=Math.ceil((resolutionEnd(x)-Date.now())/1000);if(left>EXTENSION_WINDOW)return;const r=x.resolution||{coef:EXTENSION_COEF,window:EXTENSION_WINDOW,base:EXTENSION_BASE,used:[]};const integer=Math.max(0,Math.floor(left));r.used=r.used||[];if(r.used.includes(integer))return;const ext=EXTENSION_BASE*Math.max(.05,Number(r.coef||EXTENSION_COEF));x.resolutionEndsAt=Math.max(resolutionEnd(x),Date.now()+ext*1000);r.lastExtension=ext;r.used.push(integer);r.coef=Number(r.coef||EXTENSION_COEF)/2;x.resolution=r}
function resolveItem(x){const offers=activeOffersFor(x.id).filter(o=>o.expires>Date.now()).sort((a,b)=>Number(b.max)-Number(a.max));if(!offers.length||(!x.resolution?.sellerInitiated && Number(x.currentOffer||0)<Number(x.price||0))){x.resolutionEndsAt=0;x.resolutionStartedAt=0;x.status='Open Market';x.cycleStartedAt=Date.now();x.injectedAt=Date.now();state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.status='expired');notify(`Cycle complete for ${x.fullName||x.name}; Price was not reached.`,'CYCLE',x.id);return}const top=offers[0],second=offers[1];const finalPrice=second?Math.min(Number(top.max),Math.max(Number(x.price||0),Number(second.max)+1)):Math.min(Number(top.max),Math.max(Number(x.currentOffer||0),Number(x.price||0)));x.sold=true;x.status='Sold';x.resolutionEndsAt=0;state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.status=o.id===top.id?'accepted':'unavailable');state.activity.unshift({text:`Sold ${x.fullName||x.name} for ${money(finalPrice)}.`,created:Date.now()});notify(`You won ${x.fullName||x.name} for ${money(finalPrice)}.`,'WON',x.id);save()}
function tick(){const now=Date.now();let changed=false;for(const x of items.filter(v=>!v.sold)){for(const o of state.offers.filter(v=>v.item===x.id&&v.status==='active')){if(o.expires<=now){o.status='expired';changed=true}}recalculateItem(x);if(isResolving(x)){extendResolution(x);if(resolutionEnd(x)<=now){resolveItem(x);changed=true}}else if(isExpiredCycle(x)){if(activeOffersFor(x.id).some(o=>Number(o.max)>=Number(x.price||0)))beginAutomaticResolution(x);else{state.offers.filter(o=>o.item===x.id&&o.status==='active').forEach(o=>o.status='expired');x.cycleStartedAt=now;x.injectedAt=now;x.currentOffer=0;changed=true}}}if(changed)save();render();}

function normalizeCard(c){const rd=c?.set?.releaseDate||'';const y=rd?parseInt(rd.slice(0,4),10):null;return {id:c?.id||'',name:c?.name||'',number:c?.number||'',setId:c?.set?.id||'',setName:c?.set?.name||'',releaseYear:Number.isFinite(y)?y:null,images:c?.images||{},variants:deriveVariants(c),raw:c}}
function deriveVariants(c){const p=c?.tcgplayer?.prices||{};const out=Object.keys(p);return out.length?[...new Set(out)]:['Standard']}
function luceneTerm(value){
  const clean=String(value||'').trim();
  if(!clean)return '';
  const escaped=clean.replace(/([\\:\"()])/g,'\\$1');
  return /\s/.test(clean)?`"${escaped}"`:escaped;
}
function apiQueryFor(field,q){
  const clean=String(q||'').trim();if(!clean)return '';
  const term=luceneTerm(clean);
  if(field==='pokemon')return `name:${term}`;
  if(field==='set')return `set.name:${term} OR set.id:${term}`;
  if(field==='card'){
    const m=clean.match(/^(.*?)\s*#\s*([A-Za-z0-9-]+)$/);
    if(m&&m[1].trim())return `name:${luceneTerm(m[1])} number:${luceneTerm(m[2])}`;
    return `name:${term} OR number:${term} OR id:${term}`;
  }
  return `${term} OR name:${term} OR set.name:${term} OR id:${term} OR number:${term}`;
}

function setConsignmentStatus(t,error=false){const e=document.getElementById('consignStatus');if(e){e.textContent=t;e.style.color=error?'var(--red)':'var(--muted)'}}
function updateConsignmentPreview(){const card=consignmentCache.results.find(x=>x.id===consignmentCache.card);const title=document.getElementById('consignTitle'),submit=document.getElementById('consignSubmit');if(!title||!submit)return;if(!card||!consignmentCache.variant){title.textContent=card?`${card.name} #${card.number} · Select a variant.`:'Select a card and variant.';submit.disabled=true;return}title.textContent=`${card.name} · ${card.setName} #${card.number} · ${consignmentCache.variant}`;submit.disabled=false}
function submitConsignment(){const card=consignmentCache.results.find(x=>x.id===consignmentCache.card);const price=Math.max(1,Number(document.getElementById('consignPrice')?.value||1));if(!card||!consignmentCache.variant)return toast('Select a valid card and variant first.');const now=Date.now(),year=card.releaseYear||'',item={id:'item-'+now+Math.random(),name:card.name,set:`${card.setName} #${card.number}`,fullName:`${card.name} · ${card.setName} #${card.number} · ${consignmentCache.variant}`,year,era:year>=2014?'Modern':year>=2003?'Mid Era':year>=1996?'Classic':'Unknown',category:'Pokemon',method:'rapidup-cycle',type:'RapidUp Cycle',price,currentOffer:0,status:'Open Market',sold:false,staged:true,injectedAt:now,cycleStartedAt:now,img:card.images?.large||card.images?.small||'',variant:consignmentCache.variant,grade:document.getElementById('consignCondition')?.value==='Graded'?'PSA 10':'Raw',lang:document.getElementById('consignLanguage')?.value||'English',presentation:'RapidUp Standard',internal:{condition:document.getElementById('consignCondition')?.value||'Raw',language:document.getElementById('consignLanguage')?.value||'English',presentation:'RapidUp Standard'},consignment:{cardId:card.id,setId:card.setId,setName:card.setName,cardNumber:card.number,cardName:card.name,releaseYear:card.releaseYear,variant:consignmentCache.variant}};items.push(item);save();state.modal=null;notify(`Your ${card.name} listing is live.`,'LISTING',item.id);activity(`Listed ${item.fullName} at ${money(price)}.`);render()}
function sellerDemoItems(){return [
{id:'demo-charizard',name:'Charizard ex',fullName:'Charizard ex · Obsidian Flames',price:120,currentOffer:104,status:'Active',pulse:'68% Fair Price',condition:'Near Mint',offers:3,listed:'2 days ago'},
{id:'demo-mewtwo',name:'Mewtwo GX',fullName:'Mewtwo GX · Shining Legends',price:85,currentOffer:0,status:'Active',pulse:'61% Fair Price',condition:'Lightly Played',offers:0,listed:'4 days ago'},
{id:'demo-jolteon',name:'Jolteon V',fullName:'Jolteon V · Evolving Skies',price:72,currentOffer:69,status:'Closing',pulse:'82% Fair Price',condition:'Near Mint',offers:4,listed:'6 days ago'},
{id:'demo-gardevoir',name:'Gardevoir',fullName:'Gardevoir · Secret Wonders',price:110,currentOffer:91,status:'Active',pulse:'90% Overpriced',condition:'Moderately Played',offers:2,listed:'1 day ago'},
{id:'demo-blastoise',name:'Blastoise',fullName:'Blastoise · Boundaries Crossed',price:64,currentOffer:64,status:'Closing',pulse:'74% Fair Price',condition:'Lightly Played',offers:5,listed:'7 days ago'}]}
function sellerPulseFor(x){const p=state.communityPulse?.[x.id];if(!p)return x.pulse||'No Pulse yet';const sentiment=p.sentiment||{};const entries=Object.entries(sentiment).sort((a,b)=>b[1]-a[1]);if(!entries.length)return 'No Pulse yet';const labels={underpriced:'Underpriced',fair:'Fair Price',overpriced:'Overpriced'};const total=Object.values(sentiment).reduce((a,b)=>a+b,0);return `${Math.round(entries[0][1]/Math.max(1,total)*100)}% ${labels[entries[0][0]]||entries[0][0]}`}
function sellerInventoryRows(){const real=items.filter(x=>!x.sold);return real.length?real:sellerDemoItems()}
function sellerItemRow(x){const resolving=x.status==='Closing'||isResolving(x),current=Number(x.currentOffer||0),image=x.img||'';return `<article class="seller-item" ${x.id.startsWith('demo-')?'':'onclick="openItem(\''+esc(x.id)+'\')"'} style="cursor:${x.id.startsWith('demo-')?'default':'pointer'}"><div class="seller-thumb">${image?`<img src="${esc(image)}" alt="${esc(x.fullName||x.name)}">`:'<span class="tiny muted">ITEM</span>'}</div><div class="seller-item-main"><div class="seller-item-name">${esc(x.fullName||x.name)}</div><div class="seller-item-meta"><span>Listed <b>${esc(x.listed||'Recently')}</b></span><span>Price <b>${money(x.price)}</b></span><span>Offer <b>${current?money(current):'No offer'}</b></span></div><div class="seller-item-pulse"><span class="pulse-dot"></span>Community Pulse: <b>${esc(sellerPulseFor(x))}</b>${x.condition?` · ${esc(x.condition)}`:''}</div></div><div class="seller-item-side"><div class="price">${money(x.price)}</div><div class="status"><span class="pill">${resolving?'Closing':esc(x.status||'Active')}</span></div></div></article>`}
function sellerSalesRows(){const sold=items.filter(x=>x.sold);if(sold.length)return sold.map(x=>({name:x.fullName||x.name||'Item',price:money(x.finalPrice||x.salePrice||x.currentOffer||x.price),date:x.soldAt?new Date(x.soldAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Completed',status:'Completed',net:money(x.finalPrice||x.salePrice||x.currentOffer||x.price)}));return [{name:'Jolteon V · Evolving Skies',price:'$72',date:'Sep 7, 2026',status:'Completed',net:'$72'},{name:'Mewtwo GX · Shining Legends',price:'$62',date:'Sep 5, 2026',status:'Completed',net:'$62'},{name:'Blastoise · Boundaries Crossed',price:'$48',date:'Sep 2, 2026',status:'Completed',net:'$48'},{name:'Alakazam V · Vivid Voltage',price:'$29',date:'Aug 29, 2026',status:'Completed',net:'$29'}]}
function sellerActivityRows(){return [{text:'Offer received on Charizard ex — $104.',time:'11:42 AM'},{text:'Resolution started for Jolteon V.',time:'10:18 AM'},{text:'Sale completed — Mewtwo GX for $62.',time:'Yesterday'},{text:'Community Pulse updated on Gardevoir.',time:'Yesterday'},{text:'Item listed — Blastoise.',time:'Sep 1'}]}
function sellerOverview(){const inv=sellerInventoryRows(),offers=inv.filter(x=>(x.status||'Active')==='Active'&&Number(x.currentOffer||0)>0),closing=inv.filter(x=>x.status==='Closing'||isResolving(x)),sales=sellerSalesRows();return `<main><div class="market-head"><div><div class="eyebrow">SELLER HUB</div><h1>Your Marketplace</h1><div class="tiny muted" style="margin-top:10px">Everything happening with your inventory, sales, and offers.</div></div><button class="primary" onclick="openModal('consign')">List an Item</button></div><nav class="seller-tabs" aria-label="Seller Hub sections"><a href="#seller-overview">Overview</a><a href="#seller-inventory">Inventory</a><a href="#seller-sales">Sales</a><a href="#seller-activity">Activity</a></nav>
<section id="seller-overview" class="seller-section"><div class="seller-section-title"><div><div class="eyebrow">OVERVIEW</div><h2>At a glance</h2></div></div><div class="seller-quadrant"><div class="seller-metric"><div class="label">Active Items</div><div class="value">${inv.length}</div></div><div class="seller-metric"><div class="label">Items Sold</div><div class="value">${sales.length}</div></div><div class="seller-metric"><div class="label">Gross Sales</div><div class="value">${money(sales.reduce((n,x)=>n+Number(x.price.replace('$','')),0))}</div></div><div class="seller-metric"><div class="label">Net</div><div class="value">$3.00</div></div></div><div class="seller-attention"><div class="seller-mini"><div class="seller-mini-head"><h3>Offers Received</h3><div class="seller-mini-count">${offers.length}</div></div><div class="seller-mini-list">${offers.slice(0,3).map(x=>`<div class="seller-mini-row"><span>${esc(x.name||x.fullName)}</span><b>${money(x.currentOffer)}</b></div>`).join('')||'<div class="tiny muted">No offers on active items.</div>'}</div></div><div class="seller-mini"><div class="seller-mini-head"><h3>Closing Soon</h3><div class="seller-mini-count">${closing.length}</div></div><div class="seller-mini-list">${closing.slice(0,3).map(x=>`<div class="seller-mini-row"><span>${esc(x.name||x.fullName)}</span><b>Resolving</b></div>`).join('')||'<div class="tiny muted">Nothing is closing.</div>'}</div></div></div></section>
<section id="seller-inventory" class="seller-section"><div class="seller-section-title"><div><div class="eyebrow">INVENTORY</div><h2>Your Items</h2></div><button class="seller-link" onclick="document.getElementById('seller-inventory-all').classList.toggle('open')">View All Inventory →</button></div><div class="seller-list">${inv.slice(0,4).map(sellerItemRow).join('')}</div><div id="seller-inventory-all" class="seller-all" style="margin-top:14px"><div class="seller-controls"><input id="sellerInventorySearch" class="input" placeholder="Search inventory…" oninput="filterSellerInventory()"><select id="sellerInventoryStatus" class="input" onchange="filterSellerInventory()"><option value="all">All Statuses</option><option value="active">Active</option><option value="closing">Closing</option><option value="sold">Sold</option></select><select id="sellerInventorySort" class="input" onchange="filterSellerInventory()"><option value="recent">Recently Listed</option><option value="offerHigh">Highest Offer</option><option value="priceHigh">Highest Listed Price</option><option value="priceLow">Lowest Listed Price</option></select></div><div class="seller-filterbar"><button class="active" type="button">Advanced Filters</button><button type="button">Has Offer</button><button type="button">No Offer</button><button type="button">Pulse</button></div><div id="sellerInventoryAllRows" class="seller-list">${inv.map(sellerItemRow).join('')}</div></div></section>
<section id="seller-sales" class="seller-section"><div class="seller-section-title"><div><div class="eyebrow">SALES</div><h2>Completed Transactions</h2></div></div><div class="seller-table"><div class="seller-table-row head"><div>Item</div><div>Sale Price</div><div>Date</div><div>Status</div><div>Net</div></div>${sales.map(x=>`<div class="seller-table-row"><div class="seller-sale-name">${esc(x.name)}</div><div>${x.price}</div><div>${x.date}</div><div>${x.status}</div><div><b>${x.net}</b></div></div>`).join('')}</div></section>
<section id="seller-activity" class="seller-section"><div class="seller-section-title"><div><div class="eyebrow">ACTIVITY</div><h2>Recent Activity</h2></div></div><div class="seller-activity">${sellerActivityRows().map(x=>`<div class="seller-event"><div class="seller-event-mark"></div><div class="seller-event-text">${esc(x.text)}</div><div class="seller-event-time">${esc(x.time)}</div></div>`).join('')}</div></section></main>`}
function filterSellerInventory(){const source=sellerInventoryRows(),q=(document.getElementById('sellerInventorySearch')?.value||'').toLowerCase().trim(),status=document.getElementById('sellerInventoryStatus')?.value||'all',sort=document.getElementById('sellerInventorySort')?.value||'recent';let rows=source.filter(x=>(!q||`${x.fullName||x.name}`.toLowerCase().includes(q))&&(status==='all'||String(x.status||'Active').toLowerCase()===status));if(sort==='offerHigh')rows.sort((a,b)=>Number(b.currentOffer||0)-Number(a.currentOffer||0));if(sort==='priceHigh')rows.sort((a,b)=>Number(b.price||0)-Number(a.price||0));if(sort==='priceLow')rows.sort((a,b)=>Number(a.price||0)-Number(b.price||0));const el=document.getElementById('sellerInventoryAllRows');if(el)el.innerHTML=rows.map(sellerItemRow).join('')||'<div class="seller-empty">No inventory matches these filters.</div>'}
function contactModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">RAPIDUP</div><h2>Contact Us</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>We’d love to hear from you.</b><br>Questions, feedback, or ideas for making collecting better? This is where we’ll make room for the community.</div><label style="display:block;margin-top:14px"><span class="eyebrow">Message</span><textarea id="contactMessage" class="input" rows="5" placeholder="Tell us what’s on your mind…"></textarea></label><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="closeModal();toast('Thanks for reaching out.')">Send Message</button></div></div>`}
function footer(){return `<footer class="footer"><div class="footer-rule"></div><div class="footer-inner"><div><div class="footer-brand">RapidUp</div><div class="footer-copy">Built for simplicity. Guided by integrity. RapidUp insists on creating an environment where transparency, agency, and community culminate in an increasingly refined, accelerated, and calibrated collector experience.</div><div class="footer-copy">© 2026 RapidUp. All rights reserved.</div></div><nav class="footer-links" aria-label="Footer"><button onclick="openModal('contact')">Contact Us</button><button onclick="toast('About RapidUp is coming soon.')">About</button><button onclick="toast('Terms are coming soon.')">Terms</button><button onclick="toast('Privacy policy is coming soon.')">Privacy</button></nav></div></footer>`}
function modal(){if(!state.modal)return '';const m=state.modal;if(m.type==='search')return overlay(searchModal());if(m.type==='concierge')return overlay(conciergeModal());if(m.type==='consign')return overlay(consignmentModal());if(m.type==='channel')return overlay(channelModal(m.data));if(m.type==='landingBrowse')return overlay(landingBrowseModal(m.data));if(m.type==='pulse')return overlay(pulseModal(m.data));if(m.type==='contact')return overlay(contactModal());if(m.type==='offer'){offerMode='actual';return overlay(offerModal(m.data))}return ''}
function overlay(body){return `<div class="modalOverlay" onclick="if(event.target===this)closeModal()">${body}</div>`}
function render(){let body=state.page==='item'?itemPage():state.page==='seller'?sellerOverview():market();document.getElementById('app').innerHTML=header()+body+footer()+modal()+(state.menu?menuDrawer():'')+(state.toast?`<div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:#111;color:#fff;padding:12px 16px;border-radius:14px;font-weight:800">${esc(state.toast)}</div>`:'');if(state.modal?.type==='search')setTimeout(renderSearchResults,0)}
window.addEventListener('click',e=>{if(!e.target.closest('.suggestions'))document.querySelectorAll('.suggestions-box').forEach(x=>x.hidden=true)});
setInterval(tick,1000);render();tick();
</script>
</body>
