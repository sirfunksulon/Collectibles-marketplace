<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CONTINUUM — Collectibles Marketplace Prototype</title>
<style>
:root{
  --bg:#f5f5f1;--surface:#fff;--ink:#111;--muted:#6e6e68;--line:#deded7;
  --accent:#151515;--gold:#d7a91e;--green:#18794e;--red:#b63b32;--blue:#315f9b;
  --shadow:0 16px 45px rgba(0,0,0,.09);--radius:22px;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit} button{cursor:pointer}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:40;background:rgba(245,245,241,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1240px;margin:auto;display:flex;align-items:center;gap:30px;padding:18px 22px}.brand{font-weight:900;letter-spacing:-.06em;font-size:25px;margin-right:auto}.brand small{display:block;font-size:9px;letter-spacing:.18em;color:var(--muted);margin-top:-2px}
.nav a{font-weight:800;text-decoration:none;color:var(--ink);padding:9px 5px}.nav a.active{border-bottom:3px solid var(--ink)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:13px;min-width:44px;height:44px;font-weight:900;position:relative}.badge{position:absolute;right:-5px;top:-7px;background:var(--ink);color:#fff;border-radius:999px;font-size:10px;padding:4px 7px}
main{max-width:1240px;margin:auto;padding:30px 22px 80px}.hero{padding:35px 0 28px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:900}.hero h1{font-size:clamp(42px,7vw,82px);line-height:.9;letter-spacing:-.065em;max-width:800px;margin:13px 0}.hero p{max-width:680px;color:#5e5e59;font-size:17px;line-height:1.55}.search{display:flex;gap:10px;margin:24px 0}.search input{flex:1;border:1px solid var(--line);border-radius:15px;padding:15px 16px;background:#fff;outline:none}.primary,.secondary,.danger{border:0;border-radius:14px;padding:13px 18px;font-weight:850}.primary{background:#111;color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#a72e28;color:#fff}
.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:30px 0 16px}.sectionhead h2{margin:0;font-size:28px;letter-spacing:-.04em}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:0 8px 25px rgba(0,0,0,.035)}.itemcard{overflow:hidden;padding:0}.itemimg{height:210px;background:linear-gradient(135deg,#ddd,#f7f7f3);display:flex;align-items:center;justify-content:center;overflow:hidden}.itemimg img{width:100%;height:100%;object-fit:cover}.itembody{padding:17px}.tag{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;color:#555;margin:3px 4px 3px 0}.itembody h3{margin:8px 0 3px;font-size:23px;letter-spacing:-.04em}.price{font-size:27px;font-weight:900;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tiny{font-size:12px}.pill{padding:6px 9px;border-radius:999px;background:#efefe9;font-size:11px;font-weight:850}.live{background:#ecefe8;color:#195c3f}.type{background:#ececf4}.filters{display:flex;flex-wrap:wrap;gap:8px}.filters select{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.channel{display:flex;flex-direction:column;gap:14px}.channel .itemimg{height:175px;border-radius:16px}.channel-actions{display:flex;gap:8px}.channel-actions button{flex:1}
.info{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:50%;font-weight:900}.queueItem{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.queueNum{font-weight:900;font-size:22px}.queueItem img{width:52px;height:68px;object-fit:cover;border-radius:8px}
.auctionWrap{max-width:900px;margin:auto}.auctionTop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.auctionTop h1{margin:0;font-size:clamp(32px,6vw,58px);letter-spacing:-.06em}.timer{font-variant-numeric:tabular-nums;font-size:48px;font-weight:950;letter-spacing:-.05em}.timer.elastic{color:#9b7010}.timer.sudden{color:#a72e28}.auctionImage{height:420px;border-radius:26px;overflow:hidden;background:#e9e9e3}.auctionImage img{width:100%;height:100%;object-fit:cover}.auctionMeta{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.bidBox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bidBox .card{padding:20px}.big{font-size:36px;font-weight:950;letter-spacing:-.05em}.bidInput{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;margin:8px 0}.activity{font-size:12px;color:var(--muted);min-height:18px}.privateGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap}.hubHead{display:flex;align-items:center;justify-content:space-between;gap:15px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#fff;border:1px solid var(--line);border-radius:17px}.stat strong{display:block;font-size:25px;margin-top:4px}.list{display:flex;flex-direction:column;gap:10px}.listrow{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.notification{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.notification.unread{font-weight:750}.dot{width:9px;height:9px;border-radius:50%;background:#b63b32;margin-top:6px;flex:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:22px;box-shadow:0 -20px 70px rgba(0,0,0,.25)}.modal.full{height:90vh}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalHead h2{margin:0;letter-spacing:-.04em}.close{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:50%;font-weight:900}.wave{border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0}.waveHead{display:flex;justify-content:space-between}.waveAmount{font-size:28px;font-weight:950}.notice{background:#f0f1ea;border-radius:14px;padding:12px;font-size:13px;line-height:1.45}
.empty{padding:35px;text-align:center;color:var(--muted)}.success{background:#e8f2eb;border:1px solid #c8ddcf;color:#1c6040;border-radius:14px;padding:12px}.warning{background:#f6eee1;border:1px solid #ead6b8;border-radius:14px;padding:12px}
@media(max-width:800px){.nav{gap:12px;padding:14px 15px}.nav a{font-size:13px}.brand{font-size:21px}.nav .desktop{display:none}main{padding:20px 15px 60px}.grid{grid-template-columns:1fr 1fr}.statgrid{grid-template-columns:1fr 1fr}.auctionImage{height:340px}.bidBox,.privateGrid{grid-template-columns:1fr}.hero{padding-top:20px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.itemimg{height:250px}.auctionImage{height:310px}.timer{font-size:36px}.auctionTop{align-items:flex-start}.search{flex-direction:column}.sectionhead{align-items:flex-start;flex-direction:column}.listrow{align-items:flex-start;flex-direction:column}.modal{max-height:94vh}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const IMG = {
  lugia:"https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?auto=format&fit=crop&w=900&q=80",
  cards:"https://images.unsplash.com/photo-1601645191163-3fc0d5d64e35?auto=format&fit=crop&w=900&q=80",
  vintage:"https://images.unsplash.com/photo-1599490659213-e2b9527bd087?auto=format&fit=crop&w=900&q=80"
};
const seedItems=[
 {id:"i1",name:"Lugia V",set:"Silver Tempest #186",type:"Buy Now",method:"buy",price:129,market:154,grade:"PSA 10",lang:"English",variant:"Alt Art",img:IMG.lugia},
 {id:"i2",name:"Umbreon VMAX",set:"Evolving Skies #215",type:"Auction",method:"auction",price:1,current:86,bids:12,channel:"Modern Chase",auctionType:"ELASTIC",seconds:17,market:240,grade:"PSA 10",lang:"English",variant:"Alt Art",img:IMG.cards},
 {id:"i3",name:"Gardevoir",set:"Secret Wonders #7",type:"Auction",method:"auction",price:1,current:42,bids:7,channel:"Vintage English",auctionType:"SUDDEN DEATH",seconds:94,market:80,grade:"Raw",lang:"English",variant:"Holo",img:IMG.vintage},
 {id:"i4",name:"Charizard ex",set:"Obsidian Flames #223",type:"Buy Now",method:"buy",price:129,market:145,grade:"PSA 10",lang:"English",variant:"SIR",img:IMG.cards},
 {id:"i5",name:"Mewtwo GX",set:"Shining Legends #39",type:"Auction",method:"auction",price:1,current:31,bids:5,channel:"Modern Chase",auctionType:"ELASTIC",seconds:61,market:95,grade:"Raw",lang:"English",variant:"Holo",img:IMG.lugia},
 {id:"i6",name:"Entei",set:"Secret Wonders #4",type:"Buy Now",method:"buy",price:179,market:210,grade:"Raw",lang:"English",variant:"Holo",img:IMG.vintage},
 {id:"i7",name:"Blastoise",set:"Boundaries Crossed #31",type:"Auction",method:"auction",price:1,current:24,bids:3,channel:"Vintage English",auctionType:"SUDDEN DEATH",seconds:138,market:64,grade:"Raw",lang:"English",variant:"Holo",img:IMG.cards},
 {id:"i8",name:"Reshiram & Charizard GX",set:"Sun & Moon Promo",type:"Buy Now",method:"buy",price:199,market:245,grade:"PSA 10",lang:"English",variant:"Promo",img:IMG.lugia}
];
const channels=[
 {id:"c1",name:"Modern Chase",category:"Modern Pokémon",auctionType:"ELASTIC",info:"Three-minute elastic auctions for high-demand modern chase cards. Bids in the final extension zone can re-up the timer using the inverse .2 coefficient with decay.",items:["i2","i5","i9"]},
 {id:"c2",name:"Vintage English",category:"Vintage Pokémon",auctionType:"SUDDEN DEATH",info:"Three-minute sudden-death auctions. The timer is independent of bidding; when it reaches zero, the auction ends.",items:["i3","i7","i10"]},
 {id:"c3",name:"Japanese & Regional",category:"Japanese / Regional",auctionType:"ELASTIC",info:"Perpetual three-minute elastic auctions focused on Japanese, regional and language-specific variants.",items:["i11","i12","i13"]},
 {id:"c4",name:"Graded Chase",category:"Graded Collectibles",auctionType:"SUDDEN DEATH",info:"Fast three-minute sudden-death auctions for graded cards and premium slabs.",items:["i14","i15","i16"]}
];
for(let n=9;n<=16;n++) seedItems.push({id:"i"+n,name:["Umbreon V","Rayquaza VMAX","Mew ex","Espeon VMAX","Pikachu VMAX","Tyranitar V","Magikarp Wailord GX","Mewtwo VSTAR"][n-9],set:"Perpetual Channel Item #"+n,type:"Auction",method:"auction",price:1,current:10+n,bids:n-5,channel:channels[(n-9)%4].name,auctionType:channels[(n-9)%4].auctionType,seconds:180-(n*5),market:60+n*12,grade:n%2?"Raw":"PSA 10",lang:n%3?"English":"Japanese",variant:n%2?"Holo":"Alt Art",img:[IMG.cards,IMG.vintage,IMG.lugia][n%3]});

let state={
 page:"explore", modal:null, activeItem:null, queueChannel:null, profileOpen:false,
 userMode:"buyer", unread:3, bidAmount:null,
 items:seedItems.map(x=>({...x})),
 offers:[
  {id:"o1",item:"i1",amount:112,status:"active",expires:Date.now()+22*3600000},
  {id:"o2",item:"i2",amount:95,status:"active",expires:Date.now()+9*3600000}
 ],
 notifications:[
  {id:"n1",text:"Umbreon VMAX is now live in Modern Chase.",target:"auction",item:"i2",read:false},
  {id:"n2",text:"A seller countered your offer on Lugia V.",target:"private",item:"i1",read:false},
  {id:"n3",text:"Your offer on Umbreon VMAX expires in 9 hours.",target:"buyer",read:false}
 ],
 won:[],
 interests:["Umbreon VMAX","Lugia V","Japanese","PSA 10"],
 private:{item:"i1",active:true,current:165,deadline:Date.now()+6*60000,wave:2,myOffer:150,participants:4,responses:[150,155,158,160]},
 activity:""
};

function money(n){return "$"+Math.round(n).toLocaleString()}
function item(id){return state.items.find(x=>x.id===id)}
function route(page){state.page=page;state.modal=null;state.profileOpen=false;render();scrollTo(0,0)}
function addActivity(t){state.activity=t;setTimeout(()=>{state.activity="";render()},2600)}
function openModal(type,data){state.modal={type,data};render()}
function closeModal(){state.modal=null;render()}
function img(x){return `<img src="${x.img}" alt="">`}
function tags(x){return `<span class="tag">${x.grade}</span><span class="tag">${x.lang}</span><span class="tag">${x.variant}</span>`}

function header(){
 return `<header class="topbar"><nav class="nav">
 <div class="brand">CONTINUUM<small>COLLECTIBLES MARKETPLACE</small></div>
 <a href="#" class="${state.page==='explore'?'active':''}" onclick="route('explore')">Explore</a>
 <a href="#" class="${state.page==='auctions'?'active':''}" onclick="route('auctions')">Auctions</a>
 <a href="#" class="${state.page==='buy'?'active':''}" onclick="route('buy')">Buy Now</a>
 <button class="iconbtn" onclick="openModal('notifications')">♢<span class="badge">${state.unread}</span></button>
 <button class="iconbtn" onclick="state.profileOpen=true;render()">S</button>
 </nav></header>`
}
function itemCard(x,compact=false){
 let action=x.method==='auction'?`<button class="primary" onclick="openAuction('${x.id}')">View auction</button>`:`<button class="primary" onclick="buyNow('${x.id}')">Buy Now</button>`;
 return `<article class="card itemcard">${!compact?`<div class="itemimg">${img(x)}</div>`:""}<div class="itembody">
 <div class="row"><span class="eyebrow">${x.channel||x.type}</span><span class="pill ${x.method==='auction'?'live':''}">${x.method==='auction'?x.auctionType:'BUY NOW'}</span></div>
 <h3>${x.name}</h3><div class="muted tiny">${x.set}</div><div>${tags(x)}</div>
 <div class="price">${x.method==='auction'?money(x.current):money(x.price)}</div>
 ${x.method==='auction'?`<div class="row tiny"><span>${x.bids} bids</span><span>${fmt(x.seconds)} remaining</span></div>`:`<div class="row tiny"><span>Market ${money(x.market)}</span><span>Immediate</span></div>`}
 <div style="margin-top:13px;display:flex;gap:8px">${action}<button class="secondary" onclick="makeOffer('${x.id}')">Make Offer</button></div>
 </div></article>`
}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

function explore(){
 let list=[...state.items].filter(x=>x.method==='auction'||x.method==='buy').sort((a,b)=>(b.bids||0)-(a.bids||0));
 return `<main><section class="hero"><div class="eyebrow">CONTINUOUS COLLECTIBLES MARKETPLACE</div><h1>Find what you want.<br>Put inventory where it moves.</h1><p>Search standardized inventory, follow specialized auction channels, buy immediately, or let the system-driven Concierge surface opportunities.</p>
 <div class="search"><input id="search" placeholder="Search card, set, variant, grade..." oninput="filterExplore(this.value)"><button class="primary" onclick="filterExplore(document.getElementById('search').value)">Search</button></div></section>
 <div class="sectionhead"><h2>Active discovery</h2><div class="filters"><select onchange="sortExplore(this.value)"><option value="activity">Popular activity</option><option value="bid">Highest bid</option><option value="ending">Ending soon</option><option value="new">Newest</option><option value="price">Price</option></select></div></div>
 <div id="exploreGrid" class="grid">${list.slice(0,6).map(itemCard).join("")}</div>
 <div class="sectionhead"><h2>Why CONTINUUM</h2></div><div class="grid">
 <div class="card"><div class="eyebrow">BUYER</div><h3>Intent becomes action.</h3><p class="muted">Declare what matters to you. The Concierge watches inventory, method changes and meaningful auction developments.</p></div>
 <div class="card"><div class="eyebrow">SELLER</div><h3>Inventory stays fluid.</h3><p class="muted">Move an item between Buy Now and auction as demonstrated demand changes. You control the selling path.</p></div>
 <div class="card"><div class="eyebrow">MARKETPLACE</div><h3>Demand informs liquidity.</h3><p class="muted">Committed offers create useful market intelligence without exposing competing buyer information.</p></div>
 </div></main>`
}
function filterExplore(q){q=q.toLowerCase();document.getElementById("exploreGrid").innerHTML=state.items.filter(x=>(x.name+" "+x.set+" "+x.grade+" "+x.lang+" "+x.variant).toLowerCase().includes(q)).slice(0,12).map(itemCard).join("")||`<div class="empty">No active discovery matches.</div>`}
function sortExplore(v){let list=[...state.items];if(v==='bid')list.sort((a,b)=>(b.current||b.price)-(a.current||a.price));if(v==='ending')list.sort((a,b)=>(a.seconds||999)-(b.seconds||999));if(v==='price')list.sort((a,b)=>(a.price||a.current)-(b.price||b.current));document.getElementById("exploreGrid").innerHTML=list.slice(0,9).map(itemCard).join("")}

function auctions(){
 return `<main><div class="hero"><div class="eyebrow">AUCTION DIRECTORY</div><h1>Choose a channel.<br>Join what is live.</h1><p>One active item per channel. The queue stays behind the channel so the directory remains focused on what is happening now.</p></div>
 <div class="grid">${channels.map(c=>{let x=state.items.find(i=>i.id===c.items[0])||state.items.find(i=>i.channel===c.name);return `<article class="card channel"><div class="row"><div><div class="eyebrow">${c.category}</div><h2 style="margin:5px 0">${c.name}</h2></div><button class="info" onclick="openModal('channelInfo',${JSON.stringify(c).replace(/"/g,'&quot;')})">i</button></div><div class="itemimg">${img(x)}</div><div class="row"><div><b>${x.name}</b><div class="tiny muted">${x.bids} bids · ${money(x.current)} current</div></div><div><span class="pill">${c.auctionType}</span></div></div><div class="row tiny"><span>LIVE · ${fmt(x.seconds)}</span><span>Queue: 50 items</span></div><div class="channel-actions"><button class="primary" onclick="openAuction('${x.id}')">Join auction</button><button class="secondary" onclick="openQueue('${c.id}')">Open queue</button></div></article>`}).join("")}</div></main>`
}
function openQueue(cid){state.queueChannel=cid;openModal('queue',cid)}
function queueModal(cid){
 let c=channels.find(x=>x.id===cid), active=state.items.find(i=>i.id===c.items[0])||state.items.find(i=>i.channel===c.name);
 let qs=Array.from({length:50},(_,k)=>state.items.find(i=>i.id===c.items[k%c.items.length])||({...active,id:"q"+k,name:k?`${active.name} — Queue ${k+1}`:active.name,seconds:180}));
 return `<div class="modal full"><div class="modalHead"><div><div class="eyebrow">${c.category}</div><h2>${c.name} · ${c.auctionType}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">Only the active item is bid-enabled. Queued items show the channel's $1 starting convention and become actionable when they enter the active slot.</div><div>${qs.map((x,k)=>`<div class="queueItem" onclick="${k===0?`closeModal();openAuction('${active.id}')`:''}"><div class="queueNum">${k+1}</div><img src="${x.img}"><div><b>${x.name}</b><div class="tiny muted">${x.set}</div><div>${tags(x)}</div></div><div>${k===0?`<span class="pill live">LIVE · ${fmt(active.seconds)}</span>`:`<span class="pill">$1 START</span>`}</div></div>`).join("")}</div></div>`
}

function buy(){
 let list=state.items.filter(x=>x.method==='buy');
 return `<main><div class="hero"><div class="eyebrow">BUY NOW</div><h1>Immediate means immediate.</h1><p>Buy Now remains executable at the listed price until the seller intentionally changes the selling state. Offers never reserve the item.</p></div><div class="grid">${list.map(itemCard).join("")}</div></main>`
}

function openAuction(id){state.activeItem=id;state.page='auction';state.modal=null;render();scrollTo(0,0)}
function auctionPage(){
 let x=item(state.activeItem);if(!x)return `<main><div class="empty">Auction not found.</div></main>`;
 return `<main><div class="auctionWrap"><div class="auctionTop"><div><div class="eyebrow">${x.channel} · ${x.auctionType}</div><h1>${x.name}</h1></div><div class="timer ${x.auctionType.toLowerCase()}" id="auctionTimer">${fmt(x.seconds)}</div></div>
 <div class="auctionImage">${img(x)}</div><div class="auctionMeta">${tags(x)}<span class="pill">${x.auctionType}</span><span class="pill">3:00 AUCTION</span></div>
 <div class="notice" style="margin-bottom:14px">${x.auctionType==='ELASTIC'?`ELASTIC · Extension zone active. The inverse .2 coefficient is applied to qualifying bids; coefficient decay halves after each re-up until the timer falls below the active threshold.`:`SUDDEN DEATH · Bids do not change the timer. At 0:00, the auction ends.`}</div>
 <div class="bidBox"><div class="card"><div class="eyebrow">CURRENT BID</div><div class="big">${money(x.current)}</div><div class="tiny muted">${x.bids} bids</div><input class="bidInput" id="bidInput" type="number" min="${x.current+1}" placeholder="${x.current+1}"><button class="primary" style="width:100%" onclick="placeBid('${x.id}')">Place bid</button></div>
 <div class="card"><div class="eyebrow">MAKE OFFER</div><p class="muted tiny">Committed offer. Expires after 24 hours. Does not reserve inventory.</p><input class="bidInput" id="offerInput" type="number" min="1" placeholder="Your offer"><button class="secondary" style="width:100%" onclick="makeOffer('${x.id}')">Make Offer</button></div></div>
 <div class="activity">${state.activity}</div><div class="sectionhead"><h2>Buyer view</h2><button class="info" onclick="openModal('auctionInfo','${x.id}')">i</button></div><div class="card"><div class="row"><span>Current bid</span><b>${money(x.current)}</b></div><div class="row"><span>Number of bids</span><b>${x.bids}</b></div><div class="row"><span>Auction type</span><b>${x.auctionType}</b></div></div></div></main>`
}

function makeOffer(id){
 let x=item(id), raw=prompt(`Enter your committed offer for ${x.name}. It expires in 24 hours and does not reserve the item:`);let amount=Number(raw);
 if(!amount||amount<=0)return;
 state.offers.push({id:"o"+Date.now(),item:id,amount,status:"active",expires:Date.now()+24*3600000});
 state.notifications.unshift({id:"n"+Date.now(),text:`Offer submitted on ${x.name}: ${money(amount)}.`,target:"buyer",item:id,read:false});state.unread++;addActivity(`Offer submitted: ${money(amount)} · expires in 24h`);render();
}
function placeBid(id){
 let x=item(id), amount=Number(document.getElementById("bidInput")?.value);
 if(!amount||amount<=x.current){addActivity(`Bid must exceed ${money(x.current)}.`);return}
 x.current=amount;x.bids++;addActivity(`Bid accepted at ${money(amount)}.`);
 if(x.auctionType==='ELASTIC'&&x.seconds<=30) elasticReup(x);
 render();
}
function elasticReup(x){
 // Inverse extension model: mirror the remaining integer across the 31-second boundary.
 // At 30s => 1*.2; at 23s => 8*.2. Re-ups are rounded only for display; timer state keeps decimals.
 let mirrored=Math.max(1,31-Math.floor(x.seconds));
 x._coef=x._coef||.2;x._lastReup=x._lastReup||0;
 let ext=mirrored*x._coef;
 x.seconds+=ext;x._lastReup=Math.floor(x.seconds);
 x._coef=Math.max(.00625,x._coef/2);
}
function buyNow(id){
 let x=item(id);if(x.method!=='buy')return;
 x.sold=true;state.won.push({item:id,price:x.price,source:"Buy Now"});state.notifications.unshift({id:"n"+Date.now(),text:`Purchase complete: ${x.name}.`,target:"won",item:id,read:false});state.unread++;addActivity(`Purchased ${x.name} for ${money(x.price)}.`);render();
}
function profile(){state.profileOpen=!state.profileOpen;render()}
function buyerHub(tab="overview"){
 let activeOffers=state.offers.filter(o=>o.status==='active');
 return `<main><div class="hubHead"><div><div class="eyebrow">BUYER HUB</div><h1 style="margin:5px 0;letter-spacing:-.06em">Your collecting desk.</h1></div><span class="pill">BUYER MODE</span></div>
 <div class="tabs" style="margin-top:20px"><button class="secondary" onclick="route('buyer')">Overview</button><button class="secondary" onclick="openModal('buyerOffers')">Offers (${activeOffers.length})</button><button class="secondary" onclick="openModal('won')">Won Items (${state.won.length})</button><button class="secondary" onclick="openModal('concierge')">Concierge</button></div>
 <div class="statgrid"><div class="stat">Active offers<strong>${activeOffers.length}</strong></div><div class="stat">Active bids<strong>${state.items.filter(x=>x.method==='auction').length}</strong></div><div class="stat">Won items<strong>${state.won.length}</strong></div><div class="stat">Concierge alerts<strong>${state.unread}</strong></div></div>
 <div class="sectionhead"><h2>Concierge</h2></div><div class="card">${state.notifications.slice(0,3).map(n=>notification(n)).join("")}</div>
 <div class="sectionhead"><h2>Saved interests</h2></div><div class="card">${state.interests.map(x=>`<span class="tag">${x}</span>`).join("")}<button class="secondary" style="margin-top:10px" onclick="openModal('interests')">Edit interests</button></div>
 </main>`
}
function sellerHub(){
 let offers=state.offers.filter(o=>o.status==='active'), x=item("i1");
 return `<main><div class="hubHead"><div><div class="eyebrow">SELLER HUB</div><h1 style="margin:5px 0;letter-spacing:-.06em">Control the selling path.</h1></div><span class="pill">SELLER MODE</span></div>
 <div class="tabs" style="margin-top:20px"><button class="secondary">Inventory</button><button class="secondary" onclick="openModal('sellerOffers')">Offers (${offers.length})</button><button class="secondary" onclick="openModal('sellerAnalytics')">Seller Analytics</button><button class="secondary" onclick="openModal('consign')">Consign</button></div>
 <div class="statgrid"><div class="stat">Active inventory<strong>${state.items.filter(x=>!x.sold).length}</strong></div><div class="stat">Active offers<strong>${offers.length}</strong></div><div class="stat">Auction items<strong>${state.items.filter(x=>x.method==='auction').length}</strong></div><div class="stat">Potential demand<strong>${money(160)}</strong></div></div>
 <div class="sectionhead"><h2>Inventory control</h2></div><div class="list">${state.items.slice(0,6).map(x=>`<div class="listrow"><div><b>${x.name}</b><div class="tiny muted">${x.set} · current method: ${x.method==='buy'?'BUY NOW':x.auctionType}</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="secondary" onclick="sellerFlip('${x.id}')">Change method</button>${x.id==='i1'?`<button class="primary" onclick="openModal('sellerOffers')">View demand</button>`:""}</div></div>`).join("")}</div></main>`
}
function sellerFlip(id){let x=item(id);if(x.method==='buy'){x.method='auction';x.type='Auction';x.current=x.price;x.bids=0;x.seconds=180;x.auctionType='ELASTIC';}else{x.method='buy';x.type='Buy Now';x.price=Math.max(x.current||1,1)}addActivity(`Selling method changed for ${x.name}.`);render()}
function notification(n){return `<div class="notification ${n.read?'':'unread'}"><span class="dot" style="${n.read?'visibility:hidden':''}"></span><div style="flex:1">${n.text}<div style="margin-top:7px"><button class="secondary tiny" onclick="notificationTarget('${n.id}')">Open</button></div></div></div>`}
function notificationTarget(id){let n=state.notifications.find(x=>x.id===id);if(!n)return;n.read=true;state.unread=Math.max(0,state.unread-1);if(n.target==='auction')openAuction(n.item);else if(n.target==='private')openModal('privateBuyer',n.item);else if(n.target==='won')openModal('won');else route('buyer')}

function privateBuyer(){
 let x=item(state.private.item);
 return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">DEMAND-BASED PRIVATE AUCTION</div><h2>${x.name}</h2></div><button class="close" onclick="closeModal()">×</button></div>
 <div class="notice">This private auction emerged from demonstrated committed demand. You see only your negotiation relationship with the seller.</div>
 <div class="wave"><div class="eyebrow">CURRENT SELLER COUNTER</div><div class="waveAmount">${money(state.private.current)}</div><div class="tiny muted">Response deadline · ${new Date(state.private.deadline).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div></div>
 <div class="card"><div class="eyebrow">YOUR CURRENT OFFER</div><div class="big">${money(state.private.myOffer)}</div><input id="privateInput" class="bidInput" type="number" placeholder="Counter amount"><div style="display:flex;gap:8px"><button class="primary" onclick="privateAccept()">Accept ${money(state.private.current)}</button><button class="secondary" onclick="privateCounter()">Counter</button><button class="secondary" onclick="privateExit()">Exit</button></div></div></div>`
}
function privateAccept(){state.won.push({item:state.private.item,price:state.private.current,source:"Private Auction"});state.private.active=false;addActivity("Private auction accepted. Transaction completed.");closeModal();render()}
function privateCounter(){let a=Number(document.getElementById("privateInput").value);if(!a)return;state.private.myOffer=a;state.private.current=Math.max(a,state.private.current-5);state.private.wave++;addActivity(`Counter submitted at ${money(a)}.`);render();openModal('privateBuyer',state.private.item)}
function privateExit(){state.private.active=false;closeModal();render()}

function sellerOffers(){
 let x=item("i1"), offers=state.offers.filter(o=>o.item==="i1"&&o.status==="active");
 return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLER HUB · OFFERS</div><h2>${x.name}</h2></div><button class="close" onclick="closeModal()">×</button></div>
 <div class="statgrid"><div class="stat">Active<strong>${offers.length}</strong></div><div class="stat">Lowest<strong>${money(Math.min(...offers.map(o=>o.amount),0))}</strong></div><div class="stat">Average<strong>${money(offers.reduce((a,o)=>a+o.amount,0)/(offers.length||1))}</strong></div><div class="stat">Highest<strong>${money(Math.max(...offers.map(o=>o.amount),0))}</strong></div></div>
 <div class="notice" style="margin:15px 0">Buyer identities and individual demand are shown only to the seller within the appropriate transaction context. Buyer-facing auction screens never expose this intelligence.</div>
 <div class="list">${offers.length?offers.map(o=>`<div class="listrow"><div><b>${money(o.amount)}</b><div class="tiny muted">Expires ${new Date(o.expires).toLocaleString()}</div></div><div><button class="primary" onclick="acceptOffer('${o.id}')">Accept</button></div></div>`).join(""):`<div class="empty">No active offers.</div>`}</div>
 <div style="display:flex;gap:8px;margin-top:15px"><button class="primary" onclick="counterAll()">Counter All</button><button class="secondary" onclick="sellerFlip('${x.id}');closeModal()">Change selling method</button></div></div>`
}
function acceptOffer(oid){let o=state.offers.find(x=>x.id===oid);if(!o)return;let x=item(o.item);o.status="accepted";x.sold=true;state.won.push({item:o.item,price:o.amount,source:"Offer"});state.notifications.unshift({id:"n"+Date.now(),text:`Your offer on ${x.name} was accepted at ${money(o.amount)}.`,target:"won",item:o.item,read:false});state.unread++;closeModal();addActivity(`Offer accepted at ${money(o.amount)}.`);render()}
function counterAll(){state.private.active=true;state.private.item="i1";state.private.current=Math.max(...state.offers.filter(o=>o.item==="i1"&&o.status==="active").map(o=>o.amount),160)+10;state.private.deadline=Date.now()+5*60000;state.private.wave++;closeModal();addActivity("Private Auction opened from active demand.");openModal('privateSeller')}
function privateSeller(){
 let r=state.private.responses;
 return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLER HUB · PRIVATE AUCTION</div><h2>${item(state.private.item).name}</h2></div><button class="close" onclick="closeModal()">×</button></div>
 <div class="wave"><div class="eyebrow">CURRENT PARTICIPATION PRICE</div><div class="waveAmount">${money(state.private.current)}</div><div class="tiny muted">${state.private.participants} active participants · Wave ${state.private.wave}</div></div>
 <div class="notice">This is demand-based only. The current seller counter sets the minimum participation price for the current wave. Buyers never see these competing responses.</div>
 <div class="sectionhead"><h2>Aggregate responses</h2></div><div class="list">${r.map(a=>`<div class="listrow"><span>Participant response</span><b>${money(a)}</b></div>`).join("")}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button class="primary" onclick="sellerAcceptHighest()">Accept highest</button><button class="secondary" onclick="sellerWave()">Counter all</button><button class="danger" onclick="state.private.active=false;closeModal()">End private auction</button></div></div>`
}
function sellerAcceptHighest(){let high=Math.max(...state.private.responses);state.won.push({item:state.private.item,price:high,source:"Private Auction"});state.private.active=false;closeModal();addActivity(`Private Auction transaction completed at ${money(high)}.`);render()}
function sellerWave(){state.private.current+=5;state.private.wave++;state.private.responses=state.private.responses.map(x=>Math.min(state.private.current,x+3));state.private.deadline=Date.now()+5*60000;addActivity(`Uniform counteroffer wave ${state.private.wave} issued at ${money(state.private.current)}.`);render();openModal('privateSeller')}

function modals(){
 if(state.profileOpen)return `<div class="overlay" onclick="if(event.target===this){state.profileOpen=false;render()}"><div class="modal" style="border-radius:26px"><div class="modalHead"><h2>Account</h2><button class="close" onclick="state.profileOpen=false;render()">×</button></div>
 <div class="card" style="margin-bottom:10px"><div class="eyebrow">CURRENT MODE</div><b>${state.userMode.toUpperCase()}</b></div>
 <div class="list"><button class="listrow" onclick="state.profileOpen=false;route('buyer')"><span>Buyer Hub</span><b>→</b></button><button class="listrow" onclick="state.profileOpen=false;route('seller')"><span>Seller Hub</span><b>→</b></button><button class="listrow" onclick="openModal('notifications')"><span>Notifications</span><b>${state.unread}</b></button><button class="listrow"><span>Account & Settings</span><b>→</b></button></div></div></div>`;
 if(!state.modal)return "";
 let t=state.modal.type;
 if(t==='queue')return `<div class="overlay" onclick="if(event.target===this)closeModal()">${queueModal(state.modal.data)}</div>`;
 let content="";
 if(t==='notifications')content=`<div class="modal"><div class="modalHead"><div><div class="eyebrow">SYSTEM NOTIFICATIONS</div><h2>Concierge & activity</h2></div><button class="close" onclick="closeModal()">×</button></div>${state.notifications.map(notification).join("")}</div>`;
 if(t==='channelInfo'){let c=state.modal.data;content=`<div class="modal"><div class="modalHead"><div><div class="eyebrow">${c.category}</div><h2>${c.name}</h2></div><button class="close" onclick="closeModal()">×</button></div><span class="pill">${c.auctionType}</span><p>${c.info}</p><div class="notice">All public auctions begin at 3:00. The queue is separate from the active channel surface and contains 50 seeded positions for prototype demonstration.</div></div>`}
 if(t==='auctionInfo'){let x=item(state.modal.data);content=`<div class="modal"><div class="modalHead"><h2>${x.auctionType} auction</h2><button class="close" onclick="closeModal()">×</button></div><p><b>Buyer-facing information is intentionally minimal.</b></p><p>You see the item, current bid, number of bids, live timer, auction type and your own actions. You do not see demand intelligence, competing offers or seller analytics.</p></div>`}
 if(t==='buyerOffers')content=`<div class="modal"><div class="modalHead"><h2>Your offers</h2><button class="close" onclick="closeModal()">×</button></div>${state.offers.map(o=>{let x=item(o.item);return `<div class="listrow"><div><b>${x.name}</b><div>${money(o.amount)} · ${o.status}</div><div class="tiny muted">Expires ${new Date(o.expires).toLocaleString()}</div></div><span class="pill">${o.status}</span></div>`}).join("")}</div>`;
 if(t==='won')content=`<div class="modal"><div class="modalHead"><h2>Won Items</h2><button class="close" onclick="closeModal()">×</button></div>${state.won.length?state.won.map(w=>{let x=item(w.item);return `<div class="listrow"><div><b>${x.name}</b><div>${money(w.price)} · ${w.source}</div></div><button class="primary">Proceed to order</button></div>`}).join(""):`<div class="empty">No won items yet. Place a bid or complete a purchase to populate this hub.</div>`}</div>`;
 if(t==='concierge')content=`<div class="modal"><div class="modalHead"><h2>Concierge</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">System-driven. The Concierge informs and connects; it never bids autonomously.</div><div class="sectionhead"><h2>Watching</h2></div>${state.interests.map(i=>`<span class="tag">${i}</span>`).join("")}<div class="sectionhead"><h2>Recent matches</h2></div>${state.notifications.slice(0,5).map(notification).join("")}</div>`;
 if(t==='interests')content=`<div class="modal"><div class="modalHead"><h2>Concierge interests</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Items, sets, languages, variants, grading companies, grade ranges, target prices and preferred selling methods.</p><input class="bidInput" placeholder="Add an interest"><button class="primary" onclick="let v=this.previousElementSibling.value;if(v){state.interests.push(v);closeModal();render()}">Add interest</button></div>`;
 if(t==='sellerOffers')content=sellerOffers().replace(/^<div class="modal">/,'<div class="modal">');
 if(t==='sellerAnalytics')content=`<div class="modal"><div class="modalHead"><h2>Seller Analytics</h2><button class="close" onclick="closeModal()">×</button></div><div class="statgrid"><div class="stat">Offer range<strong>$112–$150</strong></div><div class="stat">Method changes<strong>18</strong></div><div class="stat">Auction conversion<strong>31%</strong></div><div class="stat">Liquidity signal<strong>High</strong></div></div><div class="sectionhead"><h2>Demand over time</h2></div><div class="card"><p class="muted">Demonstrated offers, method performance and transaction outcomes accumulate into seller intelligence. Buyer identities are not exposed on buyer surfaces.</p><div style="height:120px;background:linear-gradient(180deg,#f1f1eb,#fff);border-radius:15px;display:flex;align-items:end;padding:12px;gap:7px">${[20,34,27,52,47,72,65,90,78,100].map(v=>`<div style="height:${v}%;background:#111;flex:1;border-radius:5px 5px 0 0"></div>`).join("")}</div></div></div>`;
 if(t==='consign')content=`<div class="modal"><div class="modalHead"><h2>Consign inventory</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">Sellers create the listing manifest proactively. CONTINUUM does not require an intake fee for this prototype flow.</div><div class="list"><div class="listrow"><span>1. Create manifest</span><b>Required</b></div><div class="listrow"><span>2. Choose presentation</span><b>Seller controlled</b></div><div class="listrow"><span>3. Choose initial method</span><b>Buy Now / Auction</b></div><div class="listrow"><span>4. Change method later</span><b>Always available</b></div></div><button class="primary" style="margin-top:15px" onclick="addActivity('Consignment intake started.');closeModal();render()">Start manifest</button></div>`;
 if(t==='privateBuyer')content=privateBuyer().replace(/^<div class="modal">/,'<div class="modal">');
 if(t==='privateSeller')content=privateSeller().replace(/^<div class="modal">/,'<div class="modal">');
 return `<div class="overlay" onclick="if(event.target===this)closeModal()">${content}</div>`
}

function render(){
 let body=state.page==='explore'?explore():state.page==='auctions'?auctions():state.page==='buy'?buy():state.page==='auction'?auctionPage():state.page==='buyer'?buyerHub():sellerHub();
 document.getElementById("app").innerHTML=header()+body+modals();
}
let timer=setInterval(()=>{
 state.items.filter(x=>x.method==='auction'&&!x.sold).forEach(x=>{
   if(x.seconds>0)x.seconds-=.1;
   if(x.seconds<=0){x.seconds=180;x.current=1;x.bids=0;x._coef=.2;x._lastReup=0;}
 });
 if(state.page==='auction'&&state.activeItem){
   let el=document.getElementById("auctionTimer"),x=item(state.activeItem);if(el)el.textContent=fmt(x.seconds);
 }
},100);
render();
</script>
</body>
</html>
