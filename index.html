function itemCard(x){
  if(!x||x.sold)return '';
  const auction=x.method==='auction';
  const title=fullItemTitle(x);
  const method=auction?'AUCTION':'BUY NOW';
  return `<article class="card itemcard clickable" onclick="openItem('${x.id}')"><div class="itemimg">${img(x)}</div><div class="itembody"><span class="ruSelling">${method}</span><div class="ruTitle">${esc(title)}</div><div class="ruPrice">${money(auction?x.current:x.price)}</div><div class="ruMeta">${fmt(secondsLeft(x))} remaining</div><div class="ruActions" onclick="event.stopPropagation()">${auction?`<button class="primary" onclick="openAuction('${x.id}')">View Auction</button>`:`<button class="primary" onclick="buyNow('${x.id}')">Buy Now</button><button class="secondary" onclick="makeOffer('${x.id}')">Offer</button>`}</div></div></article>`;
}
function fullItemTitle(x){return x.fullName||`${x.year||inferYear(x)} Pokemon ${x.set||''} ${x.variant||''} ${x.name||''}${isGraded(x)?` ${x.grader||graderFromGrade(x.grade)||''} ${x.grade||''}`:''}`.replace(/\s+/g,' ').trim();}
function inferYear(x){const m=String(x.name||'').match(/\b(19|20)\d{2}\b/);return m?m[0]:'2025';}
function isGraded(x){return /\b(PSA|CGC|BGS|SGC|TAG|GEM|NM|MT)\b/i.test(String(x.grade||''))||!!x.grader;}
function graderFromGrade(g){const m=String(g||'').match(/\b(PSA|CGC|BGS|SGC|TAG)\b/i);return m?m[1].toUpperCase():'';}
function exploreFilterModal(){const f=state.exploreFilters||{};const cats=[...new Set(items.map(x=>x.category||x.channel).filter(Boolean))];const langs=[...new Set(items.map(x=>x.lang).filter(Boolean))];const vars=[...new Set(items.map(x=>x.variant).filter(Boolean))];return `<div class="modal ruFilterModal"><div class="modalHead"><div><div class="eyebrow">SEARCH</div><h2>Find collectibles</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="ruFilterGrid"><div class="ruFilterField full"><label>Specific item</label><input id="rfText" class="input" value="${esc(f.text||'')}" placeholder="Item name, set, number..."></div><div class="ruFilterField"><label>Category</label><select id="rfCategory" class="input"><option value="">All categories</option>${cats.map(c=>`<option value="${esc(c)}" ${f.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="ruFilterField"><label>Year</label><input id="rfYear" class="input" type="number" value="${esc(f.year||'')}" placeholder="Any year"></div><div class="ruFilterField"><label>Condition</label><select id="rfCondition" class="input"><option value="">All</option><option value="raw" ${f.condition==='raw'?'selected':''}>Raw</option><option value="graded" ${f.condition==='graded'?'selected':''}>Graded</option></select></div><div class="ruFilterField"><label>Grading company</label><input id="rfGrader" class="input" value="${esc(f.grader||'')}" placeholder="PSA, CGC, BGS..."></div><div class="ruFilterField"><label>Grade range</label><div style="display:flex;gap:7px"><input id="rfMin" class="input" type="number" min="1" max="10" step="0.5" value="${esc(f.gradeMin??'')}" placeholder="Min"><input id="rfMax" class="input" type="number" min="1" max="10" step="0.5" value="${esc(f.gradeMax??'')}" placeholder="Max"></div></div><div class="ruFilterField"><label>Presentation</label><select id="rfPresentation" class="input"><option value="">All presentations</option><option value="standard" ${f.presentation==='standard'?'selected':''}>Standard</option><option value="premium" ${f.presentation==='premium'?'selected':''}>Premium</option></select></div><div class="ruFilterField"><label>Language</label><select id="rfLanguage" class="input"><option value="">All languages</option>${langs.map(v=>`<option value="${esc(v)}" ${f.language===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="ruFilterField"><label>Variant</label><select id="rfVariant" class="input"><option value="">All variants</option>${vars.map(v=>`<option value="${esc(v)}" ${f.variant===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="ruFilterField"><label>Selling method</label><select id="rfMethod" class="input"><option value="">All selling methods</option><option value="auction" ${f.method==='auction'?'selected':''}>Auction</option><option value="buy" ${f.method==='buy'?'selected':''}>Buy Now</option></select></div><div class="ruFilterField"><label>Auction type</label><select id="rfAuctionType" class="input"><option value="">All auction types</option><option value="ELASTIC" ${f.auctionType==='ELASTIC'?'selected':''}>Timer / Elastic</option><option value="SUDDEN DEATH" ${f.auctionType==='SUDDEN DEATH'?'selected':''}>Value Start / Sudden Death</option></select></div></div><div class="ruExploreBar" style="margin-top:16px"><span class="ruResultCount" id="ruFilterCount">${items.filter(x=>!x.sold).length} results</span><span class="tiny muted">Presentation defaults to all when unselected.</span></div><div class="actions"><button class="secondary" onclick="closeModal()">Close</button><button class="primary" onclick="applyExploreFilters()">Apply Filters</button></div></div>`}
function applyExploreFilters(){state.exploreFilters={text:document.getElementById('rfText')?.value.trim()||'',category:document.getElementById('rfCategory')?.value||'',year:document.getElementById('rfYear')?.value||'',condition:document.getElementById('rfCondition')?.value||'',grader:document.getElementById('rfGrader')?.value.trim()||'',gradeMin:document.getElementById('rfMin')?.value||'',gradeMax:document.getElementById('rfMax')?.value||'',presentation:document.getElementById('rfPresentation')?.value||'',language:document.getElementById('rfLanguage')?.value||'',variant:document.getElementById('rfVariant')?.value||'',method:document.getElementById('rfMethod')?.value||'',auctionType:document.getElementById('rfAuctionType')?.value||''};closeModal();}
function explore(){
  const f=state.exploreFilters||{};
  let list=items.filter(x=>!x.sold);
  if(f.text)list=list.filter(x=>fullItemTitle(x).toLowerCase().includes(f.text.toLowerCase()));
  if(f.category)list=list.filter(x=>x.category===f.category||x.channel===f.category||x.channelId===f.category);
  if(f.year)list=list.filter(x=>String(x.year||inferYear(x))===String(f.year));
  if(f.condition==='raw')list=list.filter(x=>!isGraded(x));
  if(f.condition==='graded')list=list.filter(x=>isGraded(x));
  if(f.grader)list=list.filter(x=>String(x.grader||graderFromGrade(x.grade)).toLowerCase()===String(f.grader).toLowerCase());
  if(f.gradeMin!==''&&f.gradeMin!=null)list=list.filter(x=>isNaN(Number(x.gradeValue))||Number(x.gradeValue)>=Number(f.gradeMin));
  if(f.gradeMax!==''&&f.gradeMax!=null)list=list.filter(x=>isNaN(Number(x.gradeValue))||Number(x.gradeValue)<=Number(f.gradeMax));
  if(f.presentation)list=list.filter(x=>(x.presentation||'standard').toLowerCase()===f.presentation);
  if(f.language)list=list.filter(x=>x.lang===f.language);
  if(f.variant)list=list.filter(x=>x.variant===f.variant);
  if(f.method)list=list.filter(x=>x.method===f.method);
  if(f.auctionType)list=list.filter(x=>x.method==='auction'&&x.auctionType===f.auctionType);
  if(f.sort==='price')list.sort((a,b)=>(a.method==='auction'?a.current:a.price)-(b.method==='auction'?b.current:b.price));
  else if(f.sort==='ending')list.sort((a,b)=>secondsLeft(a)-secondsLeft(b));
  else list.sort((a,b)=>(b.bidCount||0)-(a.bidCount||0));
  const cats=[...new Set(items.map(x=>x.category||x.channel).filter(Boolean))];
  const methods=[['','All selling methods'],['auction','Auction'],['buy','Buy Now']];
  return `<main><div class="ruExploreTop"><h1>Explore</h1><button class="icon ruSearchIcon" aria-label="Search and filters" onclick="openModal('exploreFilters')">⌕</button></div><div class="ruExploreBar"><div class="ruFilterSelect"><select onchange="state.exploreFilters=state.exploreFilters||{};state.exploreFilters.category=this.value;render()"><option value="">All categories</option>${cats.map(c=>`<option value="${esc(c)}" ${f.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select onchange="state.exploreFilters=state.exploreFilters||{};state.exploreFilters.method=this.value;render()">${methods.map(([v,l])=>`<option value="${v}" ${f.method===v?'selected':''}>${l}</option>`).join('')}</select></div><span class="tiny muted">${list.length} results</span></div><div class="grid">${list.slice(0,24).map(itemCard).join('')}</div></main>`;
}
function auctions(){return `<main><section class="hero"><div class="eyebrow">AUCTION DIRECTORY</div><h1>Choose a channel.</h1></section><div class="ruChannelGrid">${channels.map(c=>{const x=activeForChannel(c.id);return `<article class="card ruChannel"><div class="itemimg">${img(x)}</div><div><div class="eyebrow">${esc(c.auctionType)}</div><h2>${esc(c.name)}</h2><div class="ruChannelName">${esc(fullItemTitle(x))}</div><div class="tiny muted"><span data-channel-timer="${c.id}">${fmt(secondsLeft(x))}</span> · ${money(x.current)} current</div><div class="ruQueueCriteria">${esc(criteriaText(c))}</div></div><div style="display:flex;flex-direction:column;gap:7px"><button class="primary" onclick="openAuction('${x.id}')">Join</button><button class="secondary" onclick="openQueue('${c.id}')">Queue</button></div></article>`}).join('')}</div></main>`}
function openAuction(id){const x=item(id);if(!x||x.sold)return setToast('That auction is no longer available.');if(x.status!=='Live')return openQueue(x.channelId);state.activeItem=id;state.page='auction';state.modal=null;render();window.scrollTo(0,0)}
function openItem(id){const x=item(id);if(!x)return;state.activeItem=id;state.page=x.method==='auction'?'auction':'item';render();window.scrollTo(0,0)}
function openQueue(cid){openModal('queue',cid)}
function queueModal(cid){const c=channel(cid),pool=queuePool(cid),pos=state.channelPos[cid]||0;return `<div class="modal full queueShell"><div class="modalHead"><div><div class="eyebrow">QUEUE CRITERIA</div><h2>${esc(c.name)}</h2><div class="ruQueueCriteria">${esc(criteriaText(c))}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="queueScroll">${pool.map((x,i)=>`<div class="queueItem ${i===pos?'activeRow':''}" onclick="queueSelect('${cid}',${i})"><div class="queueNum">${i+1}</div>${img(x).replace('<img ','<img class="queueImg" ')}<div><b>${esc(fullItemTitle(x))}</b><div class="tiny muted">${i===pos?'LIVE':'QUEUED'} · ${i===pos?fmt(secondsLeft(x)):'Upcoming'}</div></div><div style="text-align:right">${i===pos?`<span class="queueStatus live">LIVE</span><div class="tiny muted">${money(x.current)}</div>`:`<span class="queueStatus queued">QUEUED</span><button class="secondary ruQueueOffer" onclick="event.stopPropagation();makeOffer('${x.id}')">Offer</button>`}</div></div>`).join('')}</div></div>`}
function queueSelect(cid,i){const pool=queuePool(cid),x=pool[i],pos=state.channelPos[cid];if(i===pos){closeModal();openAuction(x.id);return}openModal('queueItem',{cid,i,id:x.id})}
function queueItemModal(d){const x=item(d.id),c=channel(d.cid);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">QUEUE POSITION ${d.i+1}</div><h2>${esc(fullItemTitle(x))}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="detail"><div class="visual">${img(x)}</div><div class="panel"><div class="price">${money(x.current||x.price||1)}</div><p class="muted">Queued in ${esc(c.name)}. This item cannot receive a public bid until it reaches the active slot.</p><div class="actions"><button class="primary" onclick="makeOffer('${x.id}')">Make Offer</button><button class="secondary" onclick="closeModal();openQueue('${d.cid}')">Back to Queue</button></div></div></div></div>`}
function elasticPreview(x){
  if(!x||x.auctionType!=='ELASTIC')return {active:false};
  const remaining=secondsLeft(x);
  const whole=Math.floor(remaining);
  const a=x.auction||{};
  const coef=Number(a.coef??.2);
  const usedIntegers=Array.isArray(a.usedIntegers)?a.usedIntegers:[];
  const cycleStart=Number.isFinite(Number(a.cycleStartInteger))?Number(a.cycleStartInteger):null;
  // Each decay cycle is local to the lower integer at which it began.
  // When the countdown passes below that starting integer, the next integer
  // begins a fresh cycle with a fresh coefficient and fresh consumed set.
  if(whole<0||whole>30)return {active:false,remaining,whole,subsequent:Math.max(0,whole-1),mirrored:whole>=0?30-whole:0,coef,nextCoef:coef,extension:0,used:usedIntegers.includes(whole),cycleStart};
  const startsNewCycle=cycleStart==null||whole<cycleStart;
  const effectiveCoef=startsNewCycle?.2:coef;
  const effectiveUsed=startsNewCycle?false:usedIntegers.includes(whole);
  const mirrored=30-whole;

}

function submitBid(id,amount,opts={}){
  const x=item(id);
  if(!x||x.sold||x.status!=='Live')return false;
  const minimum=minBid(x);
  if(!Number.isFinite(amount)||amount<minimum)return setToast(`Minimum bid is ${money(minimum)}.`),false;
  const before=secondsLeft(x);
  if(before<=0){tick();return setToast('This auction has ended.'),false;}
  const buyer=opts.buyer||'You';
  const bid={id:'bid'+Date.now()+Math.random(),item:id,amount,created:Date.now(),buyer};
  x.current=amount;
  x.bidCount=(Number(x.bidCount)||0)+1;
  state.bids.push(bid);
  if(x.auctionType==='ELASTIC'&&before>0&&before<=30)applyElasticReup(x,before);
  if(buyer!=='You')resolveProxyForIncomingBid(x);
  save();
  render();

}

function resolveProxyForIncomingBid(x){
  const p=(state.proxyBids||{})[x.id];
  if(!p||!p.active||p.buyer!=='You')return;
  if(x.current>=p.max){p.active=false;return;}
  const response=Math.min(p.max,x.current+p.increment);
  if(response<=x.current){p.active=false;return;}
  // Record the proxy response without recursively invoking proxy resolution.
  const before=secondsLeft(x);
  x.current=response;x.bidCount=(Number(x.bidCount)||0)+1;
  state.bids.push({id:'proxy'+Date.now()+Math.random(),item:x.id,amount:response,created:Date.now(),buyer:'You',proxy:true});
  if(x.auctionType==='ELASTIC'&&before>0&&before<=30)applyElasticReup(x,before);
  if(response>=p.max)p.active=false;
}

function applyElasticReup(x,before){
  const a=x.auction||{coef:.2,cycleFloor:5,lastReupAt:null,lastTrigger:null,reups:0,decayActive:false,lastInteger:null,cycleStartInteger:null,usedIntegers:[],lastExtension:null,lastExtensionAt:null,lastMirrored:null,lastAppliedCoefficient:null,nextCoefficient:.2};
  a.usedIntegers=Array.isArray(a.usedIntegers)?a.usedIntegers:[];

  const whole=Math.max(0,Math.min(30,Math.floor(before)));

  // A decay cycle belongs to the lower integer at which it was started.
  // The cycle's consumed-integer set is local: a later cycle does not inherit
  // integers consumed by an earlier cycle. When the countdown passes below
  // the prior cycle's starting integer, that subsequent integer starts fresh
  // at the base coefficient.
  const cycleStart=Number.isFinite(Number(a.cycleStartInteger))?Number(a.cycleStartInteger):null;
  if(cycleStart==null||whole<cycleStart){
    a.cycleStartInteger=whole;
    a.usedIntegers=[];
    a.coef=.2;
    a.nextCoefficient=.2;
    a.decayActive=false;
  }

  const coef=Number(a.coef??.2);

  // Only one bid at each integer qualifies within the active decay cycle.
  // Re-visiting a consumed integer has no extension and does not cause another
  // coefficient decay.
  if(a.usedIntegers.includes(whole)){
    a.lastTrigger=before;
    a.lastInteger=whole;
    a.reups=(a.reups||0)+1;
    a.decayActive=true;
    a.lastExtension=0;
    a.lastExtensionAt=Date.now();
    a.lastMirrored=30-whole;
    a.lastAppliedCoefficient=coef;
    a.nextCoefficient=coef;
    x.auction=a;
    state.activity=`Elastic re-up at ${whole}s: integer already consumed in this decay cycle · +0.00s · coefficient remains ${coef.toFixed(4)}`;
    return 0;
  }

  const mirrored=30-whole;
  const extension=mirrored*coef;
  x.endsAt+=extension*1000;
  a.lastReupAt=Date.now();
  a.lastTrigger=before;
  a.lastInteger=whole;
  a.reups=(a.reups||0)+1;
  a.decayActive=true;
  a.usedIntegers.push(whole);
  a.lastExtension=extension;
  a.lastExtensionAt=Date.now();
  a.lastMirrored=mirrored;
  a.lastAppliedCoefficient=coef;
  a.coef=coef/2;
  a.nextCoefficient=a.coef;
  x.auction=a;
  state.activity=`Elastic re-up at ${whole}s: +${extension.toFixed(2)}s · mirrored ${mirrored} × ${coef.toFixed(4)} · next coefficient ${a.coef.toFixed(4)} · cycle starts at ${a.cycleStartInteger}s`;
  return extension;
}

function maxOffer(){return Math.max(0,...state.offers.filter(o=>o.status==='active').map(o=>o.amount))} function avgOffers(){const os=state.offers.filter(o=>o.status==='active');return os.length?os.reduce((a,o)=>a+o.amount,0)/os.length:0}
function sellerOffers(){const ids=[...new Set(state.offers.filter(o=>o.status==='active').map(o=>o.item))];return `<div class="sectionhead"><div><h2>Offer management</h2><div class="tiny muted">Aggregate demand is visible here; buyer identities remain abstract.</div></div></div>${ids.length?ids.map(sellerOfferGroup).join(''):'<div class="empty">No active committed offers.</div>'}`}
function sellerOfferGroup(id){const x=item(id),os=activeOffers(id);if(!x||!os.length)return '';const hi=Math.max(...os.map(o=>o.amount)),lo=Math.min(...os.map(o=>o.amount));return `<div class="offerCard" style="margin-bottom:13px"><div class="row"><div><div class="eyebrow">${x.method==='buy'?'BUY NOW':'AUCTION'}</div><h3 style="margin:5px 0">${esc(x.name)}</h3></div><span class="pill">${os.length} active offers</span></div><div class="offerGrid"><div class="offerStat"><span class="tiny muted">Highest</span><b>${money(hi)}</b></div><div class="offerStat"><span class="tiny muted">Average</span><b>${money(os.reduce((a,o)=>a+o.amount,0)/os.length)}</b></div><div class="offerStat"><span class="tiny muted">Range</span><b>${money(lo)}–${money(hi)}</b></div><div class="offerStat"><span class="tiny muted">Expires</span><b>${Math.max(0,Math.ceil((Math.min(...os.map(o=>o.expires))-Date.now())/3600000))}h</b></div></div><div class="offerList">${os.map((o,i)=>`<div class="offerRow"><div><b>${money(o.amount)}</b><div class="tiny muted">Offer ${i+1} · age ${Math.max(0,Math.floor((Date.now()-o.created)/3600000))}h · expires ${new Date(o.expires).toLocaleString()}</div></div><div class="actions"><button class="primary" onclick="acceptOffer('${o.id}')">Accept</button><button class="secondary" onclick="ignoreOffer('${o.id}')">Ignore</button></div></div>`).join('')}</div><div class="actions" style="margin-top:13px"><button class="primary" onclick="counterAll('${x.id}')">Counter All</button><button class="secondary" onclick="openModal('method','${x.id}')">Change selling method</button></div></div>`}
function acceptOffer(oid){const o=state.offers.find(x=>x.id===oid);if(!o||o.status!=='active')return setToast('Offer is no longer active.');const x=item(o.item);if(!x||x.sold)return setToast('Inventory has already transacted.');o.status='accepted';x.sold=true;x.status='Sold';state.offers.filter(a=>a.item===x.id&&a.status==='active').forEach(a=>a.status='unavailable');state.won.push({item:x.id,price:o.amount,source:'Seller accepted offer',date:Date.now()});notify(`Your offer on ${x.name} was accepted at ${money(o.amount)}.`,'won',x.id,'OFFER ACCEPTED');save();activity(`Offer accepted at ${money(o.amount)}.`)}
function ignoreOffer(oid){const o=state.offers.find(x=>x.id===oid);if(!o||o.status!=='active')return;o.status='ignored';save();activity('Offer ignored; inventory remains available.');}
function changeMethod(id){openModal('method',id)}
function methodModal(id){const x=item(id);if(!x)return '';const current=x.method==='buy'?'BUY NOW':(x.privateAuction?.active?'PRIVATE AUCTION':'PUBLIC AUCTION');return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLING METHOD</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="methodBox current"><div class="eyebrow">CURRENT METHOD</div><b>${current}</b><p class="tiny muted">Choose a new selling state explicitly. RapidUp will update the inventory object rather than merely showing a suggestion.</p></div><div class="sectionhead"><h3>Available methods</h3></div><div class="methodGrid"><button class="methodOption ${x.method==='buy'?'current':''}" onclick="convertMethod('${id}','buy')"><b>BUY NOW</b><span class="tiny muted">Immediate execution at a listed price.</span></button><button class="methodOption ${x.method==='auction'&&!x.privateAuction?.active?'current':''}" onclick="convertMethod('${id}','auction')"><b>PUBLIC AUCTION</b><span class="tiny muted">Move into a specialized public channel.</span></button><button class="methodOption ${x.privateAuction?.active?'current':''}" onclick="startPrivateFromMethod('${id}')"><b>PRIVATE AUCTION</b><span class="tiny muted">Demand-based response to active committed offers.</span></button></div><div class="notice" style="margin-top:13px"><b>What will happen?</b><br>${x.method==='buy'?'Changing away from Buy Now removes immediate purchase availability until you return it.':'Changing to Buy Now makes the listed price immediately executable.'} Public auction uses the selected channel's 3:00 lifecycle. Private Auction requires active demonstrated demand.</div></div>`}
function convertMethod(id,method){const x=item(id);if(!x||x.sold)return;if(method==='buy'){x.method='buy';x.type='Buy Now';x.privateAuction=null;x.price=Math.max(1,Number(x.price||x.current||x.market||1));x.endsAt=0;x.status='Available now';}else if(method==='auction'){x.method='auction';x.type='Auction';x.privateAuction=null;const c=channels.find(c=>c.id===x.channelId)||channels[0];x.channelId=c.id;x.channel=c.name;x.auctionType=c.auctionType;x.internal={...(x.internal||{}),auctionType:c.auctionType,startingPrice:Number(x.startingPrice||x.current||1)};x.current=Math.max(1,Number(x.current||1));x.bidCount=0;const pool=queuePool(c.id).concat(x).filter((v,i,a)=>a.findIndex(z=>z.id===v.id)===i);const idx=pool.findIndex(i=>i.id===x.id);if(idx<0){x.endsAt=Date.now()+180000;x.status='Live'}else{state.channelPos[c.id]=idx;x.endsAt=Date.now()+180000;x.status='Live'}}save();closeModal();activity(`${x.name} moved to ${method==='buy'?'BUY NOW':'PUBLIC AUCTION'}.`)}
function startPrivateFromMethod(id){const os=activeOffers(id);if(!os.length)return setToast('Private Auction requires active committed demand.');counterAll(id)}
function counterAll(id){const os=activeOffers(id);if(!os.length)return setToast('No active committed demand to counter.');const high=Math.max(...os.map(o=>o.amount));const current=Math.max(high+25,Math.ceil(high*1.12));state.privateAuctions[id]={active:true,item:id,current,previousSellerCounter:null,deadline:Date.now()+120000,wave:1,participants:os.length,responses:os.map(o=>({offerId:o.id,amount:o.amount,engaged:true,buyer:o.buyer})),history:[{wave:1,seller:current,responses:os.map(o=>o.amount)}]};const x=item(id);x.privateAuction={active:true};notify(`Seller opened a demand-based private auction on ${x.name}.`,'private',id,'PRIVATE AUCTION');save();openModal('privateSeller',id)}
function privateBuyer(id){let p=state.privateAuctions[id],x=item(id);if(!p||!p.active)return `<div class="modal"><div class="modalHead"><h2>Private auction closed</h2><button class="close" onclick="closeModal()">×</button></div><div class="empty">This negotiation is no longer active.</div></div>`;const mine=p.responses.find(r=>r.buyer==='You');const myAmount=mine?.amount||myOffer(id)?.amount||0;return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">DEMAND-BASED PRIVATE AUCTION</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">This private auction exists because committed demand already existed and the seller chose to respond. You see only your relationship with the seller.</div><div class="privateStage"><div class="eyebrow">CURRENT SELLER COUNTER</div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">Wave ${p.wave} · respond by ${new Date(p.deadline).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}</div><div class="bar" style="margin-top:12px"><span id="privateBuyerBar" style="width:100%"></span></div></div><div class="card" style="margin-top:12px"><div class="eyebrow">YOUR CURRENT OFFER</div><div class="big">${money(myAmount)}</div><input id="privateInput" class="input" type="number" min="1" placeholder="Your counter" style="margin:10px 0"><div class="actions"><button class="primary" onclick="privateAccept('${id}')">Accept ${money(p.current)}</button><button class="secondary" onclick="privateCounter('${id}')">Counter</button><button class="secondary" onclick="privateExit('${id}')">Exit</button></div></div><div class="privacyNote" style="margin-top:12px">Other participants may exist, but their prices, identities and aggregate responses are intentionally invisible to you.</div></div>`}
function privateAccept(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active||x?.sold)return setToast('This private auction is closed.');p.active=false;x.sold=true;x.status='Sold';x.privateAuction={active:false};state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');state.won.push({item:id,price:p.current,source:'Private Auction',date:Date.now()});notify(`You accepted the seller counter on ${x.name} at ${money(p.current)}.`,'won',id,'PRIVATE AUCTION WON');save();closeModal();activity(`Private auction accepted at ${money(p.current)}.`)}
function privateCounter(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active)return;const amount=Number(document.getElementById('privateInput')?.value);if(!amount||amount<=0)return setToast('Enter a valid counter amount.');let mine=p.responses.find(r=>r.buyer==='You');if(!mine){mine={buyer:'You',amount,engaged:true,offerId:null};p.responses.push(mine);p.participants=(p.participants||0)+1}else{mine.amount=amount;mine.engaged=true}state.offers.push({id:'o'+Date.now(),item:id,buyer:'You',amount,status:'active',created:Date.now(),expires:Date.now()+86400000,wave:p.wave});p.deadline=Date.now()+120000;p.history.push({wave:p.wave,buyer:amount});save();openModal('privateBuyer',id)}
function privateExit(id){const p=state.privateAuctions[id];if(p){const mine=p.responses.find(r=>r.buyer==='You');if(mine)mine.engaged=false;save()}closeModal();activity('You exited this private auction wave.');}
function privateSeller(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active)return `<div class="modal"><div class="modalHead"><h2>Private auction closed</h2><button class="close" onclick="closeModal()">×</button></div></div>`;const responses=p.responses.filter(r=>r.engaged);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLER HUB · PRIVATE AUCTION</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>Demand-based only.</b> This market exists because active committed offers were already present. Buyers never see this aggregate seller surface.</div><div class="privateStage"><div class="eyebrow">CURRENT PARTICIPATION PRICE</div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">${responses.length} active participants · Wave ${p.wave} · response deadline ${new Date(p.deadline).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}</div></div><div class="sectionhead"><h2>Aggregate responses</h2><span class="muted">Seller only</span></div><div class="responseGrid">${responses.map((r,i)=>`<div class="response"><div class="tiny muted">Participant ${i+1}</div><b>${money(r.amount)}</b><div class="tiny muted">${r.engaged?'engaged':'inactive'}</div></div>`).join('')||'<div class="empty">No active responses.</div>'}</div><div class="actions" style="margin-top:16px"><button class="primary" onclick="sellerAcceptHighest('${id}')">Accept highest</button><button class="secondary" onclick="sellerWave('${id}')">Counter all</button><button class="danger" onclick="endPrivate('${id}')">End private auction</button><button class="secondary" onclick="openModal('method','${id}')">Change selling method</button></div><div class="tiny muted" style="margin-top:13px">Every wave has a finite response period. Buyers who do not engage cease participating in that wave. There is no fixed maximum number of waves.</div></div>`}
function sellerAcceptHighest(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active||!p.responses.length)return;const eligible=p.responses.filter(r=>r.engaged);if(!eligible.length)return setToast('No participating responses to accept.');const high=Math.max(...eligible.map(r=>r.amount));p.active=false;x.sold=true;x.status='Sold';x.privateAuction={active:false};state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');state.won.push({item:id,price:high,source:'Private Auction',date:Date.now()});notify(`Private auction completed on ${x.name}.`,'won',id,'PRIVATE AUCTION COMPLETE');save();closeModal();activity(`Private auction completed at ${money(high)}.`)}
function sellerWave(id){const p=state.privateAuctions[id];if(!p?.active)return;const eligible=p.responses.filter(r=>r.engaged);if(!eligible.length)return setToast('No active participants remain.');const next=Math.max(p.current-5,Math.ceil(p.current*.96));p.previousSellerCounter=p.current;p.current=next;p.wave++;p.deadline=Date.now()+120000;p.responses=p.responses.map(r=>({...r,engaged:r.engaged}));p.history.push({wave:p.wave,seller:next,responses:p.responses.filter(r=>r.engaged).map(r=>r.amount)});save();openModal('privateSeller',id)}
function endPrivate(id){const p=state.privateAuctions[id],x=item(id);if(p)p.active=false;if(x)x.privateAuction={active:false};save();closeModal();activity('Private auction ended by seller. Inventory remains under seller control.')}
function sellerPrivateAuctions(){const ps=Object.entries(state.privateAuctions).filter(([id,p])=>p.active);return `<div class="sectionhead"><div><h2>Demand-based Private Auctions</h2><div class="tiny muted">Private negotiations exist only where demonstrated demand is active.</div></div></div>${ps.length?ps.map(([id,p])=>{const x=item(id),rs=p.responses.filter(r=>r.engaged);return `<div class="offerCard" style="margin-bottom:12px"><div class="row"><div><div class="eyebrow">WAVE ${p.wave}</div><h3>${esc(x.name)}</h3></div><span class="pill">${rs.length} participants</span></div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">Current participation price · deadline ${new Date(p.deadline).toLocaleTimeString()}</div><button class="primary" style="margin-top:12px" onclick="openModal('privateSeller','${id}')">Open private auction</button></div>`}).join(''):'<div class="empty">No active Private Auctions. Counter a group of active offers to begin one.</div>'}`}
function sellerAnalytics(){const os=state.offers.filter(o=>o.status==='active');return `<div class="metricStrip"><div class="metric">Offer range<b>${os.length?money(Math.min(...os.map(o=>o.amount)))+'–'+money(Math.max(...os.map(o=>o.amount))):'—'}</b></div><div class="metric">Method changes<b>24</b></div><div class="metric">Auction conversion<b>31%</b></div><div class="metric">Liquidity signal<b>High</b></div></div><div class="sectionhead"><h2>Demand over time</h2></div><div class="card"><div class="chart">${[25,39,30,55,47,72,65,91,78,100].map(v=>`<i style="height:${v}%"></i>`).join('')}</div><p class="tiny muted">Aggregated committed demand, offer outcomes and selling-method performance. Buyer-facing surfaces never receive this data.</p></div><div class="sectionhead"><h2>Positioning choices</h2></div><div class="methodGrid"><div class="methodBox current"><div class="eyebrow">BUY NOW</div><h3>Fastest liquidity</h3><p class="muted">Immediate execution remains available while offers are active.</p></div><div class="methodBox"><div class="eyebrow">PUBLIC AUCTION</div><h3>Broad competition</h3><p class="muted">Use a specialized channel when public price discovery is useful.</p></div><div class="methodBox"><div class="eyebrow">PRIVATE AUCTION</div><h3>Demand response</h3><p class="muted">Use uniform counteroffer waves when demonstrated demand warrants a private negotiation.</p></div></div>`}
function sellerInventory(){return `<div class="list">${items.filter(x=>!x.sold).slice(0,80).map(x=>`<div class="listrow"><div style="display:flex;gap:11px;align-items:center"><div class="mini">${img(x)}</div><div><b>${esc(x.name)}</b><div class="tiny muted">${esc(x.set)} · current method: ${x.method==='buy'?'BUY NOW':x.privateAuction?.active?'PRIVATE AUCTION':x.auctionType}</div></div></div><div class="actions"><button class="secondary" onclick="openModal('method','${x.id}')">Change method</button>${activeOffers(x.id).length?`<button class="primary" onclick="state.sellerTab='offers';render()">View demand</button>`:''}</div></div>`).join('')}</div>`}
function notification(n){return `<div class="notification ${n.read?'':'unread'}"><span class="dot" style="${n.read?'visibility:hidden':''}"></span><div style="flex:1"><div class="tiny muted">${esc(n.type)} · ${new Date(n.created).toLocaleString()}</div><b>${esc(n.text)}</b><div style="margin-top:7px"><button class="secondary tiny" onclick="notificationTarget('${n.id}')">Open</button></div></div></div>`}
function notificationTarget(id){const n=state.notifications.find(x=>x.id===id);if(!n)return;n.read=true;save();if(n.target==='auction')openAuction(n.item);else if(n.target==='private')openModal('privateBuyer',n.item);else if(n.target==='won'){route('buyer');state.buyerTab='won';render()}else if(n.target==='offer'){route('buyer');state.buyerTab='offers';render()}else if(n.target==='item')openItem(n.item);else route('buyer')}
function notificationsModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SYSTEM NOTIFICATIONS</div><h2>Concierge & marketplace activity</h2></div><button class="close" onclick="closeModal()">×</button></div>${state.notifications.map(notification).join('')||'<div class="empty">Nothing new.</div>'}<div class="actions" style="margin-top:13px"><button class="secondary" onclick="markAllRead()">Mark all read</button></div></div>`}
function markAllRead(){state.notifications.forEach(n=>n.read=true);save();render()}
function channelInfoModal(cid){const c=channel(cid),q=queueCriteria(c);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">CHANNEL CRITERIA</div><h2>${esc(c.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="step"><b>Auction type</b>${esc(q.auctionType||'Any')}</div><div class="step"><b>Starting price</b>${q.startingMin!=null?money(q.startingMin)+'–'+money(q.startingMax):'Any'}</div><div class="step"><b>Year range / era</b>${q.yearMin!=null?`${q.yearMin}–${q.yearMax}`:'Any'} · ${esc(q.eras?.join('/')||'All eras')}</div><div class="step"><b>Condition</b>${esc(q.conditions?.join('/')||'All conditions')}</div><div class="step"><b>Language</b>${esc(q.languages?.join('/')||'All languages')}</div><div class="step"><b>Variant</b>${esc(q.variants?.length?q.variants.join('/'):'All variants')}</div><div class="step"><b>Presentation</b>${esc(q.presentations?.join('/')||'All presentations')}</div><div class="notice"><b>Queue logic:</b> only inventory whose internal intake designators satisfy all applicable criteria is admitted to this channel's public queue.</div></div>`}
function auctionInfoModal(id){const x=item(id);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">BUYER AUCTION VIEW</div><h2>${esc(x.auctionType)} auction</h2></div><button class="close" onclick="closeModal()">×</button></div><p><b>Competitive surface only.</b></p><p>You see the item, current bid, bid count, live timer, auction type and your own bid.</p><div class="privacyNote">You do not see other buyers' offers, competing offer amounts, demand ranges, identities or seller analytics.</div></div>`}
function interestsModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">CONCIERGE</div><h2>Saved interests</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="muted">Interests can include cards, sets, variants, language, grading company, grade ranges, target prices and preferred selling methods.</p><div class="list">${state.interests.map((i,k)=>`<div class="listrow"><span>${esc(i)}</span><button class="secondary" onclick="state.interests.splice(${k},1);save();openModal('interests')">Remove</button></div>`).join('')}</div><input id="interestInput" class="input" placeholder="Add an interest" style="margin-top:12px"><button class="primary" style="margin-top:9px" onclick="addInterest()">Add interest</button></div>`}
function addInterest(){const v=document.getElementById('interestInput')?.value.trim();if(!v)return;state.interests.push(v);save();openModal('interests');notify(`Concierge is now watching ${v}.`,'buyer',null,'CONCIERGE')}
function consignModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLER HUB</div><h2>Consign inventory</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">The seller creates the standardized listing manifest and controls condition, presentation and initial selling method.</div><div class="step"><b>1 · Create manifest</b>Identify the individual collectible.</div><div class="step"><b>2 · Record intake designators</b>Capture year, era, raw/graded condition, language, variant, presentation and grading-company details.</div><div class="step"><b>3 · Choose initial method</b>Buy Now or specialized public auction.</div><div class="step"><b>4 · Stay fluid</b>Move the inventory between methods as market conditions develop.</div><button class="primary" onclick="closeModal();activity('Consignment manifest started.');state.sellerTab='inventory';render()">Start manifest</button></div>`}
function settingsModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">ACCOUNT</div><h2>Account & Settings</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="list"><div class="listrow"><span>Operating mode</span><b>${state.userMode.toUpperCase()}</b></div><div class="listrow"><span>Concierge notifications</span><b>On</b></div><div class="listrow"><span>Offer expiration</span><b>24 hours</b></div><div class="listrow"><span>Public auction start</span><b>3:00</b></div><div class="listrow"><span>Buyer demand privacy</span><b>Protected</b></div></div></div>`}
function orderModal(index){const w=state.won[index];if(!w)return `<div class="modal"><div class="modalHead"><h2>Order</h2><button class="close" onclick="closeModal()">×</button></div><div class="empty">Transaction not found.</div></div>`;const x=item(w.item);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">WON ITEM</div><h2>Order</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="success"><b>Transaction secured.</b><br>${esc(x.name)} · ${money(w.price)}</div><div class="step"><b>Next</b>Confirm shipping and payment details in the eventual production checkout.</div><button class="primary" onclick="closeModal();activity('Order flow acknowledged for '+x.name+'.')">Continue</button></div>`}
function modals(){if(state.profile)return profileModal();if(!state.modal)return '';const {type,data}=state.modal;let content='';if(type==='queue')return `<div class="overlay" onclick="if(event.target===this)closeModal()">${queueModal(data)}</div>`;if(type==='exploreFilters')content=exploreFilterModal();else if(type==='queueItem')content=queueItemModal(data);else if(type==='notifications')content=notificationsModal();else if(type==='channelInfo')content=channelInfoModal(data);else if(type==='auctionInfo')content=auctionInfoModal(data);else if(type==='offerConfirmation')content=offerConfirmation(data);else if(type==='buyerOffers')content=`<div class="modal"><div class="modalHead"><h2>Your offers</h2><button class="close" onclick="closeModal()">×</button></div>${buyerOffers()}</div>`;else if(type==='won')content=`<div class="modal"><div class="modalHead"><h2>Won Items</h2><button class="close" onclick="closeModal()">×</button></div>${wonItems()}</div>`;else if(type==='interests')content=interestsModal();else if(type==='consign')content=consignModal();else if(type==='settings')content=settingsModal();else if(type==='order')content=orderModal(data);else if(type==='privateBuyer')content=privateBuyer(data);else if(type==='privateSeller')content=privateSeller(data);else if(type==='method')content=methodModal(data);else if(type==='customBid')content=customBidModal(data);return `<div class="overlay" onclick="if(event.target===this)closeModal()">${content}</div>`}
function render(){let body;if(state.page==='explore')body=explore();else if(state.page==='auctions')body=auctions();else if(state.page==='buy')body=buy();else if(state.page==='auction')body=auctionPage();else if(state.page==='item')body=itemPage();else if(state.page==='buyer')body=buyerHub();else if(state.page==='seller')body=sellerHub();else body=explore();document.body.classList.toggle('auction-mode',state.page==='auction');document.getElementById('app').innerHTML=(state.page==='auction'?'':header())+body+modals()+(state.toast?`<div class="toast">${esc(state.toast)}</div>`:'');}
function expireOffers(now){let changed=false;state.offers.forEach(o=>{if(o.status==='active'&&o.expires<=now){o.status='expired';changed=true;}});return changed}
function finishAuction(x){const winning=state.bids.filter(b=>b.item===x.id).sort((a,b)=>b.amount-a.amount)[0];const wasMine=winning&&winning.buyer==='You'&&winning.amount===x.current;const c=channel(x.channelId),pool=queuePool(c.id);const pos=state.channelPos[c.id]||0;const next=(pos+1)%pool.length;state.channelPos[c.id]=next;x.sold=true;x.status='Auction closed';x.endsAt=0;if(wasMine){state.won.push({item:x.id,price:x.current,source:'Public Auction',date:Date.now()});notify(`You won ${x.name} for ${money(x.current)}.`,'won',x.id,'AUCTION WON')}const nx=pool[next];nx.sold=false;nx.method='auction';nx.status='Live';nx.endsAt=Date.now()+180000;nx.current=Math.max(1,Math.max(...activeOffers(nx.id).map(o=>o.amount),0));nx.bidCount=nx.bidCount||0;nx.auction={coef:.2,cycleFloor:5,lastReupAt:null,lastTrigger:null,reups:0,usedIntegers:[],lastExtension:null,lastExtensionAt:null,lastMirrored:null,lastAppliedCoefficient:null,nextCoefficient:.2};notify(`${nx.name} is now live in ${c.name}.`,'auction',nx.id,'AUCTION LIVE');state.activeItem=state.activeItem===x.id?nx.id:state.activeItem;save()}
function tick(){
 const now=Date.now();
 let changed=expireOffers(now);
 items.filter(x=>x.method==='auction'&&!x.sold&&x.status==='Live').forEach(x=>{
  // Elastic decay and consumed-integer state persist for the lifetime of the
  // active auction. Crossing N → N-1 must never reset the coefficient or make
  // a previously consumed integer available again. A fresh auction receives
  // a fresh Elastic state in finishAuction().
  if(remainingMs(x)<=0){finishAuction(x);changed=true}
 });
 if(state.modal?.type==='privateBuyer'||state.modal?.type==='privateSeller'){
  const p=state.privateAuctions[state.modal.data];
  if(p?.active&&p.deadline<=now){p.responses=p.responses.map(r=>({...r,engaged:false}));p.active=false;p.activeParticipants=0;changed=true;}
 }
 if(changed){save();render();return;}
 // All visible countdowns derive from the same authoritative endsAt value.
 const x=state.page==='auction'?item(state.activeItem):null;
 if(x){const cur=document.getElementById('auctionCurrent');if(cur)cur.textContent=money(x.current);const bc=document.getElementById('auctionBids');if(bc)bc.textContent=`${x.bidCount||0} bids`;const fb=document.getElementById('fastBidButton');if(fb)fb.textContent=`BID ${money(minBid(x))}`;
  if(x.auctionType==='ELASTIC'){const ep=elasticPreview(x);const reads=document.querySelectorAll('.elasticReadout');if(reads.length>=3){const last=x.auction?.lastExtension;reads[0].querySelector('b').textContent=last==null?'—':'+'+Number(last).toFixed(2)+'s';reads[1].querySelector('b').textContent=ep.active?(ep.used?'+0.00s':'+'+ep.extension.toFixed(2)+'s'):'—';reads[1].querySelector('.sub').textContent=ep.active?(ep.used?'integer already consumed':'predicted from current integer'):'outside extension zone';reads[2].querySelector('b').textContent=ep.active?`${ep.whole}s → ${ep.subsequent}s · ${ep.coef.toFixed(2)}`:'inactive';reads[2].querySelector('.sub').textContent=ep.active?(ep.used?`integer consumed · coefficient remains ${ep.coef.toFixed(2)}`:`mirrored ${ep.mirrored} · next coefficient ${(ep.coef/2).toFixed(2)}`):'public timer';}}}
 save();
}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else if(state.profile)closeProfile()}});
try{
 state.exploreFilters=state.exploreFilters||{};
 normalizeAuctions();
 save();
 render();
 tick();
}catch(e){
 console.error('RapidUp initialization recovered:',e);
 localStorage.removeItem(STORAGE_KEY);
 state=initialState();
 try{normalizeAuctions();}catch(_){}
 try{save();}catch(_){}
 try{render();}catch(err){console.error('RapidUp render failure:',err);}
}
setInterval(tick,1000);
setInterval(updatePreciseTimerDisplays,50);
</script></body></html>
