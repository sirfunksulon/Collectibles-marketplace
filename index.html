<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RapidUp — Function-First Prototype</title>
<style>
:root{--ink:#12151a;--muted:#6c737c;--line:#e5e7eb;--soft:#f6f7f9;--accent:#111827;--good:#0f766e;--warn:#b45309;--danger:#b91c1c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff}
button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:#fff}.shell{max-width:1440px;margin:auto;padding:0 28px 40px}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 2px 10px #00000008}.card-img{height:240px;background:#f3f4f6;display:grid;place-items:center;position:relative;cursor:pointer}.card-img svg{width:65%;height:88%;filter:drop-shadow(0 8px 14px #0002)}.method{position:absolute;top:10px;right:10px;padding:7px 9px;border-radius:9px;background:#fff;box-shadow:0 3px 12px #0002;font-size:12px;font-weight:900}.card-body{padding:13px}.title{font-weight:800;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}.meta{display:flex;justify-content:space-between;gap:8px;align-items:end;margin-top:10px}.price{font-weight:900;font-size:19px}.time{font-size:12px;color:var(--muted)}.actions{display:flex;gap:7px;margin-top:10px}.primary,.secondary,.danger{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.primary{background:#111827;color:#fff}.secondary{background:#f0f2f4;color:#111827}.danger{background:#fee2e2;color:#991b1b}.primary:disabled{opacity:.45;cursor:not-allowed}

.summary{display:grid;grid-template-columns:340px 1fr;gap:22px}.summary-art{min-height:430px;background:#f3f4f6;border-radius:14px;display:grid;place-items:center}.summary-art svg{width:75%;height:90%}.detail-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}.detail{background:#f7f7f8;border-radius:10px;padding:10px}.detail b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.offerbox{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.auction-directory .channel-card{grid-template-columns:1fr}.channel-link{border:0;background:#111827;color:#fff;border-radius:9px;padding:9px 11px;font-weight:800}

.hidden{display:none!important}

/* Immersive auction */

@media(max-width:600px){.nav{display:none}.grid{grid-template-columns:1fr 1fr;gap:10px}.card-img{height:190px}.hero{align-items:start;flex-direction:column}.filters{grid-template-columns:1fr}.channel-grid{grid-template-columns:1fr}.hub-grid{grid-template-columns:1fr}.detail-list{grid-template-columns:1fr}.auction-screen .auction-bg svg{max-width:82vw;height:49vh}.auction-top{padding:8px}.channel-name{font-size:12px}.auction-product-name{bottom:204px;font-size:12px}.bid-zone{gap:6px;padding:6px 7px 8px}.bid-box{min-height:67px}.bid-box .value{font-size:19px}.bid-action{font-size:15px;min-height:52px;padding:11px}.custom-row input{width:0}.auction-info{font-size:10px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
'use strict';

/* =========================================================
   RAPIDUP — FUNCTION-FIRST DATA / STATE / LOGIC
   ========================================================= */

const STORAGE_KEY = 'rapidup-function-first-v2';
const SCHEMA_VERSION = 2;
const AUCTION_DURATION_MS = 180000;
const ELASTIC_THRESHOLD_MS = 30000;
const ELASTIC_BASE_COEFFICIENT = 0.20;
const MIN_EFFECTIVE_EXTENSION_MS = 0.001;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toFixed(2);
const now = () => Date.now();

function cardArt(item, mode='normal'){
  const hue = (item.id.charCodeAt(0)*37)%360;
  const premium = item.presentation === 'premium';
  return `<svg viewBox="0 0 300 420" aria-label="${esc(item.title)}" role="img">
    <defs><linearGradient id="g${esc(item.id)}" x1="0" x2="1"><stop offset="0" stop-color="hsl(${hue},65%,42%)"/><stop offset="1" stop-color="hsl(${(hue+65)%360},75%,68%)"/></linearGradient>
    <filter id="s${esc(item.id)}"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-opacity=".22"/></filter></defs>
    <rect x="8" y="8" width="284" height="404" rx="18" fill="#fefefe" stroke="#111827" stroke-width="4" filter="url(#s${esc(item.id)})"/>
    <rect x="22" y="22" width="256" height="250" rx="13" fill="url(#g${esc(item.id)})"/>
    <circle cx="150" cy="140" r="72" fill="#ffffff33"/>
    <path d="M105 175 Q150 65 195 175 Q150 220 105 175Z" fill="#fff9" stroke="#111827" stroke-width="4"/>
    <circle cx="132" cy="150" r="8" fill="#111827"/><circle cx="168" cy="150" r="8" fill="#111827"/>
    <rect x="24" y="287" width="252" height="62" rx="10" fill="#f3f4f6"/>
    <text x="38" y="312" font-size="15" font-weight="800" fill="#111827">${esc(item.short)}</text>
    <text x="38" y="335" font-size="12" fill="#6b7280">${esc(item.year)} • ${esc(item.variant)}</text>
    ${premium ? '<circle cx="258" cy="44" r="13" fill="#111827"/><text x="258" y="48" text-anchor="middle" font-size="10" fill="#fff">3D</text>' : ''}
  </svg>`;
}

const seedItems = [
{id:'P001',short:'Pikachu #12',title:"2003 Pokemon Promo EX Series Collector's Tin Holo Pikachu #12 CGC 8 NM-MT",category:'Pokemon',year:2003,era:'vintage',condition:'graded',grader:'CGC',grade:8,language:'English',variant:'holo',presentation:'premium',sellingMethod:'AUCTION',auctionType:'ELASTIC',startPrice:85,currentBid:92,timeSeed:52000,channelId:'CH-ELASTIC'},
{id:'P002',short:'Charizard #4',title:"2022 Pokemon Sword & Shield Brilliant Stars Charizard VSTAR #174 PSA 10 Gem Mint",category:'Pokemon',year:2022,era:'modern',condition:'graded',grader:'PSA',grade:10,language:'English',variant:'full art',presentation:'standard',sellingMethod:'AUCTION',auctionType:'SUDDEN DEATH',startPrice:45,currentBid:51,timeSeed:128000,channelId:'CH-SUDDEN'},
{id:'P003',short:'Blastoise #31',title:"2001 Pokemon Neo Discovery Blastoise Holo #31 CGC 7 NM",category:'Pokemon',year:2001,era:'vintage',condition:'graded',grader:'CGC',grade:7,language:'English',variant:'holo',presentation:'standard',sellingMethod:'AUCTION',auctionType:'ELASTIC',startPrice:25,currentBid:27,timeSeed:180000,channelId:'CH-ELASTIC'},
{id:'P004',short:'Mewtwo GX #39',title:"2017 Pokemon Shining Legends Mewtwo GX #39 PSA 9 Mint",category:'Pokemon',year:2017,era:'modern',condition:'graded',grader:'PSA',grade:9,language:'English',variant:'full art',presentation:'premium',sellingMethod:'AUCTION',auctionType:'ELASTIC',startPrice:35,currentBid:39,timeSeed:240000,channelId:'CH-ELASTIC'},
{id:'P005',short:'Gardevoir #7',title:"2004 Pokemon EX Sandstorm Gardevoir #7 Raw NM Holo",category:'Pokemon',year:2004,era:'vintage',condition:'raw',grader:null,grade:null,language:'English',variant:'holo',presentation:'premium',sellingMethod:'AUCTION',auctionType:'SUDDEN DEATH',startPrice:18,currentBid:21,timeSeed:0,channelId:'CH-SUDDEN'},
{id:'P006',short:'Eevee #44',title:"2024 Pokemon Scarlet & Violet Twilight Masquerade Eevee #44 Illustration Rare",category:'Pokemon',year:2024,era:'modern',condition:'raw',grader:null,grade:null,language:'English',variant:'illustration rare',presentation:'standard',sellingMethod:'BUY NOW',price:29.99},
{id:'P007',short:'Mew #205',title:"2023 Pokemon 151 Mew ex #205 Special Illustration Rare PSA 10",category:'Pokemon',year:2023,era:'modern',condition:'graded',grader:'PSA',grade:10,language:'English',variant:'illustration rare',presentation:'premium',sellingMethod:'BUY NOW',price:149.99},
{id:'P008',short:'Lugia #186',title:"2002 Pokemon Neo Genesis Lugia #9 Japanese Holo CGC 8",category:'Pokemon',year:2002,era:'vintage',condition:'graded',grader:'CGC',grade:8,language:'Japanese',variant:'holo',presentation:'standard',sellingMethod:'BUY NOW',price:118},
{id:'P009',short:'Umbreon #95',title:"2021 Pokemon Evolving Skies Umbreon VMAX #95 Alternate Art PSA 9",category:'Pokemon',year:2021,era:'modern',condition:'graded',grader:'PSA',grade:9,language:'English',variant:'full art',presentation:'premium',sellingMethod:'AUCTION',auctionType:'ELASTIC',startPrice:60,currentBid:64,timeSeed:90000,channelId:'CH-PREMIUM'},
{id:'P010',short:'Alakazam #129',title:"1999 Pokemon Base Set Alakazam #1 Holo CGC 6 EX",category:'Pokemon',year:1999,era:'vintage',condition:'graded',grader:'CGC',grade:6,language:'English',variant:'holo',presentation:'standard',sellingMethod:'AUCTION',auctionType:'SUDDEN DEATH',startPrice:12,currentBid:14,timeSeed:150000,channelId:'CH-SUDDEN'},
{id:'P011',short:'Pikachu #TG05',title:"2022 Pokemon Silver Tempest Pikachu TG05 Trainer Gallery Holo",category:'Pokemon',year:2022,era:'modern',condition:'raw',grader:null,grade:null,language:'English',variant:'holo',presentation:'standard',sellingMethod:'BUY NOW',price:11.5},
{id:'P012',short:'Rayquaza #111',title:"2021 Pokemon Evolving Skies Rayquaza V #110 Alternate Art PSA 9",category:'Pokemon',year:2021,era:'modern',condition:'graded',grader:'PSA',grade:9,language:'English',variant:'full art',presentation:'premium',sellingMethod:'BUY NOW',price:79.99}
];

const channels = [
{id:'CH-ELASTIC',name:'Elastic Vault • Mid-Era / Premium',description:'Elastic auctions for graded or premium presentation Pokemon from 2000–2025.',criteria:{category:'Pokemon',auctionType:'ELASTIC',yearMin:2000,yearMax:2025,era:['vintage','mid-era','modern'],condition:['graded','raw'],language:['English'],variant:['holo','full art','illustration rare'],presentation:['premium'],startMin:20}},
{id:'CH-SUDDEN',name:'Sudden Death • Vintage Holo',description:'Sudden Death channel for English vintage Pokemon holo cards.',criteria:{category:'Pokemon',auctionType:'SUDDEN DEATH',yearMin:1995,yearMax:2005,era:['vintage'],condition:['raw','graded'],language:['English'],variant:['holo'],presentation:['standard','premium'],startMin:0}},
{id:'CH-PREMIUM',name:'Premium Elastic • Modern Hits',description:'Premium Elastic channel emphasizing modern English presentation.',criteria:{category:'Pokemon',auctionType:'ELASTIC',yearMin:2015,yearMax:2026,era:['modern'],condition:['graded','raw'],language:['English'],variant:['full art','illustration rare'],presentation:['premium'],startMin:30}}
];

function freshState(){
  const t = now();
  return {
    schema:SCHEMA_VERSION,
    route:'explore',
    user:{name:'Scott',role:'buyer',interests:['Pokemon','premium','holo','illustration rare']},
    items:seedItems.map(x=>({...x})),
    channels:channels.map(x=>({...x,criteria:{...x.criteria}})),
    queueState:{
      'CH-ELASTIC':{activeId:'P001',order:['P001','P003','P004','P009'],startedAt:t-128000,endsAt:t+52000,auctionType:'ELASTIC'},
      'CH-SUDDEN':{activeId:'P002',order:['P002','P005','P010'],startedAt:t-91000,endsAt:t+89000,auctionType:'SUDDEN DEATH'},
      'CH-PREMIUM':{activeId:'P009',order:['P009'],startedAt:t-90000,endsAt:t+90000,auctionType:'ELASTIC'}
    },
    auctions:{
      P001:{id:'P001',currentBid:92,bidCount:3,endsAt:t+52000,startedAt:t-128000,active:true,elastic:{baseCoefficient:.2,cycles:{},lastEvent:null}},
      P002:{id:'P002',currentBid:51,bidCount:2,endsAt:t+89000,startedAt:t-91000,active:true,elastic:null},
      P009:{id:'P009',currentBid:64,bidCount:1,endsAt:t+90000,startedAt:t-90000,active:true,elastic:{baseCoefficient:.2,cycles:{},lastEvent:null}}
    },
    offers:[
      {id:'O1',itemId:'P003',buyer:'Buyer A',amount:24,createdAt:t-3*3600000,status:'OPEN',expiresAt:t+21*3600000},
      {id:'O2',itemId:'P001',buyer:'Buyer B',amount:88,createdAt:t-25*3600000,status:'EXPIRED',expiresAt:t-1*3600000}
    ],
    privateAuctions:[],
    notifications:[
      {id:'N1',type:'auction',title:'Elastic Vault starts soon',body:'Pikachu #12 is live now.',createdAt:t-50000,read:false,target:'auction',itemId:'P001'},
      {id:'N2',type:'inventory',title:'New premium inventory',body:'Mew ex #205 is available Buy Now.',createdAt:t-800000,read:false,target:'item',itemId:'P007'}
    ],
    filters:{text:'',category:'',year:'',yearMin:'',yearMax:'',condition:'',grader:'',gradeMin:'',gradeMax:'',presentation:'',language:'',variant:'',sellingMethod:'',auctionType:''},
    modal:null,
    selectedItem:null,
    selectedChannel:null,
    selectedAuction:null,
    toast:null,
    lastTick:t
  };
}

let state;
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    const parsed=JSON.parse(raw);
    if(parsed.schema!==SCHEMA_VERSION) return freshState();
    return parsed;
  }catch(e){ console.warn('RapidUp state reset:',e); return freshState(); }
}
state=loadState();

function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function item(id){return state.items.find(x=>x.id===id)}
function channel(id){return state.channels.find(x=>x.id===id)}
function auction(id){return state.auctions[id]}
function isLiveAuction(x){
  const a=auction(x.id); return x.sellingMethod==='AUCTION' && !!a && a.active && a.endsAt>now();
}
function actionable(x){return x.sellingMethod==='BUY NOW' || isLiveAuction(x)}
function remainingMs(id){const a=auction(id);return a?Math.max(0,a.endsAt-now()):0}
function formatTime(ms, hundredths=true){
  const total=Math.max(0,ms);
  const mins=Math.floor(total/60000);
  const secs=Math.floor((total%60000)/1000);
  const cs=Math.floor((total%1000)/10);
  return `${mins}:${String(secs).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

/* Queue criteria are evaluated from INTERNAL DESIGNATORS, never title parsing. */
function matchesCriteria(x,c){
  const r=c.criteria||{};
  if(r.category && x.category!==r.category) return false;
  if(r.auctionType && x.auctionType!==r.auctionType) return false;
  if(r.yearMin!=null && x.year<r.yearMin) return false;
  if(r.yearMax!=null && x.year>r.yearMax) return false;
  if(r.era?.length && !r.era.includes(x.era)) return false;
  if(r.condition?.length && !r.condition.includes(x.condition)) return false;
  if(r.language?.length && !r.language.includes(x.language)) return false;
  if(r.variant?.length && !r.variant.includes(x.variant)) return false;
  if(r.presentation?.length && !r.presentation.includes(x.presentation)) return false;
  if(r.startMin!=null && (x.startPrice||0)<r.startMin) return false;
  return true;
}
function eligibleChannels(x){return state.channels.filter(c=>matchesCriteria(x,c)).map(c=>c.id)}

function filterItems(){
  const f=state.filters;
  return state.items.filter(x=>{
    if(!actionable(x)) return false;
    if(f.text && !x.title.toLowerCase().includes(f.text.toLowerCase())) return false;
    if(f.category && x.category!==f.category) return false;
    if(f.year && String(x.year)!==String(f.year)) return false;
    if(f.yearMin && x.year<Number(f.yearMin)) return false;
    if(f.yearMax && x.year>Number(f.yearMax)) return false;
    if(f.condition && x.condition!==f.condition) return false;
    if(f.grader && x.grader!==f.grader) return false;
    if(f.gradeMin && (x.grade==null || x.grade<Number(f.gradeMin))) return false;
    if(f.gradeMax && (x.grade==null || x.grade>Number(f.gradeMax))) return false;
    if(f.presentation && x.presentation!==f.presentation) return false;
    if(f.language && x.language!==f.language) return false;
    if(f.variant && x.variant!==f.variant) return false;
    if(f.sellingMethod && x.sellingMethod!==f.sellingMethod) return false;
    if(f.auctionType && (x.sellingMethod!=='AUCTION' || x.auctionType!==f.auctionType)) return false;
    if(f.startMin && (x.startPrice==null || x.startPrice<Number(f.startMin))) return false;
    if(f.startMax && (x.startPrice==null || x.startPrice>Number(f.startMax))) return false;
    return true;
  });
}

/* =========================================================
   ELASTIC ENGINE
   One qualifying extension per integer per decay cycle.
   A cycle is contextual: after cycle origin N, the next
   lower countdown integer N-1 starts a new cycle. Previous
   cycle consumption is NOT global.
   ========================================================= */

function cycleKey(origin){return String(origin)}
function coefficientFor(a,origin){
  const e=a.elastic;
  if(!e) return ELASTIC_BASE_COEFFICIENT;
  if(e.cycleOrigin!==origin){
    e.cycleOrigin=origin;
    e.coefficient=ELASTIC_BASE_COEFFICIENT;
    e.consumed={};
    e.opportunities=[];
    e.lastInteger=null;
  }
  return e.coefficient;
}
function resetCycleForInteger(a,origin){
  a.elastic.cycleOrigin=origin;
  a.elastic.coefficient=ELASTIC_BASE_COEFFICIENT;
  a.elastic.consumed={};
  a.elastic.opportunities=[];
  a.elastic.lastInteger=null;
}
function integerAt(ms){
  return Math.max(0,Math.floor(ms/1000));
}
function ensureElasticState(a){
  if(!a.elastic) a.elastic={baseCoefficient:ELASTIC_BASE_COEFFICIENT,cycles:{},naturalCycleFloor:null,lastEvent:null};
  if(!a.elastic.cycles) a.elastic.cycles={};
  return a.elastic;
}
function getCycle(e,origin){
  const k=String(origin);
  if(!e.cycles[k]) e.cycles[k]={origin,coefficient:e.baseCoefficient,consumed:{},opportunities:[]};
  return e.cycles[k];
}
function opportunityForInteger(e,whole){
  /* Generated opportunities are cycle-local. Prefer the earliest active
     generated opportunity at this integer; otherwise the natural cycle
     beginning at the countdown integer is used. */
  for(const c of Object.values(e.cycles)){
    const op=c.opportunities.find(o=>o.integer===whole && !o.consumed);
    if(op) return {cycle:c,op};
  }
  return {cycle:getCycle(e,whole),op:null};
}
function applyElasticBid(id,bidAmount){
  const a=auction(id), x=item(id);
  if(!a || !x || x.auctionType!=='ELASTIC' || !a.active) return {ok:false,reason:'Not an active Elastic auction.'};
  const rem=remainingMs(id);
  if(rem<=0) return {ok:false,reason:'Auction has ended.'};
  if(bidAmount<=a.currentBid) return {ok:false,reason:'Bid must exceed the current bid.'};
  a.currentBid=Number(bidAmount.toFixed(2)); a.bidCount++;

  if(rem<ELASTIC_THRESHOLD_MS){
    const whole=integerAt(rem);
    const e=ensureElasticState(a);
    const selected=opportunityForInteger(e,whole);
    const c=selected.cycle;
    const key=String(whole);
    /* One qualifying extension per integer within THIS cycle. */
    if(!c.consumed[key]){
      const coeff=c.coefficient;
      const extensionMs=(30-whole)*1000*coeff;
      c.consumed[key]=true;
      if(selected.op) selected.op.consumed=true;
      c.opportunities.push({integer:whole,coefficient:coeff,extensionMs,consumed:false,generatedAt:now()});
      c.coefficient=coeff/2;
      e.lastEvent={whole,cycleOrigin:c.origin,coefficient:coeff,extensionMs};
      if(extensionMs>=MIN_EFFECTIVE_EXTENSION_MS){
        a.endsAt += extensionMs;
        /* The fractional endpoint creates a higher integer opportunity in
           the same cycle. Its integer component is what becomes actionable. */
        const endpoint=a.endsAt;
        const generatedWhole=integerAt(extensionMs + whole*1000 + 0.0001);
        /* More directly: extension is measured from N seconds remaining. */
        const achieved=whole + extensionMs/1000;
        const achievedInteger=Math.floor(achieved+1e-9);
        if(achievedInteger>whole){
          const exists=c.opportunities.some(o=>o.integer===achievedInteger && !o.consumed);
          if(!exists)c.opportunities.push({integer:achievedInteger,coefficient:c.coefficient,extensionMs:0,consumed:false,generated:true,at:now()});
        }
        return {ok:true,extensionMs,whole,coefficient:coeff,cycleOrigin:c.origin};
      }
    }
  }
  return {ok:true,extensionMs:0,whole:integerAt(rem),coefficient:ensureElasticState(a).baseCoefficient};
}

/* Advance expired active auctions. This is authoritative queue progression. */
function resolveExpiredAuctions(){
  let changed=false;
  const t=now();
  for(const c of state.channels){
    const q=state.queueState[c.id]; if(!q) continue;
    const privateHeld=state.privateAuctions.some(p=>p.itemId===q.activeId&&p.status==='ACTIVE');
    const a=auction(q.activeId);
    if(privateHeld){ a && (a.active=false); }
    if(!a || (!a.active && !privateHeld) || a.endsAt>t) continue;
    a.active=false;
    const idx=q.order.indexOf(q.activeId);
    const nextId=q.order.slice(idx+1).find(id=>{
      const x=item(id);
      return x && x.sellingMethod==='AUCTION' && !state.privateAuctions.some(p=>p.itemId===id&&p.status==='ACTIVE');
    });
    if(nextId){
      q.activeId=nextId;
      const n=auction(nextId);
      n.active=true;n.startedAt=t;n.endsAt=t+AUCTION_DURATION_MS;
      if(n.auctionType==='ELASTIC') n.elastic={baseCoefficient:.2,cycles:{},lastEvent:null};
      const committed=state.offers.filter(o=>o.itemId===nextId&&o.status==='OPEN'&&o.expiresAt>t);
      n.participants=(n.participants||[]).concat(committed.map(o=>o.buyer));
      committed.forEach(o=>{o.status='PARTICIPANT';notify('auction','Committed offer entered auction',`Your offer on ${item(nextId).short} carried into the live auction as participation.`,nextId)});
      changed=true;
    }else{
      /* In a prototype, replenish from eligible inventory not already queued. */
      const candidate=state.items.find(x=>x.sellingMethod==='AUCTION' && matchesCriteria(x,c) && !q.order.includes(x.id) && !state.privateAuctions.some(p=>p.itemId===x.id&&p.status==='ACTIVE'));
      if(candidate){
        q.order.push(candidate.id);
        q.activeId=candidate.id;
        state.auctions[candidate.id]={id:candidate.id,currentBid:candidate.startPrice||1,bidCount:0,endsAt:t+AUCTION_DURATION_MS,startedAt:t,active:true,elastic:candidate.auctionType==='ELASTIC'?{baseCoefficient:.2,cycleOrigin:30,coefficient:.2,consumed:{},opportunities:[],lastInteger:null}:null};
        changed=true;
      }
    }
  }
  if(changed) save();
}

/* Offers / private auction lifecycle */
function createOffer(itemId,amount){
  const x=item(itemId); if(!x) return;
  const t=now();
  state.offers.unshift({id:'O'+Math.random().toString(36).slice(2,8),itemId,buyer:'You',amount:Number(amount),createdAt:t,status:'OPEN',expiresAt:t+24*3600000});
  notify('offer','Offer submitted',`Your ${money(amount)} offer on ${x.short} is committal for 24 hours.`,itemId);
  state.toast='Offer submitted';save();render();
}
function expireOffers(){
  let changed=false,t=now();
  for(const o of state.offers){
    if(o.status==='OPEN' && o.expiresAt<=t){o.status='EXPIRED';changed=true;notify('offer','Offer expired',`Your offer on ${item(o.itemId)?.short||'item'} expired.`,o.itemId,false)}
  }
  if(changed) save();
}
function startPrivateAuction(offerId){
  const o=state.offers.find(v=>v.id===offerId); if(!o||o.status!=='OPEN') return;
  const x=item(o.itemId), pos=findQueuePosition(o.itemId);
  if(!x||!pos){state.toast='Only queued items can enter a private auction.';render();return;}
  const q=state.queueState[pos.channelId];
  if(q.activeId===x.id){state.toast='A live auction cannot run a private auction simultaneously.';render();return;}
  o.status='COUNTERED';
  state.privateAuctions.push({id:'PA'+Date.now(),itemId:o.itemId,offerId:o.id,status:'ACTIVE',startedAt:now(),counter:Number((o.amount+2).toFixed(2)),queuePosition:{channelId:pos.channelId,index:pos.index},deferred:true});
  state.toast='Private auction engaged';
  notify('counteroffer','Private auction opened',`${x.short} has been deferred within its public queue while the seller-led private auction runs.`,x.id);
  save();render();
}
function findQueuePosition(itemId){
  for(const c of state.channels){const q=state.queueState[c.id];const i=q?.order.indexOf(itemId);if(i>=0)return {channelId:c.id,index:i};}
  return null;
}

   <div class="auction-bg">${cardArt(x,'auction')}</div>
   <div class="auction-overlay">
    <div class="auction-top"><button data-action="return-dashboard">← Return to Dashboard</button><div class="channel-name">${esc(c?.name||'Auction Channel')}</div><div class="extension">${elastic&&threshold?`ELASTIC • extension zone • ${formatTime(rem)} remaining`:''}</div></div>
    <div></div>
    <div class="bid-zone">
      <div class="bid-box"><button class="bid-action swipe" data-action="swipe-bid" data-id="${x.id}">Swipe to Bid<div class="swipe-track"><div class="swipe-fill"></div></div><div class="swipe-hint">Swipe right to submit</div></button></div>
      <div class="bid-box"><div class="label">Current Bid</div><div class="value">${money(a.currentBid)}</div><div class="criteria">${a.bidCount} bids</div></div>
      <div class="bid-box"><div class="label">Custom Bid</div><div class="custom-row"><input id="customBid" type="number" min="${(a.currentBid+.01).toFixed(2)}" step=".01" placeholder="${(a.currentBid+1).toFixed(2)}"><button data-action="custom-bid" data-id="${x.id}">Bid</button></div></div>
      <div class="bid-box"><div class="label">Time Remaining</div><div class="value" id="auctionTimer">${formatTime(rem)}</div></div>
      <div class="auction-info">ⓘ ${esc(c?.criteria?criteriaText(c):'Auction criteria unavailable')}</div>
    </div>
   </div>
   <div class="auction-product-name">${esc(x.title)}</div>
 </div>`;
}

function render(){
  resolveExpiredAuctions(); expireOffers();
  const root=document.getElementById('app');
  if(state.route==='auction'){root.innerHTML=auctionScreen();return;}
  root.innerHTML=`<div class="shell">${nav()}<main>${
    state.route==='explore'?exploreView():
    state.route==='auctions'?auctionsView():
    state.route==='channel'?channelView():
    state.route==='profile'?profileView():
    state.route==='notifications'?notificationsView():exploreView()
  }</main></div>${state.modal==='summary'?`<div class="modal-backdrop">${summaryModal()}</div>`:''}${state.modal==='search'?`<div class="modal-backdrop">${searchModal()}</div>`:''}${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}`;
  if(state.toast){const t=state.toast;state.toast=null;setTimeout(()=>{if(!state.modal)render()},1800)}
}

/* =========================================================
   EXPLICIT SEMANTIC EVENT ROUTING
   ========================================================= */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;
 const act=el.dataset.action,id=el.dataset.id;
 if(act==='nav-explore') route('explore');
 else if(act==='nav-auctions') route('auctions');
 else if(act==='open-search') openSearch();
 else if(act==='close-modal') closeModal();
 else if(act==='open-item-summary') openItem(id);
 else if(act==='view-auction') joinAuction(id);
 else if(act==='buy-now') buyNow(id);
 else if(act==='make-offer') promptOffer(id);
 else if(act==='open-channel') viewChannel(id);
 else if(act==='profile') route('profile');
 else if(act==='notifications') route('notifications');
 else if(act==='mark-read'){state.notifications.forEach(n=>n.read=true);save();render()}
 else if(act==='offers') route('profile');
 else if(act==='private') startPrivateAuction(id);
 else if(act==='return-dashboard') route('explore');
 else if(act==='custom-bid') submitBid(id);
 else if(act==='swipe-bid') submitBid(id);
 else if(act==='apply-filters'){syncFilters();state.modal=null;save();render()}
 else if(act==='clear-filters'){state.filters=freshState().filters;save();render()}
 else if(act==='elastic-test') testElastic();
 else if(act==='reset'){localStorage.removeItem(STORAGE_KEY);location.reload()}
 else if(act==='toast'){state.toast='Prototype activity panel ready';render()}
});
document.addEventListener('change',e=>{
 const el=e.target.closest('[data-action="quick-filter"]');if(el){const v=el.value;state.filters.category=['Pokemon'].includes(v)?v:'';state.filters.sellingMethod=['AUCTION','BUY NOW'].includes(v)?v:'';render()}
});
document.addEventListener('input',e=>{
 if(e.target.matches('[data-filter]')){state.filters[e.target.dataset.filter]=e.target.value;const modal=document.querySelector('.modal');if(modal&&state.modal==='search'){const count=filterItems().length;const rc=modal.querySelector('.result-count');if(rc)rc.textContent=`${count} matching actionable result${count===1?'':'s'}`}}
});
function syncFilters(){document.querySelectorAll('[data-filter]').forEach(el=>state.filters[el.dataset.filter]=el.value)}

function promptOffer(id){
 const x=item(id);if(!x)return;
 const base=x.sellingMethod==='BUY NOW'?x.price:x.currentBid;
 const val=prompt(`Offer amount for ${x.short}:`,Number(base*.9).toFixed(2));
 if(val!==null && Number(val)>0)createOffer(id,Number(val));
}
function buyNow(id){
 const x=item(id);if(!x||x.sellingMethod!=='BUY NOW')return;
 x.sellingMethod='SOLD';x.soldAt=now();notify('purchase','Purchase complete',`You purchased ${x.short} for ${money(x.price)}.`,x.id);
 state.toast=`Purchased ${x.short}`;save();render();
}
function submitBid(id){
 const x=item(id),a=auction(id);if(!x||!a||!a.active)return;
 const amount=a.currentBid+1;
 const result=applyElasticBid(id,amount);
 if(!result.ok){state.toast=result.reason;render();return}
 state.toast=result.extensionMs?`Bid accepted • +${(result.extensionMs/1000).toFixed(3)}s extension`:'Bid accepted';
 save();render();
}
function testElastic(){
 const a=auction('P001');a.active=true;a.endsAt=now()+5000;a.currentBid=92;a.elastic={baseCoefficient:.2,cycles:{},lastEvent:null};
 const before=a.endsAt;const result=applyElasticBid('P001',93);const delta=a.endsAt-before;
 state.toast=`Elastic test: ${formatTime(delta)} extension at integer ${result.whole}`;
 save();render();
}

/* Swipe gesture is separate from click and remains fully visible. */
let swipeStart=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.swipe');if(!el)return;swipeStart={x:e.clientX,el}});
document.addEventListener('pointerup',e=>{
 if(!swipeStart)return;const dx=e.clientX-swipeStart.x;const fill=swipeStart.el.querySelector('.swipe-fill');
 if(dx>70){fill.style.width='100%';submitBid(swipeStart.el.dataset.id)} else fill.style.width='0';
 swipeStart=null;
});

setInterval(()=>{
  resolveExpiredAuctions();expireOffers();
  if(state.route==='auction'){
    const id=state.selectedAuction,a=auction(id);
    if(!a){route('explore');return}
    if(a.endsAt<=now()){resolveExpiredAuctions();state.route='explore';render();return}
    const timer=document.getElementById('auctionTimer');if(timer)timer.textContent=formatTime(remainingMs(id));
    const screen=document.querySelector('[data-auction-screen]');
    if(screen){
      const ext=screen.querySelector('.extension');
      const x=item(id),rem=remainingMs(id);
      if(ext)ext.textContent=x.auctionType==='ELASTIC'&&rem<=30000?`ELASTIC • extension zone • ${formatTime(rem)} remaining`:'';
      const current=screen.querySelector('.bid-box:nth-child(2) .value');if(current)current.textContent=money(a.currentBid);
    }
  }else{
    document.querySelectorAll('.time').forEach(el=>{
      const id=el.closest('[data-item]')?.dataset.item;if(id&&isLiveAuction(item(id)))el.textContent=formatTime(remainingMs(id));
    });
  }
  state.lastTick=now();save();
},50);

render();
</script>
</body>
</html>
