    const remainingMs=Math.max(0,(Number(x.endsAt)||0)-now);
    const secondsTotal=Math.floor(remainingMs/1000);
    const mins=Math.floor(secondsTotal/60);
    const secs=secondsTotal%60;
    const displayTime=`${mins}:${secs<10?'0':''}${secs}`;
    element.textContent=remainingMs>0?displayTime:'ENDED';
  });
  const auction=document.getElementById('auctionTimer');
  if(auction){
    const x=state.page==='auction'?item(state.activeItem):null;
    if(x){
      const remainingMs=Math.max(0,(Number(x.endsAt)||0)-now);
      const secondsTotal=Math.floor(remainingMs/1000);
      const mins=Math.floor(secondsTotal/60);
      const secs=secondsTotal%60;
      auction.textContent=remainingMs>0?`${mins}:${secs<10?'0':''}${secs}`:'ENDED';
    }
  }
}

function itemCard(x){
  if(!x||x.sold)return '';
  const auction=x.method==='auction';
  if(auction&&x.status!=='Live')return '';
  const title=fullItemTitle(x);
  const method=auction?'AUCTION':'BUY NOW';
  return `<article class="card itemcard"><div class="itemimg clickable" onclick="openItem('${x.id}');return false">${img(x)}</div><div class="itembody"><span class="ruSelling">${method}</span><div class="ruTitle clickable" onclick="openItem('${x.id}');return false">${esc(title)}</div><div class="ruPrice">${money(auction?x.current:x.price)}</div><div class="ruMeta">${auction?`<span data-item-timer="${x.id}">${fmt(secondsLeft(x))}</span> remaining`:'Available now'}</div><div class="ruActions">${auction?`<button class="primary" onclick="openAuction('${x.id}')">View Auction</button>`:`<button class="primary" onclick="addToCart('${x.id}')">Buy Now</button><button class="secondary" onclick="makeOffer('${x.id}')">Offer</button>`}</div></div></article>`;
}
function buildConsignmentTitle(data={}){
  const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
  const number=clean(data.cardNumber).replace(/^#/,'');
  let grade=clean(data.grade),grader=clean(data.grader);
  if(data.condition==='Graded'||grader||grade){
    grader=grader||graderFromGrade(grade);
    if(grader)grade=clean(grade.replace(new RegExp('^'+grader+'\\s*','i'),'')).trim();
  }else{
    grade='';grader='';
  }
  return [
    clean(data.year),
    clean(data.category),
    clean(data.setName),
    clean(data.variant),
    clean(data.cardName),
    number?`#${number}`:'',
    grader,
    grade
  ].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
}

function fullItemTitle(x){return x.fullName||`${x.year||inferYear(x)} Pokemon ${x.set||''} ${x.variant||''} ${x.name||''}${isGraded(x)?` ${x.grader||graderFromGrade(x.grade)||''} ${x.grade||''}`:''}`.replace(/\s+/g,' ').trim();}
function inferYear(x){const m=String(x.name||'').match(/\b(19|20)\d{2}\b/);return m?m[0]:'';}
function isGraded(x){return /\b(PSA|CGC|BGS|SGC|TAG|GEM|NM|MT)\b/i.test(String(x.grade||''))||!!x.grader;}
function graderFromGrade(g){const m=String(g||'').match(/\b(PSA|CGC|BGS|SGC|TAG)\b/i);return m?m[1].toUpperCase():'';}

function calculateNewEndTime(currentEndTimeMs, bidTimestampMs, extensionWindowSeconds = 15, extensionDurationSeconds = 15) {
  const timeRemainingMs = currentEndTimeMs - bidTimestampMs;
  const windowMs = extensionWindowSeconds * 1000;
  const extensionMs = extensionDurationSeconds * 1000;

  // If bid arrives within the extension window, extend from the current end time
  // (or current time + extension duration).
  if (timeRemainingMs > 0 && timeRemainingMs <= windowMs) {
    return Math.max(currentEndTimeMs + extensionMs, bidTimestampMs + extensionMs);
  }
  return currentEndTimeMs;
}

function initElasticState(auction){
  if(!auction.elastic){
    auction.elastic={
      usedIntegers:[],
      coefficient:0.2,
      cycleStartInt:null,
      lastInt:null
    };
  }
}
function updateElasticClock(auction,currentSecondsLeft){
  if(auction.auctionType!=='ELASTIC'||currentSecondsLeft<=0)return;
  initElasticState(auction);
  const currentInt=Math.floor(currentSecondsLeft);
  const state=auction.elastic;
  if(state.lastInt!==null&&currentInt<state.lastInt){
    if(state.cycleStartInt!==null&&currentInt<state.cycleStartInt){
      state.usedIntegers=[];
      state.coefficient=0.2;
      state.cycleStartInt=null;
    }
  }
  state.lastInt=currentInt;
}
function calculateElasticExtension(auction,currentSecondsLeft){
  if(auction.auctionType!=='ELASTIC'||currentSecondsLeft>30||currentSecondsLeft<=0)return {canExtend:false,extensionSeconds:0};
  initElasticState(auction);
  const currentInt=Math.floor(currentSecondsLeft);
  const state=auction.elastic;
  const mirrorInt=30-currentInt;
  const extensionSeconds=mirrorInt*state.coefficient;
  return {canExtend:extensionSeconds>0,extensionSeconds:extensionSeconds,currentInt:currentInt,appliedCoefficient:state.coefficient};
}
function applyElasticBid(auction,currentSecondsLeft){
  const preview=calculateElasticExtension(auction,currentSecondsLeft);
  if(!preview.canExtend)return 0;
  const state=auction.elastic;
  const addedMs=preview.extensionSeconds*1000;
  auction.endsAt+=addedMs;
  if(!state.usedIntegers.includes(preview.currentInt))state.usedIntegers.push(preview.currentInt);
  if(state.cycleStartInt===null)state.cycleStartInt=preview.currentInt;
  state.coefficient=state.coefficient/2;
  return preview.extensionSeconds;
}
function elasticPreview(x){
  if(!x||x.auctionType!=='ELASTIC')return {active:false};
  const remaining=secondsLeft(x),result=calculateElasticExtension(x,remaining);
  const state=x.auction?.elastic;
  if(!result.canExtend)return {active:false,remaining,whole:Math.floor(remaining),subsequent:Math.max(0,Math.floor(remaining)-1),mirrored:30-Math.floor(remaining),coef:state?.coefficient??.2,nextCoef:state?.coefficient??.2,extension:0,used:false,cycleStart:state?.cycleStartInt??null};
  const used=state.usedIntegers.includes(result.currentInt);
  return {active:true,remaining,whole:result.currentInt,subsequent:Math.max(0,result.currentInt-1),mirrored:30-result.currentInt,coef:result.appliedCoefficient,nextCoef:result.appliedCoefficient/2,extension:used?0:result.extensionSeconds,used,cycleStart:state.cycleStartInt,newCycle:state.cycleStartInt===null};
}

let swipeState=null;
function startSwipe(e,id){
  const el=document.getElementById('swipeBidControl');if(!el)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();el.setPointerCapture?.(e.pointerId);el.classList.add('dragging');
  swipeState={id,pointerId:e.pointerId,startX:e.clientX,currentX:e.clientX,completed:false};
}
function moveSwipe(e){
  if(!swipeState||e.pointerId!==swipeState.pointerId)return;
  e.preventDefault();swipeState.currentX=e.clientX;
  const el=document.getElementById('swipeBidControl'),thumb=document.getElementById('swipeThumb'),bar=document.getElementById('swipeProgress');if(!el||!thumb)return;
  const max=Math.max(1,el.clientWidth-thumb.offsetWidth-10),dx=Math.max(0,Math.min(max,e.clientX-swipeState.startX)),pct=dx/max;
  thumb.style.transform=`translateX(${dx}px)`;if(bar)bar.style.width=`${Math.round(pct*100)}%`;
  swipeState.completed=pct>=.82;
}
function resetSwipe(){const el=document.getElementById('swipeBidControl'),thumb=document.getElementById('swipeThumb'),bar=document.getElementById('swipeProgress');if(el)el.classList.remove('dragging');if(thumb)thumb.style.transform='translateX(0)';if(bar)bar.style.width='0';swipeState=null;}
function endSwipe(e,id){
  if(!swipeState||swipeState.id!==id||e.pointerId!==swipeState.pointerId)return;
  const complete=swipeState.completed;try{document.getElementById('swipeBidControl')?.releasePointerCapture?.(e.pointerId)}catch(_){ }
  if(!complete){resetSwipe();return setToast('Swipe farther to submit the bid.');}
  resetSwipe();
  const x=item(id);if(!x||x.sold||x.status!=='Live')return setToast('Only the active auction can receive bids.');
  submitBid(id,minBid(x),{buyer:'You'});
}
function cancelSwipe(e){if(swipeState&&e.pointerId===swipeState.pointerId)resetSwipe();}

function submitBid(id,amount,opts={}){
  const x=item(id);
  if(!marketplaceWindow().isOpen)return setToast('Public bidding is closed until the next marketplace opening.'),false;
  if(!x||x.sold||x.status!=='Live')return false;
  const minimum=minBid(x);
  if(!Number.isFinite(amount)||amount<minimum)return setToast(`Minimum bid is ${money(minimum)}.`),false;
  const before=secondsLeft(x);
  if(before<=0){tick();return setToast('This auction has ended.'),false;}
  const bidTimestampMs=Date.now();
  const buyer=opts.buyer||'You';
  const bid={id:'bid'+bidTimestampMs+Math.random(),item:id,amount,created:bidTimestampMs,buyer};
  x.current=amount;
  x.bidCount=(Number(x.bidCount)||0)+1;
  state.bids.push(bid);
  if(x.auctionType==='ELASTIC'&&before>0&&before<=30){
    applyElasticBid(x,before);
  }else{
    x.endsAt=calculateNewEndTime(Number(x.endsAt)||0,bidTimestampMs,15,15);
  }
  if(buyer!=='You')resolveProxyForIncomingBid(x);
  save();
  render();
  if(buyer==='You')setToast(`Bid accepted at ${money(amount)}.`);
  return true;
}

function minBid(x){return (Number(x?.current)||0)+1}

function placeBid(id){const input=document.getElementById('bidInput');submitBid(id,Number(input?.value),{buyer:'You'});}

  <button class="primary" style="width:100%;margin-top:12px" onclick="submitCustomBid('${id}')">SET PROXY BID</button></div>`;
}

function submitCustomBid(id){
  const max=Number(document.getElementById('customBidInput')?.value);
  const increment=Number(document.getElementById('proxyIncrement')?.value)||1;
  const x=item(id);if(!x)return;
  const minimum=minBid(x);
  if(!Number.isFinite(max)||max<minimum)return setToast(`Maximum must be at least ${money(minimum)}.`);
  const opening=Math.min(max,minimum);
  if(!submitBid(id,opening,{buyer:'You',proxyOpening:true}))return;
  state.proxyBids=state.proxyBids||{};
  state.proxyBids[id]={item:id,buyer:'You',max,increment,created:Date.now(),active:true};
  closeModal();
  activity(`Proxy bid active through ${money(max)} with a ${money(increment)} increment.`);
}

function resolveProxyForIncomingBid(x){
  const p=(state.proxyBids||{})[x.id];
  if(!p||!p.active||p.buyer!=='You')return;
  if(x.current>=p.max){p.active=false;return;}
  const response=Math.min(p.max,x.current+p.increment);
  if(response<=x.current){p.active=false;return;}
  // Record the proxy response without recursively invoking proxy resolution.
  const before=secondsLeft(x);
  x.current=response;x.bidCount=(Number(x.bidCount)||0)+1;
  state.bids.push({id:'proxy'+Date.now()+Math.random(),item:x.id,amount:response,created:Date.now(),buyer:'You',proxy:true});
  if(x.auctionType==='ELASTIC'&&before>0&&before<=30)applyElasticBid(x,before);
  if(response>=p.max)p.active=false;
}

}

function sellerOfferGroup(id){const x=item(id),os=activeOffers(id);if(!x||!os.length)return '';const hi=Math.max(...os.map(o=>o.amount)),lo=Math.min(...os.map(o=>o.amount));return `<div class="offerCard" style="margin-bottom:13px"><div class="row"><div><div class="eyebrow">${x.method==='buy'?'BUY NOW':'AUCTION'}</div><h3 style="margin:5px 0">${esc(x.name)}</h3></div><span class="pill">${os.length} active offers</span></div><div class="offerGrid"><div class="offerStat"><span class="tiny muted">Highest</span><b>${money(hi)}</b></div><div class="offerStat"><span class="tiny muted">Average</span><b>${money(os.reduce((a,o)=>a+o.amount,0)/os.length)}</b></div><div class="offerStat"><span class="tiny muted">Range</span><b>${money(lo)}–${money(hi)}</b></div><div class="offerStat"><span class="tiny muted">Expires</span><b>${Math.max(0,Math.ceil((Math.min(...os.map(o=>o.expires))-Date.now())/3600000))}h</b></div></div><div class="offerList">${os.map((o,i)=>`<div class="offerRow"><div><b>${money(o.amount)}</b><div class="tiny muted">Offer ${i+1} · age ${Math.max(0,Math.floor((Date.now()-o.created)/3600000))}h · expires ${new Date(o.expires).toLocaleString()}</div></div><div class="actions"><button class="primary" onclick="acceptOffer('${o.id}')">Accept</button><button class="secondary" onclick="ignoreOffer('${o.id}')">Ignore</button></div></div>`).join('')}</div><div class="actions" style="margin-top:13px"><button class="primary" onclick="counterAll('${x.id}')">Counter All</button><button class="secondary" onclick="openModal('method','${x.id}')">Change selling method</button></div></div>`}
function acceptOffer(oid){const o=state.offers.find(x=>x.id===oid);if(!o||o.status!=='active')return setToast('Offer is no longer active.');const x=item(o.item);if(!x||x.sold)return setToast('Inventory has already transacted.');o.status='accepted';x.sold=true;x.status='Sold';state.offers.filter(a=>a.item===x.id&&a.status==='active').forEach(a=>a.status='unavailable');state.won.push({item:x.id,price:o.amount,source:'Seller accepted offer',date:Date.now()});notify(`Your offer on ${x.name} was accepted at ${money(o.amount)}.`,'won',x.id,'OFFER ACCEPTED');save();activity(`Offer accepted at ${money(o.amount)}.`)}
function ignoreOffer(oid){const o=state.offers.find(x=>x.id===oid);if(!o||o.status!=='active')return;o.status='ignored';save();activity('Offer ignored; inventory remains available.');}
function changeMethod(id){openModal('method',id)}
function methodModal(id){const x=item(id);if(!x)return '';const current=x.method==='buy'?'BUY NOW':(x.privateAuction?.active?'PRIVATE AUCTION':'PUBLIC AUCTION');return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLING METHOD</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="methodBox current"><div class="eyebrow">CURRENT METHOD</div><b>${current}</b><p class="tiny muted">Choose a new selling state explicitly. RapidUp will update the inventory object rather than merely showing a suggestion.</p></div><div class="sectionhead"><h3>Available methods</h3></div><div class="methodGrid"><button class="methodOption ${x.method==='buy'?'current':''}" onclick="convertMethod('${id}','buy')"><b>BUY NOW</b><span class="tiny muted">Immediate execution at a listed price.</span></button><button class="methodOption ${x.method==='auction'&&!x.privateAuction?.active?'current':''}" onclick="convertMethod('${id}','auction')"><b>PUBLIC AUCTION</b><span class="tiny muted">Move into a specialized public channel.</span></button><button class="methodOption ${x.privateAuction?.active?'current':''}" onclick="startPrivateFromMethod('${id}')"><b>PRIVATE AUCTION</b><span class="tiny muted">Demand-based response to active committed offers.</span></button></div><div class="notice" style="margin-top:13px"><b>What will happen?</b><br>${x.method==='buy'?'Changing away from Buy Now removes immediate purchase availability until you return it.':'Changing to Buy Now makes the listed price immediately executable.'} Public auction uses the minimum 3:05 lifecycle. Private Auction requires active demonstrated demand.</div></div>`}
function updateItem(itemId,newAttrs={}){
 const x=item(itemId);if(!x)return null;
 x.internal=x.internal||{};
 const sellerFields=['auctionType','startingPrice','presentation'];
 Object.keys(newAttrs).forEach(k=>{
  const v=newAttrs[k];
  x[k]=v;
  if(['category','year','era','condition','language','variant','presentation','auctionType','startingPrice'].includes(k))x.internal[k]=v;
  if(k==='method'){x.method=v;x.type=v==='auction'?'Auction':'Buy Now';}
 });
 if(x.method==='auction'){
  const result=evaluateAndEnqueue(x);
  if(result){x.status='Auction queue';x.endsAt=0;}
 }else{
  ensureQueueState(state);channels.forEach(c=>state.channelQueues[c.id]=(state.channelQueues[c.id]||[]).filter(id=>id!==x.id));x.channel=null;x.channelId=null;x.endsAt=0;x.status='Available now';
 }
 normalizeAuctions(state);save();render();return x;
}
function convertMethod(id,method){const x=item(id);if(!x||x.sold)return;if(method==='buy'){x.method='buy';x.type='Buy Now';x.privateAuction=null;x.price=Math.max(1,Number(x.price||x.current||x.market||1));x.endsAt=0;x.status='Available now';removeItemFromQueues(x.id,state);x.channel=null;x.channelId=null;}else if(method==='auction'){x.method='auction';x.type='Auction';x.privateAuction=null;x.current=Math.max(1,Number(x.current||1));x.bidCount=0;const result=evaluateAndEnqueue(x);if(result){x.status='Auction queue';x.endsAt=0;}}normalizeAuctions(state);save();closeModal();activity(`${x.name} moved to ${method==='buy'?'BUY NOW':'PUBLIC AUCTION'}.`)}
function startPrivateFromMethod(id){const os=activeOffers(id);if(!os.length)return setToast('Private Auction requires active committed demand.');counterAll(id)}
function counterAll(id){const os=activeOffers(id);if(!os.length)return setToast('No active committed demand to counter.');const high=Math.max(...os.map(o=>o.amount));const current=Math.max(high+25,Math.ceil(high*1.12));state.privateAuctions[id]={active:true,item:id,current,previousSellerCounter:null,deadline:Date.now()+120000,wave:1,participants:os.length,responses:os.map(o=>({offerId:o.id,amount:o.amount,engaged:true,buyer:o.buyer})),history:[{wave:1,seller:current,responses:os.map(o=>o.amount)}]};const x=item(id);x.privateAuction={active:true};notify(`Seller opened a demand-based private auction on ${x.name}.`,'private',id,'PRIVATE AUCTION');save();openModal('privateSeller',id)}
function privateBuyer(id){let p=state.privateAuctions[id],x=item(id);if(!p||!p.active)return `<div class="modal"><div class="modalHead"><h2>Private auction closed</h2><button class="close" onclick="closeModal()">×</button></div><div class="empty">This negotiation is no longer active.</div></div>`;const mine=p.responses.find(r=>r.buyer==='You');const myAmount=mine?.amount||myOffer(id)?.amount||0;return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">DEMAND-BASED PRIVATE AUCTION</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">This private auction exists because committed demand already existed and the seller chose to respond. You see only your relationship with the seller.</div><div class="privateStage"><div class="eyebrow">CURRENT SELLER COUNTER</div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">Wave ${p.wave} · respond by ${new Date(p.deadline).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}</div><div class="bar" style="margin-top:12px"><span id="privateBuyerBar" style="width:100%"></span></div></div><div class="card" style="margin-top:12px"><div class="eyebrow">YOUR CURRENT OFFER</div><div class="big">${money(myAmount)}</div><input id="privateInput" class="input" type="number" min="1" placeholder="Your counter" style="margin:10px 0"><div class="actions"><button class="primary" onclick="privateAccept('${id}')">Accept ${money(p.current)}</button><button class="secondary" onclick="privateCounter('${id}')">Counter</button><button class="secondary" onclick="privateExit('${id}')">Exit</button></div></div><div class="privacyNote" style="margin-top:12px">Other participants may exist, but their prices, identities and aggregate responses are intentionally invisible to you.</div></div>`}
function privateAccept(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active||x?.sold)return setToast('This private auction is closed.');p.active=false;x.sold=true;x.status='Sold';x.privateAuction={active:false};state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');state.won.push({item:id,price:p.current,source:'Private Auction',date:Date.now()});notify(`You accepted the seller counter on ${x.name} at ${money(p.current)}.`,'won',id,'PRIVATE AUCTION WON');save();closeModal();activity(`Private auction accepted at ${money(p.current)}.`)}
function privateCounter(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active)return;const amount=Number(document.getElementById('privateInput')?.value);if(!amount||amount<=0)return setToast('Enter a valid counter amount.');let mine=p.responses.find(r=>r.buyer==='You');if(!mine){mine={buyer:'You',amount,engaged:true,offerId:null};p.responses.push(mine);p.participants=(p.participants||0)+1}else{mine.amount=amount;mine.engaged=true}state.offers.push({id:'o'+Date.now(),item:id,buyer:'You',amount,status:'active',created:Date.now(),expires:Date.now()+86400000,wave:p.wave});p.deadline=Date.now()+120000;p.history.push({wave:p.wave,buyer:amount});save();openModal('privateBuyer',id)}
function privateExit(id){const p=state.privateAuctions[id];if(p){const mine=p.responses.find(r=>r.buyer==='You');if(mine)mine.engaged=false;save()}closeModal();activity('You exited this private auction wave.');}
function privateSeller(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active)return `<div class="modal"><div class="modalHead"><h2>Private auction closed</h2><button class="close" onclick="closeModal()">×</button></div></div>`;const responses=p.responses.filter(r=>r.engaged);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLER HUB · PRIVATE AUCTION</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>Demand-based only.</b> This market exists because active committed offers were already present. Buyers never see this aggregate seller surface.</div><div class="privateStage"><div class="eyebrow">CURRENT PARTICIPATION PRICE</div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">${responses.length} active participants · Wave ${p.wave} · response deadline ${new Date(p.deadline).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}</div></div><div class="sectionhead"><h2>Aggregate responses</h2><span class="muted">Seller only</span></div><div class="responseGrid">${responses.map((r,i)=>`<div class="response"><div class="tiny muted">Participant ${i+1}</div><b>${money(r.amount)}</b><div class="tiny muted">${r.engaged?'engaged':'inactive'}</div></div>`).join('')||'<div class="empty">No active responses.</div>'}</div><div class="actions" style="margin-top:16px"><button class="primary" onclick="sellerAcceptHighest('${id}')">Accept highest</button><button class="secondary" onclick="sellerWave('${id}')">Counter all</button><button class="danger" onclick="endPrivate('${id}')">End private auction</button><button class="secondary" onclick="openModal('method','${id}')">Change selling method</button></div><div class="tiny muted" style="margin-top:13px">Every wave has a finite response period. Buyers who do not engage cease participating in that wave. There is no fixed maximum number of waves.</div></div>`}
function sellerAcceptHighest(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active||!p.responses.length)return;const eligible=p.responses.filter(r=>r.engaged);if(!eligible.length)return setToast('No participating responses to accept.');const high=Math.max(...eligible.map(r=>r.amount));p.active=false;x.sold=true;x.status='Sold';x.privateAuction={active:false};state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');state.won.push({item:id,price:high,source:'Private Auction',date:Date.now()});notify(`Private auction completed on ${x.name}.`,'won',id,'PRIVATE AUCTION COMPLETE');save();closeModal();activity(`Private auction completed at ${money(high)}.`)}
function sellerWave(id){const p=state.privateAuctions[id];if(!p?.active)return;const eligible=p.responses.filter(r=>r.engaged);if(!eligible.length)return setToast('No active participants remain.');const next=Math.max(p.current-5,Math.ceil(p.current*.96));p.previousSellerCounter=p.current;p.current=next;p.wave++;p.deadline=Date.now()+120000;p.responses=p.responses.map(r=>({...r,engaged:r.engaged}));p.history.push({wave:p.wave,seller:next,responses:p.responses.filter(r=>r.engaged).map(r=>r.amount)});save();openModal('privateSeller',id)}
function endPrivate(id){const p=state.privateAuctions[id],x=item(id);if(p)p.active=false;if(x)x.privateAuction={active:false};save();closeModal();activity('Private auction ended by seller. Inventory remains under seller control.')}
function sellerPrivateAuctions(){const ps=Object.entries(state.privateAuctions).filter(([id,p])=>p.active);return `<div class="sectionhead"><div><h2>Demand-based Private Auctions</h2><div class="tiny muted">Private negotiations exist only where demonstrated demand is active.</div></div></div>${ps.length?ps.map(([id,p])=>{const x=item(id),rs=p.responses.filter(r=>r.engaged);return `<div class="offerCard" style="margin-bottom:12px"><div class="row"><div><div class="eyebrow">WAVE ${p.wave}</div><h3>${esc(x.name)}</h3></div><span class="pill">${rs.length} participants</span></div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">Current participation price · deadline ${new Date(p.deadline).toLocaleTimeString()}</div><button class="primary" style="margin-top:12px" onclick="openModal('privateSeller','${id}')">Open private auction</button></div>`}).join(''):'<div class="empty">No active Private Auctions. Counter a group of active offers to begin one.</div>'}`}

let consignmentCache={
  cards:[],
  searchResults:[],
  selectedPokemon:'',
  selectedSet:'',
  selectedCard:'',
  selectedVariant:'',
  activeField:'',
  requestToken:0,
  loading:false
};

function setConsignmentStatus(text,error=false){
  const el=document.getElementById('consignStatus');
  if(el){
    el.textContent=text;
    el.className=error?'warning tiny':'tiny muted';
  }
}

function normalizePokemonCard(card){
  const releaseDate=card?.set?.releaseDate||'';
  const releaseYear=releaseDate?parseInt(releaseDate.slice(0,4),10):null;

  return {
    id:card?.id||'',
    cardName:card?.name||'',
    cardNumber:card?.number||'',
    setId:card?.set?.id||'',
    setName:card?.set?.name||'',
    releaseYear:Number.isFinite(releaseYear)?releaseYear:null,
    pokemon:card?.name||'',
    images:card?.images||{},
    variants:typeof getPokemonCardVariants==='function'
      ? getPokemonCardVariants(card)
      : [],
    raw:card
  };
}

function uniqueConsignmentCards(cards){
  return [...new Map(
    cards
      .map(normalizePokemonCard)
      .filter(x=>x.id&&x.cardName&&x.setName)
      .map(x=>[x.id,x])
  ).values()];
}

function selectedConsignmentCard(){
  return consignmentCache.searchResults.find(
    x=>x.id===consignmentCache.selectedCard
  )||consignmentCache.cards.find(
    x=>x.id===consignmentCache.selectedCard
  )||null;
}

function closeConsignmentSuggestions(){
  document.querySelectorAll('.consignSuggestions').forEach(x=>x.hidden=true);
}

function suggestionElementId(field){
  return `consign${field.charAt(0).toUpperCase()+field.slice(1)}Suggestions`;
}

function fieldInputId(field){
  return `consign${field.charAt(0).toUpperCase()+field.slice(1)}`;
}

function consignmentFieldValue(field){
  return document.getElementById(fieldInputId(field))?.value.trim()||'';
}

function openConsignmentSuggestions(field){
  consignmentCache.activeField=field;
  renderConsignmentSuggestions(field);

  const el=document.getElementById(suggestionElementId(field));
  if(el)el.hidden=false;
}

function activeConsignmentCards(){
  let cards=consignmentCache.searchResults.slice();

  const p=consignmentCache.selectedPokemon.trim().toLowerCase();
  const s=consignmentCache.selectedSet.trim().toLowerCase();
  const v=consignmentCache.selectedVariant.trim().toLowerCase();

  if(p){
    cards=cards.filter(x=>
      x.cardName.toLowerCase().includes(p)
    );
  }

  if(s){
    cards=cards.filter(x=>
      x.setName.toLowerCase().includes(s)||
      x.setId.toLowerCase()===s
    );
  }

  if(v){
    cards=cards.filter(x=>
      (x.variants||[]).some(
        value=>String(value).toLowerCase().includes(v)
      )
    );
  }

  return cards;
}

function localConsignmentOptions(field){
  const cards=activeConsignmentCards();

  if(field==='pokemon'){
    return [...new Set(
      cards.map(x=>x.cardName).filter(Boolean)
    )]
    .sort((a,b)=>a.localeCompare(b))
    .map(value=>({value,label:value}));
  }

  if(field==='set'){
    const map=new Map();

    cards.forEach(x=>{
      if(x.setName&&!map.has(x.setId||x.setName)){
        map.set(
          x.setId||x.setName,
          {
            value:x.setName,
            label:x.setName,
            sub:x.releaseYear?String(x.releaseYear):''
          }
        );
      }
    });

    return [...map.values()]
      .sort((a,b)=>a.label.localeCompare(b.label));
  }

  if(field==='card'){
    return cards.map(x=>({
      value:x.id,
      label:`${x.cardName} #${x.cardNumber}`,
      sub:x.setName
    }));
  }

  if(field==='variant'){
    const values=new Set();

    cards.forEach(x=>{
      (x.variants||[]).forEach(v=>{
        if(v)values.add(v);
      });
    });

    return [...values]
      .sort()
      .map(value=>({value,label:value}));
  }

  return [];
}

function renderConsignmentSuggestions(field){
  const el=document.getElementById(
    suggestionElementId(field)
  );

  if(!el)return;

  const q=consignmentFieldValue(field).toLowerCase();

  let options=localConsignmentOptions(field);

  if(q){
    options=options.filter(o=>
      `${o.label} ${o.sub||''} ${o.value}`
        .toLowerCase()
        .includes(q)
    );
  }

  options=options.slice(0,60);

  if(!options.length){
    el.innerHTML='<div class="consignLoading">No matching selections yet.</div>';
    el._options=[];
    return;
  }

  el._options=options;

  el.innerHTML=options.map(
    (o,i)=>
      `<button type="button" class="consignOption" onclick="selectConsignmentOption('${field}',${i})">
        <b>${esc(o.label)}</b>
        ${o.sub?`<small>${esc(o.sub)}</small>`:''}
      </button>`
  ).join('');
}

function selectConsignmentOption(field,index){
  const input=document.getElementById(fieldInputId(field));
  const box=document.getElementById(suggestionElementId(field));

  const options=box?box._options||[]:[];
  const option=options[index];

  if(!input||!option)return;

  if(field==='card'){
    input.value=option.label;
    consignmentCache.selectedCard=option.value;

    const card=consignmentCache.searchResults.find(
      x=>x.id===option.value
    );

    if(card){
      consignmentCache.selectedPokemon=card.cardName;
      consignmentCache.selectedSet=card.setName;

      document.getElementById('consignPokemon').value=
        card.cardName;

      document.getElementById('consignSet').value=
        card.setName;

      populateConsignmentVariants(card);
    }
  }

  if(field==='pokemon'){
    input.value=option.value;
    consignmentCache.selectedPokemon=option.value;
  }

  if(field==='set'){
    input.value=option.value;
    consignmentCache.selectedSet=option.value;
  }

  if(field==='variant'){
    input.value=option.value;
    consignmentCache.selectedVariant=option.value;
  }

  closeConsignmentSuggestions();
  applyConsignmentFilters(field);

  if(field==='card'){
    const card=selectedConsignmentCard();
    if(card)populateConsignmentVariants(card);
  }

  updateConsignmentPreview();
}

function populateConsignmentVariants(card){
  const input=document.getElementById('consignVariant');
  const box=document.getElementById('consignVariantSuggestions');

  if(!input)return;

  const variants=[
    ...new Set(
      (card?.variants||[]).filter(Boolean)
    )
  ];

  if(box){
    box._options=variants.map(
      value=>({value,label:value})
    );

    box.innerHTML=box._options.map(
      (o,i)=>
        `<button type="button" class="consignOption" onclick="selectConsignmentOption('variant',${i})">
          <b>${esc(o.label)}</b>
        </button>`
    ).join('');
  }

  input.disabled=false;
}

function populateConsignmentCards(cards){
  consignmentCache.cards=cards;

  const input=document.getElementById('consignCard');

  if(input)input.disabled=false;

  renderConsignmentSuggestions('card');
}

function applyConsignmentFilters(changedField){
  const cards=activeConsignmentCards();

  consignmentCache.cards=cards;

  renderConsignmentSuggestions('pokemon');
  renderConsignmentSuggestions('set');
  renderConsignmentSuggestions('card');
  renderConsignmentSuggestions('variant');

  const current=selectedConsignmentCard();

  if(!current&&changedField!=='card'){
    consignmentCache.selectedCard='';
    const card=document.getElementById('consignCard');
    if(card)card.value='';
  }

  if(current){
    populateConsignmentVariants(current);
  }

  renderConsignmentSuggestions(
    consignmentCache.activeField
  );

  setConsignmentStatus(
    `${cards.length} matching card${cards.length===1?'':'s'} available.`
  );

  updateConsignmentPreview();
}

async function fetchConsignmentCardsByField(field,value){
  const q=String(value||'').trim();
  if(!q)return[];

  if(typeof window.searchPokemonCards!=='function'){
    throw new Error('Pokémon TCG search client is not available.');
  }

  const minLength=Number(window.POKEMON_TCG_MIN_SEARCH_LENGTH)||3;

  if(field==='variant')return[];

  // Under the threshold we deliberately avoid network traffic.
  // The API client may still return anything already cached in memory.
  if(q.length<minLength){
    if(field==='pokemon')return await window.searchPokemonCards(q);
    if(field==='set')return await window.searchPokemonCards({set:q});
    if(field==='card')return await window.searchPokemonCards({card:q});
    return[];
  }

  if(field==='pokemon')return await window.searchPokemonCards(q);
  if(field==='set')return await window.searchPokemonCards({set:q});
  if(field==='card')return await window.searchPokemonCards({card:q});
  return[];
}
let consignmentDebounce=null;

function scheduleConsignmentLookup(field,value){
  clearTimeout(consignmentDebounce);

  const q=String(value||'').trim();

  if(!q){
    if(field==='pokemon')
      consignmentCache.selectedPokemon='';

    if(field==='set')
      consignmentCache.selectedSet='';

    if(field==='card'){
      consignmentCache.selectedCard='';
      consignmentCache.selectedVariant='';
    }

    if(field==='variant')
      consignmentCache.selectedVariant='';

    applyConsignmentFilters(field);
    return;
  }

  const minLength=
    Number(window.POKEMON_TCG_MIN_SEARCH_LENGTH)||3;

  /*
   * Below the threshold, update only from local memory. No
   * outbound API lookup is scheduled.
   */
  if(q.length<minLength){
    applyConsignmentFilters(field);
    renderConsignmentSuggestions(field);
    setConsignmentStatus(
      `Type ${minLength} characters to search the Pokémon TCG database.`
    );
    return;
  }

  consignmentDebounce=setTimeout(
    ()=>lookupConsignmentField(field,q),
    250
  );
}

async function lookupConsignmentField(field,value){
  const token=++consignmentCache.requestToken;

  consignmentCache.loading=true;

  setConsignmentStatus(
    `Searching Pokémon TCG database for “${value}”…`
  );

  try{
    const results=uniqueConsignmentCards(
      await fetchConsignmentCardsByField(field,value)
    );

    if(token!==consignmentCache.requestToken)return;

    consignmentCache.searchResults=results;
    consignmentCache.cards=results;

    if(field==='pokemon')
      consignmentCache.selectedPokemon=value;

    if(field==='set')
      consignmentCache.selectedSet=value;

    if(field==='card'){
      const clean=value.replace(/^#/,'').toLowerCase();

      const match=
        results.find(
          x=>x.id.toLowerCase()===value.toLowerCase()
        )||
        results.find(
          x=>
            `${x.cardName} #${x.cardNumber}`
              .toLowerCase()===value.toLowerCase()
        )||
        results.find(
          x=>
            x.cardName.toLowerCase().includes(
              value.toLowerCase()
            )||
            x.cardNumber.toLowerCase()===clean
        );

      if(match){
        consignmentCache.selectedCard=match.id;
        consignmentCache.selectedPokemon=match.cardName;
        consignmentCache.selectedSet=match.setName;

        document.getElementById('consignCard').value=
          `${match.cardName} #${match.cardNumber}`;

        document.getElementById('consignPokemon').value=
          match.cardName;

        document.getElementById('consignSet').value=
          match.setName;

        populateConsignmentVariants(match);
      }
    }

    applyConsignmentFilters(field);

    renderConsignmentSuggestions(field);

    const box=document.getElementById(
      suggestionElementId(field)
    );

    if(box)box.hidden=false;

    setConsignmentStatus(
      results.length
        ? `${results.length} matching card${results.length===1?'':'s'} found. Select a result or refine another field.`
        : 'No matching Pokémon cards found.',
      !results.length
    );

  }catch(error){
    if(token!==consignmentCache.requestToken)return;

    console.error(
      'RapidUp Pokémon lookup failed:',
      error
    );

    setConsignmentStatus(
      'Unable to reach the Pokémon TCG database. Please try again.',
      true
    );

  }finally{
    if(token===consignmentCache.requestToken)
      consignmentCache.loading=false;
  }
}

function consignmentPokemonChanged(value){
  consignmentCache.selectedPokemon=value||'';
  consignmentCache.selectedCard='';
  consignmentCache.selectedVariant='';

  document.getElementById('consignCard').value='';
  document.getElementById('consignVariant').value='';

  scheduleConsignmentLookup('pokemon',value);
  openConsignmentSuggestions('pokemon');
  updateConsignmentPreview();
}

function consignmentSetChanged(value){
  consignmentCache.selectedSet=value||'';
  consignmentCache.selectedCard='';
  consignmentCache.selectedVariant='';

  document.getElementById('consignCard').value='';
  document.getElementById('consignVariant').value='';

  scheduleConsignmentLookup('set',value);
  openConsignmentSuggestions('set');
  updateConsignmentPreview();
}

function consignmentCardChanged(value){
  const v=(value||'').trim();

  const exact=consignmentCache.searchResults.find(
    x=>x.id===v
  );

  if(exact){
    consignmentCache.selectedCard=exact.id;
    populateConsignmentVariants(exact);
    updateConsignmentPreview();
    closeConsignmentSuggestions();
    return;
  }

  const labelMatch=consignmentCache.searchResults.find(
    x=>
      `${x.cardName} #${x.cardNumber}`
        .toLowerCase()===v.toLowerCase()
  );

  if(labelMatch){
    consignmentCache.selectedCard=labelMatch.id;
    consignmentCache.selectedPokemon=labelMatch.cardName;
    consignmentCache.selectedSet=labelMatch.setName;

    document.getElementById('consignPokemon').value=
      labelMatch.cardName;

    document.getElementById('consignSet').value=
      labelMatch.setName;

    populateConsignmentVariants(labelMatch);
    updateConsignmentPreview();
    closeConsignmentSuggestions();
    return;
  }

  consignmentCache.selectedCard='';
  consignmentCache.selectedVariant='';

  document.getElementById('consignVariant').value='';

  scheduleConsignmentLookup('card',v);
  openConsignmentSuggestions('card');
  updateConsignmentPreview();
}

function consignmentVariantChanged(value){
  consignmentCache.selectedVariant=value||'';

  renderConsignmentSuggestions('variant');
  openConsignmentSuggestions('variant');
  updateConsignmentPreview();
}

function updateConsignmentPreview(){
  const preview=document.getElementById(
    'consignTitlePreview'
  );

  const submit=document.getElementById(
    'consignSubmit'
  );

  if(!preview)return;

  const card=selectedConsignmentCard();
  const variant=consignmentCache.selectedVariant;
  const condition=document.getElementById('consignCondition')?.value||'Raw';
  const grade=condition==='Graded'?(document.getElementById('consignGrade')?.value||''):'';

  const title=
    card&&variant
      ? buildConsignmentTitle({year:card.releaseYear,category:'Pokemon',setName:card.setName,variant,cardName:card.cardName,cardNumber:card.cardNumber,condition,grade})
      : 'Select a card and variant.';

  preview.textContent=title;

  if(submit)
    submit.disabled=!(card&&variant);
  updateSellerConfigUI();
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.consignField'))
    closeConsignmentSuggestions();
});

async function initConsignmentGenerator(){
  consignmentCache={
    cards:[],
    searchResults:[],
    selectedPokemon:'',
    selectedSet:'',
    selectedCard:'',
    selectedVariant:'',
    activeField:'',
    requestToken:0,
    loading:false
  };

  [
    'consignPokemon',
    'consignSet',
    'consignCard',
    'consignVariant'
  ].forEach(id=>{
    const el=document.getElementById(id);

    if(el)el.value='';
  });

  closeConsignmentSuggestions();
  updateConsignmentPreview();

  setConsignmentStatus(
    'Start typing in any field to search the Pokémon TCG database.'
  );
}

function stageEditModal(id){
 const x=item(id);if(!x)return '';const d=x.internal||{},method=x.method==='auction'?'auction':'buy';
 return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLER HUB · INVENTORY</div><h2>Seller settings</h2><div class="tiny muted">${esc(fullItemTitle(x))}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="sellerConfigGrid"><label><span class="eyebrow">Selling method</span><select id="editMethod" class="input"><option value="buy" ${method==='buy'?'selected':''}>BUY NOW</option><option value="auction" ${method==='auction'?'selected':''}>PUBLIC AUCTION</option></select></label><label><span class="eyebrow">Presentation</span><select id="editPresentation" class="input"><option value="Standard" ${(d.presentation||x.presentation)==='Standard'?'selected':''}>Standard</option><option value="Premium" ${(d.presentation||x.presentation)==='Premium'?'selected':''}>Premium</option></select></label><label><span class="eyebrow">Condition</span><select id="editCondition" class="input"><option value="Raw" ${(d.condition||'Raw')==='Raw'?'selected':''}>Raw</option><option value="Graded" ${(d.condition||'Raw')==='Graded'?'selected':''}>Graded</option></select></label><label><span class="eyebrow">Language</span><select id="editLanguage" class="input"><option value="English" ${(d.language||x.lang)==='English'?'selected':''}>English</option><option value="Japanese" ${(d.language||x.lang)==='Japanese'?'selected':''}>Japanese</option><option value="Korean" ${(d.language||x.lang)==='Korean'?'selected':''}>Korean</option><option value="Chinese" ${(d.language||x.lang)==='Chinese'?'selected':''}>Chinese</option></select></label><label><span class="eyebrow">Auction starting price</span><select id="editAuctionStart" class="input"><option value="1" ${Number(x.startingPrice||d.startingPrice||1)===1?'selected':''}>$1</option><option value="5" ${Number(x.startingPrice||d.startingPrice||1)===5?'selected':''}>$5</option><option value="10" ${Number(x.startingPrice||d.startingPrice||1)===10?'selected':''}>$10</option><option value="25" ${Number(x.startingPrice||d.startingPrice||1)===25?'selected':''}>$25</option><option value="50" ${Number(x.startingPrice||d.startingPrice||1)===50?'selected':''}>$50</option><option value="100" ${Number(x.startingPrice||d.startingPrice||1)===100?'selected':''}>$100</option></select></label><label><span class="eyebrow">Buy Now price</span><input id="editBuyPrice" class="input" type="number" min="1" value="${esc(x.price||1)}"></label></div><div class="notice" style="margin-top:14px">Changing seller settings immediately updates routing. Public auctions use the selected auction type and starting price; Buy Now uses the listed price.</div><div class="actions" style="margin-top:16px"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveStageEdit('${id}')">Save Seller Settings</button></div></div>`;
}
function saveStageEdit(id){
 const x=item(id);if(!x||x.sold)return;const method=document.getElementById('editMethod')?.value||'buy',condition=document.getElementById('editCondition')?.value||'Raw',language=document.getElementById('editLanguage')?.value||'English',presentation=document.getElementById('editPresentation')?.value||'Standard',auctionType='ELASTIC',startingPrice=Math.max(1,Number(document.getElementById('editAuctionStart')?.value)||1),buyPrice=Math.max(1,Number(document.getElementById('editBuyPrice')?.value)||1);
 x.method=method;x.type=method==='auction'?'Auction':'Buy Now';x.price=method==='buy'?buyPrice:x.price||0;x.startingPrice=method==='auction'?startingPrice:x.startingPrice||0;x.current=method==='auction'?startingPrice:buyPrice;x.auctionType=method==='auction'?auctionType:null;x.presentation=presentation;x.lang=language;x.grade=condition==='Graded'?'PSA 10':'Raw';x.internal=x.internal||{};Object.assign(x.internal,{condition,language,presentation,auctionType:x.auctionType,startingPrice:x.startingPrice});x.endsAt=0;x.bidCount=0;removeItemFromQueues(x.id,state);x.channel=null;x.channelId=null;
 if(method==='auction'){const target=evaluateAndEnqueue(x);x.status=target&&marketplaceWindow().isOpen?'Auction queue':(!marketplaceWindow().isOpen?'Queued for next marketplace opening':'Queued for next marketplace recalculation');if(target)normalizeAuctions(state);}else{x.status='Available now';x.privateAuction=null;}
 save();closeModal();activity(`${x.name} seller settings updated.`);
}

function settingsModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">ACCOUNT</div><h2>Account & Settings</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="list"><div class="listrow"><span>Operating mode</span><b>${state.userMode.toUpperCase()}</b></div><div class="listrow"><span>Concierge notifications</span><b>On</b></div><div class="listrow"><span>Offer expiration</span><b>24 hours</b></div><div class="listrow"><span>Public auction minimum</span><b>3:05</b></div><div class="listrow"><span>Buyer demand privacy</span><b>Protected</b></div></div></div>`}
function orderModal(index){const w=state.won[index];if(!w)return `<div class="modal"><div class="modalHead"><h2>Order</h2><button class="close" onclick="closeModal()">×</button></div><div class="empty">Transaction not found.</div></div>`;const x=item(w.item);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">WON ITEM</div><h2>Order</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="success"><b>Transaction secured.</b><br>${esc(x.name)} · ${money(w.price)}</div><div class="step"><b>Next</b>Confirm shipping and payment details in the eventual production checkout.</div><button class="primary" onclick="closeModal();activity('Order flow acknowledged for '+x.name+'.')">Continue</button></div>`}
function modals(){if(state.menuOpen)return menuDrawer();if(state.profile)return profileModal();if(!state.modal)return '';const {type,data}=state.modal;let content='';if(type==='queue')return `<div class="overlay" onclick="if(event.target===this)closeModal()">${queueModal(data)}</div>`;if(type==='itemSummary')content=itemSummaryModal(data);else if(type==='exploreFilters')content=exploreFilterModal();else if(type==='queueItem')content=queueItemModal(data);else if(type==='notifications')content=notificationsModal();else if(type==='channelInfo')content=channelInfoModal(data);else if(type==='auctionInfo')content=auctionInfoModal(data);else if(type==='offerConfirmation')content=offerConfirmation(data);else if(type==='buyerOffers')content=`<div class="modal"><div class="modalHead"><h2>Your offers</h2><button class="close" onclick="closeModal()">×</button></div>${buyerOffers()}</div>`;else if(type==='won')content=`<div class="modal"><div class="modalHead"><h2>Won Items</h2><button class="close" onclick="closeModal()">×</button></div>${wonItems()}</div>`;else if(type==='interests')content=interestsModal();else if(type==='consign')content=consignModal();else if(type==='settings')content=settingsModal();else if(type==='order')content=orderModal(data);else if(type==='privateBuyer')content=privateBuyer(data);else if(type==='privateSeller')content=privateSeller(data);else if(type==='method')content=methodModal(data);else if(type==='stageEdit')content=stageEditModal(data);else if(type==='customBid')content=customBidModal(data);return `<div class="overlay" onclick="if(event.target===this)closeModal()">${content}</div>`}
function render(){let body;if(state.page==='explore')body=explore();else if(state.page==='auctions')body=auctions();else if(state.page==='buy')body=buy();else if(state.page==='auction')body=auctionPage();else if(state.page==='item')body=itemPage();else if(state.page==='buyer')body=buyerHub();else if(state.page==='seller')body=sellerHub();else body=explore();document.body.classList.toggle('auction-mode',state.page==='auction');document.getElementById('app').innerHTML=(state.page==='auction'?'':header())+body+modals()+renderCartDrawer()+(state.toast?`<div class="toast">${esc(state.toast)}</div>`:'');}
function expireOffers(now){let changed=false;state.offers.forEach(o=>{if(o.status==='active'&&o.expires<=now){o.status='expired';changed=true;}});return changed}
function finishAuction(x){
 const bids=state.bids.filter(b=>b.item===x.id).sort((a,b)=>b.amount-a.amount),winning=bids[0],wasMine=winning&&winning.buyer==='You'&&winning.amount===x.current,c=channel(x.channelId),cid=c?.id;
 x.endsAt=0;ensureQueueState(state);
 if(!winning){x.sold=false;x.status='Auction queue';if(cid){const q=state.channelQueues[cid]||[];state.channelQueues[cid]=q.filter(id=>id!==x.id);state.channelQueues[cid].push(x.id);state.channelPos[cid]=0;}x.endsAt=0;normalizeAuctions(state);save();if(state.page==='auction'&&state.activeItem===x.id){state.page='auctions';state.activeItem=null;activity(`${x.name} ended with no sale and returned to the back of its channel queue.`);}return;}
 x.sold=true;x.status='Auction closed';if(wasMine){state.won.push({item:x.id,price:x.current,source:'Public Auction',date:Date.now()});notify(`You won ${x.name} for ${money(x.current)}.`,'won',x.id,'AUCTION WON');}
 if(cid)state.channelQueues[cid]=(state.channelQueues[cid]||[]).filter(id=>id!==x.id);
 normalizeAuctions(state);save();if(state.page==='auction'&&state.activeItem===x.id){state.page='auctions';state.activeItem=null;activity(`${x.name} sold and the channel is now available for another item.`);}
}
function tick(){
 const now=Date.now();
 let changed=expireOffers(now);
 items.filter(x=>x.method==='auction'&&!x.sold&&x.status==='Live').forEach(x=>{
  // Elastic cycle state advances with the authoritative countdown. When the
  // countdown organically moves below the integer where the current decay
  // cycle began, the immediately lower integer starts a fresh cycle. This is
  // intentionally NOT triggered by every integer change: upward movement from
  // an Elastic extension and revisits within the current cycle preserve their
  // existing state.
  if(x.auctionType==='ELASTIC'&&remainingMs(x)>0){
   updateElasticClock(x,secondsLeft(x));
  }
  if(remainingMs(x)<=0){finishAuction(x);changed=true}
 });
 if(state.modal?.type==='privateBuyer'||state.modal?.type==='privateSeller'){
  const p=state.privateAuctions[state.modal.data];
  if(p?.active&&p.deadline<=now){p.responses=p.responses.map(r=>({...r,engaged:false}));p.active=false;p.activeParticipants=0;changed=true;}
 }
 if(changed){save();render();updatePreciseTimerDisplays();return;}
 const structureChanged=ensureMarketplaceCycle(state);
 if(structureChanged){save();render();updatePreciseTimerDisplays();updateMarketplaceItineraryDisplays();return;}
 // All visible countdowns derive from the same authoritative endsAt value.
 const x=state.page==='auction'?item(state.activeItem):null;
 if(x){const cur=document.getElementById('auctionCurrent');if(cur)cur.textContent=money(x.current);const bc=document.getElementById('auctionBids');if(bc)bc.textContent=`${x.bidCount||0} bids`;const fb=document.getElementById('fastBidButton');if(fb)fb.textContent=`BID ${money(minBid(x))}`;
  if(x.auctionType==='ELASTIC'){const ep=elasticPreview(x);const reads=document.querySelectorAll('.elasticReadout');if(reads.length>=3){const last=x.auction?.lastExtension;reads[0].querySelector('b').textContent=last==null?'—':'+'+Number(last).toFixed(2)+'s';reads[1].querySelector('b').textContent=ep.active?(ep.used?'+0.00s':'+'+ep.extension.toFixed(2)+'s'):'—';reads[1].querySelector('.sub').textContent=ep.active?(ep.used?'integer already consumed':'predicted from current integer'):'outside extension zone';reads[2].querySelector('b').textContent=ep.active?`${ep.whole}s → ${ep.subsequent}s · ${ep.coef.toFixed(2)}`:'inactive';reads[2].querySelector('.sub').textContent=ep.active?(ep.used?`integer consumed · coefficient remains ${ep.coef.toFixed(2)}`:`mirrored ${ep.mirrored} · next coefficient ${(ep.coef/2).toFixed(2)}`):'public timer';}}}
 updatePreciseTimerDisplays();
 updateMarketplaceItineraryDisplays();
}

window.addEventListener('error',function(e){console.error('RapidUp runtime error:',e.error||e.message)});
// RU-SURGICAL v25 navigation safety net: explicit delegated controls.
document.addEventListener('click',function(e){
 const routeEl=e.target.closest&&e.target.closest('[data-ru-route]');
 if(routeEl){e.preventDefault();route(routeEl.getAttribute('data-ru-route'));return;}
 const actionEl=e.target.closest&&e.target.closest('[data-ru-action]');
 if(actionEl){e.preventDefault();const a=actionEl.getAttribute('data-ru-action');if(a==='notifications')openModal('notifications');else if(a==='profile')openProfile();}
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else if(state.profile)closeProfile()}});
state.exploreFilters=state.exploreFilters||{};ensureMarketplaceCycle(state);normalizeAuctions(state);save();render();tick();if(window.__rapidUpTickTimer)clearInterval(window.__rapidUpTickTimer);if(window.__rapidUpDisplayTimer)clearInterval(window.__rapidUpDisplayTimer);window.__rapidUpTickTimer=setInterval(tick,250);window.__rapidUpDisplayTimer=setInterval(updatePreciseTimerDisplays,50);if(window.__rapidUpVisualCountdownTimer)clearInterval(window.__rapidUpVisualCountdownTimer);window.__rapidUpVisualCountdownTimer=setInterval(updateAllVisualCountdowns,1000);updatePreciseTimerDisplays();updateAllVisualCountdowns();
</script>
