<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>CONTINUUM — Collectibles Marketplace</title>
<style>
:root{--bg:#f4f4f1;--surface:#fff;--surface2:#ededE9;--ink:#151515;--muted:#6b6b65;--line:#d8d8d2;--good:#23643b;--warn:#8a5b12;--danger:#8c3028;--r:16px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:40;background:rgba(244,244,241,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px}.brand{font-weight:950;letter-spacing:-.05em;font-size:18px}.brand span{font-size:10px;color:var(--muted);letter-spacing:.08em;margin-left:5px}
.topactions{margin-left:auto;display:flex;gap:7px;align-items:center}.iconbtn{position:relative;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:17px}.badge{position:absolute;right:-4px;top:-5px;background:#151515;color:#fff;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-size:10px;font-weight:900}
.main{max-width:1240px;margin:auto;padding:0 18px 70px}.hero{padding:48px 0 30px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:900}.hero h1{font-size:clamp(40px,6vw,70px);line-height:.94;letter-spacing:-.06em;max-width:900px;margin:9px 0 16px}.hero p{font-size:18px;line-height:1.5;color:#60605a;max-width:780px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-weight:750;color:var(--ink)}.btn.primary{background:#151515;color:#fff;border-color:#151515}.btn.small{padding:7px 9px;font-size:12px}.btn.ghost{background:transparent}
.searchrow{display:flex;gap:8px;margin-bottom:12px}.input,.select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;width:100%;outline:none}.searchrow .input{flex:1}
.filter{display:flex;gap:8px;flex-wrap:wrap}.filter .select{width:auto;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px}.card{min-height:260px;display:flex;flex-direction:column}.card:hover{box-shadow:0 12px 35px rgba(0,0,0,.08)}.card h3,.panel h3{margin:7px 0 3px;letter-spacing:-.025em}.muted{color:var(--muted)}.meta{font-size:13px;line-height:1.5}.method{font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;color:var(--muted)}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;margin:8px 4px 0 0}.price{font-size:25px;font-weight:950;letter-spacing:-.04em;margin:10px 0 2px}.push{margin-top:auto}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.section{padding:18px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:12px 0}.sectionhead h2,.sectionhead h3{margin:0;letter-spacing:-.035em}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kpi span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900}.kpi b{display:block;font-size:27px;letter-spacing:-.04em;margin-top:4px}.notice{padding:12px 13px;border:1px solid var(--line);border-left:3px solid #151515;background:var(--surface2);border-radius:10px;font-size:13px;line-height:1.45}.stat{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}.stat:last-child{border:0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #eee}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.detail{display:grid;grid-template-columns:1fr 1.25fr;gap:15px}.visual{min-height:380px;background:#e8e8e3;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;font-size:65px;font-weight:950;letter-spacing:-.08em}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:grid;gap:6px}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--muted)}
.drawerback,.modalback{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45)}.drawer{position:absolute;right:0;top:0;height:100%;width:min(390px,92vw);background:#fff;padding:18px;box-shadow:-20px 0 60px rgba(0,0,0,.2);overflow:auto}.drawer h2{letter-spacing:-.04em}.dir{display:grid;gap:7px;margin:12px 0}.dir button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;text-align:left;font-weight:800}.dir button small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.modalback{display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:19px;box-shadow:0 25px 80px rgba(0,0,0,.3)}
.notif{padding:14px 0;border-bottom:1px solid #eee}.notif.unread{background:#f7f7f4;margin:0 -8px;padding:14px 8px;border-radius:10px}.dot{width:8px;height:8px;background:#151515;border-radius:50%;display:inline-block;margin-right:6px}.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:#151515;color:#fff;padding:12px 15px;border-radius:11px;display:none}.toast.show{display:block}
.mainnav{display:flex;gap:4px;margin-left:auto;margin-right:10px}.mainnav button{border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:800;cursor:pointer}.mainnav button.active{background:#151515;color:#fff}.queuewindow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}.queueitem{cursor:pointer;border:1px solid #ddd;border-radius:12px;padding:10px;background:#fff;min-width:0}.queueitem:hover{background:#f5f5f5;border-color:#aaa}.queueitem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queueitem .qprice{font-size:18px;font-weight:950;margin-top:6px}
.channelhero{padding:28px 0 18px}.channelhero h1{font-size:42px;letter-spacing:-.05em;margin:7px 0}.channelnav{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.channelnav button{white-space:nowrap}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid,.grid2,.formgrid{grid-template-columns:1fr}.hero{padding-top:32px}.hero h1{font-size:43px}.topin{flex-wrap:wrap}.brand{flex:1}.kpis{grid-template-columns:repeat(2,1fr)}}
.live{font-weight:950}.table td:last-child{white-space:nowrap}.kpi b{font-variant-numeric:tabular-nums}</style>
</head>
<body>
<header class="top"><div class="topin">
<div class="brand">CONTINUUM <span>prototype</span></div>
<nav class="mainnav">
<button id="navExplore" onclick="go('explore')">Explore</button>
<button id="navAuctions" onclick="go('auctions')">Auctions</button>
<button id="navBuyNow" onclick="go('buynow')">Buy Now</button>
</nav>
<div class="topactions">
<button class="iconbtn" title="Concierge notifications" onclick="openNotifications()">♢<span id="badge" class="badge"></span></button>
<button class="iconbtn" title="Profile and hubs" onclick="openProfile()">S</button>
</div>
</div></header>
<main class="main" id="app"></main>
<div id="overlay"></div><div id="toast" class="toast"></div>
<script>
const baseSeed=[
{id:1,name:"Umbreon VMAX",set:"Evolving Skies #215",grade:"PSA 10",language:"English",variant:"Alternate Art",method:"Auction",price:null,status:"Live",channel:"Modern Chase Cards",interest:[[350,"Aug 18"],[382,"Aug 20"],[407,"Aug 21"],[395,"Aug 23"],[425,"Aug 25"]],auction:{current:382,endsAt:Date.now()+180000}},
{id:2,name:"Charizard ex",set:"Obsidian Flames #223",grade:"PSA 10",language:"English",variant:"Special Illustration Rare",method:"Buy Now",price:129,status:"Available now",channel:null,interest:[[115,"Aug 20"],[125,"Aug 23"],[150,"Aug 25"]]},
{id:3,name:"Gardevoir",set:"Secret Wonders #7",grade:"Raw",language:"English",variant:"Holo Rare",method:"Auction",price:null,status:"Live",channel:"Vintage Pokemon",interest:[[42,"Aug 16"],[48,"Aug 20"],[55,"Aug 24"]],auction:{current:51,endsAt:Date.now()+180000}},
{id:4,name:"Mewtwo GX",set:"Shining Legends #39",grade:"PSA 9",language:"English",variant:"Full Art",method:"Buy Now",price:74,status:"Available now",channel:null,interest:[[65,"Aug 19"],[70,"Aug 22"],[72,"Aug 24"]]},
{id:5,name:"Zekrom",set:"Celebrations #114",grade:"Raw",language:"English",variant:"Classic Collection",method:"Auction",price:null,status:"Live",channel:"Modern Pokemon",interest:[[18,"Aug 22"],[22,"Aug 25"]],auction:{current:18,endsAt:Date.now()+180000}},
{id:6,name:"Reshiram & Charizard GX",set:"Sun & Moon Promo",grade:"PSA 9",language:"English",variant:"Tag Team",method:"Buy Now",price:89,status:"Available now",channel:null,interest:[[75,"Aug 18"],[82,"Aug 22"],[90,"Aug 25"]]},
{id:7,name:"Jolteon VMAX",set:"Evolving Skies #051",grade:"PSA 10",language:"English",variant:"Alternate Art",method:"Buy Now",price:214,status:"Recently converted",channel:null,interest:[[175,"Aug 14"],[198,"Aug 19"],[205,"Aug 24"],[225,"Aug 26"]]},
{id:8,name:"Alakazam V",set:"Scarlet & Violet 151 #188",grade:"PSA 10",language:"Japanese",variant:"Special Illustration Rare",method:"Auction",price:null,status:"Live",channel:"Japanese Pokemon",interest:[[82,"Aug 19"],[95,"Aug 23"],[110,"Aug 26"]],auction:{current:91,endsAt:Date.now()+180000}},
{id:9,name:"Blastoise",set:"Base Set #2",grade:"PSA 8",language:"English",variant:"Holo",method:"Buy Now",price:168,status:"Available now",channel:null,interest:[[140,"Aug 12"],[155,"Aug 17"],[160,"Aug 25"]]}
];

const channelDefs=[
{name:"Modern Chase Cards",category:"High-demand modern singles",description:"Popular modern chase cards and alternate arts."},
{name:"Vintage Pokemon",category:"Vintage & WOTC",description:"Classic-era Pokemon cards with established collector demand."},
{name:"Modern Pokemon",category:"Modern Pokemon",description:"Modern Pokemon inventory across sets and rarities."},
{name:"Japanese Pokemon",category:"Japanese collectibles",description:"Japanese-language cards, exclusive variants, and artwork."}
];
const names=[
["Pikachu VMAX","Vivid Voltage"],["Rayquaza VMAX","Evolving Skies"],["Mew VMAX","Fusion Strike"],
["Lugia V","Silver Tempest"],["Giratina VSTAR","Crown Zenith"],["Moonbreon","Evolving Skies"],
["Espeon VMAX","Evolving Skies"],["Glaceon VMAX","Evolving Skies"],["Sylveon VMAX","Evolving Skies"],
["Dragonite V","Evolving Skies"],["Aerodactyl V","Lost Origin"],["Machamp V","Astral Radiance"],
["Charizard VSTAR","Crown Zenith"],["Charizard V","Brilliant Stars"],["Blaziken VMAX","Chilling Reign"],
["Moltres V","Chilling Reign"],["Zapdos V","Crown Zenith"],["Articuno V","Crown Zenith"],
["Mewtwo VSTAR","Pokemon Go"],["Lugia VSTAR","Silver Tempest"],["Ho-Oh V","Silver Tempest"],
["Gengar VMAX","Fusion Strike"],["Tyranitar V","Battle Styles"],["Umbreon V","Brilliant Stars"],
["Eevee","Twilight Masquerade"],["Pikachu ex","Surging Sparks"],["Terapagos ex","Stellar Crown"],
["Greninja ex","Twilight Masquerade"],["Miraidon ex","Scarlet & Violet"],["Koraidon ex","Scarlet & Violet"],
["Iono","Paldea Evolved"],["Miriam","Scarlet & Violet"],["Magikarp","Paldea Evolved"],
["Psyduck","151"],["Blastoise ex","151"],["Venusaur ex","151"],["Alakazam ex","151"],
["Erika's Invitation","151"],["Charmander","151"],["Squirtle","151"],["Bulbasaur","151"],
["Mew ex","151"],["Pikachu","151"],["Gengar","Lost Origin"],["Rotom V","Crown Zenith"],
["Origin Forme Palkia VSTAR","Crown Zenith"],["Origin Forme Dialga VSTAR","Crown Zenith"],
["Arceus VSTAR","Crown Zenith"],["Deoxys VMAX","Crown Zenith"],["Glaceon VSTAR","Crown Zenith"]
];
const grades=["PSA 10","PSA 9","CGC 10","Raw"];
const variants=["Alternate Art","Special Illustration Rare","Full Art","Holo Rare","Secret Rare"];
const prices=[42,55,68,75,88,95,110,125,145,165,185,210,245,275,325,375,425,475];

function buildAuctions(){
  let out=baseSeed.map(x=>structuredClone(x));
  let id=100;
  for(const def of channelDefs){
    for(let i=0;i<50;i++){
      const pair=names[(i+channelDefs.indexOf(def)*11)%names.length];
      const grade=grades[(i+channelDefs.indexOf(def))%grades.length];
      const variant=variants[(i*2+channelDefs.indexOf(def))%variants.length];
      const p=prices[(i*3+channelDefs.indexOf(def))%prices.length];
      out.push({
        id:id++,name:pair[0],set:pair[1]+" #"+String((i*7+11)%250+1),
        grade,language:def.name==="Japanese Pokemon"?"Japanese":"English",variant,
        method:"Auction",price:null,status:"Live",channel:def.name,
        interest:[[Math.round(p*.78),"Aug 19"],[Math.round(p*.88),"Aug 23"],[p,"Aug 26"]],
        auction:{current:Math.max(1,Math.round(p*.52)),endsAt:Date.now()+180000}
      });
    }
  }
  return out;
}
let stored=JSON.parse(localStorage.getItem("cont_inv_v5")||"null");
let inv=stored||buildAuctions();
let interests=JSON.parse(localStorage.getItem("cont_int_v5")||"null")||[
{name:"Umbreon VMAX",set:"Evolving Skies",grade:"PSA 9–10",language:"English",variant:"Alternate Art",target:425,method:"Auction",created:"Aug 25"}
];
let notifications=JSON.parse(localStorage.getItem("cont_notif_v5")||"null")||[
{id:1,unread:true,type:"New opportunity",title:"Umbreon VMAX — PSA 10",body:"An auction opportunity matches your $425 maximum interest.",time:"Just now"}
];
let won=JSON.parse(localStorage.getItem("cont_won_v5")||"null")||[];
let myBids=JSON.parse(localStorage.getItem("cont_bids_v5")||"null")||{};
let manifest=JSON.parse(localStorage.getItem("cont_manifest_v5")||"null")||[];
let page="explore",selected=1,searchTerm="",filters={method:"All",grade:"All",language:"All"},channelName="Modern Chase Cards",sortMode="Popular";
function initializeAuctionQueues(){for(const ch of channelDefs){const xs=inv.filter(x=>x.method==="Auction"&&x.channel===ch.name).sort((a,b)=>(a.id||0)-(b.id||0));xs.forEach((x,i)=>{x.auction=x.auction||{};x.auction.queuePosition=i;x.auction.active=(i===0);x.auction.current=x.auction.current||1;if(i===0){x.auction.endsAt=Date.now()+180000;x.status="Live"}else{x.auction.endsAt=0;x.auction.current=1;x.status="Auction queue"}})}}
initializeAuctionQueues();
const save=()=>{localStorage.setItem("cont_inv_v5",JSON.stringify(inv));localStorage.setItem("cont_int_v5",JSON.stringify(interests));localStorage.setItem("cont_notif_v5",JSON.stringify(notifications));localStorage.setItem("cont_manifest_v5",JSON.stringify(manifest));localStorage.setItem("cont_won_v5",JSON.stringify(won));localStorage.setItem("cont_bids_v5",JSON.stringify(myBids))};
const money=n=>"$"+Number(n||0).toLocaleString();
const remaining=x=>Math.max(0,(x.auction?.endsAt||0)-Date.now());
const timeLeft=x=>{let s=Math.ceil(remaining(x)/1000); if(s<=0)return "00:00"; return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const activeAuctions=()=>inv.filter(x=>x.method==='Auction'&&x.auction?.active&&remaining(x)>0);
function highestPreBid(x){return (x.interest||[]).map(r=>Number(r[0]||0)).filter(v=>v>0).reduce((a,b)=>Math.max(a,b),0)}
function activateNextInChannel(channel){const xs=inv.filter(x=>x.method==="Auction"&&x.channel===channel).sort((a,b)=>(a.auction?.queuePosition||0)-(b.auction?.queuePosition||0));if(!xs.length)return null;const ai=xs.findIndex(x=>x.auction?.active);const next=ai>=0?xs[(ai+1)%xs.length]:xs[0];xs.forEach(x=>{x.auction.active=false;x.auction.endsAt=0;x.auction.current=1;x.status="Auction queue"});next.auction.active=true;next.auction.endsAt=Date.now()+180000;next.auction.current=Math.max(1,highestPreBid(next));next.auction.preBidApplied=highestPreBid(next)>0;next.status="Live";notifications.unshift({id:Date.now()+next.id,unread:true,type:"Auction now live",title:`${next.name} — ${money(next.auction.current)}`,body:`${next.channel} is now active.`,time:"Just now",targetId:next.id});return next}
function finishExpired(){const now=Date.now();const expired=inv.filter(x=>x.method==="Auction"&&x.auction?.active&&x.auction.endsAt<=now);for(const x of expired){const bid=myBids[x.id];if(bid&&bid>=x.auction.current){won.unshift({id:x.id,name:x.name,set:x.set,grade:x.grade,language:x.language,variant:x.variant,price:x.auction.current,wonAt:new Date().toLocaleString()});notifications.unshift({id:Date.now()+x.id,unread:true,type:"Auction won",title:`${x.name} — ${money(x.auction.current)}`,body:"You won this auction. It is now in your Buyer Hub.",time:"Just now",targetId:x.id})}activateNextInChannel(x.channel)}}

function tick(){finishExpired();render();}
const low=a=>Math.min(...a.map(x=>x[0])), high=a=>Math.max(...a.map(x=>x[0])), avg=a=>Math.round(a.reduce((s,x)=>s+x[0],0)/a.length);
const initials=n=>n.split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase();
function go(p,id){page=p;if(id)selected=id;closeOverlay();render();scrollTo({top:0,behavior:"smooth"})}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function updateMainNav(){const map={navExplore:"explore",navAuctions:"auctions",navBuyNow:"buynow"};Object.entries(map).forEach(([id,p])=>{const el=document.getElementById(id);if(el)el.classList.toggle("active",page===p||(p==="auctions"&&(page==="channel")))})}
function render(){updateMainNav();document.getElementById("app").innerHTML=page==="explore"?explore():page==="concierge"?concierge():page==="auctions"?auctions():page==="channel"?channel():page==="buynow"?buynow():page==="sell"?sell():page==="intelligence"?intelligence():item(selected);updateBadge()}
function updateBadge(){let n=notifications.filter(x=>x.unread).length;document.getElementById("badge").textContent=n?n:"";document.getElementById("badge").style.display=n?"grid":"none"}

function card(x){
  const mine=myBids[x.id];
  return `<article class="card"><div class="method">${x.channel} · ${x.variant}</div><h3>${x.name}</h3><div class="muted">${x.set}</div><div class="meta">${x.grade} · ${x.language}</div><div class="tag">${x.auction&&remaining(x)>0?"LIVE":"Starting"}</div><div class="push"><div class="price">${money(x.auction?.current)}</div><div class="meta"><b>${timeLeft(x)}</b> remaining ${mine?`· Your bid ${money(mine)}`:""}</div><div class="actions"><button class="btn primary small" onclick="go('item',${x.id})">View auction</button><button class="btn small" onclick="bidModal(${x.id})">Bid</button></div></div></article>`;
}
function explore(){
  finishExpired();
  let active=activeAuctions();
  let popular=active.filter(x=>x.auction.current>=35 || x.interest.length>=3);
  let list=(popular.length?popular:active.slice(0,18)).filter(x=>{
    let q=(x.name+" "+x.set+" "+x.grade+" "+x.language+" "+x.variant).toLowerCase();
    return(!searchTerm||q.includes(searchTerm.toLowerCase()))&&(filters.grade==="All"||x.grade.includes(filters.grade))&&(filters.language==="All"||x.language===filters.language);
  });
  if(sortMode==="Bid: High")list.sort((a,b)=>b.auction.current-a.auction.current);
  if(sortMode==="Time: Ending")list.sort((a,b)=>remaining(a)-remaining(b));
  if(sortMode==="Interest")list.sort((a,b)=>high(b.interest)-high(a.interest));
  return `<section class="hero"><div class="eyebrow">Marketplace discovery</div><h1>What collectors are acting on now.</h1><p>Explore is a curated view of popular active opportunities—not a dump of every listing.</p></section>
  <div class="searchrow"><input class="input" id="search" value="${searchTerm}" placeholder="Search popular active items..."><button class="btn primary" onclick="searchNow()">Search</button></div>
  <div class="filter"><select class="select" onchange="sortMode=this.value;render()"><option>Popular</option><option ${sortMode==="Bid: High"?"selected":""}>Bid: High</option><option ${sortMode==="Time: Ending"?"selected":""}>Time: Ending</option><option ${sortMode==="Interest"?"selected":""}>Interest</option></select><select class="select" onchange="filters.grade=this.value;render()"><option>All grades</option><option ${filters.grade==="PSA"?"selected":""}>PSA</option><option ${filters.grade==="CGC"?"selected":""}>CGC</option><option ${filters.grade==="Raw"?"selected":""}>Raw</option></select><select class="select" onchange="filters.language=this.value;render()"><option>All languages</option><option ${filters.language==="English"?"selected":""}>English</option><option ${filters.language==="Japanese"?"selected":""}>Japanese</option></select><button class="btn ghost" onclick="searchTerm='';filters={method:'All',grade:'All',language:'All'};sortMode='Popular';render()">Clear</button></div>
  <div class="sectionhead"><h2>Popular active items</h2><span class="muted">${active.length} active across channels</span></div><div class="grid">${list.map(card).join("")}</div>`;
}
function searchNow(){searchTerm=document.getElementById("search").value;render()}

function item(id){
  finishExpired(); let x=inv.find(z=>z.id===id), mine=myBids[x.id];
  return `<section class="section"><button class="btn ghost small" onclick="go('explore')">← Marketplace</button></section><div class="detail"><div class="visual">${initials(x.name)}</div><div class="panel"><div class="eyebrow">${x.channel||x.method}</div><h1 style="font-size:40px;letter-spacing:-.05em;margin:7px 0">${x.name}</h1><div class="muted">${x.set}</div><span class="tag">${x.grade}</span><span class="tag">${x.language}</span><span class="tag">${x.variant}</span>${x.method==="Auction"?`<div class="price">${money(x.auction.current)}</div><div class="notice"><b>LIVE · ${timeLeft(x)}</b> remaining · current bid</div><div class="actions"><button class="btn primary" onclick="bidModal(${x.id})">Place bid</button><button class="btn" onclick="interestModal(${x.id})">Express interest</button></div>${mine?`<div class="notice" style="margin-top:10px">Your current bid: <b>${money(mine)}</b>. There is no competing bidder in this prototype.</div>`:""}`:`<div class="price">${money(x.price)}</div><div class="notice">Available for immediate purchase.</div><div class="actions"><button class="btn primary" onclick="toast('Purchase flow is represented in the prototype.')">Buy Now</button><button class="btn" onclick="interestModal(${x.id})">Express interest</button></div>`}<div class="sectionhead"><h3>Demand intelligence</h3><button class="btn small" onclick="demandModal(${x.id})">View full demand</button></div><div class="stat"><span>Low expressed interest</span><b>${money(low(x.interest))}</b></div><div class="stat"><span>Average expressed interest</span><b>${money(avg(x.interest))}</b></div><div class="stat"><span>High expressed interest</span><b>${money(high(x.interest))}</b></div><div class="stat"><span>Expressions</span><b>${x.interest.length}</b></div></div></div>`;
}
function bidModal(id){
  let x=inv.find(z=>z.id===id); if(!x||x.method!=="Auction"){toast("This item is not in auction.");return}
  let min=Math.max(x.auction.current+1,Number(myBids[id]||0)+1);
  openModal(`<div class="sectionhead"><div><div class="eyebrow">Live auction</div><h2>${x.name}</h2><div class="muted">${x.set} · ${x.grade}</div></div><button class="btn small" onclick="closeOverlay()">Close</button></div><div class="kpis"><div class="kpi"><span>Current bid</span><b>${money(x.auction.current)}</b></div><div class="kpi"><span>Time</span><b>${timeLeft(x)}</b></div><div class="kpi"><span>Your bid</span><b>${myBids[id]?money(myBids[id]):"—"}</b></div><div class="kpi"><span>Competition</span><b>None</b></div></div><div class="field" style="margin-top:15px"><label>Your bid</label><input id="bidp" class="input" type="number" min="${min}" value="${min}"></div><div class="notice" style="margin-top:10px">Prototype mode: bids are elastic only when they exceed the current bid. With no competing bidder, your bid becomes the current bid. When the 3:00 timer expires, the highest bid wins.</div><div class="actions"><button class="btn primary" onclick="placeBid(${id})">Place bid</button></div>`);
}
function placeBid(id){
  let x=inv.find(z=>z.id===id),p=Number(document.getElementById("bidp").value);
  let min=x.auction.current+1;
  if(!p||p<min){toast("Bid must exceed the current bid.");return}
  myBids[id]=p;x.auction.current=p;
  notifications.unshift({id:Date.now(),unread:true,type:"Bid placed",title:`${x.name} — ${money(p)}`,body:"Your bid is now the current bid. The auction remains live until its timer expires.",time:"Just now"});
  save();closeOverlay();render();toast("Bid placed.");
}
function interestModal(id){let x=inv.find(z=>z.id===id);openModal(`<div class="sectionhead"><div><div class="eyebrow">Buyer intent</div><h2>Express interest</h2><div class="muted">${x.name} · ${x.set}</div></div><button class="btn small" onclick="closeOverlay()">Close</button></div><div class="notice">Set the maximum price you would be willing to pay if this item enters auction. This is non-committal and creates no bid or purchase obligation.</div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Maximum price</label><input id="ip" class="input" type="number" placeholder="e.g. 425"></div><div class="field"><label>Preferred method</label><select id="im" class="select"><option>Auction</option><option>Buy Now</option><option>Either</option></select></div></div><div class="actions"><button class="btn primary" onclick="submitInterest(${id})">Express interest</button></div>`)}
function submitInterest(id){let x=inv.find(z=>z.id===id),p=Number(document.getElementById("ip").value),m=document.getElementById("im").value;if(!p){toast("Enter a maximum price.");return}let date="Today";x.interest.push([p,date]);interests.push({name:x.name,set:x.set,grade:x.grade,language:x.language,variant:x.variant,target:p,method:m,created:date});notifications.unshift({id:Date.now(),unread:true,type:"Interest recorded",title:`${x.name} — $${p}`,body:"Your expression has been added to the item's aggregated demand intelligence. No bid was placed.",time:"Just now"});save();closeOverlay();render();toast("Interest recorded. Demand intelligence updated.");}

function concierge(){return `<section class="hero"><div class="eyebrow">Buyer hub · system-driven concierge</div><h1>Your interests become opportunities.</h1><p>The concierge monitors your criteria, inventory, method changes, and auctions. It informs and connects; it never dictates behavior or bids autonomously.</p></section><div class="kpis"><div class="kpi"><span>Active interests</span><b>${interests.length}</b></div><div class="kpi"><span>Notifications</span><b>${notifications.length}</b></div><div class="kpi"><span>Current matches</span><b>${matches().length}</b></div><div class="kpi"><span>Autonomous bids</span><b>0</b></div></div><div class="sectionhead"><h2>Won auctions</h2><span class="muted">${won.length} won</span></div><div class="grid2">${won.length?won.slice(0,12).map(w=>`<div class="panel"><div class="method">Won auction</div><h3>${w.name}</h3><div class="muted">${w.set} · ${w.grade}</div><div class="stat"><span>Winning bid</span><b>${money(w.price)}</b></div><div class="stat"><span>Won</span><span>${w.wonAt}</span></div><button class="btn primary small" onclick="toast('Order detail flow is represented in the prototype.')">View order</button></div>`).join(""):'<div class="notice">No won auctions yet. Place a bid and let the 3:00 timer expire.</div>'}</div><div class="sectionhead"><h2>Your interests</h2><button class="btn primary" onclick="newInterest()">Add interest</button></div><div class="grid2">${interests.map((i,k)=>`<div class="panel"><div class="method">${i.method} preferred</div><h3>${i.name}</h3><div class="muted">${i.set} · ${i.language} · ${i.grade}</div><div class="stat"><span>Maximum interest</span><b>$${i.target}</b></div><div class="stat"><span>Established</span><span>${i.created}</span></div><div class="actions"><button class="btn small" onclick="removeInterest(${k})">Remove</button><button class="btn primary small" onclick="interestMatches(${k})">Find opportunities</button></div></div>`).join("")}</div>`}
function matches(){return inv.filter(x=>interests.some(i=>x.name.toLowerCase().includes(i.name.toLowerCase())&&i.target>=(x.method==="Buy Now"?x.price||0:x.auction?.current||0)))}
function newInterest(){openModal(`<div class="sectionhead"><h2>New concierge interest</h2><button class="btn small" onclick="closeOverlay()">Close</button></div><div class="formgrid"><div class="field"><label>Item / set</label><input id="nn" class="input" placeholder="Umbreon VMAX"></div><div class="field"><label>Language</label><select id="nl" class="select"><option>Any</option><option>English</option><option>Japanese</option></select></div><div class="field"><label>Variant</label><input id="nv" class="input" placeholder="Any / Alternate Art"></div><div class="field"><label>Grade range</label><input id="ng" class="input" placeholder="PSA 9–10"></div><div class="field"><label>Target price</label><input id="nt" class="input" type="number" placeholder="425"></div><div class="field"><label>Preferred method</label><select id="nm" class="select"><option>Either</option><option>Auction</option><option>Buy Now</option></select></div></div><div class="actions"><button class="btn primary" onclick="saveInterest()">Create interest</button></div>`)}
function saveInterest(){let n=document.getElementById("nn").value,t=Number(document.getElementById("nt").value);if(!n||!t){toast("Item/set and target price are required.");return}interests.push({name:n,set:"Any",grade:document.getElementById("ng").value||"Any",language:document.getElementById("nl").value,variant:document.getElementById("nv").value||"Any",target:t,method:document.getElementById("nm").value,created:"Today"});save();closeOverlay();render();toast("Concierge interest created.")}
function removeInterest(k){interests.splice(k,1);save();render();toast("Interest removed.")}
function interestMatches(k){let i=interests[k],m=inv.filter(x=>x.name.toLowerCase().includes(i.name.toLowerCase())&&i.target>=(x.method==="Buy Now"?x.price||0:x.auction?.current||0));openModal(`<div class="sectionhead"><h2>${m.length} matching opportunities</h2><button class="btn small" onclick="closeOverlay()">Close</button></div><div class="grid">${m.map(x=>`<div class="card"><div class="method">${x.method}</div><h3>${x.name}</h3><div class="muted">${x.set}</div><div class="price">${x.method==="Buy Now"?"$"+x.price:"$"+x.auction.current}</div><button class="btn primary small" onclick="closeOverlay();go('item',${x.id})">View</button></div>`).join("")||'<div class="notice">No current matches. The concierge continues monitoring.</div>'}</div>`)}

function auctionQueueCard(x){return `<div class="queueitem" onclick="go('item',${x.id})"><b>${x.name}</b><small class="muted">${x.set} · ${x.grade}</small><div class="qprice">$1</div><small class="muted">Queued · position ${(x.auction?.queuePosition||0)+1}</small></div>`}
function auctions(){finishExpired();return `<section class="hero"><div class="eyebrow">Auction directory</div><h1>One active auction per channel.</h1><p>Each channel runs one item at a time. The queue remains visible and selectable; queued items display $1 until activation, when demonstrated pre-bid interest establishes the opening bid.</p></section><div class="grid">${channelDefs.map(ch=>{const xs=inv.filter(x=>x.method==="Auction"&&x.channel===ch.name).sort((a,b)=>(a.auction?.queuePosition||0)-(b.auction?.queuePosition||0));const active=xs.find(x=>x.auction?.active);const queue=xs.filter(x=>!x.auction?.active).slice(0,5);return `<div class="panel"><div class="eyebrow">${ch.category}</div><h2>${ch.name}</h2><p class="muted">${ch.description}</p>${active?`<div class="notice"><b>LIVE NOW</b> · ${active.name}<br><b>${money(active.auction.current)}</b> · ${timeLeft(active)} remaining</div><div class="actions"><button class="btn primary" onclick="go('item',${active.id})">Open active auction</button></div>`:`<div class="notice">No auction currently active.</div>`}<div class="sectionhead"><h3>Queue</h3><span class="muted">Tap an item to inspect</span></div><div class="queuewindow">${queue.map(auctionQueueCard).join("")}</div><div class="actions"><button class="btn" onclick="channelName='${ch.name}';go('channel')">Open channel</button></div></div>`}).join("")}</div>`}
function channel(){finishExpired();const ch=channelDefs.find(c=>c.name===channelName);const xs=inv.filter(x=>x.method==="Auction"&&x.channel===channelName).sort((a,b)=>(a.auction?.queuePosition||0)-(b.auction?.queuePosition||0));const active=xs.find(x=>x.auction?.active);const queue=xs.filter(x=>!x.auction?.active).slice(0,5);return `<section class="channelhero"><div class="channelnav">${channelDefs.map(c=>`<button class="btn small ${c.name===channelName?'primary':''}" onclick="channelName='${c.name}';render()">${c.name}</button>`).join("")}</div><div class="eyebrow" style="margin-top:25px">${ch?.category||"Auction channel"}</div><h1>${channelName}</h1><p class="muted">${ch?.description||""}</p></section><div class="panel">${active?`<div class="sectionhead"><div><div class="eyebrow">Active auction</div><h2>${active.name}</h2><div class="muted">${active.set} · ${active.grade}</div></div><span class="tag">${active.auctionMode||"Auction"}</span></div><div class="kpis"><div class="kpi"><span>Current bid</span><b>${money(active.auction.current)}</b></div><div class="kpi"><span>Time</span><b>${timeLeft(active)}</b></div><div class="kpi"><span>Next minimum</span><b>${money(minimumBid(active))}</b></div><div class="kpi"><span>Queue</span><b>${xs.length-1} waiting</b></div></div><div class="actions"><button class="btn primary" onclick="go('item',${active.id})">Open auction</button><button class="btn" onclick="bidModal(${active.id})">Bid</button></div>`:''}<div class="sectionhead" style="margin-top:24px"><h2>Queue</h2><span class="muted">Tap any item to inspect</span></div><div class="queuewindow">${queue.map(auctionQueueCard).join("")}</div><div class="notice" style="margin-top:14px">Queued items remain at <b>$1</b> until activation. When an item becomes active, demonstrated pre-bid interest establishes the opening bid.</div></div>`}
function buynow(){const xs=inv.filter(x=>x.method==="Buy Now");return `<section class="hero"><div class="eyebrow">Marketplace</div><h1>Buy Now.</h1><p>Immediate purchases from currently available inventory.</p></section><div class="grid">${xs.map(x=>`<article class="card"><div class="method">Buy Now</div><h3>${x.name}</h3><div class="muted">${x.set}</div><div class="meta">${x.grade} · ${x.language}</div><div class="price">${money(x.price)}</div><div class="actions"><button class="btn primary small" onclick="go('item',${x.id})">View item</button></div></article>`).join("")}</div>`}
function sell(){return `<section class="hero"><div class="eyebrow">Seller hub · consignment</div><h1>Standardize the item. Keep control of how it sells.</h1><p>Sellers proactively consign individual items with a manifest, establish presentation and an initial method, then reposition inventory as demonstrated demand develops.</p></section><div class="kpis"><div class="kpi"><span>Manifest items</span><b>${manifest.length}</b></div><div class="kpi"><span>Buy Now</span><b>${inv.filter(x=>x.method==="Buy Now").length}</b></div><div class="kpi"><span>Auction</span><b>${inv.filter(x=>x.method==="Auction").length}</b></div><div class="kpi"><span>Repositionable</span><b>All</b></div></div><div class="sectionhead"><h2>Consignment manifest</h2><button class="btn primary" onclick="addManifest()">Add individual item</button></div><div class="panel">${manifest.length?`<table class="table"><thead><tr><th>Item</th><th>Grade</th><th>Language</th><th>Initial method</th><th></th></tr></thead><tbody>${manifest.map((m,i)=>`<tr><td><b>${m.name}</b><br><span class="muted">${m.set}</span></td><td>${m.grade}</td><td>${m.language}</td><td>${m.method}</td><td><button class="btn small" onclick="manifest.splice(${i},1);save();render()">Remove</button></td></tr>`).join("")}</tbody></table>`:'<div class="notice">The seller creates the manifest proactively. Each individual item becomes a standardized unit of inventory and demand intelligence.</div>'}</div><div class="sectionhead"><h2>Inventory positioning</h2></div><div class="grid">${inv.map(sellerCard).join("")}</div>`}
function sellerCard(x){return `<div class="panel"><div class="method">${x.method}</div><h3>${x.name}</h3><div class="muted">${x.set} · ${x.grade}</div><div class="stat"><span>Low / Avg / High</span><b>$${low(x.interest)} / $${avg(x.interest)} / $${high(x.interest)}</b></div><div class="stat"><span>Latest expression</span><span>$${x.interest.at(-1)[0]} · ${x.interest.at(-1)[1]}</span></div><div class="actions"><button class="btn small" onclick="demandModal(${x.id})">View demand</button><button class="btn primary small" onclick="methodModal(${x.id})">Position item</button></div></div>`}
function addManifest(){openModal(`<div class="sectionhead"><h2>Add consigned item</h2><button class="btn small" onclick="closeOverlay()">Close</button></div><div class="formgrid"><div class="field"><label>Item</label><input id="mn" class="input" placeholder="Umbreon VMAX"></div><div class="field"><label>Set / number</label><input id="ms" class="input" placeholder="Evolving Skies #215"></div><div class="field"><label>Grade</label><input id="mg" class="input" placeholder="PSA 10"></div><div class="field"><label>Language</label><select id="ml" class="select"><option>English</option><option>Japanese</option></select></div><div class="field"><label>Variant</label><input id="mv" class="input" placeholder="Alternate Art"></div><div class="field"><label>Initial method</label><select id="mm" class="select"><option>Buy Now</option><option>Auction</option></select></div></div><div class="actions"><button class="btn primary" onclick="saveManifest()">Add to manifest</button></div>`)}
function saveManifest(){let n=document.getElementById("mn").value;if(!n){toast("Item name required.");return}manifest.push({name:n,set:document.getElementById("ms").value,grade:document.getElementById("mg").value,language:document.getElementById("ml").value,variant:document.getElementById("mv").value,method:document.getElementById("mm").value});save();closeOverlay();render();toast("Item added to manifest.")}

function intelligence(){return `<section class="hero"><div class="eyebrow">Seller hub · intelligence</div><h1>See demand before choosing how to sell.</h1><p>Aggregated, non-identifying expressions show low, average, high, and dated willingness to pay for each individual item.</p></section><div class="kpis"><div class="kpi"><span>Tracked items</span><b>${inv.length}</b></div><div class="kpi"><span>Total expressions</span><b>${inv.reduce((s,x)=>s+x.interest.length,0)}</b></div><div class="kpi"><span>Buy Now positioned</span><b>${inv.filter(x=>x.method==="Buy Now").length}</b></div><div class="kpi"><span>Auction positioned</span><b>${inv.filter(x=>x.method==="Auction").length}</b></div></div><div class="sectionhead"><h2>Portfolio demand</h2></div><div class="grid">${inv.map(x=>`<div class="panel"><div class="method">${x.method}</div><h3>${x.name}</h3><div class="muted">${x.set} · ${x.grade}</div><div class="stat"><span>Low</span><b>$${low(x.interest)}</b></div><div class="stat"><span>Average</span><b>$${avg(x.interest)}</b></div><div class="stat"><span>High</span><b>$${high(x.interest)}</b></div><div class="stat"><span>Latest</span><span>$${x.interest.at(-1)[0]} · ${x.interest.at(-1)[1]}</span></div><div class="notice" style="margin-top:10px">${x.method==="Auction"&&x.interest.at(-1)[0]>=avg(x.interest)?"Buy Now may capture demonstrated demand.":"Current positioning remains reasonable."}</div><div class="actions"><button class="btn small" onclick="demandModal(${x.id})">Open analytics</button><button class="btn primary small" onclick="methodModal(${x.id})">Change method</button></div></div>`).join("")}</div>`}

function demandModal(id){let x=inv.find(z=>z.id===id);openModal(`<div class="sectionhead"><div><div class="eyebrow">Demand intelligence</div><h2>${x.name}</h2><div class="muted">${x.set} · ${x.grade}</div></div><button class="btn small" onclick="closeOverlay()">Close</button></div><div class="kpis"><div class="kpi"><span>Low</span><b>$${low(x.interest)}</b></div><div class="kpi"><span>Average</span><b>$${avg(x.interest)}</b></div><div class="kpi"><span>High</span><b>$${high(x.interest)}</b></div><div class="kpi"><span>Expressions</span><b>${x.interest.length}</b></div></div><div class="grid2 section"><div class="panel"><div class="eyebrow">Interest history</div><h3>Dated expressions</h3><table class="table"><thead><tr><th>Expression</th><th>Date</th></tr></thead><tbody>${x.interest.slice().reverse().map(v=>`<tr><td><b>$${v[0]}</b></td><td>${v[1]}</td></tr>`).join("")}</tbody></table></div><div class="panel"><div class="eyebrow">Interpretation</div><h3>Demonstrated demand</h3><p class="muted">Expressions are aggregated and non-identifying. Dates help distinguish current demand from isolated or aging interest.</p><div class="stat"><span>Current method</span><b>${x.method}</b></div><div class="stat"><span>Latest expression</span><b>$${x.interest.at(-1)[0]}</b></div><button class="btn primary" onclick="closeOverlay();methodModal(${x.id})">Evaluate selling method</button></div></div>`)}

function methodModal(id){let x=inv.find(z=>z.id===id),a=avg(x.interest),h=high(x.interest),r=x.interest.at(-1);openModal(`<div class="sectionhead"><div><div class="eyebrow">Seller positioning</div><h2>${x.name}</h2><div class="muted">${x.set} · current: ${x.method}</div></div><button class="btn small" onclick="closeOverlay()">Close</button></div><div class="panel"><div class="eyebrow">Marketplace guidance</div><h3>${x.method==="Auction"&&r[0]>=a?"Buy Now may capture demonstrated demand":"Auction remains available for price discovery"}</h3><p class="muted">Guidance reflects demonstrated marketplace activity. The seller controls the method.</p><div class="stat"><span>Average interest</span><b>$${a}</b></div><div class="stat"><span>High interest</span><b>$${h}</b></div><div class="stat"><span>Most recent</span><b>$${r[0]} · ${r[1]}</b></div></div><div class="sectionhead"><h3>Choose selling method</h3></div><div class="grid2"><div class="panel"><div class="method">Buy Now</div><h3>Immediate liquidity</h3><p class="muted">Set an asking price supported by the demand you see.</p><button class="btn primary" onclick="changeMethod(${x.id},'Buy Now')">Move to Buy Now</button></div><div class="panel"><div class="method">Auction</div><h3>Price discovery</h3><p class="muted">Place the item into a perpetual auction channel.</p><button class="btn primary" onclick="changeMethod(${x.id},'Auction')">Move to Auction</button></div></div>`)}
function changeMethod(id,m){let x=inv.find(z=>z.id===id);x.method=m;if(m==="Buy Now"){x.price=Math.round(avg(x.interest)*1.02);x.status="Recently converted";x.auction=null;x.channel=null}else{x.price=null;x.status="Auction queue";x.channel="Modern Pokemon";x.auction={current:Math.max(1,Math.round(avg(x.interest)*.9)),ends:"upcoming"}}notifications.unshift({id:Date.now(),unread:true,type:"Method change",title:`${x.name} moved to ${m}`,body:"Marketplace positioning has been updated.",time:"Just now"});save();closeOverlay();render();toast(x.name+" moved to "+m+".")}

function openNotifications(){let ns=notifications;openModal(`<div class="sectionhead"><div><div class="eyebrow">System-driven concierge</div><h2>Notifications</h2></div><button class="btn small" onclick="closeOverlay()">Close</button></div>${ns.map(n=>`<div class="notif ${n.unread?'unread':''}" onclick="readNotif(${n.id})"><div><span class="dot" style="${n.unread?'':'display:none'}"></span><b>${n.type}</b><span class="muted" style="float:right">${n.time}</span></div><h3>${n.title}</h3><div class="muted">${n.body}</div></div>`).join("")||'<div class="notice">No notifications.</div>'}<div class="actions"><button class="btn" onclick="markRead()">Mark all read</button><button class="btn" onclick="go('concierge')">Open Buyer Hub</button></div>`)}
function readNotif(id){const n=notifications.find(x=>x.id===id);if(n)n.unread=false;save();updateBadge();if(n&&n.targetId){closeOverlay();go('item',n.targetId);return}closeOverlay();render()}

function markRead(){notifications.forEach(n=>n.unread=false);save();updateBadge();openNotifications()}

function openProfile(){openDrawer(`<div class="sectionhead"><div><div class="eyebrow">Profile</div><h2>Scott</h2></div><button class="btn small" onclick="closeOverlay()">Close</button></div><div class="dir"><button onclick="go('concierge')">Buyer Hub<small>Interests · Concierge · opportunities · activity</small></button><button onclick="go('auctions')">Auction Channels<small>Browse and manually participate in perpetual channels</small></button><button onclick="go('sell')">Seller Hub<small>Consignment · inventory positioning · method control</small></button><button onclick="go('intelligence')">Seller Intelligence<small>Demand · expressions · positioning guidance</small></button></div><div class="notice">Buyer and seller experiences are separated into hubs, while the marketplace intelligence connects them underneath.</div>`)}
function openDrawer(c){document.getElementById("overlay").innerHTML=`<div class="drawerback" onclick="if(event.target===this)closeOverlay()"><aside class="drawer">${c}</aside></div>`}
function openModal(c){document.getElementById("overlay").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeOverlay()"><div class="modal">${c}</div></div>`}
function closeOverlay(){document.getElementById("overlay").innerHTML=""}
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeOverlay()});
save();render();setInterval(tick,1000);
</script>
</body></html>
