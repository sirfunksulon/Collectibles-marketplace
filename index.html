<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RapidUp — Collectibles Marketplace</title>
<style>
:root{--bg:#fff;--ink:#111;--muted:#777;--line:#deded8;--soft:#f4f4f0;--shadow:0 12px 40px rgba(0,0,0,.09);--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}img{max-width:100%;display:block}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}.nav{height:78px;max-width:1320px;margin:auto;padding:10px 22px;display:flex;align-items:center;gap:28px}.brand{font-weight:950;font-size:30px;letter-spacing:-.07em;line-height:.8;display:flex;align-items:center;gap:10px;margin-right:auto}.brandMark{width:42px;height:42px;border-radius:50%;border:1px solid #ddd;display:grid;place-items:center;font-size:20px}.brand small{display:block;font-size:8px;letter-spacing:.2em;color:#777;margin-top:7px}.navbtn{border:0;background:transparent;font-weight:850;font-size:16px;padding:12px 5px;border-bottom:3px solid transparent}.navbtn.active{border-color:#111}.round{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:14px;font-weight:900;position:relative}.badge{position:absolute;right:-5px;top:-7px;background:#111;color:#fff;border-radius:99px;font-size:10px;padding:4px 7px}
main{max-width:1320px;margin:auto;padding:28px 22px 90px}h1{font-size:42px;letter-spacing:-.05em;margin:15px 0 25px}h2{letter-spacing:-.035em}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:24px}.select{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;min-width:210px}.searchBtn{margin-left:auto;width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.035)}.cardimg{aspect-ratio:3/4;background:#f0f0eb;object-fit:cover;width:100%}.cardbody{padding:14px}.cardtitle{font-weight:850;line-height:1.1;min-height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-size:22px;font-weight:950;margin-top:10px}.meta{color:var(--muted);font-size:13px;margin-top:5px}.tag{position:absolute;top:10px;right:10px;background:#fff;border:1px solid #ddd;border-radius:99px;padding:7px 9px;font-weight:900;font-size:11px}.media{position:relative}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:1px solid #111;background:#111;color:#fff;border-radius:12px;padding:11px 14px;font-weight:850;flex:1}.btn.alt{background:#fff;color:#111;border-color:#ccc}
.channels{display:grid;grid-template-columns:1fr 1fr;gap:12px}.channel{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:14px}.channel h3{margin:0 0 6px;font-size:19px}.channel p{margin:0;color:var(--muted);font-size:13px}.pill{display:inline-block;border:1px solid #ddd;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900;margin-right:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:100;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:22px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}.modalHead{display:flex;justify-content:space-between;gap:20px;align-items:center}.close{border:1px solid #ddd;background:#fff;border-radius:50%;width:40px;height:40px}.detail{display:grid;grid-template-columns:260px 1fr;gap:24px;margin-top:18px}.detail img{border-radius:16px;aspect-ratio:3/4;object-fit:cover;background:#eee}.specs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.spec{padding:10px;border-radius:11px;background:var(--soft);font-size:13px}.spec b{display:block;font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.searchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.searchgrid label{font-size:12px;font-weight:850}.searchgrid select,.searchgrid input{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin-top:5px}
.profileGrid{display:grid;grid-template-columns:220px 1fr;gap:20px}.side{border:1px solid var(--line);border-radius:16px;padding:12px;height:max-content}.side button{width:100%;text-align:left;background:#fff;border:0;padding:12px;border-radius:10px;font-weight:800}.side button.active{background:#f0f0eb}.panel{border:1px solid var(--line);border-radius:16px;padding:20px}
.notice{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.notice.unread{background:#f7f7f3;font-weight:750}
.auctionShell{position:fixed;inset:0;background:#090909;color:#fff;z-index:200;overflow:hidden}.auctionBg{position:absolute;inset:0;display:grid;place-items:center;padding:72px 4vw 230px;background:radial-gradient(circle at 50% 38%,#30302d,#090909 65%)}.auctionBg img{max-height:calc(100vh - 300px);max-width:min(70vw,760px);width:auto;height:auto;object-fit:contain;border-radius:22px;box-shadow:0 20px 80px rgba(0,0,0,.5)}.auctionTop{position:absolute;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;align-items:center;z-index:2}.returnBtn{background:rgba(0,0,0,.72);color:#fff;border:1px solid #333;border-radius:12px;padding:10px 14px;font-weight:850}.channelName{font-weight:900;font-size:18px}.ext{font-size:12px;font-weight:800;color:#ddd;min-width:150px;text-align:right}.auctionBottom{position:absolute;left:22px;right:22px;bottom:20px;z-index:3}.productLine{font-size:14px;font-weight:800;margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bidrow{display:grid;grid-template-columns:minmax(300px,1fr) 180px 150px;gap:12px;align-items:stretch}.swipe{background:#fff;color:#111;border:0;border-radius:16px;min-height:68px;font-size:19px;font-weight:950;position:relative;text-align:center}.custom{background:transparent;color:#fff;border:1px solid #777;border-radius:16px;min-height:50px;font-weight:850;margin-top:8px;width:100%}.bidbox,.timebox{border-left:1px solid #444;padding-left:16px;display:flex;flex-direction:column;justify-content:center}.label{font-size:10px;letter-spacing:.12em;font-weight:900;color:#aaa}.big{font-size:31px;font-weight:950;line-height:1.05}.timebig{font-size:25px;font-weight:900}.channelInfo{font-size:12px;color:#bbb;margin-top:12px;display:flex;gap:10px;align-items:center}.infoIcon{border:1px solid #888;border-radius:50%;width:25px;height:25px;display:grid;place-items:center;font-weight:900}
@media(max-width:800px){.nav{gap:14px;padding:9px 14px}.brand{font-size:24px}.brandMark{width:36px;height:36px}.navbtn{font-size:14px}main{padding:20px 14px 70px}h1{font-size:36px}.grid{grid-template-columns:1fr 1fr}.channels{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.detail img{max-height:360px;margin:auto}.profileGrid{grid-template-columns:1fr}.bidrow{grid-template-columns:1fr 105px 105px;gap:7px}.swipe{font-size:16px;min-height:64px}.custom{font-size:12px}.big{font-size:25px}.auctionBg{padding:65px 10px 245px}.auctionBg img{max-width:90vw;max-height:calc(100vh - 310px)}.productLine{font-size:13px}.ext{min-width:90px}}
</style></head><body><div id="app"></div><div id="modalRoot"></div>
<script>
const IMG={
  lugia:'https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?auto=format&fit=crop&w=1200&q=86',
  cards:'https://images.unsplash.com/photo-1601645191163-3fc0d5d64e35?auto=format&fit=crop&w=1200&q=86',
  vintage:'https://images.unsplash.com/photo-1599490659213-e2b9527bd087?auto=format&fit=crop&w=1200&q=86'
};
const seedNames=['Umbreon VMAX','Rayquaza VMAX','Espeon VMAX','Pikachu VMAX','Mew ex','Tyranitar V','Gengar VMAX','Mewtwo VSTAR','Blastoise','Charizard ex','Gardevoir','Lugia V','Entei','Alakazam V','Zekrom','Reshiram & Charizard GX','Sylveon VMAX','Magikarp Wailord GX','Giratina V','Dragonite V','Mewtwo GX','Jolteon VMAX','Aerodactyl V','Machamp V','Darkrai VSTAR','Arceus VSTAR','Celebi VMAX','Rayquaza V','Pikachu ex','Charizard VMAX'];
const sets=['Evolving Skies','Silver Tempest','Secret Wonders','Shining Legends','Vivid Voltage','Lost Origin','Crown Zenith','Astral Radiance','Celebrations','Obsidian Flames','151','Brilliant Stars'];
const variants=['Alternate Art','Holo','Special Illustration Rare','Illustration Rare','Secret Rare','Classic Collection','Promo','Reverse Holo'];
const STORAGE='rapidup_function_first_v1';
const channels=[
 {id:'c1',name:'Modern Chase',criteria:{auctionType:'ELASTIC',starting:'$1–$100',year:'2020–2026',era:'Modern',condition:'Raw / Graded',language:'English',variant:'Any',presentation:'Standard / Premium'}},
 {id:'c2',name:'Vintage English',criteria:{auctionType:'SUDDEN DEATH',starting:'$1–$100',year:'1999–2003',era:'Vintage',condition:'Raw / Graded',language:'English',variant:'Any',presentation:'Standard / Premium'}},
 {id:'c3',name:'Japanese & Regional',criteria:{auctionType:'ELASTIC',starting:'$1–$100',year:'2004–2019',era:'Mid Era',condition:'Raw / Graded',language:'Japanese',variant:'Any',presentation:'Standard / Premium'}},
 {id:'c4',name:'Graded Chase',criteria:{auctionType:'SUDDEN DEATH',starting:'$1–$250',year:'1999–2026',era:'Vintage / Mid Era / Modern',condition:'Graded',language:'English',variant:'Any',presentation:'Standard / Premium'}}
];
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function uid(p='x'){return p+Math.random().toString(36).slice(2,9)}
function eraFor(y){return y<=2003?'Vintage':y<=2019?'Mid Era':'Modern'}
function makeItem(i,cid,method='auction'){const c=channels.find(x=>x.id===cid);const year=cid==='c1'?2020+i%7:cid==='c2'?1999+i%5:cid==='c3'?2004+i%16:1999+i%28;const condition=(cid==='c4'||i%3!==0)?'Graded':'Raw';const grade=condition==='Graded'?['PSA 10','PSA 9','CGC 9.5','BGS 9.5'][i%4]:'Raw';const presentation=i%2?'Standard':'Premium';const variant=variants[i%variants.length];const name=seedNames[(i*7+cid.charCodeAt(1))%seedNames.length];const set=sets[(i+cid.charCodeAt(1))%sets.length];const fullName=year+' Pokemon '+set+' '+variant+' '+name+' #'+(12+i*7)+(condition==='Graded'?' '+grade:'');const start=1+(i%6)*5;const price=99+(i%6)*25;const now=Date.now();return {id:uid('i'),name,set,fullName,year,era:eraFor(year),category:'Pokemon',method,type:method==='auction'?'Auction':'Buy Now',auctionType:c?.criteria.auctionType||'ELASTIC',startingPrice:start,current:start,price,bidCount:0,grade,condition,language:cid==='c3'?'Japanese':'English',lang:cid==='c3'?'Japanese':'English',variant,presentation,channelId:cid,channel:c?.name,img:Object.values(IMG)[i%3],sold:false,active:method==='auction'?false:true,endsAt:0,queueIndex:i,internal:{category:'Pokemon',year,era:eraFor(year),condition,language:cid==='c3'?'Japanese':'English',variant,presentation,auctionType:c?.criteria.auctionType,startingPrice:start} ,elastic:{used:new Set(),cycleStart:null,lastExtension:0,nextExtension:0,coefficient:.2}}}
let items=[];channels.forEach(c=>{for(let i=0;i<18;i++)items.push(makeItem(i,c.id,'auction'))});for(let i=0;i<8;i++)items.push(makeItem(i,'c1','buy'));
const state={page:'explore',activeAuction:null,channel:null,modal:null,searchOpen:false,search:{q:'',category:'',year:'',condition:'',language:'',variant:'',presentation:'',selling:'',auctionType:'',start:''},notifications:[{id:'n1',text:'Umbreon VMAX is now live in Modern Chase.',read:false},{id:'n2',text:'A seller countered your offer on Lugia V.',read:false}],offers:[],profileOpen:false,profileTab:'overview',queueOffers:{},bidHistory:{}};
// First item in every auction channel is live; following items are genuinely queued.
channels.forEach(c=>{const arr=items.filter(x=>x.channelId===c.id&&x.method==='auction');arr.forEach((x,j)=>x.queueIndex=j);const live=arr[0];live.active=true;live.endsAt=Date.now()+180000;live.current=live.startingPrice;});
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({items:items.map(x=>({...x,elastic:undefined})),state:{...state,activeAuction:null,modal:null}}))}catch(e){}}
function activeItems(){return items.filter(x=>!x.sold&&((x.method==='buy'&&x.active)|| (x.method==='auction'&&x.active&&x.endsAt>Date.now())))}
function channelItems(cid){return items.filter(x=>x.channelId===cid&&x.method==='auction'&&!x.sold).sort((a,b)=>a.queueIndex-b.queueIndex)}
function matchesCriteria(x,c){const q=c.criteria,d=x.internal||{};const parts=q.year.split('–').map(Number);const lo=parts[0],hi=parts[1];const money=q.starting.replace(/[^0-9–-]/g,'').replace('-','–').split('–').map(Number);const slo=money[0]||0,shi=money[1]||Infinity;return d.auctionType===q.auctionType&&d.year>=lo&&d.year<=hi&&q.era.includes(d.era)&&q.condition.includes(d.condition)&&q.language.includes(d.language)&&q.presentation.includes(d.presentation)&&d.startingPrice>=slo&&d.startingPrice<=shi}
function eligibleQueue(cid){const c=channels.find(c=>c.id===cid);return items.filter(x=>x.method==='auction'&&!x.sold&&!x.ended&&matchesCriteria(x,c)).sort((a,b)=>a.queueIndex-b.queueIndex)}
function promoteNext(cid){const arr=channelItems(cid);const next=arr.find(x=>!x.active&&!x.ended);if(next){next.active=true;next.endsAt=Date.now()+180000;next.current=next.startingPrice;next.bidCount=0;next.elastic={used:new Set(),cycleStart:null,lastExtension:0,nextExtension:0,coefficient:.2}}}
function formatTime(ms){ms=Math.max(0,ms);let t=Math.ceil(ms/10)/100;let m=Math.floor(t/60);let s=Math.floor(t%60);let cs=Math.floor((t-Math.floor(t))*100);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0')}
function elasticExtension(item,remaining){const r=Math.max(0,remaining/1000);if(r>30||r<=0)return 0;const n=Math.floor(r);if(item.elastic.used.has(n))return 0;item.elastic.used.add(n);let coef=.2;if(item.elastic.cycleStart!==null){const distance=Math.max(0,n-item.elastic.cycleStart);coef=.2/Math.pow(2,Math.max(0,distance>0?Math.floor(distance/1):0));}item.elastic.cycleStart=n+1;const add=(30-n)*coef;item.elastic.lastExtension=add;item.elastic.coefficient=coef;return add*1000}
function placeBid(item,amount){if(!item?.active||item.sold)return;amount=Math.max(Number(amount)||0,item.current+1);item.current=amount;item.bidCount++;const before=Math.max(0,item.endsAt-Date.now());if(item.auctionType==='ELASTIC'&&before<=30000){const add=elasticExtension(item,before);if(add>0)item.endsAt+=add;}save();render();}
function enterAuction(id){const x=items.find(i=>i.id===id);if(!x||x.method!=='auction'||!x.active)return;state.activeAuction=id;state.page='auction';render()}
function openSummary(id){state.modal=id;renderModal()}
function closeModal(){state.modal=null;renderModal()}
function returnDash(){state.activeAuction=null;state.page='explore';render()}
function criteriaText(c){return Object.entries(c.criteria).map(([k,v])=>k+': '+v).join(' · ')}
function card(x){return `<article class="card"><div class="media" data-act="summary" data-id="${x.id}"><img class="cardimg" src="${esc(x.img)}" alt=""><span class="tag">${x.method==='buy'?'BUY NOW':'AUCTION'}</span></div><div class="cardbody"><div class="cardtitle">${esc(x.fullName)}</div><div class="price">$${x.method==='buy'?x.price||129:x.current}</div><div class="meta">${x.method==='auction'?formatTime(x.endsAt-Date.now())+' remaining':'Available now'}</div><div class="actions">${x.method==='buy'?`<button class="btn" data-act="buy" data-id="${x.id}">Buy Now</button>`:`<button class="btn" data-act="join" data-id="${x.id}">View Auction</button>`}<button class="btn alt" data-act="summary" data-id="${x.id}">Inspect</button></div></div></article>`}
function renderExplore(){const list=activeItems().filter(x=>{const f=state.search;return (!f.q||x.fullName.toLowerCase().includes(f.q.toLowerCase()))&&(!f.category||x.category===f.category)&&(!f.year||String(x.year)===f.year)&&(!f.condition||x.condition===f.condition)&&(!f.language||x.language===f.language)&&(!f.variant||x.variant===f.variant)&&(!f.presentation||x.presentation===f.presentation)&&(!f.selling||x.method===f.selling)});return `<main><div class="toolbar"><h1 style="margin-right:auto">Explore</h1><button class="searchBtn" data-act="search">⌕</button></div><div class="toolbar"><select class="select" data-filter="category"><option value="">All categories</option><option>Pokemon</option></select><select class="select" data-filter="selling"><option value="">All selling methods</option><option value="auction">Auction</option><option value="buy">Buy Now</option></select><span class="meta">${list.length} results</span></div><div class="grid">${list.map(card).join('')}</div></main>`}
function renderAuctions(){return `<main><h1>Auctions</h1><div class="channels">${channels.map(c=>{const arr=channelItems(c.id);const live=arr.find(x=>x.active);return `<section class="channel"><div><div><span class="pill">${c.criteria.auctionType}</span><span class="pill">${c.criteria.starting}</span></div><h3>${c.name}</h3><p>${esc(criteriaText(c))}</p><p style="margin-top:7px">${live?esc(live.fullName)+' · '+formatTime(live.endsAt-Date.now()):'No active item'}</p></div><button class="btn" style="max-width:140px" data-act="channel" data-id="${c.id}">Open Channel</button></section>`}).join('')}</div></main>`}
function renderProfile(){return `<main><h1>Profile</h1><div class="profileGrid"><div class="side">${['overview','offers','notifications','interests'].map(t=>`<button class="${state.profileTab===t?'active':''}" data-profile="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div class="panel"><h2>${state.profileTab[0].toUpperCase()+state.profileTab.slice(1)}</h2><p class="meta">RapidUp buyer and seller hub.</p>${state.profileTab==='overview'?'<p>Manage interests, offers, purchases and seller activity from one place.</p>':''}${state.profileTab==='offers'?'<p>No active offers in this demo.</p>':''}${state.profileTab==='interests'?'<p>Umbreon VMAX · Lugia V · Japanese · PSA 10</p>':''}${state.profileTab==='notifications'?renderNotices():''}</div></div></main>`}
function renderNotices(){return state.notifications.map(n=>`<div class="notice ${n.read?'':'unread'}" data-notice="${n.id}">${esc(n.text)}</div>`).join('')||'<p>No notifications.</p>'}
function renderHeader(){const unread=state.notifications.filter(n=>!n.read).length;return `<header class="topbar"><nav class="nav"><div class="brand"><div class="brandMark">◈</div><div>RAPIDUP<small>COLLECTIBLES MARKETPLACE</small></div></div><button class="navbtn ${state.page==='explore'?'active':''}" data-nav="explore">Explore</button><button class="navbtn ${state.page==='auctions'?'active':''}" data-nav="auctions">Auctions</button><button class="navbtn ${state.page==='buy'?'active':''}" data-nav="buy">Buy Now</button><button class="round" data-act="notifications">♢<span class="badge">${unread}</span></button><button class="round" data-act="profile">S</button></nav></header>`}
function renderBuy(){const list=items.filter(x=>x.method==='buy'&&x.active&&!x.sold);return `<main><h1>Buy Now</h1><div class="grid">${list.map(card).join('')}</div></main>`}
function render(){if(state.page==='auction'&&state.activeAuction)return renderAuction();document.getElementById('app').innerHTML=renderHeader()+(state.page==='explore'?renderExplore():state.page==='auctions'?renderAuctions():renderBuy());bind();save()}
function renderAuction(){const x=items.find(i=>i.id===state.activeAuction);if(!x||!x.active){returnDash();return}const ext=x.elastic?.lastExtension||0;document.getElementById('app').innerHTML=`<div class="auctionShell"><div class="auctionTop"><button class="returnBtn" data-act="return">← Return to Dashboard</button><div class="channelName">${esc(x.channel)}</div><div class="ext">${x.auctionType==='ELASTIC'&&Date.now()<x.endsAt&&x.endsAt-Date.now()<=30000?'NEXT EXTENSION +'+(x.elastic.nextExtension||0).toFixed(2)+'s':''}</div></div><div class="auctionBg"><img src="${esc(x.img)}" alt="${esc(x.fullName)}"></div><div class="auctionBottom"><div class="productLine">${esc(x.fullName)}</div><div class="bidrow"><div><button class="swipe" data-act="bid" data-id="${x.id}">→ &nbsp; SWIPE TO BID $${x.current+1}</button><button class="custom" data-act="custom" data-id="${x.id}">CUSTOM BID</button></div><div class="bidbox"><span class="label">CURRENT BID</span><span class="big">$${x.current}</span><span class="meta">${x.bidCount} bids</span></div><div class="timebox"><span class="label">TIME REMAINING</span><span class="timebig" id="auctionTimer">${formatTime(x.endsAt-Date.now())}</span></div></div><div class="channelInfo"><span class="infoIcon">i</span><span>${esc(criteriaText(channels.find(c=>c.id===x.channelId)))}</span></div></div></div>`;bind()}
function renderModal(){const root=document.getElementById('modalRoot');if(!state.modal){root.innerHTML='';return}const x=items.find(i=>i.id===state.modal);if(!x){root.innerHTML='';return}root.innerHTML=`<div class="overlay"><div class="modal"><div class="modalHead"><h2>Item Summary</h2><button class="close" data-act="close">×</button></div><div class="detail"><img src="${esc(x.img)}"><div><h2>${esc(x.fullName)}</h2><div class="price">$${x.method==='buy'?x.price||129:x.current}</div><div class="specs">${[['Category',x.category],['Year',x.year],['Era',x.era],['Condition',x.condition],['Language',x.language],['Variant',x.variant],['Presentation',x.presentation],['Selling method',x.type],['Auction type',x.auctionType||'—'],['Starting price','$'+x.startingPrice]].map(a=>`<div class="spec"><b>${a[0]}</b>${esc(a[1])}</div>`).join('')}</div>${x.method==='auction'&&x.active?`<button class="btn" data-act="join" data-id="${x.id}">Join Auction</button>`:x.method==='buy'?`<button class="btn" data-act="buy" data-id="${x.id}">Buy Now</button>`:`<button class="btn alt" data-act="queue" data-id="${x.id}">View Queue</button>`}</div></div></div></div>`;bind()}
function openSearch(){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="overlay"><div class="modal"><div class="modalHead"><h2>Search & Filters</h2><button class="close" data-act="close-search">×</button></div><div class="searchgrid"><label>Item<input data-sf="q" placeholder="Search item"></label><label>Category<select data-sf="category"><option value="">Any</option><option>Pokemon</option></select></label><label>Year<input data-sf="year" inputmode="numeric"></label><label>Condition<select data-sf="condition"><option value="">Any</option><option>Raw</option><option>Graded</option></select></label><label>Language<select data-sf="language"><option value="">Any</option><option>English</option><option>Japanese</option></select></label><label>Variant<select data-sf="variant"><option value="">Any</option>${variants.map(v=>`<option>${esc(v)}</option>`).join('')}</select></label><label>Presentation<select data-sf="presentation"><option value="">All</option><option>Standard</option><option>Premium</option></select></label><label>Selling Method<select data-sf="selling"><option value="">Any</option><option value="auction">Auction</option><option value="buy">Buy Now</option></select></label><label>Auction Type<select data-sf="auctionType"><option value="">Any</option><option>ELASTIC</option><option>SUDDEN DEATH</option></select></label><label>Starting Price<input data-sf="start" placeholder="e.g. 1-50"></label></div><div class="actions"><button class="btn alt" data-act="close-search">Cancel</button><button class="btn" data-act="apply-search">Apply Filters</button></div></div></div>`;bind()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.page=b.dataset.nav;state.activeAuction=null;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handle(b.dataset.act,b.dataset.id));document.querySelectorAll('[data-filter]').forEach(s=>s.onchange=()=>{state.search[s.dataset.filter]=s.value;render()});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{state.profileTab=b.dataset.profile;render()});document.querySelectorAll('[data-notice]').forEach(b=>b.onclick=()=>{const n=state.notifications.find(n=>n.id===b.dataset.notice);if(n)n.read=true;render()});document.querySelectorAll('[data-sf]').forEach(e=>e.oninput=()=>state.search[e.dataset.sf]=e.value)}
function handle(act,id){if(act==='search')return openSearch();if(act==='close')return closeModal();if(act==='close-search')return document.getElementById('modalRoot').innerHTML='';if(act==='apply-search'){document.getElementById('modalRoot').innerHTML='';render();return}if(act==='summary')return openSummary(id);if(act==='join'){closeModal();enterAuction(id);return}if(act==='return')return returnDash();if(act==='channel'){state.page='auctions';state.channel=id;renderChannel(id);return}if(act==='queue'){state.page='auctions';render();return}if(act==='buy'){const x=items.find(i=>i.id===id);if(x){x.sold=true;x.active=false;state.notifications.unshift({id:uid('n'),text:'Purchase completed: '+x.fullName,read:false});render()}return}if(act==='notifications'){state.profileTab='notifications';state.page='profile';render();return}if(act==='profile'){state.page='profile';render();return}if(act==='offer'){const x=items.find(i=>i.id===id);const v=prompt('Enter your offer amount',String(x.current+5));if(v){state.offers.unshift({id:uid('o'),item:id,amount:Number(v),status:'active',created:Date.now()});save();renderChannel(x.channelId)}return}if(act==='bid'){const x=items.find(i=>i.id===id);placeBid(x,x.current+1);return}if(act==='custom'){const x=items.find(i=>i.id===id);const v=prompt('Enter bid amount',String(x.current+1));if(v)placeBid(x,Number(v));return}}
function renderChannel(cid){const c=channels.find(x=>x.id===cid);const arr=eligibleQueue(cid);document.getElementById('app').innerHTML=renderHeader()+`<main><div class="toolbar"><button class="btn alt" style="max-width:160px" data-nav="auctions">← Auction Directory</button><h1 style="margin:0 auto 0 0">${esc(c.name)}</h1></div><p class="meta">${esc(criteriaText(c))}</p><div class="card" style="margin-top:18px;padding:18px"><h2>Public Queue</h2>${arr.map((x,i)=>`<div class="channel"><div><b>${i===0?'LIVE':'#'+(i+1)}</b> · ${esc(x.fullName)}<div class="meta">${i===0?formatTime(x.endsAt-Date.now()):'Upcoming'} · ${x.auctionType}</div></div><div class="actions" style="max-width:260px"><button class="btn" data-act="${i===0?'join':'offer'}" data-id="${x.id}">${i===0?'Join Auction':'Make Offer'}</button><button class="btn alt" data-act="summary" data-id="${x.id}">Inspect</button></div></div>`).join('')}</div></main>`;bind()}
function tick(){const now=Date.now();items.filter(x=>x.method==='auction'&&x.active&&x.endsAt&&x.endsAt<=now&&!x.sold).forEach(x=>{x.active=false;x.ended=true;x.endsAt=0;promoteNext(x.channelId)});if(state.page==='auction'&&state.activeAuction){const x=items.find(i=>i.id===state.activeAuction);if(!x||!x.active)return returnDash();const el=document.getElementById('auctionTimer');if(el)el.textContent=formatTime(x.endsAt-now);const e=x.elastic;if(x.auctionType==='ELASTIC'&&x.endsAt-now<=30000&&x.endsAt-now>0){const r=Math.floor((x.endsAt-now)/1000);const coef=.2;const predicted=(30-r)*coef;if(e)e.nextExtension=predicted;const ex=document.querySelector('.ext');if(ex)ex.textContent='NEXT EXTENSION +'+predicted.toFixed(2)+'s'}}else if(state.page!=='auction'){document.querySelectorAll('.meta').forEach(()=>{})}}
setInterval(tick,50);setInterval(()=>{if(state.page!=='auction')render()},1000);
render();
</script></body></html>
