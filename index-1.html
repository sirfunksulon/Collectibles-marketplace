<script>
/* CONTINUUM refinement build: this script extends the existing prototype into a stateful product simulation. */
const STORAGE_KEY='continuum_refinement_v10';
const IMG={
  lugia:'https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?auto=format&fit=crop&w=1200&q=86',
  cards:'https://images.unsplash.com/photo-1601645191163-3fc0d5d64e35?auto=format&fit=crop&w=1200&q=86',
  vintage:'https://images.unsplash.com/photo-1599490659213-e2b9527bd087?auto=format&fit=crop&w=1200&q=86'
};
const channels=[
 {id:'c1',name:'Modern Chase',category:'Modern Pokémon',auctionType:'ELASTIC',description:'High-demand modern chase cards, alternate arts and premium modern singles.',info:'Three-minute perpetual public auctions. Elastic bidding can extend the clock during the final 30-second zone using CONTINUUM’s inverse mirrored-number model. Each qualifying re-up halves the coefficient until the current decay cycle resets.',color:'elastic'},
 {id:'c2',name:'Vintage English',category:'Vintage Pokémon',auctionType:'SUDDEN DEATH',description:'Vintage English cards, WOTC-era pieces and established collector favorites.',info:'Three-minute perpetual public auctions. Bidding is completely independent of the timer. At 0:00 the current high bid wins and the next queue position becomes active.',color:'sudden'},
 {id:'c3',name:'Japanese & Regional',category:'Japanese / Regional',auctionType:'ELASTIC',description:'Japanese-language cards, regional releases and language-specific variants.',info:'Three-minute perpetual public auctions using the inverse elastic model. Qualifying bids in the 1–30 second zone can add decimal time; coefficient decay prevents runaway extension.',color:'elastic'},
 {id:'c4',name:'Graded Chase',category:'Graded Collectibles',auctionType:'SUDDEN DEATH',description:'Graded chase cards and premium slabs across eras and sets.',info:'Three-minute perpetual sudden-death auctions. The clock never responds to bids. The next slab enters at 3:00 as soon as the current one closes.',color:'sudden'}
];
const seedNames=['Umbreon VMAX','Rayquaza VMAX','Espeon VMAX','Pikachu VMAX','Mew ex','Tyranitar V','Gengar VMAX','Mewtwo VSTAR','Blastoise','Charizard ex','Gardevoir','Lugia V','Entei','Alakazam V','Zekrom','Reshiram & Charizard GX','Sylveon VMAX','Magikarp Wailord GX','Giratina V','Dragonite V','Mewtwo GX','Jolteon VMAX','Aerodactyl V','Machamp V','Darkrai VSTAR','Arceus VSTAR','Celebi VMAX','Rayquaza V','Pikachu ex','Charizard VMAX'];
const sets=['Evolving Skies','Silver Tempest','Secret Wonders','Shining Legends','Vivid Voltage','Lost Origin','Crown Zenith','Astral Radiance','Celebrations','Obsidian Flames','151','Brilliant Stars'];
const variants=['Alternate Art','Holo','Special Illustration Rare','Illustration Rare','Secret Rare','Classic Collection','Promo','Reverse Holo'];
const grades=['Raw','PSA 10','PSA 9','CGC 9.5','BGS 9.5'];
let items=[];
function makeAuctionItem(id,k,c){
 const nm=seedNames[(c*17+k)%seedNames.length];
 const base=35+((c*50+k)*7)%430;
 return {id,name:k<seedNames.length?nm:`${nm} · ${k+1}`,set:`${sets[(c*3+k)%sets.length]} #${20+(k*7)%190}`,method:'auction',type:'Auction',channel:c.name,channelId:c.id,auctionType:c.auctionType,market:base+35,grade:grades[(k+c)%grades.length],lang:(k+c)%4===0?'Japanese':'English',variant:variants[(k+c)%variants.length],img:[IMG.lugia,IMG.cards,IMG.vintage][(k+c)%3],sold:false,current:1,bidCount:(k+c)%4,seconds:0,endsAt:0,auction:{coef:.2,cycleFloor:5,lastReupAt:null,lastTrigger:null,reups:0}};
}
channels.forEach((c,ci)=>{for(let k=0;k<50;k++)items.push(makeAuctionItem('a'+(ci*50+k+1),k,c));});
items.push(
 {id:'b1',name:'Lugia V',set:'Silver Tempest #186',method:'buy',type:'Buy Now',price:129,market:154,grade:'PSA 10',lang:'English',variant:'Alternate Art',img:IMG.lugia,sold:false},
 {id:'b2',name:'Charizard ex',set:'Obsidian Flames #223',method:'buy',type:'Buy Now',price:129,market:145,grade:'PSA 10',lang:'English',variant:'Special Illustration Rare',img:IMG.cards,sold:false},
 {id:'b3',name:'Entei',set:'Secret Wonders #4',method:'buy',type:'Buy Now',price:179,market:210,grade:'Raw',lang:'English',variant:'Holo',img:IMG.vintage,sold:false},
 {id:'b4',name:'Reshiram & Charizard GX',set:'Sun & Moon Promo',method:'buy',type:'Buy Now',price:199,market:245,grade:'PSA 10',lang:'English',variant:'Promo',img:IMG.lugia,sold:false},
 {id:'b5',name:'Jolteon VMAX',set:'Evolving Skies #051',method:'buy',type:'Buy Now',price:214,market:242,grade:'PSA 10',lang:'English',variant:'Alternate Art',img:IMG.cards,sold:false},
 {id:'b6',name:'Blastoise',set:'Base Set 2 #31',method:'buy',type:'Buy Now',price:168,market:190,grade:'PSA 8',lang:'English',variant:'Holo',img:IMG.vintage,sold:false}
);
function initialState(){
 const now=Date.now();
 const s={page:'explore',activeItem:'a1',queueChannel:null,modal:null,profile:false,userMode:'buyer',search:'',sort:'activity',buyerTab:'overview',sellerTab:'overview',activity:'',toast:'',channelPos:{c1:0,c2:0,c3:0,c4:0},lastTick:now,offers:[],bids:[],won:[],purchases:[],notifications:[],interests:['Umbreon VMAX','Lugia V','Japanese','PSA 10'],privateAuctions:{},readNotifications:[],seeded:true};
 s.offers=[
  {id:'o-seed-1',item:'b1',buyer:'You',amount:150,status:'active',created:now-2*3600000,expires:now+22*3600000,wave:0},
  {id:'o-seed-2',item:'b1',buyer:'Buyer B',amount:121,status:'active',created:now-1*3600000,expires:now+23*3600000,wave:0},
  {id:'o-seed-3',item:'a1',buyer:'You',amount:150,status:'active',created:now-3*3600000,expires:now+9*3600000,wave:0},
  {id:'o-seed-4',item:'a1',buyer:'Buyer D',amount:140,status:'active',created:now-4*3600000,expires:now+11*3600000,wave:0}
 ];
 s.bids=[{id:'bid-seed-1',item:'a1',amount:94,created:now-10000},{id:'bid-seed-2',item:'a2',amount:82,created:now-20000}];
 s.privateAuctions={b1:{active:true,item:'b1',current:165,previousSellerCounter:150,deadline:now+110000,wave:2,participants:2,responses:[{offerId:'o-seed-1',amount:150,engaged:true,buyer:'You'},{offerId:'o-seed-2',amount:158,engaged:true,buyer:'Buyer B'}],history:[{wave:1,seller:165,responses:[145,158]}]}};items.find(x=>x.id==='b1').privateAuction={active:true};
 s.notifications=[
  {id:'n1',text:'Umbreon VMAX is now live in Modern Chase.',type:'AUCTION LIVE',target:'auction',item:'a1',read:false,created:now-4*60000},
  {id:'n2',text:'A seller countered your offer on Lugia V.',type:'PRIVATE AUCTION',target:'private',item:'b1',read:false,created:now-18*60000},
  {id:'n3',text:'Your offer on Umbreon VMAX expires in 9 hours.',type:'OFFER EXPIRING',target:'offer',item:'a1',read:false,created:now-34*60000},
  {id:'n4',text:'A matching graded Lugia entered Buy Now.',type:'CONCIERGE',target:'item',item:'b1',read:true,created:now-3*3600000}
 ];
 return s;
}
let state=loadState();
function loadState(){
 try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const s=JSON.parse(raw);if(s&&s.channelPos&&Array.isArray(s.offers)){const base=initialState();const merged={...base,...s};items.forEach(x=>{const saved=(s.itemState||{})[x.id];if(saved)Object.assign(x,saved)});normalizeAuctions();return merged;}}}catch(e){console.warn('CONTINUUM state reset',e)}
 const s=initialState();normalizeAuctions(s);return s;
}
function normalizeAuctions(s=state){const now=Date.now();channels.forEach(c=>{
 const pool=items.filter(x=>x.channelId===c.id);
 let pos=Number(s.channelPos[c.id]||0)%pool.length;s.channelPos[c.id]=pos;
 pool.forEach((x,i)=>{x.method='auction';x.auctionType=c.auctionType;x.channel=c.name;x.channelId=c.id;x.auction=x.auction||{coef:.2,cycleFloor:5,lastReupAt:null,lastTrigger:null,reups:0,decayActive:false};if(i===pos&&!x.sold){if(!x.endsAt||x.endsAt<=now){x.endsAt=now+180000;x.current=Math.max(1,Math.max(...(s.offers||[]).filter(o=>o.item===x.id&&o.status==='active'&&o.expires>Date.now()).map(o=>Number(o.amount)||0),0));x.bidCount=Number(x.bidCount||0)}x.status='Live';}else{x.endsAt=0;x.status='Auction queue';x.current=1;}});
 });
}
function save(){state.lastTick=Date.now();state.unread=state.notifications.filter(n=>!n.read).length;state.itemState={};items.forEach(x=>state.itemState[x.id]={endsAt:x.endsAt,current:x.current,bidCount:x.bidCount,sold:x.sold,status:x.status,auction:x.auction,method:x.method,price:x.price});try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function money(n){return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2,minimumFractionDigits:0})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function item(id){return items.find(x=>x.id===id)} function channel(id){return channels.find(x=>x.id===id)}
function tags(x){return `<span class="tag">${esc(x.grade)}</span><span class="tag">${esc(x.lang)}</span><span class="tag">${esc(x.variant)}</span>`}
function img(x){return `<img src="${x.img}" alt="${esc(x.name)} collectible" loading="lazy">`}
function remainingMs(x){return Math.max(0,(x.endsAt||0)-Date.now())}
function secondsLeft(x){return remainingMs(x)/1000}
function fmt(sec){sec=Math.max(0,sec);const m=Math.floor(sec/60),s=Math.floor(sec%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function fmtPrecise(sec){return `${Math.max(0,sec).toFixed(1)}s`}
function activeForChannel(cid){const c=channel(cid),pool=items.filter(x=>x.channelId===cid);const pos=state.channelPos[cid]||0;return pool[pos]||pool[0]}
function activeOffers(itemId){return state.offers.filter(o=>o.item===itemId&&o.status==='active'&&o.expires>Date.now())}
function myOffer(itemId){return activeOffers(itemId).filter(o=>o.buyer==='You').sort((a,b)=>b.created-a.created)[0]}
function myBid(itemId){return state.bids.filter(b=>b.item===itemId).sort((a,b)=>b.created-a.created)[0]}
function setToast(msg){state.toast=msg;render();clearTimeout(window.__toast);window.__toast=setTimeout(()=>{state.toast='';render()},3000)}
function activity(msg){state.activity=msg;render();clearTimeout(window.__activity);window.__activity=setTimeout(()=>{state.activity='';render()},3200)}
function notify(text,target,itemId,type='MARKETPLACE'){state.notifications.unshift({id:'n'+Date.now()+Math.random(),text,target,item:itemId,type,read:false,created:Date.now()});state.unread=state.notifications.filter(n=>!n.read).length;save()}
function route(page){state.page=page;state.modal=null;state.profile=false;state.activeItem=state.activeItem||'a1';render();window.scrollTo(0,0)}
function openModal(type,data=null){state.modal={type,data};state.profile=false;render()}
function closeModal(){state.modal=null;render()}
function openProfile(){state.profile=true;state.modal=null;render()}
function closeProfile(){state.profile=false;render()}
function currentPath(){return state.page}
function header(){return `<header class="topbar"><nav class="nav"><div class="brand">CONTINUUM<small>COLLECTIBLES MARKETPLACE</small></div><a class="${state.page==='explore'?'active':''}" href="#" onclick="route('explore');return false">Explore</a><a class="${state.page==='auctions'||state.page==='auction'?'active':''}" href="#" onclick="route('auctions');return false">Auctions</a><a class="${state.page==='buy'||state.page==='item'?'active':''}" href="#" onclick="route('buy');return false">Buy Now</a><button class="icon" aria-label="Notifications" onclick="openModal('notifications')">♢<span class="badge">${state.notifications.filter(n=>!n.read).length||''}</span></button><button class="icon" aria-label="Profile" onclick="openProfile()">S</button></nav></header>`}
function itemCard(x){if(!x||x.sold)return '';const auction=x.method==='auction';return `<article class="card itemcard clickable" onclick="openItem('${x.id}')"><div class="itemimg">${img(x)}</div><div class="itembody"><div class="row"><span class="eyebrow">${esc(x.channel||'FEATURED')}</span><span class="pill ${auction?'live':''}">${auction?x.auctionType:'BUY NOW'}</span></div><h3 style="margin:8px 0 3px;font-size:23px;letter-spacing:-.04em">${esc(x.name)}</h3><div class="tiny muted">${esc(x.set)}</div><div>${tags(x)}</div><div class="price">${money(auction?x.current:x.price)}</div>${auction?`<div class="row tiny"><span>${x.bidCount||0} bids</span><span>${fmt(secondsLeft(x))}</span></div>`:`<div class="row tiny"><span>Market ${money(x.market)}</span><span>Immediate</span></div>`}<div style="display:flex;gap:8px;margin-top:13px" onclick="event.stopPropagation()"><button class="primary" onclick="${auction?`openAuction('${x.id}')`:`buyNow('${x.id}')`}">${auction?'View auction':'Buy Now'}</button><button class="secondary" onclick="makeOffer('${x.id}')">Make Offer</button></div></div></article>`}
function explore(){let list=items.filter(x=>!x.sold&&((x.method==='auction'&&x.bidCount>0)||(x.method==='buy')));if(state.search)list=list.filter(x=>(x.name+' '+x.set+' '+x.grade+' '+x.lang+' '+x.variant+' '+(x.channel||'')).toLowerCase().includes(state.search.toLowerCase()));const val=x=>x.method==='auction'?x.current:x.price;if(state.sort==='bid')list.sort((a,b)=>(b.current||0)-(a.current||0));else if(state.sort==='ending')list.sort((a,b)=>secondsLeft(a)-secondsLeft(b));else if(state.sort==='price')list.sort((a,b)=>val(a)-val(b));else if(state.sort==='new')list.sort((a,b)=>b.id.localeCompare(a.id));else if(state.sort==='category')list.sort((a,b)=>(a.channel||'').localeCompare(b.channel||''));else list.sort((a,b)=>(b.bidCount||0)-(a.bidCount||0));return `<main><section class="hero"><div class="eyebrow">ACTIVITY-LED DISCOVERY</div><h1>Find what matters.<br>Follow where it moves.</h1><p>Explore is deliberately curated. It surfaces active, meaningful marketplace activity rather than dumping every listing into one inventory grid.</p><div class="search"><input value="${esc(state.search)}" placeholder="Search card, set, variant, grade..." oninput="state.search=this.value;render()"><button class="primary" onclick="render()">Search</button></div></section><div class="sectionhead"><div><h2>Active discovery</h2><div class="tiny muted">Popular activity, meaningful bids and notable Buy Now inventory.</div></div><div class="filters"><select onchange="state.sort=this.value;render()"><option value="activity" ${state.sort==='activity'?'selected':''}>Popular</option><option value="bid" ${state.sort==='bid'?'selected':''}>Highest bid</option><option value="ending" ${state.sort==='ending'?'selected':''}>Ending soon</option><option value="new" ${state.sort==='new'?'selected':''}>Newest</option><option value="price" ${state.sort==='price'?'selected':''}>Price</option><option value="category" ${state.sort==='category'?'selected':''}>Category</option></select></div></div><div class="grid">${list.slice(0,12).map(itemCard).join('')}</div><div class="sectionhead"><h2>Marketplace activity</h2><span class="muted tiny">${items.filter(x=>!x.sold).length} active inventory objects · 200 auction positions</span></div><div class="hubGrid"><div class="card"><div class="eyebrow">PUBLIC AUCTIONS</div><h3>Four channels. One active item each.</h3><p class="muted">Specialized perpetual channels keep public bidding simple while queues hold the depth behind the active slot.</p><button class="secondary" onclick="route('auctions')">Browse channels</button></div><div class="card"><div class="eyebrow">DEMAND → LIQUIDITY</div><h3>Committed offers create options.</h3><p class="muted">Offers become usable seller intelligence without exposing private demand to buyers.</p><button class="secondary" onclick="route('buy')">See Buy Now</button></div></div></main>`}
function auctions(){return `<main><section class="hero"><div class="eyebrow">AUCTION DIRECTORY</div><h1>Choose a channel.<br>Join what is live.</h1><p>Every channel has one active item. Everything else lives behind its queue. Auction type is part of the channel identity.</p></section><div class="grid">${channels.map(c=>{const x=activeForChannel(c.id);return `<article class="card channel"><div class="row"><div><div class="eyebrow">${esc(c.category)}</div><h2 style="margin:5px 0;letter-spacing:-.045em">${esc(c.name)}</h2></div><button class="info" aria-label="Channel information" onclick="event.stopPropagation();openModal('channelInfo','${c.id}')">i</button></div><div class="auctionState"><span class="pill ${c.auctionType==='ELASTIC'?'elastic':'sudden'}">${c.auctionType}</span><span class="pill">3:00 START</span></div><div class="itemimg">${img(x)}</div><div class="row"><div><b>${esc(x.name)}</b><div class="tiny muted">${x.bidCount||0} bids · ${money(x.current)} current</div></div><b class="livePulse">${fmt(secondsLeft(x))}</b></div><div class="tiny muted">Position ${state.channelPos[c.id]+1} of 50 · 1 active item</div><div class="channel-actions"><button class="primary" onclick="openAuction('${x.id}')">Join auction</button><button class="secondary" onclick="openQueue('${c.id}')">Open queue</button></div></article>`}).join('')}</div></main>`}
function openAuction(id){const x=item(id);if(!x||x.sold)return setToast('That auction is no longer available.');if(x.status!=='Live')return openQueue(x.channelId);state.activeItem=id;state.page='auction';state.modal=null;render();window.scrollTo(0,0)}
function openItem(id){const x=item(id);if(!x)return;state.activeItem=id;state.page=x.method==='auction'?'auction':'item';render();window.scrollTo(0,0)}
function openQueue(cid){openModal('queue',cid)}
function queueModal(cid){const c=channel(cid),pool=items.filter(x=>x.channelId===cid),pos=state.channelPos[cid]||0;return `<div class="modal full queueShell"><div class="modalHead"><div><div class="eyebrow">${esc(c.category)}</div><h2>${esc(c.name)} · ${c.auctionType}</h2><div class="tiny muted">One active item at a time · 50-position queue</div></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>${c.auctionType} channel.</b> Queued items are selectable for preview, but only position ${pos+1} is active. Queued positions show the channel's <b>$1 starting convention</b>; live bids begin only when an item reaches the active slot.</div><div class="queueScroll">${pool.map((x,i)=>`<div class="queueItem ${i===pos?'activeRow':''}" onclick="queueSelect('${cid}',${i})"><div class="queueNum">${i+1}</div><img class="queueImg" src="${x.img}" alt="${esc(x.name)}"><div><b>${esc(x.name)}</b><div class="tiny muted">${esc(x.set)} · ${esc(x.grade)} · ${esc(x.lang)}</div><div>${tags(x)}</div></div><div>${i===pos?`<span class="queueStatus live">LIVE · ${fmt(secondsLeft(x))}</span><div class="tiny muted" style="text-align:right">${money(x.current)} · ${x.bidCount||0} bids</div>`:`<span class="queueStatus queued">QUEUED · $1 START</span>`}</div></div>`).join('')}</div></div>`}
function queueSelect(cid,i){const pool=items.filter(x=>x.channelId===cid),x=pool[i],pos=state.channelPos[cid];if(i===pos){closeModal();openAuction(x.id);return}openModal('queueItem',{cid,i,id:x.id})}
function queueItemModal(d){const x=item(d.id),c=channel(d.cid);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">QUEUE POSITION ${d.i+1}</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="auctionState"><span class="pill">${esc(c.name)}</span><span class="pill ${c.auctionType==='ELASTIC'?'elastic':'sudden'}">${c.auctionType}</span><span class="pill">QUEUED</span></div><div class="detail"><div class="visual">${img(x)}</div><div class="panel"><div class="notice">This item is queued, not active. It cannot receive a public bid until it reaches the active slot.</div><div class="price">$1 START</div><p class="muted">Position ${d.i+1} of 50. The queue advances automatically when the active auction ends.</p><div class="actions"><button class="primary" onclick="closeModal();openQueue('${d.cid}')">Back to queue</button><button class="secondary" onclick="closeModal();openModal('channelInfo','${d.cid}')">Channel info</button></div></div></div></div>`}
function auctionPage(){const x=item(state.activeItem);if(!x||x.sold)return `<main><div class="empty">This auction is no longer active.<div class="emptyAction"><button class="primary" onclick="route('auctions')">Back to auctions</button></div></div></main>`;const mine=myBid(x.id);return `<main><section class="section"><button class="ghost" onclick="route('auctions')">← Auction directory</button></section><div class="auctionHero"><div><div class="auctionTop"><div><div class="eyebrow">${esc(x.channel)}</div><h1>${esc(x.name)}</h1></div><div id="auctionTimer" class="timer ${x.auctionType==='ELASTIC'?'elastic':'sudden'}">${fmt(secondsLeft(x))}</div></div><div class="auctionState"><span class="pill ${x.auctionType==='ELASTIC'?'elastic':'sudden'}">${x.auctionType}</span><span class="pill">3:00 PUBLIC AUCTION</span><span class="pill">${esc(x.channel)}</span><button class="info" onclick="openModal('auctionInfo','${x.id}')">i</button></div><div class="auctionImage"><span class="imageLabel">${x.auctionType==='ELASTIC'?'ELASTIC CLOCK':'SUDDEN DEATH'}</span>${img(x)}</div><div class="auctionMeta">${tags(x)}</div></div><div class="bidPanel"><div class="card"><div class="eyebrow">CURRENT BID</div><div id="auctionCurrent" class="big">${money(x.current)}</div><div id="auctionBids" class="tiny muted">${x.bidCount||0} bids</div><div class="privacyNote" style="margin:14px 0">Buyer view is intentionally limited: current bid, bid count, your own bid, timer and auction type. No competing offers or seller intelligence is shown.</div><label class="tiny muted">Your bid</label><div class="bidAction"><input id="bidInput" class="input" type="number" min="${Number(x.current)+1}" placeholder="${Number(x.current)+1}"><button class="primary" onclick="placeBid('${x.id}')">Place bid</button></div>${mine?`<div class="success" style="margin-top:10px">Your current bid: <b>${money(mine.amount)}</b></div>`:''}<div class="activity">${esc(state.activity)}</div></div><div class="card" style="margin-top:12px"><div class="eyebrow">MAKE OFFER</div><h3 style="margin:6px 0">Commit, don't signal.</h3><p class="tiny muted">Your offer is genuine, expires after 24 hours, does not reserve inventory and can be accepted or countered by the seller.</p><input id="offerInput" class="input" type="number" min="1" placeholder="Your offer" style="margin:10px 0"><button class="secondary" style="width:100%" onclick="makeOffer('${x.id}')">Make Offer</button></div></div></div><div class="sectionhead"><h2>How this auction works</h2><button class="info" onclick="openModal('channelInfo','${x.channelId}')">i</button></div><div class="notice">${x.auctionType==='ELASTIC'?`<b>Elastic:</b> qualifying bids in the 1–30 second zone add decimal time. The extension uses the mirrored integer (31 − remaining whole second) × the current coefficient. The starting coefficient is <b>.2</b>; each qualifying re-up halves it. When the cycle falls below the established floor, the coefficient resets.`:`<b>Sudden Death:</b> the clock is independent of bidding. Bids never add time. At 0:00 the current high bid wins.`}</div></main>`}
function buy(){const list=items.filter(x=>x.method==='buy'&&!x.sold);return `<main><section class="hero"><div class="eyebrow">BUY NOW</div><h1>Immediate means immediate.</h1><p>Buy Now remains executable at the listed price until the seller intentionally changes the selling state. Offers never reserve inventory.</p></section><div class="grid">${list.map(itemCard).join('')}</div></main>`}
function itemPage(){const x=item(state.activeItem);if(!x||x.sold)return `<main><div class="empty">This item is no longer available.</div></main>`;const mine=myOffer(x.id),pa=state.privateAuctions[x.id];return `<main><section class="section"><button class="ghost" onclick="route('buy')">← Buy Now</button></section><div class="detail"><div class="visual">${img(x)}</div><div class="panel"><div class="eyebrow">BUY NOW · ${esc(x.grade)}</div><h1 style="font-size:clamp(38px,6vw,62px);letter-spacing:-.06em;margin:7px 0">${esc(x.name)}</h1><div class="muted">${esc(x.set)}</div><div style="margin-top:6px">${tags(x)}</div><div class="price">${money(x.price)}</div><div class="notice"><b>Available for immediate purchase.</b> Active offers do not reserve this item. Another buyer may purchase it at ${money(x.price)} at any time.</div>${mine?`<div class="success" style="margin-top:12px">Your offer: <b>${money(mine.amount)}</b> · expires ${new Date(mine.expires).toLocaleString()}</div>`:''}${pa?.active?`<div class="warning" style="margin-top:12px"><b>Demand-based Private Auction active.</b><br>There is a current seller response waiting for participating buyers.</div>`:''}<div class="actions" style="margin-top:14px"><button class="primary" onclick="buyNow('${x.id}')">Buy Now · ${money(x.price)}</button><button class="secondary" onclick="makeOffer('${x.id}')">${mine?'Replace offer':'Make Offer'}</button>${pa?.active?`<button class="secondary" onclick="openModal('privateBuyer','${x.id}')">Open private auction</button>`:''}</div><div class="sectionhead"><h2>Item details</h2></div><div class="list"><div class="listrow"><span>Market reference</span><b>${money(x.market)}</b></div><div class="listrow"><span>Condition / grade</span><b>${esc(x.grade)}</b></div><div class="listrow"><span>Language</span><b>${esc(x.lang)}</b></div><div class="listrow"><span>Variant</span><b>${esc(x.variant)}</b></div></div></div></div></main>`}
function makeOffer(id){const x=item(id);if(!x||x.sold)return setToast('This item is no longer available.');const input=document.getElementById('offerInput');const raw=input?.value||prompt(`Committed offer for ${x.name}:`);const amount=Number(raw);if(!amount||amount<=0)return setToast('Enter a valid offer amount.');const old=myOffer(id);if(old)old.status='replaced';const o={id:'o'+Date.now()+Math.random(),item:id,buyer:'You',amount,status:'active',created:Date.now(),expires:Date.now()+86400000,wave:0};state.offers.push(o);notify(`Offer submitted on ${x.name}: ${money(amount)}.`, 'offer', id,'OFFER SUBMITTED');save();openModal('offerConfirmation',o.id)}
function offerConfirmation(oid){const o=state.offers.find(x=>x.id===oid),x=item(o.item);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">OFFER SUBMITTED</div><h2>Committed offer recorded.</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="success"><b>${money(o.amount)}</b><br>${esc(x.name)}</div><div class="step"><b>Expires</b>${new Date(o.expires).toLocaleString()}</div><div class="step"><b>Inventory remains liquid</b>Your offer does not reserve the item. Buy Now remains available until the seller changes the selling state or another buyer purchases it.</div><div class="actions"><button class="primary" onclick="closeModal();route('buyer');state.buyerTab='offers';render()">Open Buyer Hub</button><button class="secondary" onclick="closeModal()">Done</button></div></div>`}
function placeBid(id){const x=item(id);if(!x||x.sold||x.status!=='Live')return setToast('Only the active auction can receive bids.');const input=document.getElementById('bidInput');const amount=Number(input?.value);if(!amount||amount<=x.current)return setToast(`Bid must exceed ${money(x.current)}.`);const before=secondsLeft(x);x.current=amount;x.bidCount=(x.bidCount||0)+1;state.bids.push({id:'bid'+Date.now()+Math.random(),item:id,amount,created:Date.now()});if(x.auctionType==='ELASTIC'&&before>0&&before<=30){applyElasticReup(x,before)}save();render();setToast(`Bid accepted at ${money(amount)}.`)}
function applyElasticReup(x,before){const a=x.auction||{coef:.2,cycleFloor:5,lastReupAt:null,lastTrigger:null,reups:0,decayActive:false};/* At 4 seconds and below the previous decay cycle has ended; the next qualifying bid starts again at .2. */if(before<=4){a.coef=.2;a.reups=0;a.decayActive=false}const whole=Math.max(1,Math.min(30,Math.ceil(before)));const mirrored=31-whole;const coef=Number(a.coef||.2);const extension=mirrored*coef;x.endsAt+=extension*1000;a.lastReupAt=Date.now();a.lastTrigger=before;a.reups=(a.reups||0)+1;a.decayActive=true;a.coef=coef/2;x.auction=a;state.activity=`Elastic re-up: +${extension.toFixed(2)}s · mirrored ${mirrored} × ${coef.toFixed(4)}`}
function buyNow(id){const x=item(id);if(!x||x.method!=='buy'||x.sold)return setToast('This Buy Now item is no longer available.');x.sold=true;x.status='Sold';state.purchases.push({item:id,price:x.price,source:'Buy Now',date:Date.now()});state.won.push({item:id,price:x.price,source:'Buy Now',date:Date.now()});state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');notify(`Purchase complete: ${x.name}.`,'won',id,'PURCHASE COMPLETE');save();route('buyer');state.buyerTab='won';render()}
function profileModal(){return `<div class="overlay" onclick="if(event.target===this)closeProfile()"><div class="modal" style="border-radius:27px"><div class="modalHead"><div><div class="eyebrow">ACCOUNT</div><h2>Your CONTINUUM</h2></div><button class="close" onclick="closeProfile()">×</button></div><div class="roleBanner"><div><b>${state.userMode==='buyer'?'Buyer':'Seller'} operating mode</b><div class="muted tiny">Hubs are separate from the marketplace navigation.</div></div><span class="modeChip">${state.userMode.toUpperCase()}</span></div><div class="list"><button class="listrow" onclick="closeProfile();state.userMode='buyer';route('buyer')"><span><b>Buyer Hub</b><small>Offers · bids · won items · Concierge</small></span><b>→</b></button><button class="listrow" onclick="closeProfile();state.userMode='seller';route('seller')"><span><b>Seller Hub</b><small>Inventory · offers · analytics · private auctions</small></span><b>→</b></button><button class="listrow" onclick="closeProfile();openModal('notifications')"><span><b>Notifications</b><small>Actionable Concierge and marketplace events</small></span><b>${state.notifications.filter(n=>!n.read).length}</b></button><button class="listrow" onclick="closeProfile();openModal('settings')"><span><b>Account & Settings</b><small>Operating preferences and marketplace rules</small></span><b>→</b></button></div></div></div>`}
function buyerHub(){state.userMode='buyer';const active=state.offers.filter(o=>o.status==='active');return `<main><div class="hubHead" style="display:flex;justify-content:space-between;align-items:end"><div><div class="eyebrow">BUYER HUB</div><h1 style="margin:5px 0;font-size:clamp(38px,6vw,64px);letter-spacing:-.065em">Your collecting desk.</h1></div><span class="pill">BUYER MODE</span></div><div class="segmented" style="margin:20px 0"><button class="${state.buyerTab==='overview'?'primary':'secondary'}" onclick="state.buyerTab='overview';render()">Overview</button><button class="${state.buyerTab==='offers'?'primary':'secondary'}" onclick="state.buyerTab='offers';render()">Offers (${active.length})</button><button class="${state.buyerTab==='bids'?'primary':'secondary'}" onclick="state.buyerTab='bids';render()">Active Bids</button><button class="${state.buyerTab==='won'?'primary':'secondary'}" onclick="state.buyerTab='won';render()">Won Items (${state.won.length})</button><button class="${state.buyerTab==='concierge'?'primary':'secondary'}" onclick="state.buyerTab='concierge';render()">Concierge</button></div>${state.buyerTab==='overview'?buyerOverview():state.buyerTab==='offers'?buyerOffers():state.buyerTab==='bids'?buyerBids():state.buyerTab==='won'?wonItems():concierge()}`}
function buyerOverview(){return `<div class="metricStrip"><div class="metric">Active offers<b>${state.offers.filter(o=>o.status==='active').length}</b></div><div class="metric">Active bids<b>${state.bids.filter(b=>{const x=item(b.item);return x&&!x.sold&&x.status==='Live'}).length}</b></div><div class="metric">Won items<b>${state.won.length}</b></div><div class="metric">Unread alerts<b>${state.notifications.filter(n=>!n.read).length}</b></div></div><div class="sectionhead"><h2>Actionable activity</h2><button class="secondary" onclick="openModal('notifications')">Open notifications</button></div><div class="card">${state.notifications.slice(0,5).map(notification).join('')||'<div class="empty">No recent activity.</div>'}</div><div class="sectionhead"><h2>Saved interests</h2></div><div class="card">${state.interests.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}<button class="secondary" style="display:block;margin-top:10px" onclick="openModal('interests')">Edit interests</button></div>`}
function buyerOffers(){const os=state.offers.filter(o=>o.buyer==='You');return `<div class="sectionhead"><div><h2>Your committed offers</h2><div class="tiny muted">Every offer expires after 24 hours and never reserves inventory.</div></div></div><div class="list">${os.length?os.map(o=>{const x=item(o.item);return `<div class="listrow clickable" onclick="openItem('${x.id}')"><div><b>${esc(x.name)}</b><div>${money(o.amount)} · ${esc(o.status)}</div><div class="tiny muted">Expires ${new Date(o.expires).toLocaleString()}</div></div><span class="pill">${esc(o.status)}</span></div>`}).join(''):'<div class="empty">No offers submitted yet.</div>'}</div>`}
function buyerBids(){const latest={};state.bids.forEach(b=>{if(!latest[b.item]||b.created>latest[b.item].created)latest[b.item]=b});return `<div class="sectionhead"><h2>Your active bids</h2></div><div class="list">${Object.values(latest).map(b=>{const x=item(b.item);if(!x||x.sold)return '';return `<div class="listrow clickable" onclick="openAuction('${x.id}')"><div><b>${esc(x.name)}</b><div>Your bid ${money(b.amount)} · current ${money(x.current)}</div><div class="tiny muted">${x.auctionType} · ${fmt(secondsLeft(x))} remaining</div></div><span class="pill">${x.status==='Live'?'LIVE':'ENDED'}</span></div>`}).join('')||'<div class="empty">No active bids.</div>'}</div>`}
function wonItems(){return `<div class="sectionhead"><div><h2>Won Items</h2><div class="tiny muted">Completed transactions remain here for order follow-through.</div></div></div><div class="list">${state.won.length?state.won.map((w,i)=>{const x=item(w.item);return `<div class="listrow"><div style="display:flex;gap:11px;align-items:center"><div class="mini">${img(x)}</div><div><b>${esc(x.name)}</b><div>${money(w.price)} · ${esc(w.source)}</div><div class="tiny muted">Transaction completed</div></div></div><button class="primary" onclick="openModal('order',${i})">Proceed to order</button></div>`}).join(''):'<div class="empty">No won items yet. Complete a Buy Now purchase or win an auction.</div>'}</div>`}
function concierge(){return `<div class="card"><div class="eyebrow">SYSTEM-DRIVEN</div><h2 style="margin:7px 0">The Concierge informs. It never bids.</h2><p class="muted">Declare what matters to you and CONTINUUM watches inventory, selling-method changes and meaningful auction developments.</p></div><div class="sectionhead"><h2>Watching</h2></div><div class="card">${state.interests.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}<button class="secondary" style="display:block;margin-top:10px" onclick="openModal('interests')">Edit interests</button></div><div class="sectionhead"><h2>Recent Concierge activity</h2></div><div class="card">${state.notifications.filter(n=>n.target==='item'||n.target==='auction').map(notification).join('')||'<div class="empty">No current matches.</div>'}</div>`}
function sellerHub(){state.userMode='seller';const active=state.offers.filter(o=>o.status==='active');return `<main><div style="display:flex;justify-content:space-between;align-items:end"><div><div class="eyebrow">SELLER HUB</div><h1 style="margin:5px 0;font-size:clamp(38px,6vw,64px);letter-spacing:-.065em">Control the selling path.</h1></div><span class="pill">SELLER MODE</span></div><div class="segmented" style="margin:20px 0"><button class="${state.sellerTab==='overview'?'primary':'secondary'}" onclick="state.sellerTab='overview';render()">Overview</button><button class="${state.sellerTab==='offers'?'primary':'secondary'}" onclick="state.sellerTab='offers';render()">Offers (${active.length})</button><button class="${state.sellerTab==='analytics'?'primary':'secondary'}" onclick="state.sellerTab='analytics';render()">Seller Analytics</button><button class="${state.sellerTab==='inventory'?'primary':'secondary'}" onclick="state.sellerTab='inventory';render()">Inventory</button><button class="${state.sellerTab==='private'?'primary':'secondary'}" onclick="state.sellerTab='private';render()">Private Auctions</button><button class="secondary" onclick="openModal('consign')">Consign</button></div>${state.sellerTab==='overview'?sellerOverview():state.sellerTab==='offers'?sellerOffers():state.sellerTab==='analytics'?sellerAnalytics():state.sellerTab==='inventory'?sellerInventory():sellerPrivateAuctions()}</main>`}
function sellerOverview(){const active=items.filter(x=>!x.sold);return `<div class="metricStrip"><div class="metric">Active inventory<b>${active.length}</b></div><div class="metric">Active offers<b>${state.offers.filter(o=>o.status==='active').length}</b></div><div class="metric">Auction positions<b>200</b></div><div class="metric">Private auctions<b>${Object.values(state.privateAuctions).filter(p=>p.active).length}</b></div></div><div class="sectionhead"><h2>Seller intelligence</h2><button class="secondary" onclick="state.sellerTab='analytics';render()">Open analytics</button></div><div class="card"><p class="muted">This is the seller-only market surface. It aggregates committed demand without exposing buyer identities or intelligence to buyers.</p><div class="offerGrid"><div class="offerStat"><span class="tiny muted">Active offers</span><b>${state.offers.filter(o=>o.status==='active').length}</b></div><div class="offerStat"><span class="tiny muted">Highest</span><b>${money(maxOffer())}</b></div><div class="offerStat"><span class="tiny muted">Average</span><b>${money(avgOffers())}</b></div><div class="offerStat"><span class="tiny muted">Private</span><b>${Object.values(state.privateAuctions).some(p=>p.active)?'Active':'Available'}</b></div></div></div>`}
function maxOffer(){return Math.max(0,...state.offers.filter(o=>o.status==='active').map(o=>o.amount))} function avgOffers(){const os=state.offers.filter(o=>o.status==='active');return os.length?os.reduce((a,o)=>a+o.amount,0)/os.length:0}
function sellerOffers(){const ids=[...new Set(state.offers.filter(o=>o.status==='active').map(o=>o.item))];return `<div class="sectionhead"><div><h2>Offer management</h2><div class="tiny muted">Aggregate demand is visible here; buyer identities remain abstract.</div></div></div>${ids.length?ids.map(sellerOfferGroup).join(''):'<div class="empty">No active committed offers.</div>'}`}
function sellerOfferGroup(id){const x=item(id),os=activeOffers(id);if(!x||!os.length)return '';const hi=Math.max(...os.map(o=>o.amount)),lo=Math.min(...os.map(o=>o.amount));return `<div class="offerCard" style="margin-bottom:13px"><div class="row"><div><div class="eyebrow">${x.method==='buy'?'BUY NOW':'AUCTION'}</div><h3 style="margin:5px 0">${esc(x.name)}</h3></div><span class="pill">${os.length} active offers</span></div><div class="offerGrid"><div class="offerStat"><span class="tiny muted">Highest</span><b>${money(hi)}</b></div><div class="offerStat"><span class="tiny muted">Average</span><b>${money(os.reduce((a,o)=>a+o.amount,0)/os.length)}</b></div><div class="offerStat"><span class="tiny muted">Range</span><b>${money(lo)}–${money(hi)}</b></div><div class="offerStat"><span class="tiny muted">Expires</span><b>${Math.max(0,Math.ceil((Math.min(...os.map(o=>o.expires))-Date.now())/3600000))}h</b></div></div><div class="offerList">${os.map((o,i)=>`<div class="offerRow"><div><b>${money(o.amount)}</b><div class="tiny muted">Offer ${i+1} · age ${Math.max(0,Math.floor((Date.now()-o.created)/3600000))}h · expires ${new Date(o.expires).toLocaleString()}</div></div><div class="actions"><button class="primary" onclick="acceptOffer('${o.id}')">Accept</button><button class="secondary" onclick="ignoreOffer('${o.id}')">Ignore</button></div></div>`).join('')}</div><div class="actions" style="margin-top:13px"><button class="primary" onclick="counterAll('${x.id}')">Counter All</button><button class="secondary" onclick="openModal('method','${x.id}')">Change selling method</button></div></div>`}
function acceptOffer(oid){const o=state.offers.find(x=>x.id===oid);if(!o||o.status!=='active')return setToast('Offer is no longer active.');const x=item(o.item);if(!x||x.sold)return setToast('Inventory has already transacted.');o.status='accepted';x.sold=true;x.status='Sold';state.offers.filter(a=>a.item===x.id&&a.status==='active').forEach(a=>a.status='unavailable');state.won.push({item:x.id,price:o.amount,source:'Seller accepted offer',date:Date.now()});notify(`Your offer on ${x.name} was accepted at ${money(o.amount)}.`,'won',x.id,'OFFER ACCEPTED');save();activity(`Offer accepted at ${money(o.amount)}.`)}
function ignoreOffer(oid){const o=state.offers.find(x=>x.id===oid);if(!o||o.status!=='active')return;o.status='ignored';save();activity('Offer ignored; inventory remains available.');}
function changeMethod(id){openModal('method',id)}
function methodModal(id){const x=item(id);if(!x)return '';const current=x.method==='buy'?'BUY NOW':(x.privateAuction?.active?'PRIVATE AUCTION':'PUBLIC AUCTION');return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLING METHOD</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="methodBox current"><div class="eyebrow">CURRENT METHOD</div><b>${current}</b><p class="tiny muted">Choose a new selling state explicitly. CONTINUUM will update the inventory object rather than merely showing a suggestion.</p></div><div class="sectionhead"><h3>Available methods</h3></div><div class="methodGrid"><button class="methodOption ${x.method==='buy'?'current':''}" onclick="convertMethod('${id}','buy')"><b>BUY NOW</b><span class="tiny muted">Immediate execution at a listed price.</span></button><button class="methodOption ${x.method==='auction'&&!x.privateAuction?.active?'current':''}" onclick="convertMethod('${id}','auction')"><b>PUBLIC AUCTION</b><span class="tiny muted">Move into a specialized public channel.</span></button><button class="methodOption ${x.privateAuction?.active?'current':''}" onclick="startPrivateFromMethod('${id}')"><b>PRIVATE AUCTION</b><span class="tiny muted">Demand-based response to active committed offers.</span></button></div><div class="notice" style="margin-top:13px"><b>What will happen?</b><br>${x.method==='buy'?'Changing away from Buy Now removes immediate purchase availability until you return it.':'Changing to Buy Now makes the listed price immediately executable.'} Public auction uses the selected channel's 3:00 lifecycle. Private Auction requires active demonstrated demand.</div></div>`}
function convertMethod(id,method){const x=item(id);if(!x||x.sold)return;if(method==='buy'){x.method='buy';x.type='Buy Now';x.privateAuction=null;x.price=Math.max(1,Number(x.price||x.current||x.market||1));x.endsAt=0;x.status='Available now';}else if(method==='auction'){x.method='auction';x.type='Auction';x.privateAuction=null;const c=channels.find(c=>c.id===x.channelId)||channels[0];x.channelId=c.id;x.channel=c.name;x.auctionType=c.auctionType;x.current=Math.max(1,Number(x.current||1));x.bidCount=0;const pool=items.filter(i=>i.channelId===c.id&&!i.sold);const idx=pool.findIndex(i=>i.id===x.id);if(idx<0){x.endsAt=Date.now()+180000;x.status='Live'}else{state.channelPos[c.id]=idx;x.endsAt=Date.now()+180000;x.status='Live'}}save();closeModal();activity(`${x.name} moved to ${method==='buy'?'BUY NOW':'PUBLIC AUCTION'}.`)}
function startPrivateFromMethod(id){const os=activeOffers(id);if(!os.length)return setToast('Private Auction requires active committed demand.');counterAll(id)}
function counterAll(id){const os=activeOffers(id);if(!os.length)return setToast('No active committed demand to counter.');const high=Math.max(...os.map(o=>o.amount));const current=Math.max(high+25,Math.ceil(high*1.12));state.privateAuctions[id]={active:true,item:id,current,previousSellerCounter:null,deadline:Date.now()+120000,wave:1,participants:os.length,responses:os.map(o=>({offerId:o.id,amount:o.amount,engaged:true,buyer:o.buyer})),history:[{wave:1,seller:current,responses:os.map(o=>o.amount)}]};const x=item(id);x.privateAuction={active:true};notify(`Seller opened a demand-based private auction on ${x.name}.`,'private',id,'PRIVATE AUCTION');save();openModal('privateSeller',id)}
function privateBuyer(id){let p=state.privateAuctions[id],x=item(id);if(!p||!p.active)return `<div class="modal"><div class="modalHead"><h2>Private auction closed</h2><button class="close" onclick="closeModal()">×</button></div><div class="empty">This negotiation is no longer active.</div></div>`;const mine=p.responses.find(r=>r.buyer==='You');const myAmount=mine?.amount||myOffer(id)?.amount||0;return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">DEMAND-BASED PRIVATE AUCTION</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">This private auction exists because committed demand already existed and the seller chose to respond. You see only your relationship with the seller.</div><div class="privateStage"><div class="eyebrow">CURRENT SELLER COUNTER</div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">Wave ${p.wave} · respond by ${new Date(p.deadline).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}</div><div class="bar" style="margin-top:12px"><span id="privateBuyerBar" style="width:100%"></span></div></div><div class="card" style="margin-top:12px"><div class="eyebrow">YOUR CURRENT OFFER</div><div class="big">${money(myAmount)}</div><input id="privateInput" class="input" type="number" min="1" placeholder="Your counter" style="margin:10px 0"><div class="actions"><button class="primary" onclick="privateAccept('${id}')">Accept ${money(p.current)}</button><button class="secondary" onclick="privateCounter('${id}')">Counter</button><button class="secondary" onclick="privateExit('${id}')">Exit</button></div></div><div class="privacyNote" style="margin-top:12px">Other participants may exist, but their prices, identities and aggregate responses are intentionally invisible to you.</div></div>`}
function privateAccept(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active||x?.sold)return setToast('This private auction is closed.');p.active=false;x.sold=true;x.status='Sold';x.privateAuction={active:false};state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');state.won.push({item:id,price:p.current,source:'Private Auction',date:Date.now()});notify(`You accepted the seller counter on ${x.name} at ${money(p.current)}.`,'won',id,'PRIVATE AUCTION WON');save();closeModal();activity(`Private auction accepted at ${money(p.current)}.`)}
function privateCounter(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active)return;const amount=Number(document.getElementById('privateInput')?.value);if(!amount||amount<=0)return setToast('Enter a valid counter amount.');let mine=p.responses.find(r=>r.buyer==='You');if(!mine){mine={buyer:'You',amount,engaged:true,offerId:null};p.responses.push(mine);p.participants=(p.participants||0)+1}else{mine.amount=amount;mine.engaged=true}state.offers.push({id:'o'+Date.now(),item:id,buyer:'You',amount,status:'active',created:Date.now(),expires:Date.now()+86400000,wave:p.wave});p.deadline=Date.now()+120000;p.history.push({wave:p.wave,buyer:amount});save();openModal('privateBuyer',id)}
function privateExit(id){const p=state.privateAuctions[id];if(p){const mine=p.responses.find(r=>r.buyer==='You');if(mine)mine.engaged=false;save()}closeModal();activity('You exited this private auction wave.');}
function privateSeller(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active)return `<div class="modal"><div class="modalHead"><h2>Private auction closed</h2><button class="close" onclick="closeModal()">×</button></div></div>`;const responses=p.responses.filter(r=>r.engaged);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLER HUB · PRIVATE AUCTION</div><h2>${esc(x.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>Demand-based only.</b> This market exists because active committed offers were already present. Buyers never see this aggregate seller surface.</div><div class="privateStage"><div class="eyebrow">CURRENT PARTICIPATION PRICE</div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">${responses.length} active participants · Wave ${p.wave} · response deadline ${new Date(p.deadline).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}</div></div><div class="sectionhead"><h2>Aggregate responses</h2><span class="muted">Seller only</span></div><div class="responseGrid">${responses.map((r,i)=>`<div class="response"><div class="tiny muted">Participant ${i+1}</div><b>${money(r.amount)}</b><div class="tiny muted">${r.engaged?'engaged':'inactive'}</div></div>`).join('')||'<div class="empty">No active responses.</div>'}</div><div class="actions" style="margin-top:16px"><button class="primary" onclick="sellerAcceptHighest('${id}')">Accept highest</button><button class="secondary" onclick="sellerWave('${id}')">Counter all</button><button class="danger" onclick="endPrivate('${id}')">End private auction</button><button class="secondary" onclick="openModal('method','${id}')">Change selling method</button></div><div class="tiny muted" style="margin-top:13px">Every wave has a finite response period. Buyers who do not engage cease participating in that wave. There is no fixed maximum number of waves.</div></div>`}
function sellerAcceptHighest(id){const p=state.privateAuctions[id],x=item(id);if(!p?.active||!p.responses.length)return;const eligible=p.responses.filter(r=>r.engaged);if(!eligible.length)return setToast('No participating responses to accept.');const high=Math.max(...eligible.map(r=>r.amount));p.active=false;x.sold=true;x.status='Sold';x.privateAuction={active:false};state.offers.filter(o=>o.item===id&&o.status==='active').forEach(o=>o.status='unavailable');state.won.push({item:id,price:high,source:'Private Auction',date:Date.now()});notify(`Private auction completed on ${x.name}.`,'won',id,'PRIVATE AUCTION COMPLETE');save();closeModal();activity(`Private auction completed at ${money(high)}.`)}
function sellerWave(id){const p=state.privateAuctions[id];if(!p?.active)return;const eligible=p.responses.filter(r=>r.engaged);if(!eligible.length)return setToast('No active participants remain.');const next=Math.max(p.current-5,Math.ceil(p.current*.96));p.previousSellerCounter=p.current;p.current=next;p.wave++;p.deadline=Date.now()+120000;p.responses=p.responses.map(r=>({...r,engaged:r.engaged}));p.history.push({wave:p.wave,seller:next,responses:p.responses.filter(r=>r.engaged).map(r=>r.amount)});save();openModal('privateSeller',id)}
function endPrivate(id){const p=state.privateAuctions[id],x=item(id);if(p)p.active=false;if(x)x.privateAuction={active:false};save();closeModal();activity('Private auction ended by seller. Inventory remains under seller control.')}
function sellerPrivateAuctions(){const ps=Object.entries(state.privateAuctions).filter(([id,p])=>p.active);return `<div class="sectionhead"><div><h2>Demand-based Private Auctions</h2><div class="tiny muted">Private negotiations exist only where demonstrated demand is active.</div></div></div>${ps.length?ps.map(([id,p])=>{const x=item(id),rs=p.responses.filter(r=>r.engaged);return `<div class="offerCard" style="margin-bottom:12px"><div class="row"><div><div class="eyebrow">WAVE ${p.wave}</div><h3>${esc(x.name)}</h3></div><span class="pill">${rs.length} participants</span></div><div class="privatePrice">${money(p.current)}</div><div class="tiny muted">Current participation price · deadline ${new Date(p.deadline).toLocaleTimeString()}</div><button class="primary" style="margin-top:12px" onclick="openModal('privateSeller','${id}')">Open private auction</button></div>`}).join(''):'<div class="empty">No active Private Auctions. Counter a group of active offers to begin one.</div>'}`}
function sellerAnalytics(){const os=state.offers.filter(o=>o.status==='active');return `<div class="metricStrip"><div class="metric">Offer range<b>${os.length?money(Math.min(...os.map(o=>o.amount)))+'–'+money(Math.max(...os.map(o=>o.amount))):'—'}</b></div><div class="metric">Method changes<b>24</b></div><div class="metric">Auction conversion<b>31%</b></div><div class="metric">Liquidity signal<b>High</b></div></div><div class="sectionhead"><h2>Demand over time</h2></div><div class="card"><div class="chart">${[25,39,30,55,47,72,65,91,78,100].map(v=>`<i style="height:${v}%"></i>`).join('')}</div><p class="tiny muted">Aggregated committed demand, offer outcomes and selling-method performance. Buyer-facing surfaces never receive this data.</p></div><div class="sectionhead"><h2>Positioning choices</h2></div><div class="methodGrid"><div class="methodBox current"><div class="eyebrow">BUY NOW</div><h3>Fastest liquidity</h3><p class="muted">Immediate execution remains available while offers are active.</p></div><div class="methodBox"><div class="eyebrow">PUBLIC AUCTION</div><h3>Broad competition</h3><p class="muted">Use a specialized channel when public price discovery is useful.</p></div><div class="methodBox"><div class="eyebrow">PRIVATE AUCTION</div><h3>Demand response</h3><p class="muted">Use uniform counteroffer waves when demonstrated demand warrants a private negotiation.</p></div></div>`}
function sellerInventory(){return `<div class="list">${items.filter(x=>!x.sold).slice(0,80).map(x=>`<div class="listrow"><div style="display:flex;gap:11px;align-items:center"><div class="mini">${img(x)}</div><div><b>${esc(x.name)}</b><div class="tiny muted">${esc(x.set)} · current method: ${x.method==='buy'?'BUY NOW':x.privateAuction?.active?'PRIVATE AUCTION':x.auctionType}</div></div></div><div class="actions"><button class="secondary" onclick="openModal('method','${x.id}')">Change method</button>${activeOffers(x.id).length?`<button class="primary" onclick="state.sellerTab='offers';render()">View demand</button>`:''}</div></div>`).join('')}</div>`}
function notification(n){return `<div class="notification ${n.read?'':'unread'}"><span class="dot" style="${n.read?'visibility:hidden':''}"></span><div style="flex:1"><div class="tiny muted">${esc(n.type)} · ${new Date(n.created).toLocaleString()}</div><b>${esc(n.text)}</b><div style="margin-top:7px"><button class="secondary tiny" onclick="notificationTarget('${n.id}')">Open</button></div></div></div>`}
function notificationTarget(id){const n=state.notifications.find(x=>x.id===id);if(!n)return;n.read=true;save();if(n.target==='auction')openAuction(n.item);else if(n.target==='private')openModal('privateBuyer',n.item);else if(n.target==='won'){route('buyer');state.buyerTab='won';render()}else if(n.target==='offer'){route('buyer');state.buyerTab='offers';render()}else if(n.target==='item')openItem(n.item);else route('buyer')}
function notificationsModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SYSTEM NOTIFICATIONS</div><h2>Concierge & marketplace activity</h2></div><button class="close" onclick="closeModal()">×</button></div>${state.notifications.map(notification).join('')||'<div class="empty">Nothing new.</div>'}<div class="actions" style="margin-top:13px"><button class="secondary" onclick="markAllRead()">Mark all read</button></div></div>`}
function markAllRead(){state.notifications.forEach(n=>n.read=true);save();render()}
function channelInfoModal(cid){const c=channel(cid);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">${esc(c.category)}</div><h2>${esc(c.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><span class="pill ${c.auctionType==='ELASTIC'?'elastic':'sudden'}">${c.auctionType}</span><p>${esc(c.description)}</p><div class="step"><b>3:00 starting clock</b>Every public auction begins at three minutes. Only the active queue position has a live clock.</div><div class="step"><b>${c.auctionType==='ELASTIC'?'Inverse elastic':'Sudden death'}</b>${c.auctionType==='ELASTIC'?'The qualifying zone is 1–30 seconds. The mirrored integer is 31 − the remaining whole second, multiplied by the current coefficient. The result may be fractional. Each qualifying re-up halves the coefficient until the decay cycle resets.':'Bids never affect the timer. At 0:00, the auction ends.'}</div><div class="step"><b>Perpetual progression</b>When the active item ends, the next queue position becomes active at 3:00. The queue remains hidden behind Open Queue.</div><div class="step"><b>Buyer privacy</b>Buyers see only the current bid, bid count, their own bid, timer and channel rules. Seller intelligence stays in Seller Hub.</div></div>`}
function auctionInfoModal(id){const x=item(id);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">BUYER AUCTION VIEW</div><h2>${esc(x.auctionType)} auction</h2></div><button class="close" onclick="closeModal()">×</button></div><p><b>Competitive surface only.</b></p><p>You see the item, current bid, bid count, live timer, auction type and your own bid.</p><div class="privacyNote">You do not see other buyers' offers, competing offer amounts, demand ranges, identities or seller analytics.</div></div>`}
function interestsModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">CONCIERGE</div><h2>Saved interests</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="muted">Interests can include cards, sets, variants, language, grading company, grade ranges, target prices and preferred selling methods.</p><div class="list">${state.interests.map((i,k)=>`<div class="listrow"><span>${esc(i)}</span><button class="secondary" onclick="state.interests.splice(${k},1);save();openModal('interests')">Remove</button></div>`).join('')}</div><input id="interestInput" class="input" placeholder="Add an interest" style="margin-top:12px"><button class="primary" style="margin-top:9px" onclick="addInterest()">Add interest</button></div>`}
function addInterest(){const v=document.getElementById('interestInput')?.value.trim();if(!v)return;state.interests.push(v);save();openModal('interests');notify(`Concierge is now watching ${v}.`,'buyer',null,'CONCIERGE')}
function consignModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">SELLER HUB</div><h2>Consign inventory</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">The seller creates the standardized listing manifest and controls condition, presentation and initial selling method.</div><div class="step"><b>1 · Create manifest</b>Identify the individual collectible.</div><div class="step"><b>2 · Choose presentation</b>Record condition, grade, language and variant.</div><div class="step"><b>3 · Choose initial method</b>Buy Now or specialized public auction.</div><div class="step"><b>4 · Stay fluid</b>Move the inventory between methods as market conditions develop.</div><button class="primary" onclick="closeModal();activity('Consignment manifest started.');state.sellerTab='inventory';render()">Start manifest</button></div>`}
function settingsModal(){return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">ACCOUNT</div><h2>Account & Settings</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="list"><div class="listrow"><span>Operating mode</span><b>${state.userMode.toUpperCase()}</b></div><div class="listrow"><span>Concierge notifications</span><b>On</b></div><div class="listrow"><span>Offer expiration</span><b>24 hours</b></div><div class="listrow"><span>Public auction start</span><b>3:00</b></div><div class="listrow"><span>Buyer demand privacy</span><b>Protected</b></div></div></div>`}
function orderModal(index){const w=state.won[index];if(!w)return `<div class="modal"><div class="modalHead"><h2>Order</h2><button class="close" onclick="closeModal()">×</button></div><div class="empty">Transaction not found.</div></div>`;const x=item(w.item);return `<div class="modal"><div class="modalHead"><div><div class="eyebrow">WON ITEM</div><h2>Order</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="success"><b>Transaction secured.</b><br>${esc(x.name)} · ${money(w.price)}</div><div class="step"><b>Next</b>Confirm shipping and payment details in the eventual production checkout.</div><button class="primary" onclick="closeModal();activity('Order flow acknowledged for '+x.name+'.')">Continue</button></div>`}
function modals(){if(state.profile)return profileModal();if(!state.modal)return '';const {type,data}=state.modal;let content='';if(type==='queue')return `<div class="overlay" onclick="if(event.target===this)closeModal()">${queueModal(data)}</div>`;if(type==='queueItem')content=queueItemModal(data);else if(type==='notifications')content=notificationsModal();else if(type==='channelInfo')content=channelInfoModal(data);else if(type==='auctionInfo')content=auctionInfoModal(data);else if(type==='offerConfirmation')content=offerConfirmation(data);else if(type==='buyerOffers')content=`<div class="modal"><div class="modalHead"><h2>Your offers</h2><button class="close" onclick="closeModal()">×</button></div>${buyerOffers()}</div>`;else if(type==='won')content=`<div class="modal"><div class="modalHead"><h2>Won Items</h2><button class="close" onclick="closeModal()">×</button></div>${wonItems()}</div>`;else if(type==='interests')content=interestsModal();else if(type==='consign')content=consignModal();else if(type==='settings')content=settingsModal();else if(type==='order')content=orderModal(data);else if(type==='privateBuyer')content=privateBuyer(data);else if(type==='privateSeller')content=privateSeller(data);else if(type==='method')content=methodModal(data);return `<div class="overlay" onclick="if(event.target===this)closeModal()">${content}</div>`}
function render(){let body;if(state.page==='explore')body=explore();else if(state.page==='auctions')body=auctions();else if(state.page==='buy')body=buy();else if(state.page==='auction')body=auctionPage();else if(state.page==='item')body=itemPage();else if(state.page==='buyer')body=buyerHub();else if(state.page==='seller')body=sellerHub();else body=explore();document.getElementById('app').innerHTML=header()+body+modals()+(state.toast?`<div class="toast">${esc(state.toast)}</div>`:'');}
function expireOffers(now){let changed=false;state.offers.forEach(o=>{if(o.status==='active'&&o.expires<=now){o.status='expired';changed=true;}});return changed}
function finishAuction(x){const winning=state.bids.filter(b=>b.item===x.id).sort((a,b)=>b.amount-a.amount)[0];const wasMine=winning&&winning.amount===x.current;const c=channel(x.channelId),pool=items.filter(i=>i.channelId===c.id);const pos=state.channelPos[c.id]||0;const next=(pos+1)%pool.length;state.channelPos[c.id]=next;x.sold=true;x.status='Auction closed';x.endsAt=0;if(wasMine){state.won.push({item:x.id,price:x.current,source:'Public Auction',date:Date.now()});notify(`You won ${x.name} for ${money(x.current)}.`,'won',x.id,'AUCTION WON')}const nx=pool[next];nx.sold=false;nx.method='auction';nx.status='Live';nx.endsAt=Date.now()+180000;nx.current=Math.max(1,Math.max(...activeOffers(nx.id).map(o=>o.amount),0));nx.bidCount=nx.bidCount||0;nx.auction={coef:.2,cycleFloor:5,lastReupAt:null,lastTrigger:null,reups:0};notify(`${nx.name} is now live in ${c.name}.`,'auction',nx.id,'AUCTION LIVE');state.activeItem=state.activeItem===x.id?nx.id:state.activeItem;save()}
function tick(){const now=Date.now();let changed=expireOffers(now);items.filter(x=>x.method==='auction'&&!x.sold&&x.status==='Live').forEach(x=>{if(x.auction?.decayActive&&secondsLeft(x)<=4){x.auction.decayActive=false;x.auction.coef=.2;x.auction.reups=0;changed=true}if(remainingMs(x)<=0){finishAuction(x);changed=true}});if(state.modal?.type==='privateBuyer'||state.modal?.type==='privateSeller'){const p=state.privateAuctions[state.modal.data];if(p?.active&&p.deadline<=now){p.responses=p.responses.map(r=>({...r,engaged:false}));p.activeParticipants=0;save();if(state.modal.type==='privateSeller')render();else render()}}if(state.page==='auction'){const x=item(state.activeItem);const el=document.getElementById('auctionTimer');if(el&&x)el.textContent=fmt(secondsLeft(x));const cur=document.getElementById('auctionCurrent');if(cur&&x)cur.textContent=money(x.current);const bc=document.getElementById('auctionBids');if(bc&&x)bc.textContent=`${x.bidCount||0} bids`;const bar=document.getElementById('privateBuyerBar');if(bar){const p=state.privateAuctions[state.modal?.data];if(p)bar.style.width=Math.max(0,Math.min(100,((p.deadline-now)/120000)*100))+'%'}}if(changed)render();save()}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else if(state.profile)closeProfile()}});
normalizeAuctions();save();render();setInterval(tick,250);
</script></body></html>
